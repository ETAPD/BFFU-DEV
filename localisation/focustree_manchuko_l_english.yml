 MAN_the_terror_of_the_east:0 "The Terror of the East"
 MAN_the_terror_of_the_east_desc:0 "The Manchukuo special forces are honed into a fearsome instrument of raiding and infiltration, feared across the frontier. The regular line pays for it, stripped of its best men and material."
 MAN_wall_of_steel:0 "Wall of Steel"
 MAN_wall_of_steel_desc:0 "A dedicated land-warfare research and testing ground is raised in Liaoning, where Manchukuo's armour is designed, prototyped and proven under Kwantung supervision."
 MAN_dragons_of_the_land:0 "Dragons of the Land"
 MAN_dragons_of_the_land_desc:0 "With the reforms complete, the Imperial Army turns to a doctrine of its own: a hard-hitting force built to fight and win across the vast Asian mainland."
 MAN_combined_arms_command:0 "Combined Arms Command"
 MAN_combined_arms_command_desc:0 "A unified command welds infantry, armour and the special forces into a single coordinated instrument, directed from a modern general staff."
 MAN_living_off_enemy_land:0 "Living Off Enemy Land"
 MAN_living_off_enemy_land_desc:0 "Trained to forage, requisition and fight far from their depots, the divisions carry the war into the enemy's rear without waiting on supply."
 MAN_manchurian_tank_tactics:0 "Manchurian Tank Tactics"
 MAN_manchurian_tank_tactics_desc:0 "Armour tactics tailored to the open plains and river crossings of Manchuria, exploiting speed and shock where the ground allows."
 MAN_deep_operations_planning:0 "Deep Operations Planning"
 MAN_deep_operations_planning_desc:0 "The general staff studies the theory of deep battle, teaching the army to strike in echelons and shatter the enemy's whole depth at once."
 MAN_high_command_collaboration:0 "High Command Collaboration"
 MAN_high_command_collaboration_desc:0 "Closer cooperation with the Kwantung Army's staff college accelerates the training and promotion of Manchukuo's own officers."
