l_english:
MAN_first_five_year_plan:0 "First Five Year Plan"
MAN_first_five_year_plan_desc:0 "Manchukuo's first five-year plan is modeled on Soviet central planning but bent to Japanese ends: rapid industrialisation of heavy industry, mining and transport to make Manchuria self-sufficient in strategic materials."
MAN_formmanestsusindustrialsector:0 "Form Manestsu's Industrial Sector"
MAN_formmanestsusindustrialsector_desc:0 "The South Manchuria Railway Company is far more than a railway. Its mines, factories and utilities are organised into a coherent industrial sector, giving the plan its backbone."
MAN_create_the_main_railway_administration:0 "Create the Main Railway Administration"
MAN_create_the_main_railway_administration_desc:0 "Manchukuo's railway network is the skeleton of its economy. A central administration coordinates the existing Mantetsu lines with new construction, connecting mines to ports and factories to the front."
MAN_the_matsuoka_plan:0 "The Matsuoka Plan"
MAN_the_matsuoka_plan_desc:0 "Yosuke Matsuoka, president of the South Manchuria Railway, favours a state-led model where Mantetsu serves as the monopoly instrument of industrial policy, keeping control centralised and consumer output lean."
MAN_the_aikawa_plan:0 "The Aikawa Plan"
MAN_the_aikawa_plan_desc:0 "Yoshisuke Aikawa, founder of the Nissan zaibatsu, proposes a private-capital model. He relocated his entire industrial combine to Manchuria in 1937, promising outside investment and rapid expansion."
MAN_one_company_one_industry:0 "One Company One Industry"
MAN_one_company_one_industry_desc:0 "Under the Matsuoka model, each strategic sector is assigned to a single company, eliminating competition and duplication. Maximum efficiency through absolute monopoly."
MAN_create_new_worker_ethos:0 "Create New Worker Ethos"
MAN_create_new_worker_ethos_desc:0 "Japanese settlement programmes bring hundreds of thousands of colonists to Manchuria. A new labour culture blends Japanese discipline with Chinese frontier work, and settlers are put to work on the plan's construction sites."
MAN_manestu_reborn:0 "Manestu Reborn"
MAN_manestu_reborn_desc:0 "Stripped of its administrative empire, the South Manchuria Railway Company is refocused on its core mission: industrial production and rail operations, reborn as a pure economic instrument of the state."
MAN_expansionofmanestucontrol:0 "Expansion of  Manestu Control"
MAN_expansionofmanestucontrol_desc:0 "Mantetsu pushes into Inner Mongolia and northern China, extending its mining and railway concessions to secure the raw materials the Five-Year Plan demands."
MAN_replacemanestsuscontrol:0 "Replace Manestsu's Control"
MAN_replacemanestsuscontrol_desc:0 "Times have changed, and Mantetsu could not survive in the conditions of the policy pursued by the Kwantung Army. The total assets of the South Manchurian Railway exceeded two billion yen, and it employed more than 53,000 employees. It was the largest company organized in accordance with Japanese law. It operated its own railway zone and remained a virtually independent entity. The Kwantung Army wanted to reorganize Mantetsu and strip it of its administrative authority and associated privileges. It wants to turn it into a simple economic unit subordinate to the government of Manchuria."
MAN_remove_extraterritorially_privledges:0 "Remove Extraterritorially Privledges"
MAN_remove_extraterritorially_privledges_desc:0 "The South Manchurian Railway was an \"empire within an empire\" with special privileges that other private companies had never had, including an administratively separate railway zone and extraterritoriality. It has also developed into a huge holding company that influences all aspects of Manchurian economic life. The railway zone and the extraterritoriality were on the way to the independence of Manchukuo and, as a result, to the superiority of the Kwantung Army in all aspects of life. This means that Mantetsu is forced to abandon its local administration unit. Its employees were transferred to the jurisdiction of the Government of Manchukuo. Three days later, Yōsuke Matsuoka said goodbye to the other employees who had been transferred to the new Mange Corporation. The days of greatness of the South Manchurian Railway have come to an end."
MAN_foundmangyo:0 "Found Mangyō"
MAN_foundmangyo_desc:0 "The Manchuria Heavy Industry Development Company is founded by Aikawa in December 1937 as the vehicle for private-capital industrialisation, absorbing many of Mantetsu's former subsidiaries and opening Manchuria to zaibatsu investment."
MAN_manetsu_research_department:0 "Manetsu Research Department"
MAN_manetsu_research_department_desc:0 "Mantetsu's Research Department is one of Asia's largest think tanks, employing thousands of researchers studying everything from economics to ethnography. Its expertise underpins Manchukuo's industrial planning."
MAN_purchase_german_liscenses:0 "Purchase German Liscenses"
MAN_purchase_german_liscenses_desc:0 "Manchukuo seeks German industrial patents and expertise, particularly in synthetic fuel production and chemical processes. The Fushun shale-oil works benefit directly from licensed German technology."
MAN_learn_from_american_steelmakers:0 "Learn From American Steelmakers"
MAN_learn_from_american_steelmakers_desc:0 "Before the embargo, American steel technology and expertise flowed to Manchuria. The Showa Steel Works at Anshan, the largest steelmaking complex in Asia outside Japan, drew heavily on US methods and equipment."
MAN_manchurian_aircrafts_company:0 "Manchurian Aircrafts Company"
MAN_manchurian_aircrafts_company_desc:0 "The Manchuria Aeroplane Manufacturing Company, founded in 1938 in Harbin, is Manchukuo's attempt to build an indigenous aircraft industry, assembling and eventually designing military aircraft under Japanese supervision."
MAN_second_five_year_plan:0 "Second Five Year Plan"
MAN_second_five_year_plan_desc:0 "The second five-year plan shifts emphasis from heavy industry to war production, aiming to make Manchukuo the arsenal of the Co-Prosperity Sphere. Every factory bends toward the demands of the front."
MAN_breakthrough_in_steel_rolling:0 "Breakthrough in Steel Rolling"
MAN_breakthrough_in_steel_rolling_desc:0 "The Showa Steel Works at Anshan is the largest steelmaking complex in Asia outside Japan. Advances in rolling technology expand output to meet the insatiable wartime demand for armour plate and rail."
MAN_modernised_agriculture:0 "Modernised Agriculture"
MAN_modernised_agriculture_desc:0 "Manchuria's black-earth plains are among the most fertile in Asia. Mechanisation and modern techniques aim to feed both the colony and the empire while freeing labour for industry."
MAN_restructure_the_liaohe_river_flow:0 "Restructure the Liaohe River Flow"
MAN_restructure_the_liaohe_river_flow_desc:0 "Major hydraulic engineering projects on the Liaohe and Sungari rivers aim to control flooding, generate hydroelectric power and irrigate the agricultural heartland of central Manchuria."
MAN_foster_a_light_metal_society:0 "Foster a Light Metal Society"
MAN_foster_a_light_metal_society_desc:0 "Aluminium is critical for aircraft production. Manchukuo develops bauxite processing and aluminium smelting at Kirin to supply the empire's growing aviation industry."
MAN_kwantung_demands_economic_planning:0 "Kwantung Demands Economic Planning"
MAN_kwantung_demands_economic_planning_desc:0 "The Kwantung Army, effectively sovereign in Manchuria, demands central economic planning to turn the state into a war-mobilisation instrument under military direction. The civilian government is expected to comply."
MAN_court_reorganisation_act:0 "Court Reorganisation Act"
MAN_court_reorganisation_act_desc:0 "Manchukuo's legal system is a patchwork of Chinese, Japanese and Manchu law. Reorganising the courts imposes a uniform legal code under Japanese supervision, replacing the old magistrate system."
MAN_invest_in_mass_education:0 "Invest in Mass Education"
MAN_invest_in_mass_education_desc:0 "The state invests in schools teaching Japanese language and imperial ideology alongside technical skills, aiming to mold a loyal, productive population out of Manchuria's diverse peoples."
MAN_implement_a_japanese_tax_system:0 "Implement a Japanese Tax System"
MAN_implement_a_japanese_tax_system_desc:0 "The old Chinese tax structure is replaced with a modern Japanese-style system, centralising revenue collection and giving the government the fiscal tools needed for planned industrialisation."
MAN_open_a_law_school:0 "Open a Law School"
MAN_open_a_law_school_desc:0 "Training Manchukuo's own lawyers and judges reduces dependence on Japanese legal advisors and gives the puppet state a veneer of self-governing legitimacy."
MAN_delegate_authority_to_manestsu_research_branch:0 "Delegate Authority to Manestsu Research Branch"
MAN_delegate_authority_to_manestsu_research_branch_desc:0 "Economic planning is entrusted to Mantetsu's expert researchers and technocrats rather than the Manchukuo civil service. Policy will be driven by data and expertise, not political expediency."
MAN_delegate_authority_to_the_manchuko_government:0 "Delegate Authority to the Manchuko Government"
MAN_delegate_authority_to_the_manchuko_government_desc:0 "The Manchukuo government is given genuine authority over economic planning, strengthening the puppet state's institutions at the cost of direct Japanese corporate control."
MAN_introduce_moral_societies:0 "Introduce Moral Societies"
MAN_introduce_moral_societies_desc:0 "The Concordia Association and its affiliated moral societies are mass organisations promoting Japanese-Manchurian harmony and suppressing dissent through social pressure rather than the secret police."
MAN_manchuko_national_musuem:0 "Manchuko National Musuem"
MAN_manchuko_national_musuem_desc:0 "A national museum celebrating the founding mythology of the Five Races Under One Union presents Manchukuo as a legitimate multiethnic state with deep historical roots, not a recent Japanese creation."
MAN_establish_the_manchuko_film_association:0 "Establish the Manchuko Film Association"
MAN_establish_the_manchuko_film_association_desc:0 "The Man'ei film studio, founded in 1937 in Hsinking, produces propaganda films and newsreels portraying Manchukuo as a prosperous, harmonious state. It grows into one of Asia's largest film studios."
MAN_promote_chinese_multicultralism:0 "Promote Chinese Multicultralism"
MAN_promote_chinese_multicultralism_desc:0 "The multiethnic character of Manchuria is emphasised. Chinese, Manchu, Mongol, Korean and Japanese populations are encouraged to coexist, with Chinese culture given a prominent place alongside Japanese."
MAN_promote_manchurian_identity:0 "Promote Manchurian Identity"
MAN_promote_manchurian_identity_desc:0 "Rather than Chinese or Japanese, a distinct Manchurian national identity is forged, rooted in the Manchu heritage and the founding myth of the state. A new nation, distinct from China."
MAN_nationwide_federalisation_of_manchuria:0 "Nationwide Federalisation of Manchuria"
MAN_nationwide_federalisation_of_manchuria_desc:0 "The state is restructured along federal lines, recognising the ethnic diversity of Manchuria's provinces. Each region receives limited autonomy under a central government that balances their competing interests."
MAN_call_for_mixed_marriages:0 "Call for Mixed Marriages"
MAN_call_for_mixed_marriages_desc:0 "Intermarriage between Japanese settlers and local populations is promoted as the ultimate expression of racial harmony. In practice it remains rare and controversial, but the policy signals the regime's commitment to integration."
MAN_keep_chinese_language:0 "Keep Chinese Language"
MAN_keep_chinese_language_desc:0 "Chinese remains the primary language of administration and education, preserving continuity with the region's history and the culture of the majority population."
MAN_introduce_manchurian_language:0 "Introduce Manchurian Language"
MAN_introduce_manchurian_language_desc:0 "The Manchu language, nearly extinct by the 1930s, is revived as a state language. A symbolic assertion of Manchukuo's identity as something other than a Chinese or Japanese colony."
MAN_force_the_japanese_language:0 "Force the Japanese Language"
MAN_force_the_japanese_language_desc:0 "Japanese is made the language of administration, education and daily life, tightening Tokyo's cultural grip and accelerating the assimilation of the colony into the empire."
MAN_support_manchurian_elite_families:0 "Support Manchurian Elite Families"
MAN_support_manchurian_elite_families_desc:0 "Traditional Manchu and Chinese elite families are courted with titles and privileges, co-opting the old aristocracy into the new order and giving the regime a base of local support."
MAN_joint_manchukorean_leadership:0 "Joint Manchu-Korean Leadership"
MAN_joint_manchukorean_leadership_desc:0 "Koreans are a large minority in Manchuria, many of them farmers who crossed the Yalu and Tumen rivers. Bringing Korean leaders into the government broadens the regime's base beyond the Manchu-Japanese axis."
MAN_reform_mongolian_territory:0 "Reform Mongolian Territory"
MAN_reform_mongolian_territory_desc:0 "The Mongol regions of western Manchuria, the Hinggan provinces, are reorganised, balancing autonomy for the nomadic Mongol population with their integration into the centralised state."
MAN_recognise_russian_influx:0 "Recognise Russian Influx"
MAN_recognise_russian_influx_desc:0 "Tens of thousands of White Russian emigrants live in Harbin and across Manchuria. Recognising their presence and granting them legal status brings their skills into the fold and earns their loyalty."
MAN_restoring_control_to_the_concord_society:0 "Restoring Control to the Concord Society"
MAN_restoring_control_to_the_concord_society_desc:0 "The Concordia Association, Manchukuo's sole political party, was meant to represent all races in harmony. Restoring its authority means the civilian politicians, not the Kwantung Army, will guide the state."
MAN_dreams_of_a_republican_state:0 "Dreams of a Republican State"
MAN_dreams_of_a_republican_state_desc:0 "Some Manchukuo officials quietly harbour visions of genuine self-governance: a republic in fact as well as name, free from Kwantung Army domination and answerable to its own people."
MAN_begin_selfgovernance:0 "Begin Self-Governance"
MAN_begin_selfgovernance_desc:0 "The first steps toward actual autonomy. Manchukuo officials take real decision-making power, no longer rubber-stamping orders from the Kwantung Army headquarters in Hsinking."
MAN_restoring_the_harmony_society:0 "Restoring the Harmony Society"
MAN_restoring_the_harmony_society_desc:0 "The Kyowa ideal of cooperation among the five races is revived as a genuine civic principle rather than mere propaganda, empowering local communities to govern their own affairs."
MAN_legitimise_representative_functions:0 "Legitimise Representative Functions"
MAN_legitimise_representative_functions_desc:0 "The National Assembly and local councils are given genuine legislative power, moving Manchukuo from military dictatorship toward something resembling a real parliamentary state."
MAN_return_japanese_possesions:0 "Return Japanese Possesions"
MAN_return_japanese_possesions_desc:0 "Japanese-owned concessions, the old Mantetsu railway zone and the Kwantung Leased Territory, are handed back to the Manchukuo government. A symbolic assertion of sovereignty over territory Japan has held since 1905."
MAN_return_japanese_civilians_to_politics:0 "Return Japanese Civilians to Politics"
MAN_return_japanese_civilians_to_politics_desc:0 "Japanese civilians in Manchuria are encouraged to participate in Manchukuo's political life as citizens, not colonists, blurring the line between occupier and resident."
MAN_progressive_bureaucrats_in_power:0 "Progressive Bureaucrats In Power"
MAN_progressive_bureaucrats_in_power_desc:0 "Reform-minded officials, both Manchurian and Japanese, are placed in key positions, steering the state toward genuine modernisation and development rather than pure extraction."
MAN_release_intellectual_leftist:0 "Release Intellectual Leftist"
MAN_release_intellectual_leftist_desc:0 "Political prisoners and leftist intellectuals are freed from detention, signalling a loosening of the security state and an opening for new ideas in Manchukuo's public life."
MAN_restore_the_status_of_the_party:0 "Restore the Status of the Party"
MAN_restore_the_status_of_the_party_desc:0 "The Concordia Association is elevated from a propaganda organ to a genuine governing party with real authority over policy. For the first time, the party matters."
MAN_manchuria_greening_program:0 "Manchuria Greening Program"
MAN_manchuria_greening_program_desc:0 "Decades of deforestation and overfarming have degraded Manchuria's land. A major reforestation and conservation programme aims to restore the landscape and protect the agricultural base."
MAN_support_land_reform:0 "Support Land Reform"
MAN_support_land_reform_desc:0 "Land is redistributed from absentee landlords to tenant farmers, winning popular support in the countryside and increasing agricultural output by giving peasants a stake in their own land."
MAN_thejapaneseareatthetopchinesesecond:0 "The Japanese are at the Top, Chinese Second"
MAN_thejapaneseareatthetopchinesesecond_desc:0 "Despite the rhetoric of racial harmony, the power structure is laid bare. Japanese administrators and settlers occupy the highest positions in every institution, with Chinese and Manchu subjects below them."
MAN_an_army_with_a_state:0 "An Army with a State"
MAN_an_army_with_a_state_desc:0 "Manchukuo is not a state with an army but an army with a state. The Kwantung Army tightens its grip until the civilian government is nothing more than an instrument of military policy."
MAN_finish_off_the_concord_society:0 "Finish Off the Concord Society"
MAN_finish_off_the_concord_society_desc:0 "The Concordia Association is gutted, its civilian leaders purged or sidelined. Political life in Manchukuo is now an extension of the barracks, answerable to the Kwantung Army alone."
MAN_establish_religious_laws:0 "Establish Religious Laws"
MAN_establish_religious_laws_desc:0 "State Shinto and the emperor cult are imposed across Manchukuo, with religious law used to enforce loyalty and suppress Christianity, Buddhism and folk religions deemed subversive to the imperial order."
MAN_punish_thoughtcrimes:0 "Punish Thoughtcrimes"
MAN_punish_thoughtcrimes_desc:0 "The Thought Police apparatus is extended to Manchukuo, monitoring and punishing any expression of dissent, nationalist sentiment or communist sympathy. Mere suspicion is enough for arrest."
MAN_idealogical_use_for_the_kwantung:0 "Idealogical Use for the Kwantung"
MAN_idealogical_use_for_the_kwantung_desc:0 "The Kwantung Army's ideology section takes direct control of propaganda, education and public messaging, turning the state into a machine for military indoctrination from the schoolroom to the factory floor."
MAN_shut_down_land_reforms:0 "Shut Down Land Reforms"
MAN_shut_down_land_reforms_desc:0 "Land reform is halted and reversed. The landlord class, allied with the occupation, keeps its holdings intact. Peasant unrest is met with force, not concessions."
MAN_enact_mobilisation:0 "Enact Mobilisation"
MAN_enact_mobilisation_desc:0 "Full wartime mobilisation is enacted. The civilian economy is subordinated to military production, labour is conscripted, and the population is organised for total war."
MAN_transform_the_civilian_sector:0 "Transform the Civilian Sector"
MAN_transform_the_civilian_sector_desc:0 "Civilian factories and workshops are converted to war production. Consumer goods grow scarce as every resource is directed toward the military effort."
MAN_pass_forced_labours:0 "Pass Forced Labours"
MAN_pass_forced_labours_desc:0 "Forced labour is institutionalised across Manchukuo. Chinese and Korean workers are conscripted for mines, construction and factories under conditions that claim thousands of lives."
MAN_purge_the_left:0 "Purge the Left"
MAN_purge_the_left_desc:0 "Communists, socialists and labour organisers are hunted down and eliminated. The left is destroyed as a political force in Manchukuo, its networks shattered by the military police."
MAN_openthelab:0 "Open the Lab..."
MAN_openthelab_desc:0 "At Pingfang, near Harbin, the Imperial Japanese Army's most secret facility begins its work. Unit 731 conducts biological and chemical warfare research under the direction of General Shiro Ishii. Manchukuo's darkest chapter."
MAN_manchurian_army_uniform_standard:0 "Manchurian Army Uniform Standard"
MAN_manchurian_army_uniform_standard_desc:0 "The Manchukuo Imperial Army adopts a uniform standard modelled on the Japanese military, replacing the hodgepodge of Chinese warlord-era kit. One army, one look."
MAN_new_military_academies:0 "New military Academies"
MAN_new_military_academies_desc:0 "Purpose-built military academies are established to train Manchukuo's own officer class, reducing reliance on seconded Japanese instructors and building an indigenous command culture."
MAN_korean_special_forces:0 "Korean Special Forces"
MAN_korean_special_forces_desc:0 "Korean volunteers in the Manchukuo forces are formed into elite units. Their language skills and border knowledge make them natural candidates for special operations along the Soviet frontier."
MAN_form_the_asano_squad:0 "Form the Asano Squad"
MAN_form_the_asano_squad_desc:0 "The Asano Butai is a special unit of ethnic Koreans formed under Colonel Asano Takashi, trained for intelligence gathering and partisan warfare along the Soviet-Manchurian border."
MAN_lay_down_the_first_destroyer:0 "Lay Down the First Destroyer"
MAN_lay_down_the_first_destroyer_desc:0 "The Manchukuo Imperial Navy is tiny, but laying down a destroyer marks its first step toward a blue-water capability, however modest. The keel is laid at Dairen."
MAN_manchurian_shipyards:0 "Manchurian Shipyards"
MAN_manchurian_shipyards_desc:0 "Dockyards at Dairen and along the Liaodong coast are expanded to build and maintain the growing Manchukuo fleet, from patrol boats to river monitors."
MAN_create_a_manchurian_air_force:0 "Create a Manchurian Air Force"
MAN_create_a_manchurian_air_force_desc:0 "The Manchukuo Imperial Air Force is established as a branch separate from the army, with its own command structure and training schools at Harbin and Mukden."
MAN_air_defense_department:0 "Air Defense Department"
MAN_air_defense_department_desc:0 "An air defence organisation is set up to protect Manchukuo's industrial heartland from air attack, coordinating fighters, anti-aircraft guns and early-warning networks."
MAN_rebuild_the_officer_corps:0 "Rebuild the Officer Corps"
MAN_rebuild_the_officer_corps_desc:0 "The Imperial Army's officer class is thin and inexperienced. A professional corps of career officers, schooled and promoted on merit, is the foundation of any fighting force."
MAN_standardise_drill:0 "Standardise Drill and Discipline"
MAN_standardise_drill_desc:0 "One army, one drill book. Uniform training and iron discipline turn a patchwork of collaborator units into cohesive divisions that hold under fire."
MAN_kwantung_training_cadres:0 "Kwantung Training Cadres"
MAN_kwantung_training_cadres_desc:0 "Japanese instructors are embedded down to the regimental level, drilling Manchukuo recruits in the Kwantung Army's methods and raising them to standard far faster."
MAN_frontline_infantry_doctrine:0 "A Frontline Infantry Doctrine"
MAN_frontline_infantry_doctrine_desc:0 "Drawing on hard lessons from the China front, the army codifies its own infantry doctrine, teaching its soldiers to both attack and hold ground."
MAN_reservist_mobilisation:0 "Reservist Mobilisation"
MAN_reservist_mobilisation_desc:0 "A standing reserve is called up and put through the colours, deepening the manpower pool and stiffening the resolve of the line divisions."
MAN_manchurian_logistics_corps:0 "The Manchurian Logistics Corps"
MAN_manchurian_logistics_corps_desc:0 "A dedicated supply and transport corps keeps the army fed, fuelled and moving across Manchuria's vast distances, easing the strain on the front."
MAN_a_modern_imperial_army:0 "A Modern Imperial Army"
MAN_a_modern_imperial_army_desc:0 "Years of reform bear fruit. The Manchukuo Imperial Army is no longer a garrison of conscripts but a modern force fit to stand beside the Empire's own."
MAN_manchurian_commandos:0 "Manchurian Commandos"
MAN_manchurian_commandos_desc:0 "Building on the Korean and Asano detachments, the army raises dedicated commando formations for raiding, reconnaissance and special warfare."
MAN_manchurian_tank_corps:0 "The Manchurian Tank Corps"
MAN_manchurian_tank_corps_desc:0 "Manchuria's steel and the Dowa works give the army the means to field its own armour. A tank corps is stood up under Kwantung supervision."
MAN_mechanisation_program:0 "Mechanisation Program"
MAN_mechanisation_program_desc:0 "Trucks and half-tracks off the Dowa lines put the infantry on wheels, giving the army the mobility to exploit a breakthrough."
MAN_deep_battle_tactics:0 "Deep Battle Tactics"
MAN_deep_battle_tactics_desc:0 "Armour and mechanised infantry are trained to punch through and drive deep into the enemy rear, encircling before he can react."
MAN_riverine_flotilla:0 "The Riverine Flotilla"
MAN_riverine_flotilla_desc:0 "Manchuria's great rivers are highways and borders alike. A flotilla of gunboats secures the Sungari and Amur against smugglers and Soviet probes."
MAN_coastal_defence_command:0 "Coastal Defence Command"
MAN_coastal_defence_command_desc:0 "The Kwantung Leased Territory and the Dairen approaches must be held. A coastal defence command organises the light warships and shore batteries that guard them."
MAN_manchukuo_aviation_industry:0 "The Manchukuo Aviation Industry"
MAN_manchukuo_aviation_industry_desc:0 "The Manchuria Aeroplane Manufacturing Company is expanded into a true aviation industry, able to build aircraft as well as service them."
MAN_fighter_development:0 "Fighter Development"
MAN_fighter_development_desc:0 "Manchukuo's aviators press for a modern interceptor of their own, agile enough to contest the skies over the northern frontier."
MAN_ground_support_wing:0 "A Ground Support Wing"
MAN_ground_support_wing_desc:0 "The air force is bound tightly to the army, standing up dedicated attack squadrons to break enemy strongpoints ahead of the advance."
