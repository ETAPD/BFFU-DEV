l_english:
JAP_begin_nanshin_ron:0 "Begin Nanshin-ron"
JAP_begin_nanshin_ron_desc:0 "The §YNanshin-ron§!, the Doctrine of Southern Expansion, holds that the Empire's destiny lies not in the frozen steppes of Siberia but in the resource-rich lands and seas to the south. Let us set our course toward the Pacific and Southeast Asia."
JAP_begin_nanshin_ron_tt:0 "Commit the Empire to the §YSouthern Expansion Doctrine§!.\nOpens the §YNanshin-ron§! decision tab."
JAP_nanshin_placeholder_tt:0 "§RThis focus is not yet implemented.§!"
JAP_Demand_indochina:0 "Demand Indochina"
JAP_Demand_indochina_desc:0 "With our armies poised on the borders of French Indochina, we will press our demands and open the §Ydecision§! to bring the colony under Japanese administration."
JAP_Srike_The_West:0 "Strike the West"
JAP_Srike_The_West_desc:0 "The decision is taken. We will fall upon the Western powers across the whole of Asia and the Pacific at once, before they can marshal their strength against us."
JAP_Strike_Darwin:0 "Strike Darwin"
JAP_Strike_Darwin_desc:0 "With New Guinea secured and the first shock of war spent, we turn south. Operation AN will carry the war to the Australian mainland itself."
JAP_Secured_Autarky:0 "Secured Autarky"
JAP_Secured_Autarky_desc:0 "The oil, rubber and tin of the Dutch East Indies are ours. At last the Empire commands the resources to sustain a long war without the West."
JAP_Guerilla_Operation:0 "Guerrilla Operation"
JAP_Guerilla_Operation_desc:0 "Infiltrators and saboteurs will slip behind enemy lines to wreck the defences of one Allied stronghold of our choosing."
JAP_nanshin_placeholder_1:0 "Nanshin-ron (Placeholder)"
JAP_nanshin_placeholder_1_desc:0 "Placeholder focus. To be designed."
JAP_nanshin_placeholder_2:0 "Nanshin-ron (Placeholder)"
JAP_nanshin_placeholder_2_desc:0 "Placeholder focus. To be designed."
