JAP_nanshin_placeholder_7_desc:0 "Placeholder focus. To be designed."
JAP_nanshin_placeholder_8:0 "Nanshin-ron (Placeholder)"
JAP_nanshin_placeholder_8_desc:0 "Placeholder focus. To be designed."
JAP_sign_the_tripartie_pact:0 "Sign the Tripartie Pact"
JAP_sign_the_tripartie_pact_desc:0 "Japan formally joins Germany and Italy in the Tripartite Pact, each power recognising the others' claimed sphere in a new world order. The alliance binds Tokyo closer to Berlin and Rome, and edges the Empire nearer to war with America."
JAP_commision_a_study_in_germany:0 "Commision a Study in Germany"
JAP_commision_a_study_in_germany_desc:0 "Officers and engineers are dispatched to observe the Wehrmacht's doctrine and industry firsthand, hoping to import lessons in mechanisation and total war that Japan's own staff colleges have been slow to absorb."
JAP_supreme_council_for_direction_of_war:0 "Supreme Council for Direction of War"
JAP_develop_a_unified_cartridge:0 "Develop a Unified Cartridge"
JAP_develop_a_unified_cartridge_desc:0 "Army arsenals field rifles, machine guns and cartridges in a confusing tangle of incompatible calibres. A single standard round promises simpler logistics and faster production, if the services can agree to share it."
JAP_prepare_the_manchurian_peninsular:0 "Prepare the Manchurian Peninsular"
JAP_prepare_the_manchurian_peninsular_desc:0 "With the Kwantung Army's border garrisons reinforced and supply lines surveyed, the General Staff quietly readies Manchuria for the war with China that many officers now consider inevitable."
JAP_establish_the_volunteer_combat_corps:0 "Establish the Volunteer Combat Corps"
JAP_establish_the_volunteer_combat_corps_desc:0 "Reservists and patriotic volunteers are folded into auxiliary combat units, blooding green officers alongside veterans and hardening the army for campaigns far from the temperate home islands."
JAP_imperial_japanese_rations:0 "Imperial Japanese Rations"
JAP_imperial_japanese_rations_desc:0 "A standardised field ration is issued across the army, easing the strain on supply columns that have struggled to keep pace with troops advancing deep into hostile, poorly mapped terrain."
JAP_resultsfromhommasreports:0 "Results from Homma's Reports"
JAP_resultsfromhommasreports_desc:0 "General Homma's reports on Western military methods, drawn from his years as an attache in Europe, are circulated through the staff college, reshaping doctrine before the army commits it to the field."
JAP_aruthlessadministrator:0 "A Ruthless Administrator..."
JAP_aruthlessadministrator_desc:0 "Hideki Tojo's reputation as a brusque, exacting bureaucrat, earning him the nickname Razor Tojo, now defines the government itself. Decisions move faster, but dissent finds no quarter under his iron administration."
JAP_council_for_political_settlements:0 "Council for Political Settlements"
JAP_council_for_political_settlements_desc:0 "A standing council is formed to mediate the endless rivalries between parties, factions and the military, hoping to settle disputes quietly before they spill into public scandal or cabinet collapse."
JAP_under_a_steady_hand:0 "Under a steady hand"
JAP_under_a_steady_hand_desc:0 "With the crisis of the moment past, the cabinet steadies itself, trading revolutionary ambition for cautious, predictable governance that reassures both the court and the zaibatsu."
JAP_create_multi_level_elections:0 "Create Multi Level Elections"
JAP_create_multi_level_elections_desc:0 "A tiered electoral system is introduced, weighting representation toward reliable, established interests and blunting the influence of the mass parties the military distrusts."
JAP_national_syndicalism:0 "National Syndicalism"
JAP_national_syndicalism_desc:0 "Corporatist theorists within the bureaucracy push a syndicalist model binding labour, capital and the state into a single directed economy, answerable not to profit but to the nation's war footing."
JAP_take_up_governmental_positions:0 "Take up Governmental Positions"
JAP_take_up_governmental_positions_desc:0 "Sympathetic officers and reform bureaucrats are quietly placed in ministries and agencies, building a network of allies who will answer to the cause long after any one cabinet falls."
JAP_unique_political_system:0 "Unique Political System"
JAP_unique_political_system_desc:0 "Neither purely parliamentary nor purely military, Japan's Imperial Way blends throne, cabinet and general staff into a system unlike any in the West, steadying the state through its own peculiar logic."
JAP_develop_the_azuma_class:0 "Develop the Azuma Class"
JAP_develop_the_azuma_class_desc:0 "Naval architects lay down the Azuma class, a modest but modern design meant to test new construction techniques before committing the yards to the fleet's next generation of capital ships."
JAP_niniroku_jiken:0 "Ni-Niroku Jiken"
JAP_niniroku_jiken_desc:0 "The February 26 Incident (二・二六事件, Ni Ni-Roku Jiken) was an attempted coup d'état in the Empire of Japan from 26 to 29 February 1936, launched by radical young Imperial Japanese Army (IJA) officers."
JAP_transport_submarine_technology:0 "Transport Submarine Technology"
JAP_transport_submarine_technology_desc:0 "Submarines built to run supplies and reinforcements past enemy blockades are prioritised, a quiet admission that the fleet's surface convoys may not always get through to isolated garrisons."
JAP_kokiscabinetforms:0 "Koki's Cabinet Forms"
JAP_kokiscabinetforms_desc:0 "Following the February 26 Incident and Okada Keisuke's resignation, Hirota Kōki emerges as a compromise premier acceptable to both civilian and military factions, though Army Minister Terauchi's objections already reveal how far the military's influence now reaches."
JAP_kyoikukaigicouncilestablished:0 "Kyōiku Kaigi Council Established"
JAP_kyoikukaigicouncilestablished_desc:0 "established in 1935 was an advisory body to the Japanese Minister of Education. It functioned as a tool for the state to centralise control over schooling, standardising curricula and shifting educational goals toward extreme nationalism and militarism."
JAP_noborito_research_institute:0 "Noborito Research Institute"
JAP_noborito_research_institute_desc:0 "The Noborito Research Institute, officially the Ninth Army Technical Research Laboratory, is a covert Kawasaki facility of the Imperial Japanese Army, specialising in unconventional warfare: espionage, sabotage, and the clandestine development of biological and chemical weapons."
JAP_hirotaoutoftime:0 "Hirota Out of Time..."
JAP_hirotaoutoftime_desc:0 "He resigned after a disagreement with Hisaichi Terauchi, who was serving as the war minister, over a speech by the Rikken Seiyūkai representative Kunimatsu Hamada criticizing military interference in politics."
JAP_reformthekakushinkanryo:0 "Reform the Kakushin Kanryō"
JAP_reformthekakushinkanryo_desc:0 "Widely seen as a military proposal, the reform establishes a central personnel agency directly under the Prime Minister and broadens his power of discretionary appointment, aiming to break the bureaucracy's entrenched sectionalism once and for all."
JAP_rebuild_the_agricultural_sector:0 "Rebuild the Agricultural Sector"
JAP_rebuild_the_agricultural_sector_desc:0 "Since the Tenant Arbitration Ordinance of 1932, Japan has tried to ease bitter landlord tenant conflict. The 1935 Farm Tenancy Conciliation Act widens this framework, allowing rent, eviction and renewal disputes to be mediated out of court."
JAP_renewed_ministries_of_trade_and_industry:0 "Renewed Ministries of Trade and Industry"
JAP_renewed_ministries_of_trade_and_industry_desc:0 "By offering the miliary a hand-picked cabinet per the decree on May 18, 1936, Hirota has gained crucial time to enact economic reforms"
JAP_reform_the_tax_system:0 "Reform the Tax System"
JAP_reform_the_tax_system_desc:0 "The Hirota Cabinet's attempted tax revision ended in failure. Finance Minister Yuki, under Hayashi, instead passed a temporary tax increment law: levies on corporate capital, foreign bonds, petrol and negotiable instruments, funding roughly 100 million yen in emergency grants."
JAP_address_the_housing_crisis:0 "Address the Housing Crisis"
JAP_address_the_housing_crisis_desc:0 "Rapid industrialisation has flooded Tokyo and Osaka with rural migrants, fuelling overcrowded, unsanitary slums. Most working families are confined to cramped wooden nagaya row houses, lacking proper plumbing, ventilation or earthquake safety."
JAP_assure_the_military_of_the_civilian_sector:0 "Assure the Military of the Civilian Sector"
JAP_assure_the_military_of_the_civilian_sector_desc:0 "Under Prime Minister Hirota, per Hirohito's decree on May 18, 1936, only active military personnel could assume the posts of Army and Navy ministers (previously reserved for retirees), granting them the ability to advocate for the defense industry's interests."
JAP_hayashi_enters_office:0 "Hayashi Enters Office"
JAP_hayashi_enters_office_desc:0 "Following Hirota's outburst, a 4 month replacement Hayashi enters with short time, attempts to reign in factionalism"
JAP_increased_taxes:0 "Increased Taxes"
JAP_increased_taxes_desc:0 "New levies are imposed to fund the army's ambitions, drawing grumbling from taxpayers already squeezed by a decade of depression and rearmament."
JAP_compromise_with_business_sectors:0 "Compromise with Business Sectors"
JAP_compromise_with_business_sectors_desc:0 "Facing resistance from the zaibatsu, the cabinet offers concessions, favourable contracts and looser oversight in exchange for the great combines' cooperation with the state's rearmament programme."
JAP_abolish_financial_support:0 "Abolish Financial Support"
JAP_abolish_financial_support_desc:0 "Subsidies once guaranteed to struggling industries and rural cooperatives are quietly withdrawn, freeing funds for the military budget at the cost of real hardship in the countryside."
JAP_anotherresignation:0 "Another Resignation..."
JAP_anotherresignation_desc:0 "After only months in office, he threw his support behind the promilitarist Shōwa-kai, dissolved the Diet and called an election hoping to build a one-party state. The vote revealed he had few supporters, and he resigned."
JAP_ichiyoraifuk:0 "Ichiyō Raifuk"
JAP_ichiyoraifuk_desc:0 "The return of spring. With all political failures in recent years the admired prince Konoe has stepped in times of crisis to steer Japan through its next goals"
JAP_hakkoichiu:0 "Hakkō ichiu"
JAP_hakkoichiu_desc:0 "Hakkō Ichiu, the eight corners of the world under one roof, is proclaimed the guiding ideal of the Empire's expansion, casting conquest as a sacred mission to unite Asia beneath the Throne."
JAP_new_order_in_east_asia:0 "New Order in East Asia"
JAP_new_order_in_east_asia_desc:0 "Konoe's government proclaims a New Order in East Asia, a vision binding Japan, Manchukuo and China together under Tokyo's guidance, free of Western commercial and colonial interests."
JAP_create_the_yen_block:0 "Create the Yen Block"
JAP_create_the_yen_block_desc:0 "A closed currency zone built around the yen binds Japan's conquests and client states into a single trading sphere, insulating the Empire's economy from Western embargo at the cost of open markets."
JAP_east_asian_development_board:0 "East Asian Development Board"
JAP_east_asian_development_board_desc:0 "The East Asian Development Board is founded to coordinate the economic exploitation of occupied China, wresting control of resources and industry away from the army's independent field commands."
JAP_greater_east_asian_conference:0 "Greater East Asian Conference"
JAP_greater_east_asian_conference_desc:0 "Delegates from Japan's client states gather in Tokyo for a conference proclaiming Asian solidarity, a show of unity meant to paper over the very real inequalities of Japan's new order."
JAP_asiaforasiatics:0 "Asia for Asiatics!"
JAP_asiaforasiatics_desc:0 "Propaganda ministries take up the cry of Asia for the Asiatics, urging colonised peoples across the region to see Japan not as a conqueror but as a liberator from Western rule."
JAP_end_the_kuomintang:0 "End the Kuomintang"
JAP_end_the_kuomintang_desc:0 "With Chiang Kai-shek's government broken and scattered, Tokyo moves to end the Kuomintang as a political force in China altogether, backing rival regimes willing to collaborate."
JAP_behead_the_dragon:0 "Behead the Dragon"
JAP_behead_the_dragon_desc:0 "A decapitation strategy targets the Nationalist leadership directly, gambling that removing Chiang Kai-shek and his inner circle will collapse Chinese resistance faster than grinding attrition ever could."
JAP_staff_the_new_cabinets:0 "Staff the New Cabinets"
JAP_staff_the_new_cabinets_desc:0 "Japan installs pliable administrators in the collaborationist governments raised across occupied China, ensuring Tokyo's word carries further than any nominal Chinese authority."
JAP_pardon_communists:0 "Pardon Communists"
JAP_pardon_communists_desc:0 "An amnesty is proclaimed for political prisoners, communists among them, a calculated gesture of clemency meant to present the Throne as magnanimous even as the state's grip elsewhere tightens."
JAP_develop_kokutai:0 "Develop Kokutai"
JAP_develop_kokutai_desc:0 "The doctrine of kokutai, the unique and inviolable national polity centred on the Emperor, is elevated into official orthodoxy, binding education, law and loyalty to one sacred idea of the state."
JAP_maintain_showa_statism:0 "Maintain Showa Statism"
JAP_maintain_showa_statism_desc:0 "The Shōwa state leans further into statist control, subordinating parties, unions and the press to a single national purpose defined from the top down."
JAP_five_races_under_one_union:0 "Five Races Under One Union"
JAP_five_races_under_one_union_desc:0 "The ideal of Gozoku Kyōwa, five races living in harmony under Japanese guidance, is proclaimed across Manchukuo and occupied China, a slogan that rarely survives contact with occupation policy."
JAP_establish_slave_labour:0 "Establish Slave Labour"
JAP_establish_slave_labour_desc:0 "Forced labour drafts are imposed on occupied populations, herding conscripted workers into mines, factories and construction projects to feed the war economy, whatever the human cost."
JAP_enact_the_national_mobilisation_law:0 "Enact the National Mobilisation Law"
JAP_enact_the_national_mobilisation_law_desc:0 "The National Mobilisation Law grants the government sweeping authority over industry, labour and the press, formally subordinating the entire civilian economy to the demands of total war."
JAP_ally_siam:0 "Ally Siam"
JAP_ally_siam_desc:0 "Bangkok is courted as a willing partner rather than a conquered subject, offering Siam trade and territorial concessions in exchange for standing alongside Japan's new order."
JAP_subjugate_siam:0 "Subjugate Siam"
JAP_subjugate_siam_desc:0 "Patience with Bangkok's hesitation runs out. Japanese troops move to occupy Siam outright, folding its resources and bases directly into the Empire's southern strategy."
JAP_no_time_for_reform:0 "No Time for Reform"
JAP_no_time_for_reform_desc:0 "With war looming, ambitious reform schemes are shelved. There will be time to remake the state later, the cabinet reasons; for now every effort bends toward the coming conflict."
JAP_hiranuma_cabinet_forms:0 "Hiranuma Cabinet Forms"
JAP_hiranuma_cabinet_forms_desc:0 "Baron Hiranuma Kiichirō, an ultranationalist jurist, forms his cabinet in the wake of Konoe's first resignation, inheriting a war in China with no end in sight."
JAP_abandon_ties_to_the_west:0 "Abandon Ties to the West"
JAP_abandon_ties_to_the_west_desc:0 "Facing Allied embargo and mounting hostility, Tokyo formally abandons its remaining ties to the Western powers, accepting the diplomatic isolation that commitment to the Co-Prosperity Sphere demands."
JAP_delay_nazi_channels:0 "Delay Nazi Channels"
JAP_delay_nazi_channels_desc:0 "Tokyo stalls on Berlin's overtures for a formal military alliance, wary of being dragged into a European war before Japan's own ambitions in Asia are secured."
JAP_adopt_the_new_german_laws:0 "Adopt the New German Laws"
JAP_adopt_the_new_german_laws_desc:0 "An unhistorical faction within the government pushes to import German racial and legal doctrine wholesale, a radical departure few in the cabinet are willing to fully embrace."
JAP_esclate_the_war_in_china:0 "Esclate the War in China"
JAP_esclate_the_war_in_china_desc:0 "Limited skirmishing gives way to full scale war. Divisions pour across the Chinese border as Tokyo commits the Empire to a conflict it insists will be short."
JAP_test_the_soviets:0 "Test the Soviets"
JAP_test_the_soviets_desc:0 "Kwantung Army units probe the Soviet border in Manchuria, testing Moscow's resolve and the Red Army's strength before committing to any larger confrontation in the north."
JAP_nonaggression_pact_with_the_ussr:0 "Non-Aggression Pact with the USSR"
JAP_nonaggression_pact_with_the_ussr_desc:0 "With Nomonhan's lessons learned the hard way, Tokyo signs a non aggression pact with Moscow, freeing the army to look south without fear of a two front war."
JAP_fixing_a_broken_system:0 "Fixing a Broken System"
JAP_fixing_a_broken_system_desc:0 "Convinced the party system itself is the root of Japan's paralysis, reformers move to dismantle it entirely, clearing the ground for something new to take its place."
JAP_the_prince_returns:0 "The Prince Returns"
JAP_the_prince_returns_desc:0 "Prince Konoe returns to head a second cabinet, promising the strong, unified leadership his first term never quite delivered, as the Empire edges closer to a wider war."
JAP_imperial_rule_assistance_association:0 "Imperial Rule Assistance Association"
JAP_imperial_rule_assistance_association_desc:0 "Every political party dissolves itself into the Taisei Yokusankai, the Imperial Rule Assistance Association, a single mass organisation meant to unite the nation behind the Throne and the war effort."
JAP_a_full_fledged_poltical_party:0 "A Full Fledged Poltical Party"
JAP_a_full_fledged_poltical_party_desc:0 "What began as a loose coalition of bureaucrats and officers matures into a genuine political machine, contesting influence in every ministry and prefecture."
JAP_supreme_national_political_commitee:0 "Supreme National Political Commitee"
JAP_supreme_national_political_commitee_desc:0 "A supreme committee is formed atop the Association's structure, meant to arbitrate between its rival factions before their quarrels paralyse the government."
JAP_create_a_unified_trade_union:0 "Create a Unified Trade Union"
JAP_create_a_unified_trade_union_desc:0 "Independent labour unions are dissolved and folded into a single state sanctioned body, trading the right to strike for a guaranteed voice in wartime planning."
JAP_dai_nippon_fujinkai:0 "Dai Nippon fujinkai"
JAP_dai_nippon_fujinkai_desc:0 "The Dai Nippon Fujinkai, the Greater Japan Women's Association, mobilises women nationwide for war work, rationing drives and the home front's endless demands."
JAP_form_a_party_core:0 "Form a Party Core"
JAP_form_a_party_core_desc:0 "A disciplined inner core of loyal officials is assembled at the Association's heart, the engine meant to drive policy long after the founding enthusiasm fades."
JAP_one_national_party:0 "One National Party"
JAP_one_national_party_desc:0 "Every remaining faction and splinter party is compelled to fold into a single national organisation, the reformers ascendant as the old conservative blocs wither."
JAP_centralised_political_body:0 "Centralised Political Body"
JAP_centralised_political_body_desc:0 "Authority within the Association concentrates in a small leadership council, streamlining decisions that once took months of factional haggling to resolve."
JAP_mass_orginistational_base:0 "Mass Orginistational Base"
JAP_mass_orginistational_base_desc:0 "Branch offices spread into every town and village, building the Association's mass base until few households in the Empire stand entirely outside its reach."
JAP_tojo_outmaneuvers_konoe:0 "Tojo Outmaneuvers Konoe"
JAP_tojo_outmaneuvers_konoe_desc:0 "Hideki Tojo, War Minister and rising favourite of the army, manoeuvres Prince Konoe out of office and takes the premiership himself, formalising the military's grip on government."
JAP_expand_the_powers_of_executive_branch:0 "Expand the Powers of Executive Branch"
JAP_expand_the_powers_of_executive_branch_desc:0 "Tojo consolidates the offices of Prime Minister, War Minister and Home Minister under himself, an unprecedented concentration of executive authority in a single pair of hands."
JAP_national_defense_brotherhood:0 "National Defense Brotherhood"
JAP_national_defense_brotherhood_desc:0 "A civilian mobilisation league binds factory, farm and neighbourhood association alike into the machinery of national defence, blurring the line between soldier and citizen."
JAP_add_the_reform_bureacrats_to_the_economy:0 "Add the Reform Bureacrats to the Economy"
JAP_add_the_reform_bureacrats_to_the_economy_desc:0 "Kishi Nobusuke and the reform bureaucrats are given a free hand over economic planning, imposing state direction on an economy the zaibatsu once ran largely to their own design."
JAP_mass_propanganda:0 "Mass Propanganda"
JAP_mass_propanganda_desc:0 "State propaganda saturates newsreel, radio and classroom alike, marshalling the nation's imagination as thoroughly as its factories for the war ahead."
JAP_toseihamodernisationplan:0 "Tōseiha Modernisation Plan"
JAP_toseihamodernisationplan_desc:0 "The Tōseiha, the Control Faction, presses its own vision of a modernised, mechanised army under strict central command, sidelining the romantic spiritualism of its rivals."
JAP_manchurian_modernisation_plan:0 "Manchurian Modernisation Plan"
JAP_manchurian_modernisation_plan_desc:0 "Manchukuo's arsenals and rail network are drawn into a single modernisation plan, treating the puppet state as an extension of Japan's own industrial base."
JAP_ugakismodernisationplan:0 "Ugaki's Modernisation Plan"
JAP_ugakismodernisationplan_desc:0 "General Ugaki Kazushige's long delayed reforms finally move forward, trimming obsolete formations to fund the tanks, aircraft and artillery a modern army actually needs."
JAP_water_supply_and_prevention_department:0 "Water Supply and Prevention Department"
JAP_water_supply_and_prevention_department_desc:0 "Officially a department for water purification and epidemic prevention, its true purpose lies far darker: research into biological agents conducted under strict military secrecy."
JAP_three_alls_policy:0 "Three Alls Policy"
JAP_three_alls_policy_desc:0 "The Three Alls Policy, kill all, burn all, loot all, is unleashed against suspected guerrilla strongholds in occupied China, a scorched earth campaign of savage reprisal."
JAP_develop_chemichal_weapons:0 "Develop Chemichal Weapons"
JAP_develop_chemichal_weapons_desc:0 "Army chemists press ahead with mustard gas and other banned agents, stockpiling weapons Japan has publicly forsworn but privately judges too useful to abandon."
JAP_integrate_takasagao_volunteers:0 "Integrate Takasagao Volunteers"
JAP_integrate_takasagao_volunteers_desc:0 "Aboriginal Takasago volunteers from Taiwan's highlands are integrated into the army, prized for their jungle skills and endurance in terrain few mainland units can master."
JAP_supremacy_of_man:0 "Supremacy of Man"
JAP_supremacy_of_man_desc:0 "Doctrine holds that the spirit and will of the individual soldier, properly cultivated, can overcome any material disadvantage the enemy might hold."
JAP_yamashitasguidance:0 "Yamashita's Guidance"
JAP_yamashitasguidance_desc:0 "General Yamashita Tomoyuki's lessons from Malaya, rapid movement, bold bluff and relentless pressure on a numerically superior foe, are folded into standard army doctrine."
JAP_meticulious_preperation:0 "Meticulious Preperation"
JAP_meticulious_preperation_desc:0 "Staff colleges drill the virtue of meticulous preparation, reasoning that a plan rehearsed to exhaustion beforehand costs fewer lives than one worked out under fire."
JAP_learning_from_our_opponents:0 "Learning from Our Opponents"
JAP_learning_from_our_opponents_desc:0 "Captured manuals and battlefield reports from Soviet, Chinese and Western forces are studied closely, mining even a beaten enemy for tactics worth borrowing."
JAP_development_of_assault_tactics:0 "Development of Assault Tactics"
JAP_development_of_assault_tactics_desc:0 "Infiltration and shock tactics, honed against Chinese and Soviet lines alike, are formalised into doctrine for breaking prepared defences quickly and at minimal cost."
JAP_supremacy_of_will:0 "Supremacy of Will"
JAP_supremacy_of_will_desc:0 "Where matériel falls short, doctrine insists willpower must fill the gap, that an army convinced of its own invincibility can be made to act as if it were."
JAP_finish_army_reforms:0 "Finish Army Reforms"
JAP_finish_army_reforms_desc:0 "The long, contested process of army reform is finally brought to a close, its modernisers satisfied and its traditionalists overruled or retired."
JAP_intergrate_airground_crews:0 "Intergrate Air-Ground Crews"
JAP_intergrate_airground_crews_desc:0 "Air and ground crews train together for the first time as a matter of course, trimming the costly delays that once plagued close support missions."
JAP_mechanised_drive:0 "Mechanised Drive"
JAP_mechanised_drive_desc:0 "Infantry divisions begin trading their marching boots for trucks and half tracks, chasing the mobility that Japan's terrain and industry have long denied them."
JAP_triple_tank_production:0 "Triple Tank Production"
JAP_triple_tank_production_desc:0 "Tank output is ordered tripled almost overnight, straining an industrial base never designed to build armour at anything like the scale its rivals manage."
JAP_supremacy_of_technology:0 "Supremacy of Technology"
JAP_supremacy_of_technology_desc:0 "After decades favouring spirit over steel, doctrine finally concedes that modern war is won as much in the factory as on the battlefield."
JAP_favour_the_ijaas:0 "Favour the IJAAS"
JAP_favour_the_ijaas_desc:0 "Funding and priority tilt toward the Army Air Service, its generals arguing that close support and interdiction, not naval aviation, will decide the coming land campaigns."
JAP_favour_the_ijnas:0 "Favour the IJNAS"
JAP_favour_the_ijnas_desc:0 "The Navy Air Service wins the argument instead, its carriers and long range bombers judged the surer path to command of the vast Pacific theatre."
JAP_the_perfect_zero:0 "The Perfect Zero"
JAP_the_perfect_zero_desc:0 "Engineers push the A6M Zero's design to its limit, chasing ever greater range and manoeuvrability even as the airframe's thin armour leaves its pilots dangerously exposed."
JAP_funding_for_high_altitude_combat:0 "Funding for High Altitude Combat"
JAP_funding_for_high_altitude_combat_desc:0 "Research funds flow toward superchargers and pressurised cabins, chasing the high altitude performance Japanese fighters have so far lacked against Western bombers."
JAP_establish_kantai_kessen:0 "Establish Kantai Kessen"
JAP_establish_kantai_kessen_desc:0 "Kantai Kessen, the doctrine of the decisive fleet battle, is formally adopted: the Navy will husband its strength for one climactic engagement to break an enemy fleet outright."
JAP_favour_the_treaty_faction:0 "Favour the Treaty Faction"
JAP_favour_the_treaty_faction_desc:0 "The Treaty Faction argues for restraint, favouring diplomacy and a fleet built within the naval treaties' limits rather than an unaffordable race to outbuild every rival."
JAP_favour_the_fleet_faction:0 "Favour the Fleet Faction"
JAP_favour_the_fleet_faction_desc:0 "The Fleet Faction wins out instead, convinced that only a battle fleet unconstrained by any treaty can guarantee the Empire's security in the Pacific."
JAP_begin_the_third_circle_plan:0 "Begin the Third Circle Plan"
JAP_begin_the_third_circle_plan_desc:0 "The Third Replenishment Programme, the Maru San Keikaku, lays down a new generation of capital ships and carriers, the Navy's answer to the treaty system's collapse."
JAP_fourth_circle_plan:0 "Fourth Circle Plan"
JAP_fourth_circle_plan_desc:0 "A fourth shipbuilding programme follows hard on the third, the yards working around the clock to keep pace with a fleet expansion that shows no sign of slowing."
JAP_final_fifth_circle_plan:0 "Final Fifth Circle Plan"
JAP_final_fifth_circle_plan_desc:0 "A fifth and final programme is drawn up before war makes further long term planning meaningless, the Navy racing to complete as much of its ambition as time allows."
JAP_creation_of_the_first_mobile_fleet:0 "Creation of the First Mobile Fleet"
JAP_creation_of_the_first_mobile_fleet_desc:0 "The Combined Fleet's carriers are gathered for the first time into a single mobile striking force, a concentration of naval air power without precedent anywhere in the world."
JAP_lay_down_the_shokaku_class:0 "Lay Down the Shokaku Class"
JAP_lay_down_the_shokaku_class_desc:0 "The Shōkaku class carriers are laid down, among the finest fleet carriers afloat, built to project the Navy's air power far beyond home waters."
JAP_develop_type_91_aerial_torpedo:0 "Develop Type 91 Aerial Torpedo"
JAP_develop_type_91_aerial_torpedo_desc:0 "The Type 91 aerial torpedo is refined until it can be dropped reliably even in the shallow waters of a defended harbour, a capability few navies believed possible."
JAP_form_the_kido_butai:0 "Form the Kido Butai"
JAP_form_the_kido_butai_desc:0 "The Kidō Butai, the mobile strike force built around six fleet carriers, is formed: the single most powerful concentration of naval air power the world has yet seen."
JAP_advanced_torpedo_cruisers:0 "Advanced Torpedo Cruisers"
JAP_advanced_torpedo_cruisers_desc:0 "Cruiser designs are reworked around the superlative Type 93 torpedo, trading armour for the reach and striking power to win a night action outright."
JAP_form_the_snlf:0 "Form the SNLF"
JAP_form_the_snlf_desc:0 "The Special Naval Landing Forces are formed, the Navy's own marine infantry, trained to seize island bases and harbours ahead of the army's main landings."
JAP_develop_the_type_23_fire_control_radar:0 "Develop the Type 23 Fire Control Radar"
JAP_develop_the_type_23_fire_control_radar_desc:0 "Naval engineers race to close the gap in fire control radar, a technology in which the fleet has fallen embarrassingly far behind its Western rivals."
JAP_strenghten_the_island_defences:0 "Strenghten the Island Defences"
JAP_strenghten_the_island_defences_desc:0 "Garrisons across the Pacific mandates are reinforced with bunkers, coastal guns and hidden supply caches, preparing for a defence in depth few in Tokyo yet believe will be needed."
JAP_the_ultimate_battleship:0 "The Ultimate Battleship"
JAP_the_ultimate_battleship_desc:0 "Design work culminates in a battleship without equal, armoured and armed beyond anything else afloat, the Navy's answer to any fleet it might one day face."
JAP_lay_down_the_bungo_class:0 "Lay Down the Bungo Class"
JAP_lay_down_the_bungo_class_desc:0 "A sister ship to the Empire's greatest battleship is laid down in secret, the yards straining to match the extraordinary demands of her design."
JAP_prepare_for_poor_weather:0 "Prepare for Poor Weather"
JAP_prepare_for_poor_weather_desc:0 "Ships and aircrew alike are drilled for operations in typhoon season and the fog banks of the northern Pacific, conditions that have grounded fleets before."
JAP_tohoku_industrial_development_company:0 "Tohoku Industrial Development Company"
JAP_tohoku_industrial_development_company_desc:0 "The Tōhoku Industrial Development Company channels capital into the region's mines and factories, dragging Japan's poorer northeast into the war economy's orbit."
JAP_begin_the_manchurian_project:0 "Begin the Manchurian Project"
JAP_begin_the_manchurian_project_desc:0 "The Manchurian Industrial Development Plan pours capital and settlers into Manchukuo's mines and mills, remaking the puppet state into the Empire's forward arsenal."
JAP_begin_the_chosen_proejct:0 "Begin the Chosen Proejct"
JAP_begin_the_chosen_proejct_desc:0 "The Chōsen Project extends the same industrial ambition to Korea, binding the peninsula's coal, hydroelectric power and labour ever tighter to the home islands' war economy."
JAP_economic_unification_with_korea:0 "Economic Unification with Korea"
JAP_economic_unification_with_korea_desc:0 "Tariff walls between Japan and Korea are dismantled, folding the peninsula's economy fully into the Empire's own, a formality that changes little for a Korea occupied for decades already."
JAP_industralise_taiwan:0 "Industralise Taiwan"
JAP_industralise_taiwan_desc:0 "Investment flows into Taiwan's ports, railways and refineries, transforming the island from a sleepy agricultural colony into a genuine industrial asset for the Empire."
JAP_closer_economic_control:0 "Closer Economic Control"
JAP_closer_economic_control_desc:0 "Tokyo tightens its grip on the colonial economies, overriding what little local discretion remained in Taiwan, Korea and the mandates in favour of direct metropolitan control."
JAP_reliance_on_nippon:0 "Reliance On Nippon"
JAP_reliance_on_nippon_desc:0 "Colonial industries are reoriented to depend on Japanese suppliers and markets alone, ensuring Taiwan, Korea and Manchukuo can never again stand economically apart from the home islands."
JAP_birth_of_the_reform_bureaucrats:0 "Birth of the Reform Bureaucrats"
JAP_birth_of_the_reform_bureaucrats_desc:0 "A new generation of technocrats, the reform bureaucrats, rises within the ministries, convinced that only direct state planning can carry Japan through the coming total war."
JAP_the_sakura_blooms:0 "The Sakura Blooms"
JAP_the_sakura_blooms_desc:0 "Spring propaganda reels cast the falling cherry blossom as the soldier's own fate: brief, beautiful and given willingly for the Emperor, a sentiment the state cultivates deliberately."
JAP_send_japanese_settlers:0 "Send Japanese Settlers"
JAP_send_japanese_settlers_desc:0 "Hundreds of thousands of Japanese farming families are resettled across Manchukuo and Korea, planting colonies meant to anchor the Empire's claim on its new territories for generations."
JAP_found_the_riken_institute:0 "Found the Riken Institute"
JAP_found_the_riken_institute_desc:0 "The Riken Institute is granted lavish new funding, its physicists and chemists set loose on research ranging from synthetic fuel to the far edges of nuclear science."
JAP_form_a_cabinet_planning_council:0 "Form a Cabinet Planning Council"
JAP_form_a_cabinet_planning_council_desc:0 "The Cabinet Planning Board is formed to draft a single, coordinated economic mobilisation plan, wresting strategic direction away from the ministries' competing fiefdoms."
JAP_nationalise_nippon_electric:0 "Nationalise Nippon Electric"
JAP_nationalise_nippon_electric_desc:0 "Nippon Electric is brought under state direction, its factories and patents redirected wholesale toward radios, radar sets and the countless other devices a modern war demands."
