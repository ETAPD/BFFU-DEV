 naval_reform_spirit:0 "Naval Reform"
 naval_reform_spirit_desc:0 "War always changes."
 naval_refit_yards_spirit:0 "Naval Refit Yards"
 naval_refit_yards_spirit_desc:0 "Minimizing time in the dock, maximes the time a ship can be at sea."
 naval_modernism_spirit:0 "Modernism"
 naval_modernism_spirit_desc:0 "The future is upon us."
 fleet_in_being_navy_spirit:0 "Global Presence"
 fleet_in_being_navy_spirit_desc:1 "Our ships shall patrol the oceans around the globe."
 trade_interdiction_navy_spirit:1 "Submarine Primacy"
 trade_interdiction_navy_spirit_desc:1 "Without supplies, a country cannot fight a war."
 base_strike_navy_spirit:1 "Mobile Force"
 base_strike_navy_spirit_desc:1 "Being able to strike anywhere, anytime."
 landlocked_spirit:0 "Landlocked"
 landlocked_spirit_desc:0 "Without access to the sea it is hard to build a naval tradition."
 political_connections_navy_spirit:0 "Political Connections"
 political_connections_navy_spirit_desc:0 "My command has nothing to do with my father being the Minister of Finance!"
 overbearing_army_spirit:0 "Overbearing Army"
 overbearing_army_spirit_desc:0 "The Navy is but support for the Army."
 bureau_of_ordnance_spirit:0 "Bureau of Ordnance"
