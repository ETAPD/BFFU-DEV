l_english:
 CZE_national_army_program:0 "Czechoslovak Army Programme"
 CZE_national_army_program_desc:0 "The combined results of military specialization, General Staff reform, procurement and operational doctrine."
 CZE_national_industrial_program:0 "National Industrial Programme"
 CZE_national_industrial_program_desc:0 "The combined results of infrastructure, factory, procurement, and production policy."
 GER_fate_of_czechoslovakia_cze_paths_tt:0 "§YThe Fate of Czechoslovakia§! will open Germany's final choice between a §YBohemian§! administration and a §YSlovak§! settlement. The selected administration determines where later Czechoslovak industrial expansion is concentrated."
 CZE_HUN.1.t:0 "The Hungarian Demand for Southern Slovakia"
 CZE_HUN_demand_southern_slovakia_tt:0 "The current owner of §YSouthern Slovakia§! will be asked to surrender the region. A refusal leaves the dispute open until Germany decides the §YFate of Czechoslovakia§!, when Hungary may attempt a limited border war from §YSouthern Plain§! into §YCarpathian Ruthenia§!."
 wuw_HUN_demand_southern_slovakia:0 "Demand Southern Slovakia"
 CZE_HUN.1.d:0 "Budapest has formally demanded the immediate transfer of Southern Slovakia. Acceptance may avert a frontier crisis, but surrendering the territory would weaken the state and embolden further Hungarian claims."
 CZE_HUN.1.a:0 "Concede Southern Slovakia"
 CZE_HUN.1.b:0 "The frontier is not negotiable"
 CZE_HUN.2.t:0 "The Southern Slovak Reply"
 CZE_HUN.2.accepted:0 "Our demand has been accepted. Hungarian officials and troops are moving into Southern Slovakia."
 CZE_HUN.2.refused:0 "Our demand has been rejected. The dispute will remain unresolved until the fate of Czechoslovakia is settled."
 CZE_HUN.2.a:0 "We have their answer"
 CZE_HUN.3.t:0 "The Carpathian Frontier Question"
 CZE_HUN.3.d:0 "With Czechoslovakia's fate now being decided, Budapest has one last opportunity to enforce its claim to Southern Slovakia. Hungary may open a limited border war from state 154 against state 73, or leave the frontier undisturbed."
 CZE_HUN.3.a:0 "Force the frontier at Carpathia"
 CZE_HUN.3.b:0 "No border war"
 CZE_HUN.4.t:0 "Hungarian Victory on the Frontier"
 CZE_HUN.4.d:0 "Hungarian forces have broken the defenders and secured Carpathian Ruthenia. The administration of the region now passes to Budapest."
 CZE_HUN.4.a:0 "Restore Hungarian administration"
 CZE_HUN.4.b:0 "The frontier has been lost"
 CZE_HUN.5.t:0 "The Hungarian Advance Repulsed"
 CZE_HUN.5.d:0 "The Hungarian border formations have failed to break through. Carpathian Ruthenia remains in the hands of its present government."
 CZE_HUN.5.a:0 "End the confrontation"
 CZE_HUN.6.t:0 "The Border War Stalls"
 CZE_HUN.6.d:0 "Neither side has secured a decisive advantage. The frontier remains unchanged and the immediate confrontation subsides."
 CZE_HUN.6.a:0 "Stand down"
