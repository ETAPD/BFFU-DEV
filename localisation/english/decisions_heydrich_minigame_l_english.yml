l_english:
 ENG_heydrich_assassination_category:0 "Heydrich Assassination"
 ENG_heydrich_assassination_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n§YOPERATION ANTHROPOID§!\n£decision_icon_small Current Clock: §Y[?ENG_heydrich_countdown|0] days§!\nStatus: §YBegins when Germany and Britain are at war§!\n\n§YSupport Actions§!\nEvery action runs for §Y90 days§! and removes §G90 days§! from the clock. At zero, the Intelligence Agency unlocks a §Y90-day§! operation requiring §Y80% network strength§! and §Ythree operatives§!."
 ENG_heydrich_minigame_countdown_display:0 "Heydrich Assassination Countdown"
 ENG_heydrich_minigame_countdown_display_desc:0 "§YCurrent clock§!\n[?ENG_heydrich_countdown|0] days remain.\n\n§YStart condition§!\nGermany and Britain must be at war.\n\n§YFinal operation§!\nRequires 80% network strength and three operatives; execution takes 90 days."
 ENG_heydrich_minigame_countdown_display_tt:0 "Current countdown: §Y[?ENG_heydrich_countdown|0] days§!"
 ENG_boost_exiled_cze_legitimacy:0 "Boost Legitimacy of the Exiled CZE Government"
 ENG_boost_exiled_cze_legitimacy_desc:0 "§YCommitment§!\nDuration: 90 days\nPolitical Power: £pol_power  [?ENG_heydrich_pp_cost|0]\n\n§YResult§!\nRemoves §G90 days§! from the assassination clock. Protectorate reprisals add 50 Political Power per use to the base cost."
 ENG_boost_exiled_cze_tt:0 "Removes §G90 days§! from the assassination countdown."
 ENG_supply_cze_guns:0 "Supply CZE Resistance Fighters With Guns"
 ENG_supply_cze_guns_desc:0 "§YCommitment§!\nDuration: 90 days\nPolitical Power: £pol_power  [?ENG_heydrich_gun_pp_cost|0]\nInfantry Equipment: £infantry_equipment_text_icon  [?ENG_heydrich_gun_cost|0]\n\n§YResult§!\nThe equipment is removed on completion and the assassination clock is shortened by §G90 days§!. Protectorate countermeasures add fixed base-cost increments."
 ENG_heydrich_gun_cost_text:0 "£infantry_equipment_text_icon  §Y[?ENG_heydrich_gun_cost|0]§!"
 ENG_heydrich_gun_cost_text_blocked:0 "£infantry_equipment_text_icon  §R[?ENG_heydrich_gun_cost|0]§!"
 ENG_heydrich_gun_cost_text_tooltip:0 "Requires £infantry_equipment_text_icon  §Y[?ENG_heydrich_gun_cost|0]§! Infantry Equipment in stockpile. The decision also costs £pol_power  §Y[?ENG_heydrich_gun_pp_cost|0]§!."
 ENG_supply_cze_guns_tt:0 "Removes £infantry_equipment_text_icon  §R[?ENG_heydrich_gun_cost|0]§! Infantry Equipment.\nRemoves §G90 days§! from the assassination clock."
 ENG_supply_cze_funds:0 "Supply CZE Resistance Fighters With Funds"
 ENG_supply_cze_funds_desc:0 "§YCommitment§!\nDuration: 90 days\nCivilian Factories in use: £civ_factory  [?ENG_heydrich_civ_cost|0]\n\n§YResult§!\nFactories return on completion and the assassination clock is shortened by §G90 days§!. Protectorate reprisals add one factory per use."
 ENG_heydrich_civ_cost_text:0 "£civ_factory  §Y[?ENG_heydrich_civ_cost|0]§!"
 ENG_heydrich_civ_cost_text_blocked:0 "£civ_factory  §R[?ENG_heydrich_civ_cost|0]§!"
 ENG_heydrich_civ_cost_text_tooltip:0 "It requires £civ_factory  §Y[?ENG_heydrich_civ_cost|0]§! available Civilian Factories for 90 days."
 ENG_supply_cze_funds_tt:0 "Removes §G90 days§! from the assassination countdown."
 ENG_heydrich_funding_commitment:0 "Funding the CZE Resistance"
 ENG_heydrich_funding_commitment_desc:0 "Civilian industry is committed to financing Czechoslovak resistance networks."
 ENG_support_slovak_communists:0 "Connect CZE Resistance Fighters With Slovak Communists"
 ENG_support_slovak_communists_desc:0 "§YCommitment§!\nDuration: 90 days\n\n§YResult§!\nAdds §Y1%§! Communist popularity in CZE and removes §G90 days§! from the assassination clock."
 ENG_support_slovak_communists_tt:0 "Adds §Y1%§! Communist popularity to CZE.\nRemoves §G90 days§! from the assassination countdown."
 ENG_operation_assassinate_heydrich:0 "Operation Anthropoid"
 ENG_operation_assassinate_heydrich_desc:0 "Deploy three operatives through a network with at least 80% strength. The operation takes 90 days and kills Reinhard Heydrich when completed."
 ENG_operation_assassinate_heydrich_outcome_tt:0 "§RReinhard Heydrich will be assassinated.§! Kurt Daluege will become CZE country leader. §YJan Kubiš§! and §YJozef Gabčík§! will not return from the operation."
 ENG_heydrich_minigame_1_t:0 "Operation Anthropoid Successful"
 ENG_heydrich_minigame_1_d:0 "Our operatives have killed Reinhard Heydrich, Protector of Bohemia and Moravia. Kurt Daluege has assumed the Protectorate administration in Prague."
 ENG_heydrich_minigame_1_a:0 "A decisive blow"
 CZE_heydrich_defense_category:0 "Protect Heydrich"
 CZE_heydrich_defense_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n§YOPERATION ANTHROPOID DEFENCE§!\n£decision_icon_small British Clock: §Y[?ENG.ENG_heydrich_countdown|0] days§!\nStatus: §YBegins when Germany and Britain are at war§!\n\nCountermeasures remain visible before they unlock. Each requires its intelligence focus, §Yfascism§!, and §YReinhard Heydrich§!. [ENG.GetFlag] icons mark the §RBritish cost increases§! imposed by each reprisal."
 CZE_heydrich_countdown_display:0 "Operation Anthropoid Intelligence Estimate"
 CZE_heydrich_countdown_display_desc:0 "§YBritish clock§!\n[?ENG.ENG_heydrich_countdown|0] days remain.\n\n§YStart condition§!\nGermany and Britain must be at war.\n\n§YBritish end condition§!\n80% network strength, three operatives, and a 90-day operation."
 CZE_purge_suspected_partisans:0 "[ENG.GetFlag] £infantry_equipment_text_icon Purge Every Suspected Partisan"
 CZE_purge_suspected_partisans_desc:0 "§YCzechoslovak Commitment§!\n£stability_texticon Stability: §R-5%§!\n£decision_icon_small Duration: §Y90 days§!\n\n§YCost imposed on Britain§! [ENG.GetFlag]\n£infantry_equipment_text_icon Resistance gun shipments cost §R+2,000 Infantry Equipment§! per use. The increase is additive, not compounded.\n\nRequires §YPurge the Underground§!, fascism, and Heydrich as country leader."
 CZE_purge_partisans_tt:0 "Loses §R5%§! Stability.\nBritish gun shipments cost another £infantry_equipment_text_icon  §R2,000§!."
 CZE_burn_supportive_villages:0 "[ENG.GetFlag] £pol_power £infantry_equipment_text_icon £civ_factory Burn Down Partisan Villages"
 CZE_burn_supportive_villages_desc:0 "§YCzechoslovak Commitment§!\n£stability_texticon Stability: §R-5%§!\n£decision_icon_small Duration: §Y90 days§!\n\n§YCosts imposed on Britain§! [ENG.GetFlag]\n£pol_power Political actions: §R+50 PP§!\n£infantry_equipment_text_icon Gun shipments: §R+25 PP and +2,000 Infantry Equipment§!\n£civ_factory Resistance funding: §R+1 Civilian Factory§!\n\nEvery increase is additive and never compounded. Requires §YScorched Earth Policy§!, fascism, and Heydrich as country leader."
 CZE_burn_villages_tt:0 "Loses §R5%§! Stability.\nBritish political action costs another £pol_power  §R50§!.\nBritish gun shipments cost another £pol_power  §R25§! and £infantry_equipment_text_icon  §R2,000§!.\nBritish funding requires another £civ_factory  §R1§!."
