 sp_electronics_cipher_machines_unique_reward:0 "Secure Our Traffic or Read Theirs"
 sp_electronics_cipher_machines_unique_reward_desc:0 "The prototype machines can be built for field encryption or wired together into codebreaking aids. Our signals staff must choose where the next production run goes."
 sp_electronics_cipher_machines_preference_a:0 "Field Cipher Sets"
 sp_electronics_cipher_machines_preference_b:0 "Codebreaking Bombes"
 sp_electronics_mine_detectors_unique_reward:0 "Carried or Mounted"
 sp_electronics_mine_detectors_unique_reward_desc:0 "The detector heads work, but the engineers disagree on how to field them: light sets for every sapper section, or heavier arrays on armoured vehicles that lead the column."
