 # Oxygen Torpedo sp
 sp_naval_oxygen_torpedo:0 "Oxygen Torpedo"
 sp_naval_oxygen_torpedo_desc:0 "A large caliber, long range torpedo driven by a pure-oxygen wet-heater engine. It leaves almost no wake, but the oxygen fuel is dangerous to handle and even more so if the launcher is hit by enemy fire."
 sp_naval_oxygen_torpedo_tech:0 "Oxygen Torpedo"
 sp_naval_lancer_effects:0 "Improved torpedo propulsion and guidance for §Yall§! torpedo modules:\n- Torpedo Hit Chance: §G+3%§!\n- Torpedo Screen Penetration: §G+5%§!"
 torpedo_lancer:0 "Oxygen Torpedo Doctrine"
 torpedo_lancer_desc:0 "Lessons learned from oxygen torpedo trials improve the use of all torpedoes."

 ship_oxygen_torpedo:0 "Oxygen Torpedo Launcher"
 ship_oxygen_torpedo_short:0 "Oxygen Torpedo"
 ship_oxygen_torpedo_desc:0 "Wakeless long range oxygen torpedoes. Strong before late-war launchers arrive, but expensive and less reliable."
 ship_oxygen_torpedo_sub:0 "Oxygen Torpedo Tubes"
 ship_oxygen_torpedo_sub_short:0 "Oxygen Torpedo"
 ship_oxygen_torpedo_sub_desc:0 "Wakeless long range oxygen torpedoes. Strong before late-war launchers arrive, but expensive and less reliable."

 # BFFU passive special projects
 sp_electronics_cipher_machines:0 "Electromechanical Cipher Machines"
 sp_electronics_cipher_machines_desc:0 "Rotor cipher machines and the first electromechanical codebreaking aids let our signals staff encrypt traffic faster and attack enemy codes on a scale no team of clerks could manage."
 sp_electronics_mine_detectors:0 "Electronic Mine Detectors"
 sp_electronics_mine_detectors_desc:0 "A portable induction coil and a pair of headphones can find a buried mine faster than any bayonet. Sappers equipped with these sets can open lanes through minefields while the assault is still moving."
 sp_electronics_sound_ranging:0 "Sound-Ranging and Flash-Spotting Sets"
 sp_electronics_sound_ranging_desc:0 "Microphone arrays and survey posts time the sound and flash of enemy guns, letting our batteries locate and silence hostile artillery before it can break up our own attacks."
 sp_electronics_tank_intercom:0 "Tank Crew Intercom Systems"
 sp_electronics_tank_intercom_desc:0 "Throat microphones and an internal intercom let commander, driver and gunner work as one crew through the noise of the engine and the gun, keeping the vehicle in the fight for longer."
 sp_land_hollow_charge:0 "Hollow-Charge Infantry Weapons"
 sp_land_hollow_charge_desc:0 "Shaped-charge warheads focus the blast of a small charge into a jet that cuts through armour plate, giving infantry a light weapon that can stop a tank at close range."
 sp_land_blood_plasma:0 "Blood Plasma and Penicillin Trials"
 sp_land_blood_plasma_desc:0 "Dried plasma that keeps in the field and mass-produced penicillin save men who would once have died of shock or infection, returning more of the wounded to their units."
 sp_land_assault_rifle_trials:0 "Assault Rifle Trials"
 sp_land_assault_rifle_trials_desc:0 "An intermediate cartridge in a select-fire rifle gives every rifleman the firepower of a submachine gun at the ranges where infantry actually fight."
 sp_land_muzzle_brake:0 "Muzzle Brake and Recoil Trials"
 sp_land_muzzle_brake_desc:0 "Baffled muzzle brakes and improved recoil systems tame the kick of high-velocity guns, allowing heavier charges on lighter carriages without losing accuracy."
 sp_air_all_weather_flying:0 "All-Weather Flying Programme"
 sp_air_all_weather_flying_desc:0 "Blind-flying instruments, radio navigation aids and de-icing equipment let our crews take off, fight and return in weather that would ground an untrained air force."
 sp_air_self_sealing_tanks:0 "Self-Sealing Fuel Tanks"
 sp_air_self_sealing_tanks_desc:0 "Layers of rubber that swell shut when pierced keep a holed fuel tank from leaking or catching fire, bringing damaged aircraft and their crews home."
 sp_electronics_cipher_machines_tech:0 "Electromechanical Cipher Machines"
 sp_electronics_cipher_machines_pick_a:0 "Cipher Machines: Secure Traffic"
 sp_electronics_cipher_machines_pick_b:0 "Cipher Machines: Codebreaking Bombes"
