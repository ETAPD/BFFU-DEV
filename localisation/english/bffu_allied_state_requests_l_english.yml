l_english:
 BFFU_allied_state_requests_category:0 "Allied Territorial Requests"
 BFFU_allied_state_requests_category_desc:0 "The United States temporarily administers Chinese territory liberated during the war. Allied governments have §Y90 days§! to request the transfer of a Chinese state."
 BFFU_allied_state_requests_deadline:0 "Territorial Request Window"
 BFFU_allied_state_requests_deadline_desc:0 "All territorial requests must be submitted before the postwar settlement is finalized. Once this timer expires, the category will close permanently."
 BFFU_close_allied_state_requests_permanently:0 "Close Territorial Requests Permanently"
 BFFU_close_allied_state_requests_permanently_desc:0 "Immediately finalize the postwar settlement and refuse all future requests for Chinese territory under American administration."
 BFFU_request_state_from_usa:0 "Request [FROM.GetName] from the United States"
 BFFU_request_state_from_usa_desc:0 "Ask the United States to transfer [FROM.GetName] to us for no political power cost. Washington will receive an event and may accept or refuse our request."
 BFFU_no_allied_state_request_pending_tt:0 "Does not have another territorial request awaiting an American response"
 BFFU_allied_state_request_pending:0 "Territorial request awaiting an American response"
 BFFU_allied_state_requests_expired:0 "Territorial request period has expired"
 BFFU_allied_state_requests_closed:0 "The United States has permanently closed territorial requests"

 bffu_allied_state_requests.1.t:0 "[FROM.GetNameDefCap] Requests [?FROM.BFFU_requested_state.GetName]"
 bffu_allied_state_requests.1.d:0 "[FROM.GetNameDefCap] has formally asked us to transfer [?FROM.BFFU_requested_state.GetName] to their administration.\n\nState Buildings\n\n£civ_factory  §W[?FROM.BFFU_requested_civilian_factories|0]§! $industrial_complex$\n£mil_factory  §W[?FROM.BFFU_requested_military_factories|0]§! $arms_factory$\n£nav_dockyard_texticon  §W[?FROM.BFFU_requested_dockyards|0]§! $dockyard$\n\nState Resources\n\n£resources_strip|0  §W[?FROM.BFFU_requested_coal|0]§! $state_resource_coal$\n£resources_strip|1  §W[?FROM.BFFU_requested_oil|0]§! $state_resource_oil$\n£resources_strip|2  §W[?FROM.BFFU_requested_aluminium|0]§! $state_resource_aluminium$\n£resources_strip|3  §W[?FROM.BFFU_requested_rubber|0]§! $state_resource_rubber$\n£resources_strip|4  §W[?FROM.BFFU_requested_tungsten|0]§! $state_resource_tungsten$\n£resources_strip|5  §W[?FROM.BFFU_requested_steel|0]§! $state_resource_steel$\n£resources_strip|6  §W[?FROM.BFFU_requested_chromium|0]§! $state_resource_chromium$"
 bffu_allied_state_requests.1.a:0 "Transfer the state."
 bffu_allied_state_requests.1.b:0 "The United States will retain it."
 BFFU_allied_state_request_refuse_tt:0 "The request for §Y[?FROM.BFFU_requested_state.GetName]§! will be refused."
