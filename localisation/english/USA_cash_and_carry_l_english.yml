 ####################################################
 # USA — Cash and Carry Market
 ####################################################

 # Vanilla Lend-Lease block (hidden flag; shown only on the disabled action)
 USA_cnc_lend_lease_blocked_tt:0 "The United States sells through the §YCash and Carry§! war market instead of Lend-Lease"

 # Focus unlock tooltip
 USA_cnc_unlocked_tt:0 "Unlocks the §YCash and Carry§! war market: stock equipment from our own reserves for other nations to buy, growing the American war economy with every sale"

 # Decision categories
 USA_cash_and_carry_cat:0 "Cash and Carry Market"
 USA_cnc_market_cat:0 "American War Market"

 # Shared overview hint (the info rows are not clickable)
 USA_cnc_overview_hint_tt:0 "This is a market overview, not an action. Each §Ypackage§! is drawn from the American stockpile and sold as one lot."

 # ---- USA side: overview tracker (live counts in the title) ----
 USA_cnc_market_overview:0 "Market Stock  ·  Inf §Y[?global.cnc_stock_inf|0]§!  Sup §Y[?global.cnc_stock_sup|0]§!  Art §Y[?global.cnc_stock_art|0]§!  Mot §Y[?global.cnc_stock_mot|0]§!  Mec §Y[?global.cnc_stock_mec|0]§!"
 USA_cnc_market_overview_desc:0 "Packages currently on the American war market:\n\nInfantry: §Y[?global.cnc_stock_inf|0]§! (6,000 infantry equipment + 2,000 squad weapons)\nSupport: §Y[?global.cnc_stock_sup|0]§! (1,000 support equipment)\nArtillery: §Y[?global.cnc_stock_art|0]§! (750 artillery)\nMotorised: §Y[?global.cnc_stock_mot|0]§! (2,000 trucks)\nMechanised: §Y[?global.cnc_stock_mec|0]§! (500 mechanised)"

 # ---- USA side: stock the market by type ----
 USA_cnc_stock_infantry:0 "Stock Infantry Equipment"
 USA_cnc_stock_infantry_desc:0 "Move §Y6,000 infantry equipment§! and §Y2,000 squad weapons§! from our stockpile onto the market.\n\nOn the market now: §Y[?global.cnc_stock_inf|0]§!\n\n§RCosts us:§! 0.05 Stability, the equipment above, and §Y1 random on-map Military Factory§! torn down.\n§GEach sale grows our war economy by §Y0.2%§! industrial output, realised once our war economy is active."
 USA_cnc_stock_support:0 "Stock Support Equipment"
 USA_cnc_stock_support_desc:0 "Move §Y1,000 support equipment§! from our stockpile onto the market.\n\nOn the market now: §Y[?global.cnc_stock_sup|0]§!\n\n§RCosts us:§! 0.05 Stability, the equipment above, and §Y1 random on-map Military Factory§! torn down.\n§GEach sale grows our war economy by §Y0.2%§! industrial output, realised once our war economy is active."
 USA_cnc_stock_artillery:0 "Stock Artillery"
 USA_cnc_stock_artillery_desc:0 "Move §Y750 artillery§! from our stockpile onto the market.\n\nOn the market now: §Y[?global.cnc_stock_art|0]§!\n\n§RCosts us:§! 0.05 Stability, the equipment above, and §Y1 random on-map Military Factory§! torn down.\n§GEach sale grows our war economy by §Y0.2%§! industrial output, realised once our war economy is active."
 USA_cnc_stock_motorized:0 "Stock Trucks"
 USA_cnc_stock_motorized_desc:0 "Move §Y2,000 trucks§! from our stockpile onto the market.\n\nOn the market now: §Y[?global.cnc_stock_mot|0]§!\n\n§RCosts us:§! 0.05 Stability, the equipment above, and §Y1 random on-map Military Factory§! torn down.\n§GEach sale grows our war economy by §Y0.2%§! industrial output, realised once our war economy is active."
 USA_cnc_stock_mechanized:0 "Stock Mechanised Equipment"
 USA_cnc_stock_mechanized_desc:0 "Move §Y500 mechanised equipment§! from our stockpile onto the market.\n\nOn the market now: §Y[?global.cnc_stock_mec|0]§!\n\n§RCosts us:§! 0.05 Stability, the equipment above, and §Y1 random on-map Military Factory§! torn down.\n§GEach sale grows our war economy by §Y0.2%§! industrial output, realised once our war economy is active."

 # ---- Recipient side: overview tracker ----
 USA_cnc_buyer_overview:0 "US Market Stock  ·  Inf §Y[?global.cnc_stock_inf|0]§!  Sup §Y[?global.cnc_stock_sup|0]§!  Art §Y[?global.cnc_stock_art|0]§!  Mot §Y[?global.cnc_stock_mot|0]§!  Mec §Y[?global.cnc_stock_mec|0]§!"
 USA_cnc_buyer_overview_desc:0 "Packages available to buy from [USA.GetName]'s war market:\n\nInfantry: §Y[?global.cnc_stock_inf|0]§! (6,000 infantry equipment + 2,000 squad weapons)\nSupport: §Y[?global.cnc_stock_sup|0]§! (1,000 support equipment)\nArtillery: §Y[?global.cnc_stock_art|0]§! (750 artillery)\nMotorised: §Y[?global.cnc_stock_mot|0]§! (2,000 trucks)\nMechanised: §Y[?global.cnc_stock_mec|0]§! (500 mechanised)"

 # ---- Recipient side: buy by type ----
 USA_cnc_buy_infantry:0 "Buy Infantry Equipment"
 USA_cnc_buy_infantry_desc:0 "Buy an infantry package (§Y6,000 infantry equipment + 2,000 squad weapons§!) from [USA.GetName]'s market.\n\nAvailable: §Y[?global.cnc_stock_inf|0]§!\n\n§RCosts us:§! 60 Political Power, and §Y5 Civilian Factories in use for 90 days§!.\n§YDelivery:§! the package leaves the market at once; the equipment arrives when the 90 days end.\n§OCooldown:§! 30 further days before this type can be bought again. Other types stay available."
 USA_cnc_buy_support:0 "Buy Support Equipment"
 USA_cnc_buy_support_desc:0 "Buy a support package (§Y1,000 support equipment§!) from [USA.GetName]'s market.\n\nAvailable: §Y[?global.cnc_stock_sup|0]§!\n\n§RCosts us:§! 60 Political Power, and §Y5 Civilian Factories in use for 90 days§!.\n§YDelivery:§! the package leaves the market at once; the equipment arrives when the 90 days end.\n§OCooldown:§! 30 further days before this type can be bought again. Other types stay available."
 USA_cnc_buy_artillery:0 "Buy Artillery"
 USA_cnc_buy_artillery_desc:0 "Buy an artillery package (§Y750 artillery§!) from [USA.GetName]'s market.\n\nAvailable: §Y[?global.cnc_stock_art|0]§!\n\n§RCosts us:§! 60 Political Power, and §Y5 Civilian Factories in use for 90 days§!.\n§YDelivery:§! the package leaves the market at once; the equipment arrives when the 90 days end.\n§OCooldown:§! 30 further days before this type can be bought again. Other types stay available."
 USA_cnc_buy_motorized:0 "Buy Trucks"
 USA_cnc_buy_motorized_desc:0 "Buy a truck package (§Y2,000 trucks§!) from [USA.GetName]'s market.\n\nAvailable: §Y[?global.cnc_stock_mot|0]§!\n\n§RCosts us:§! 60 Political Power, and §Y5 Civilian Factories in use for 90 days§!.\n§YDelivery:§! the package leaves the market at once; the equipment arrives when the 90 days end.\n§OCooldown:§! 30 further days before this type can be bought again. Other types stay available."
 USA_cnc_buy_mechanized:0 "Buy Mechanised Equipment"
 USA_cnc_buy_mechanized_desc:0 "Buy a mechanised package (§Y500 mechanised equipment§!) from [USA.GetName]'s market.\n\nAvailable: §Y[?global.cnc_stock_mec|0]§!\n\n§RCosts us:§! 60 Political Power, and §Y5 Civilian Factories in use for 90 days§!.\n§YDelivery:§! the package leaves the market at once; the equipment arrives when the 90 days end.\n§OCooldown:§! 30 further days before this type can be bought again. Other types stay available."

