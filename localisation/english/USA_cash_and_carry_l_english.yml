 USA_cnc_eximbank_desc:0 "With Cash and Carry pushed through Congress, the Export-Import Bank of Washington can extend credit to the nations buying from us. Every political power a member puts into the shared pool is topped up by the bank."
 USA_cnc_eximbank_effect_tt:0 "Every investment into the shared §YCash and Carry§! pool is matched with an extra §G+25%§!."

