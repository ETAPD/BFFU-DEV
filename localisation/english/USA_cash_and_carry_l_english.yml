 USA_cnc_market_overview_desc:0 "Shared pool: £pol_power §Y[?global.cnc_pp_pool|0]§!\n§YMarket output§! (factory output): §Y[?USA.USA_cnc_output_var|%1]§!\nLots sold: §Y[?global.cnc_lots_sold|0]§!  (§Y[?USA.USA_cnc_lots_progress|0]§!/5 toward the next §G+2.5%§!)\n\nLots currently on the American war market:\n\nInfantry Equipment: §Y[?global.cnc_stock_inf|0]§! lots (one lot = 6,000 infantry equipment + 2,000 squad weapons)\nSupport Equipment: §Y[?global.cnc_stock_sup|0]§! lots (one lot = 1,000 support equipment)\nArtillery: §Y[?global.cnc_stock_art|0]§! lots (one lot = 750 artillery)\nTrucks: §Y[?global.cnc_stock_mot|0]§! lots (one lot = 2,000 trucks)\nMechanised Equipment: §Y[?global.cnc_stock_mec|0]§! lots (one lot = 500 mechanised equipment)\nAnti-Air Guns: §Y[?global.cnc_stock_aa|0]§! lots (one lot = 500 anti-air guns)\nAnti-Tank Guns: §Y[?global.cnc_stock_at|0]§! lots (one lot = 500 anti-tank guns)\nRocket Artillery: §Y[?global.cnc_stock_rkt|0]§! lots (one lot = 800 rocket artillery)\nHeavy Anti-Air Guns: §Y[?global.cnc_stock_haa|0]§! lots (one lot = 400 heavy anti-air guns)\nHeavy Anti-Tank Guns: §Y[?global.cnc_stock_hat|0]§! lots (one lot = 240 heavy anti-tank guns)\nHeavy Artillery: §Y[?global.cnc_stock_hart|0]§! lots (one lot = 240 heavy artillery)"

