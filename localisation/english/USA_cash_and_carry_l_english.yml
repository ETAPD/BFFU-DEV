 # ---- Members: buy by type ----
 USA_cnc_buy_infantry:0 "Buy Infantry Equipment"
 USA_cnc_buy_infantry_desc:0 "Buy §Y[GetCnCPackageSize]§! of infantry from [USA.GetName]'s market. One lot is §Y6,000 infantry equipment + 2,000 squad weapons§!.\n\nOn the market: §Y[?global.cnc_stock_inf|0]§! lots\nShared pool: £pol_power §Y[?global.cnc_pp_pool|0]§!\n\n§RCosts us:§! the package price from the shared pool, and §Y5 Civilian Factories in use for 90 days§!.\n§YDelivery:§! the lots leave the market at once; the equipment arrives when the 90 days end.\n§OCooldown:§! 30 further days before this type can be bought again. Other types stay available."
