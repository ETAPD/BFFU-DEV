 ####################################################
 # USA — Cash and Carry Market
 ####################################################

 # Vanilla Lend-Lease block (hidden flag; shown only on the disabled action)
 USA_cnc_lend_lease_blocked_tt:0 "The United States sells through the §YCash and Carry§! war market instead of Lend-Lease"

 # Focus unlock tooltips
 USA_cnc_unlocked_tt:0 "Unlocks the §YCash and Carry§! war market: stock equipment from our own reserves for other nations to buy, growing the American war economy with every sale"
 USA_cnc_unlocked_1937_tt:0 "The §YNeutrality Act of 1937§! lets belligerents buy American goods if they pay cash and carry them home in their own ships. Opens the §YCash and Carry§! war market for the United States and its customers."
 USA_cnc_eximbank_unlock_tt:0 "Unlocks the §YExport-Import Bank Credits§! upgrade in the §YCash and Carry Market§! tab."

 USA_cnc_output_open_tt:0 "§YThe United States§! gets §R-10%§! Factory Output from the market, and §G+2.5%§! back for every §Y5§! lots sold to market members, with no limit."
 USA_cnc_sale_output_tt:0 "Each lot sold counts toward §G+2.5%§! Factory Output for §Y[USA.GetName]§! (every §Y5§! lots)."
 USA_cnc_market_output:0 "Cash and Carry Market"

 # Decision categories
 USA_cash_and_carry_cat:0 "Cash and Carry Market"
 USA_cnc_market_cat:0 "American War Market"
 USA_cash_and_carry_cat_desc:0 "We stock lots of equipment from our own reserves. Market members pay political power into a shared pool and buy our lots from it.\n\nShared pool: £pol_power §Y[?global.cnc_pp_pool|0]§!\n§YMarket output§! (factory output): §Y[?USA.USA_cnc_output_var|%1]§!\nLots sold: §Y[?global.cnc_lots_sold|0]§!  (§Y[?USA.USA_cnc_lots_progress|0]§!/5 toward the next §G+2.5%§!)\n\nOn the market: Inf §Y[?global.cnc_stock_inf|0]§!  Sup §Y[?global.cnc_stock_sup|0]§!  Art §Y[?global.cnc_stock_art|0]§!  Mot §Y[?global.cnc_stock_mot|0]§!  Mec §Y[?global.cnc_stock_mec|0]§!  AA §Y[?global.cnc_stock_aa|0]§!  AT §Y[?global.cnc_stock_at|0]§!  Rkt §Y[?global.cnc_stock_rkt|0]§!  HAA §Y[?global.cnc_stock_haa|0]§!  HAT §Y[?global.cnc_stock_hat|0]§!  HArt §Y[?global.cnc_stock_hart|0]§!\n\n§YMember ledger§! (invested / spent from the pool)[GetCnCLedger_ENG][GetCnCLedger_FRA][GetCnCLedger_CAN][GetCnCLedger_AST][GetCnCLedger_NZL][GetCnCLedger_SAF][GetCnCLedger_RAJ][GetCnCLedger_HOL][GetCnCLedger_BEL][GetCnCLedger_POL][GetCnCLedger_BRA][GetCnCLedger_MEX][GetCnCLedgerEmpty]"
 USA_cnc_market_cat_desc:0 "Members of [USA.GetName]'s war market pay political power into one shared pool. Any member can spend the pool on equipment lots, so the pool grows faster when everyone contributes.\n\nShared pool: £pol_power §Y[?global.cnc_pp_pool|0]§!\nWe have invested: £pol_power §Y[?cnc_pp_invested|0]§!   Spent from the pool: £pol_power §Y[?cnc_pp_drawn|0]§!\nOur package size: §Y[GetCnCPackageSize]§!\n\nOn the market: Inf §Y[?global.cnc_stock_inf|0]§!  Sup §Y[?global.cnc_stock_sup|0]§!  Art §Y[?global.cnc_stock_art|0]§!  Mot §Y[?global.cnc_stock_mot|0]§!  Mec §Y[?global.cnc_stock_mec|0]§!  AA §Y[?global.cnc_stock_aa|0]§!  AT §Y[?global.cnc_stock_at|0]§!  Rkt §Y[?global.cnc_stock_rkt|0]§!  HAA §Y[?global.cnc_stock_haa|0]§!  HAT §Y[?global.cnc_stock_hat|0]§!  HArt §Y[?global.cnc_stock_hart|0]§!\n\n§YMember ledger§! (invested / spent from the pool)[GetCnCLedger_ENG][GetCnCLedger_FRA][GetCnCLedger_CAN][GetCnCLedger_AST][GetCnCLedger_NZL][GetCnCLedger_SAF][GetCnCLedger_RAJ][GetCnCLedger_HOL][GetCnCLedger_BEL][GetCnCLedger_POL][GetCnCLedger_BRA][GetCnCLedger_MEX][GetCnCLedgerEmpty]"

