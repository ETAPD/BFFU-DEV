 # ---- Landon-path unlock notification ----
 usa.9410.t:0 "The Cash and Carry Market Opens"
 usa.9410.d:0 "With Poland fallen, Congress can no longer look away from the war in Europe. The §YCash and Carry§! war market is now open: we may stock equipment from our own reserves and sell it to the nations that need it, so long as we stay out of the war ourselves."
 usa.9410.a:0 "Open the market"
