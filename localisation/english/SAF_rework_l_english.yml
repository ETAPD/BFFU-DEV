 SAF_no_aat_cope_tt:0 "§RRequires Arms Against Tyranny§! to fund §YCape COPE§!."
 SAF_no_aat_crossley_tt:0 "§RRequires Arms Against Tyranny§! to fund §YCrossley Motors§!."
 SAF_no_aat_marmon_herrington_tt:0 "§RRequires Arms Against Tyranny§! to fund §YMarmon-Herrington§!."

 ### dynamic modifier panels ##############################################
 SAF_south_african_economy:0 "The South African Economy"
 SAF_south_african_economy_desc:0 "The Union never truly left the slump. The gold standard was abandoned only in 1932, three years late, and the cost of that stubbornness is still being paid in idle mills, empty treasuries and men out of work.\n\nThis is the whole economy, and it does not go away. It is dug out of the Depression by the political branch, and it is thrown into §Yprosperity§! by the war orders that follow the September 1939 vote."
 SAF_the_afrikaner_question:0 "The Afrikaner Question"
 SAF_the_afrikaner_question_desc:0 "Two white nations share one state, and neither trusts the other with it. Beneath them both sits the overwhelming majority of South Africans, who are permitted to labour but not to serve, and not to vote.\n\nThe Union can field a fraction of the men it actually has. §RThis will not go away.§!"
 SAF_union_defence_force:0 "State of the Union Defence Force"
 SAF_union_defence_force_desc:0 "The UDF of 1936 is a skeleton: a permanent force of a few thousand, a scattering of coastal guns, and a citizen reserve that has not been called out in earnest since 1922."

 ### opinion modifiers ####################################################
 SAF_unilateral_claims:0 "Unilateral Claims in Africa"
 SAF_loyal_dominion:0 "Loyal Dominion"

 ### military industrial organisations ####################################
 SAF_iscor_organization:0 "ISCOR"
 SAF_cope_organization:0 "Cape COPE"
 SAF_marmon_herrington_organization:0 "Marmon-Herrington (SA)"

 ##########################################################################
 # INDUSTRY
 ##########################################################################
 SAF_the_industrial_development_act:0 "The Industrial Development Act"
 SAF_the_industrial_development_act_desc:0 "The Union imports almost everything it shoots, drives and wears. The Industrial Development Corporation is founded to change that with public money, because there is no private money willing to try."
 SAF_van_der_bijls_vision:0 "Van der Bijl's Vision"
 SAF_van_der_bijls_vision_desc:0 "Hendrik van der Bijl is an electrical engineer who believes a mining colony can be made into an industrial state by decision rather than by accident. Nobody else in Pretoria thinks in decades."
 SAF_expand_iscor:0 "Expand ISCOR"
 SAF_expand_iscor_desc:0 "The Iron and Steel Corporation has been rolling its own since 1934, over the objections of every importer in the country. Give it the furnaces to supply an army."
 SAF_the_rand_mines:0 "The Rand Mines"
 SAF_the_rand_mines_desc:0 "The Witwatersrand pays for everything the Union does. Deepen the workings, and the gold that buys our machine tools will keep coming."
 SAF_south_african_railways:0 "South African Railways"
 SAF_south_african_railways_desc:0 "The SAR is the largest employer in the country and effectively a second government. Its workshops can build far more than rolling stock, if asked."
 SAF_the_electricity_supply_commission:0 "The Electricity Supply Commission"
 SAF_the_electricity_supply_commission_desc:0 "ESCOM sells power at cost, on principle. Cheap current is the foundation everything else on the Rand is built on."
 SAF_pretoria_arms_and_ammunition:0 "Pretoria Arms and Ammunition"
 SAF_pretoria_arms_and_ammunition_desc:0 "The Union makes its own small-arms ammunition and very little else. Shells, fuses and gun barrels all still come by sea from Britain."
 SAF_the_csir_precursor:0 "The Special Signals Services"
 SAF_the_csir_precursor_desc:0 "Basil Schonland's lightning research turns out to be radar research by another name. A handful of physicists at Wits can put a working set in the field within the year."
 SAF_fund_the_university_of_south_africa:0 "Fund the University of South Africa"
 SAF_fund_the_university_of_south_africa_desc:0 "A country that must import its engineers will never build anything it did not buy."
 SAF_the_gold_standard_question:0 "The Gold Standard Question"
 SAF_the_gold_standard_question_desc:0 "Leaving gold in 1932 broke Hertzog's cabinet and made the Union rich. The bullion still flows out; the question is only what we take in return."
 SAF_wartime_supplies_board:0 "Wartime Supplies Board"
 SAF_wartime_supplies_board_desc:0 "Van der Bijl is made Director-General of War Supplies with authority over every factory in the Union. He uses all of it."
 SAF_dorman_long_and_the_bridge_shops:0 "Dorman Long and the Bridge Shops"
 SAF_dorman_long_and_the_bridge_shops_desc:0 "The men who built the Birchenough Bridge can build hulls. Structural steelwork and shipbuilding are closer trades than either would admit."
 SAF_socony_and_the_refineries:0 "Socony and the Refineries"
 SAF_socony_and_the_refineries_desc:0 "The Union has coal without end and not one barrel of oil. If we cannot pump it, we will cook it out of the ground we have."
 SAF_convert_the_railway_workshops:0 "Convert the Railway Workshops"
 SAF_convert_the_railway_workshops_desc:0 "Salt River and Pretoria stop building locomotives and start building armoured cars. The SAR becomes the Union's arsenal by the simple expedient of being told to."
 SAF_the_atomic_energy_board:0 "The Atomic Energy Board"
 SAF_the_atomic_energy_board_desc:0 "The Rand's gold reefs carry uranium in quantities nobody has bothered to measure. Somebody has now started measuring."
 SAF_a_railway_up_through_africa:0 "A Railway Up Through Africa"
 SAF_a_railway_up_through_africa_desc:0 "Rhodes wanted Cape to Cairo and got as far as his own funeral. The gauge is standard the whole way; only the will has ever been missing."

 ##########################################################################
 # POLITICAL
 ##########################################################################
 SAF_the_union_in_crisis:0 "The Union in Crisis"
 SAF_the_union_in_crisis_desc:0 "Twenty-six years after Union, South Africa is a country that has not decided what it is. Boer and Briton govern together in a Fusion cabinet neither believes in, over a majority neither will enfranchise, in an economy still on its knees.\n\nSomething has to give, and everyone in Pretoria knows which way they want it to fall."

 SAF_the_fusion_compact:0 "The Fusion Compact"
 SAF_the_fusion_compact_desc:0 "Hertzog's bargain: the Nationalists and the South African Party govern as one, South Africa stays out of other people's wars, and the Afrikaner gets what he was promised in 1910.\n\nIt is a compact for a country that intends to be left alone."

 SAF_the_smuts_line:0 "The Smuts Line"
 SAF_the_smuts_line_desc:0 "Smuts has spent his life being told he is more at home in London than in Pretoria, and has spent it proving them right and being useful anyway.\n\nThe next war is coming whether the Union votes for it or not. Better to be ready and hated than neutral and overrun."

 SAF_representation_of_natives_act:0 "Representation of Natives Act"
 SAF_representation_of_natives_act_desc:0 "The Cape's qualified African franchise is the last of its kind in the Union, and it has been an embarrassment to the north since 1910. The Act strikes it from the common roll and offers three white men to speak for a million.\n\nIt passes 169 to 11."

 SAF_native_laws_amendment_act:0 "Native Laws Amendment Act"
 SAF_native_laws_amendment_act_desc:0 "Tighten the pass laws, fix who may live in a city and for how long, and hand the municipalities the machinery to remove the rest.\n\nThe mines and the mills get exactly the labour force they asked for, on exactly the terms they wanted."

 SAF_the_hertzog_bills_carried:0 "The Hertzog Bills Carried"
 SAF_the_hertzog_bills_carried_desc:0 "Thirteen years in the drafting and carried at last by a joint sitting. Hertzog has delivered what he promised the platteland in 1912, and the platteland will now deliver him something in return.\n\nThe commandos will muster when he asks. That was always the price, and it has now been paid."

 SAF_work_for_all_poor:0 "Work for All Poor Whites"
 SAF_work_for_all_poor_desc:0 "The Carnegie Commission counted three hundred thousand of them: Afrikaners driven off the land by drought, rinderpest and the sheriff, living in the cities they cannot work in.\n\nThe railways and the mills will employ them, at rates fixed by colour rather than by skill."

 SAF_the_marketing_act:0 "The Marketing Act"
 SAF_the_marketing_act_desc:0 "Control boards for maize, for wheat, for meat, for everything the platteland grows. Prices are set in Pretoria now, and they are set in the farmer's favour."

 SAF_the_voortrekker_centenary:0 "The Voortrekker Centenary"
 SAF_the_voortrekker_centenary_desc:0 "Ox-wagons roll north from Cape Town to Pretoria, a hundred years after the first ones, and a quarter of a million people come out to meet them. Men grow beards. Women wear kappies. Streets are renamed as the wagons pass.\n\nNobody in the government quite expected what they have just woken up."

 SAF_status_of_the_union_act:0 "Status of the Union Act"
 SAF_status_of_the_union_act_desc:0 "The Union is sovereign, the King acts on the advice of his South African ministers alone, and Westminster legislates for us never again.\n\nHertzog has made the Union free to choose. He is about to discover what it chooses."

 SAF_hertzog_moves_the_motion:0 "Hertzog Moves the Motion"
 SAF_hertzog_moves_the_motion_desc:0 "Poland is invaded on a Friday. Parliament happens to be sitting. The Prime Minister will move that the Union remain neutral, and he believes he has the House.\n\nHe does not have the House."

 SAF_the_united_party_caucus:0 "The United Party Caucus"
 SAF_the_united_party_caucus_desc:0 "Fusion was a marriage of convenience and Smuts has been the inconvenient partner throughout. The caucus is where the war will be won or lost, long before any shot is fired."

 SAF_oppose_the_native_bills:0 "Oppose the Native Bills"
 SAF_oppose_the_native_bills_desc:0 "Smuts votes for the bills and then spends thirty years explaining why. Hofmeyr votes against them and never explains at all.\n\nThe eleven who stood up will not be forgiven by the platteland, and the Union will need every man it just insulted."

 SAF_rearm_the_union:0 "Rearm the Union"
 SAF_rearm_the_union_desc:0 "Pirow's five-year plan bought lorries, a few aircraft and a great deal of paper. The Union has an army on the establishment and almost nothing in the field."

 SAF_amend_the_industrial_conciliation_act:0 "Amend the Industrial Conciliation Act"
 SAF_amend_the_industrial_conciliation_act_desc:0 "The colour bar keeps the skilled trades white and the workshops empty. Loosen it and the Union can staff its factories; loosen it and the platteland will never vote for you again."

 SAF_the_defence_endowment_fund:0 "The Defence Endowment Fund"
 SAF_the_defence_endowment_fund_desc:0 "Money voted for defence and ring-fenced against the Treasury's habit of finding better uses for it."

 SAF_court_the_english_speaking_press:0 "Court the English-Speaking Press"
 SAF_court_the_english_speaking_press_desc:0 "Natal would secede tomorrow to stay British. The Argus papers do not need persuading, only pointing."

 SAF_watch_the_ossewabrandwag:0 "Watch the Ossewabrandwag"
 SAF_watch_the_ossewabrandwag_desc:0 "It began as a cultural society for men who missed the ox-wagons. It now has a uniformed wing, a general staff, and a great many members inside the police."

 SAF_smuts_moves_the_amendment:0 "Smuts Moves the Amendment"
 SAF_smuts_moves_the_amendment_desc:0 "The Deputy Prime Minister rises to move an amendment against his own Prime Minister: that the Union sever relations with the Reich.\n\nEighty to sixty-seven. Hertzog goes to the Governor-General to ask for a dissolution and is refused."

 SAF_press_our_claims_in_africa:0 "Press Our Claims in Africa"
 SAF_press_our_claims_in_africa_desc:0 "The High Commission Territories were promised to the Union in 1910 and withheld ever since. The protectorates sit inside our borders like holes in a net.\n\nLondon is busy. London has been busy for thirty years. We will not ask a thirty-first time."

 SAF_ask_britain_for_the_protectorates:0 "Ask Britain for the Protectorates"
 SAF_ask_britain_for_the_protectorates_desc:0 "Basutoland, Bechuanaland and Swaziland were always meant to come to us once the Union had proved it could be trusted with them.\n\nWe have just proved it. We are in the field alongside them, and we are asking politely, and this time there is a war on."

 ### shared middle - reachable from either tempo ##########################
 SAF_the_imperial_conference:0 "The Imperial Conference"
 SAF_the_imperial_conference_desc:0 "Hertzog and Smuts sail to London together and argue opposite cases in the same room. Hertzog leaves having established that a Dominion may stay neutral; Chamberlain leaves having established that none of them will say so out loud.\n\nBoth men come home convinced they won."
 SAF_the_1938_election:0 "The 1938 General Election"
 SAF_the_1938_election_desc:0 "The United Party takes 111 seats of 150. Fusion is vindicated, Malan is contained, and the two men at the top of the winning party have not agreed on anything important in four years.\n\nThe mandate is enormous and says nothing at all about war."
 SAF_the_1939_defence_estimates:0 "The 1939 Defence Estimates"
 SAF_the_1939_defence_estimates_desc:0 "Nobody in Cabinet will say the word 'war', but the Treasury keeps signing off on defence votes nobody argues down anymore. Whatever Parliament decides in September, the Union enters it a little less unready than it would have been."
 SAF_the_national_road_board:0 "The National Road Board"
 SAF_the_national_road_board_desc:0 "The Union has more distance than road. A national board is given the money and the powers to build trunk routes across the veld, and nobody in Parliament objects, because for once nobody can think of a reason to."

 ### Hertzog, second rank #################################################
 SAF_the_native_trust_and_land_act:0 "Native Trust and Land Act"
 SAF_the_native_trust_and_land_act_desc:0 "The companion to the franchise bill, and the one that actually moves people. The reserves are fixed at a seventh of the country for two-thirds of its population, a Trust is created to buy the land, and the Trust is given a budget it will never spend.\n\nThe platteland has what it was promised in 1913."
 SAF_the_two_streams_policy:0 "The Two Streams Policy"
 SAF_the_two_streams_policy_desc:0 "Boer and Briton are to flow side by side and never mix: two languages, two school systems, two histories, one state. Hertzog has spent thirty years insisting this is generosity rather than division.\n\nIt buys peace between the white nations. It buys nothing for anybody else."
 SAF_pirows_five_year_plan:0 "Pirow's Five-Year Plan"
 SAF_pirows_five_year_plan_desc:0 "The Minister of Defence promises a mechanised army for a million pounds a year. What arrives is a great many lorries, a handful of aircraft, and a Special Service Battalion that is really a jobs scheme.\n\nIt is mocked at the time. It is also the only reason the Union has any lorries at all in 1940."
 SAF_south_africa_first:0 "South Africa First"
 SAF_south_africa_first_desc:0 "The Union will not be dragged into a European quarrel by sentiment about a King most of its citizens have never seen. Sovereignty means the right to say no, and a right unused is no right at all."

 ### Smuts, second rank ###################################################
 SAF_the_native_representative_council:0 "The Native Representative Council"
 SAF_the_native_representative_council_desc:0 "The consolation prize written into the Act that took the franchise away: a council that may advise, and be ignored, and has no power whatsoever.\n\nSmuts's people intend to make it mean something. Its own members will call it a toy telephone."
 SAF_the_institute_of_race_relations:0 "The Institute of Race Relations"
 SAF_the_institute_of_race_relations_desc:0 "A research body that counts what the government would rather not count, funded by men who lose votes for funding it. Hofmeyr is its patron and it will cost him the succession."
 SAF_the_smuts_hofmeyr_axis:0 "The Smuts-Hofmeyr Axis"
 SAF_the_smuts_hofmeyr_axis_desc:0 "The old general and the young scholar: one who votes for the bills and regrets them, one who votes against and pays for it. Between them they hold the English-speaking half of the country and the conscience of the other half.\n\nIt is the most effective partnership in the cabinet and it cannot survive the peace. Smuts spends what remains of his imperial standing calling in favours from every dominion that owes the Union one."
 SAF_smuts_hofmeyr_axis_industry_tt:0 "§WCommonwealth Industrial Cooperation§!, wherever it is still owed:"
 SAF_raj_not_independent_tt:0 "§RThe British Raj is not fully independent§! - no factories are owed there."
 SAF_prepare_for_the_inevitable:0 "Prepare for the Inevitable"
 SAF_prepare_for_the_inevitable_desc:0 "Smuts has read the same despatches as everyone else and drawn the only conclusion available. The argument is no longer whether the war comes, but whether the Union is holding a rifle when it does."

 SAF_the_september_1939_vote:0 "The September 1939 Vote"
 SAF_the_september_1939_vote_desc:0 "Parliament divides on whether the Union goes to war. Eighty for Smuts, sixty-seven for Hertzog. The Prime Minister asks for a dissolution; the Governor-General refuses him and sends for his deputy instead.\n\nBy nightfall South Africa has a new Prime Minister and an old enemy. The factories that stood idle for ten years are about to find they have more orders than men.\n\n§YThe South African Economy is thrown into prosperity.§!"

 SAF_the_war_measures_act:0 "The War Measures Act"
 SAF_the_war_measures_act_desc:0 "Government by proclamation. The Union has no conscription and will not get any, so everything else must be taken instead."
 SAF_directorate_of_military_intelligence:0 "Directorate of Military Intelligence"
 SAF_directorate_of_military_intelligence_desc:0 "The Union has never needed to spy on itself before. It needs to now, and the men who will do it are drawn from a police force that is not entirely reliable either."
 SAF_counter_intelligence_watch:0 "Counter-Intelligence Watch"
 SAF_counter_intelligence_watch_desc:0 "A movement four hundred thousand strong cannot be watched by good intentions alone. A standing surveillance apparatus is stood up, quietly, inside the police the Ossewabrandwag has already half-infiltrated."
 SAF_the_red_oath_volunteers:0 "The Red Oath"
 SAF_the_red_oath_volunteers_desc:0 "No man can be sent beyond our borders. So the Union asks instead, and those who agree wear a red tab on the shoulder to show it.\n\nOne hundred and eighty thousand take the oath. They are volunteers in a way almost no other army of this war can claim."
 SAF_suppress_the_stormjaers:0 "Suppress the Stormjaers"
 SAF_suppress_the_stormjaers_desc:0 "The assault troops of the Ossewabrandwag swear an oath that ends 'if I retreat, shoot me'. They cut telegraph lines, bomb post offices, and are largely the same men the Union is trying to recruit."
 SAF_reconstitute_the_cape_corps:0 "Reconstitute the Cape Corps"
 SAF_reconstitute_the_cape_corps_desc:0 "The Cape Corps fought at Square Hill in 1918 and was disbanded the moment it was no longer needed. It is needed again."
 SAF_a_seat_at_the_imperial_war_cabinet:0 "A Seat at the Imperial War Cabinet"
 SAF_a_seat_at_the_imperial_war_cabinet_desc:0 "Smuts sat in the last one and drafted the constitution of the Royal Air Force while he was there. Churchill would make him a field marshal and, if it came to it, his successor.\n\nA dominion of two million whites is about to be listened to in London."
 SAF_intern_the_ossewabrandwag:0 "Intern the Ossewabrandwag"
 SAF_intern_the_ossewabrandwag_desc:0 "Van Rensburg and his lieutenants go to Koffiefontein without charge or trial, and a future Prime Minister goes with them.\n\nThe sabotage stops. The grievance does not, and it will be collecting interest for the next six years."
 SAF_the_native_military_corps:0 "The Native Military Corps"
 SAF_the_native_military_corps_desc:0 "Eighty thousand men enlist to drive, to carry, to dig and to bury, and are issued assegais and knobkerries because the Union will not arm them.\n\nThey serve anyway. At Sidi Rezegh and on the Mendi they died exactly as fast as men with rifles."
 SAF_break_glass_a_national_emergency:0 "A National Emergency"
 SAF_break_glass_a_national_emergency_desc:0 "The Union is bleeding and the arguments about who may carry a rifle have become unaffordable. Every restriction goes at once.\n\nHalf the country will never forgive this. The other half will not be alive to care."
 SAF_the_smuts_holism_memorandum:0 "Holism and Evolution"
 SAF_the_smuts_holism_memorandum_desc:0 "The Prime Minister writes philosophy between despatches, and will draft the preamble to the United Nations Charter in the same hand that signed the pass laws.\n\nHe never reconciled the two. Neither has anyone since."

 ##########################################################################
 # ARMY
 ##########################################################################
 SAF_the_union_defence_force_root:0 "The Union Defence Force"
 SAF_the_union_defence_force_root_desc:0 "A permanent force of a few thousand men, a citizen reserve on paper, and a coast defence establishment pointed at an enemy that never came. This is what the Union has."
 SAF_the_special_service_battalion:0 "The Special Service Battalion"
 SAF_the_special_service_battalion_desc:0 "Founded to take unemployed white youths off the street and give them a trade. It accidentally produces the only professionally trained soldiers in the country."

 SAF_the_first_sa_infantry_brigade:0 "1st South African Infantry Brigade"
 SAF_the_first_sa_infantry_brigade_desc:0 "Delville Wood cost the brigade seven hundred and eighty men out of three thousand, and they held it.\n\nThe Union builds its army around the rifleman, as it always has."
 SAF_lions_of_the_desert:0 "Lions of the Desert"
 SAF_lions_of_the_desert_desc:0 "The veld taught us to move. Ride to the fight, dismount, shoot, ride away. The desert is only a drier veld."
 SAF_armour_effort:0 "Armour Effort"
 SAF_armour_effort_desc:0 "The Union has never built a tank. It has steel, it has workshops, and it has an ocean between itself and anyone who would sell it one."

 SAF_the_cape_town_highlanders:0 "The Cape Town Highlanders"
 SAF_the_cape_town_highlanders_desc:0 "Raised in 1885 and still wearing the kilt. Regimental pride is not a modifier the staff college recognises, and it wins battles anyway."
 SAF_expand_the_south_african_artillery:0 "Expand the South African Artillery"
 SAF_expand_the_south_african_artillery_desc:0 "The Transvaal Staatsartillerie shot better than anything the Empire brought against it in 1900. The tradition survived the republic that made it."
 SAF_the_three_oh_three_and_the_bren:0 "The .303 and the Bren"
 SAF_the_three_oh_three_and_the_bren_desc:0 "Pretoria can fill a cartridge case. Making the gun that fires it is a different order of problem, and one we can no longer avoid."
 SAF_heavy_anti_tank_guns:0 "Heavy Anti-Tank Guns"
 SAF_heavy_anti_tank_guns_desc:0 "An infantry brigade that meets armour in the open desert without anti-tank guns does not come back. Sidi Rezegh taught us that in a single afternoon."

 SAF_the_cape_motor_divisions:0 "The Cape Motor Divisions"
 SAF_the_cape_motor_divisions_desc:0 "The Union has more lorries per soldier than any army in the Commonwealth, because it has almost no railways where it intends to fight."
 SAF_contract_marmon_herrington:0 "Contract Marmon-Herrington"
 SAF_contract_marmon_herrington_desc:0 "An American chassis, a Canadian engine, a British gun and a South African hull. Over five thousand are built, and they end up in the hands of everyone from the Eighth Army to the Wehrmacht."
 SAF_desert_worthy_designs:0 "Desert-Worthy Designs"
 SAF_desert_worthy_designs_desc:0 "Sand kills engines. Everything we send north must be built by men who have seen what the Karoo does to a radiator."
 SAF_desert_adaptable_armored_car_designs:0 "Enables §HAdaptable Desert Armour Designs§!\n§HArmoured Car:\n    Desert§!\n     Attack: §G+5%§!\n     Defence: §G+5%§!\n     Movement: §G+10%§!"
 SAF_the_desert_jackal_armoured_car:0 "The Desert Jackal"
 SAF_the_desert_jackal_armoured_car_desc:0 "Fast, thin-skinned and utterly reliable. It cannot fight a tank and was never asked to; it is there to find one and tell somebody."
 SAF_weaponising_the_jackal:0 "Weaponising the Jackal"
 SAF_weaponising_the_jackal_desc:0 "The crews keep bolting captured guns to the hull until somebody in Pretoria gives up and designs a proper mounting."
 SAF_the_mk_iii_recon_car:0 "The Mk III Reconnaissance Car"
 SAF_the_mk_iii_recon_car_desc:0 "Thicker armour, a two-pounder, and a turret that turns. The Jackal has grown teeth."

 SAF_king_of_the_desert:0 "King of the Desert"
 SAF_king_of_the_desert_desc:0 "A medium tank built from Rand steel in SAR workshops. It will not frighten a Tiger, and it will be there, which is more than can be said for anything shipped around the Cape."
 SAF_queen_of_the_desert:0 "Queen of the Desert"
 SAF_queen_of_the_desert_desc:0 "Heavier, slower, and able to take a hit. If the Union is going to build tanks at all, it may as well build ones that come home."
 SAF_south_african_anti_tank_guns:0 "South African Anti-Tank Guns"
 SAF_south_african_anti_tank_guns_desc:0 "Every lesson from the desert says the same thing: the gun matters more than the tank carrying it."
 SAF_the_mechanisation_effort:0 "The Mechanisation Effort"
 SAF_the_mechanisation_effort_desc:0 "6th South African Armoured Division goes to Italy fully mechanised, and is the only division in the theatre that never asks for lorries."

 SAF_the_south_african_military_college:0 "The South African Military College"
 SAF_the_south_african_military_college_desc:0 "Voortrekkerhoogte teaches an army that has fought as commandos, as an imperial brigade, and as a desert division, and has never once written down what it learned."
 SAF_the_coastal_garrison_scheme:0 "The Coastal Garrison Scheme"
 SAF_the_coastal_garrison_scheme_desc:0 "Every man on a gun at Saldanha is a man not in the desert. The Union raises formations that exist to free better ones."
 SAF_the_coastal_garrison_scheme_tt:0 "§YUnlocks the§! §HKusgarnisoen§! §Ydivision template.§!"

 ##########################################################################
 # AIR
 ##########################################################################
 SAF_the_south_african_air_force:0 "The South African Air Force"
 SAF_the_south_african_air_force_desc:0 "The second independent air force in the world, founded in 1920 with aircraft Britain gave away because shipping them home cost more than they were worth."
 SAF_improve_the_hawker_hartbees:0 "Improve the Hawker Hartbees"
 SAF_improve_the_hawker_hartbees_desc:0 "Sixty-five built at Roberts Heights, the first military aircraft the Union ever made. An obsolete biplane, and it is ours."
 SAF_the_joint_air_training_scheme:0 "The Joint Air Training Scheme"
 SAF_the_joint_air_training_scheme_desc:0 "Clear skies, flat ground and no enemy within four thousand miles. The Union trains thirty-three thousand aircrew for the Commonwealth and turns the veld into the Empire's classroom."
 SAF_retain_experienced_pilots:0 "Retain Experienced Pilots"
 SAF_retain_experienced_pilots_desc:0 "Sailor Malan wrote ten rules for air fighting on a single sheet of paper, and the RAF pinned them up in every dispersal hut it had.\n\nWe trained him. We should like him back."
 SAF_the_desert_air_force:0 "The Desert Air Force"
 SAF_the_desert_air_force_desc:0 "SAAF squadrons fly alongside the RAF from landing grounds that are a strip of graded sand and a fuel dump."
 SAF_perfect_the_cab_rank_technique:0 "Perfect the Cab Rank Technique"
 SAF_perfect_the_cab_rank_technique_desc:0 "Fighters orbit above the battle waiting their turn like taxis on a rank, and come down when the man on the ground calls them.\n\nIt is the closest thing to artillery on demand that any air force manages this war."
 SAF_the_coastal_command_flights:0 "Coastal Command Flights"
 SAF_the_coastal_command_flights_desc:0 "Ansons and Venturas over the Cape rollers, looking for the U-boats that hunt the convoys we cannot escort."
 SAF_bomb_the_western_desert:0 "Bomb the Western Desert"
 SAF_bomb_the_western_desert_desc:0 "Marauders and Bostons against ports and columns, flown by men who were farming outside Bloemfontein three years ago."

 ##########################################################################
 # NAVY
 ##########################################################################
 SAF_the_seaward_defence_force:0 "The Seaward Defence Force"
 SAF_the_seaward_defence_force_desc:0 "The Union's navy is founded on the day war breaks out, with no ships, no yards, and three thousand miles of coast to defend."
 SAF_the_cape_sea_route:0 "The Cape Sea Route"
 SAF_the_cape_sea_route_desc:0 "Close the Mediterranean and every ship between Britain and India must round the Cape. The Union is suddenly the most important place in the Empire, and it has nothing to defend it with."
 SAF_expand_the_simons_town_base:0 "Expand the Simon's Town Base"
 SAF_expand_the_simons_town_base_desc:0 "Ours by the 1921 agreement, and Britain's to use whenever she asks. Which she does."
 SAF_the_cape_garrison_artillery:0 "The Cape Garrison Artillery"
 SAF_the_cape_garrison_artillery_desc:0 "Nine-point-two inch guns on the Cape Peninsula, pointed at an ocean that has never yet produced a target."
 SAF_convert_the_whalers:0 "Convert the Whalers"
 SAF_convert_the_whalers_desc:0 "Deep-sea whalers out of Durban are the right size, the right hull and already carry a gun on the bow. Paint them grey and call them minesweepers.\n\nThe Union goes to sea in ships built to kill whales, and they work."
 SAF_anti_submarine_tactics:0 "Anti-Submarine Tactics"
 SAF_anti_submarine_tactics_desc:0 "The U-boats came south in 1942 and sank a quarter of a million tons off our coast in four months. We learned quickly because the alternative was not learning at all."
 SAF_protect_the_trade:0 "Protect the Trade"
 SAF_protect_the_trade_desc:0 "Everything the Empire needs from the East passes our lighthouses. Nothing that passes them is ours."
 SAF_the_south_atlantic_command:0 "The South Atlantic Command"
 SAF_the_south_atlantic_command_desc:0 "From Simon's Town the Union directs the defence of an ocean, which is a considerable achievement for a navy that started the war with borrowed trawlers."

 ##########################################################################
 # IDEAS
 ##########################################################################
 SAF_ossewabrandwag:0 "Ossewabrandwag"
 SAF_ossewabrandwag_desc:0 "The Ox-Wagon Sentinels began as a cultural society and became something else. Four hundred thousand members, a uniformed assault wing, and a standing conviction that this is the wrong war against the wrong enemy."
 SAF_the_idc:0 "Industrial Development Corporation"
 SAF_the_idc_desc:0 "State capital where private capital will not go. The mining houses call it socialism; the mining houses also decline to build a single mill."
 SAF_the_idc_2:0 "Industrial Development Corporation"
 SAF_the_idc_2_desc:0 "With ESCOM's current behind it, the Corporation stops arguing and starts pouring concrete."
 SAF_the_idc_3:0 "Industrial Development Corporation"
 SAF_the_idc_3_desc:0 "War powers, war money and a Director-General who answers to nobody. The Union builds more in six years than in the previous thirty."
 SAF_the_rearmament_program:0 "The Rearmament Program"
 SAF_the_rearmament_program_desc:0 "Every workshop in the Union is told to drop what it is doing and re-equip the UDF. It cannot last - there are not enough hands or machine tools to sustain it - but for a season the mills run flat out."
 SAF_south_african_railways_idea:0 "South African Railways and Harbours"
 SAF_south_african_railways_idea_desc:0 "A hundred and thirteen thousand employees, its own police force, its own hospitals, and more political weight than most cabinet ministers."
 SAF_gold_exports:0 "The Marriage of Maize and Gold"
 SAF_gold_exports_desc:0 "Bullion out, machine tools in. The Union is rich in a currency it cannot eat and cannot shoot."
 SAF_socony:0 "Socony-Vacuum South Africa"
 SAF_socony_desc:0 "Coal into oil, at a price that only makes sense to a country with no coastline it can trust."
 # NB: the focus and the idea it grants share the token
 # SAF_directorate_of_military_intelligence, so one entry serves both.
 # It is defined once above, in the POLITICAL section.

 ### industrial concerns ##################################################
 SAF_south_african_railways_concern:0 "South African Railways and Harbours"
 SAF_south_african_railways_concern_desc:0 "The SAR builds what it is told to build, and it has the largest workshops on the continent to build it in."
 SAF_escom:0 "ESCOM"
 SAF_escom_desc:0 "The Electricity Supply Commission sells power at cost by statute. Everything on the Rand runs on it, and it is the only reason anything on the Rand is affordable."
 SAF_rand_mines_concern:0 "Rand Mines"
 SAF_rand_mines_concern_desc:0 "Gold, coal, and a uranium seam nobody has bothered to measure. The deepest workings on earth, dug by men who are paid by the shift and housed behind a fence."
 SAF_dorman_long:0 "Dorman Long (Africa)"
 SAF_dorman_long_desc:0 "Structural steel and bridges, and hulls when asked. They built the Birchenough and the Victoria Falls; a frigate is a bridge that floats."

 ##########################################################################
 # TRAITS
 ##########################################################################
 SAF_boer_war_hero:0 "Boer War Hero"
 SAF_boer_war_hero_desc:0 "He took a commando into the Cape in 1901 and a seat in the Imperial War Cabinet in 1917. Both halves of the Union have reason to distrust him, and both halves will follow him."
 SAF_orthodox_treasurer:0 "Orthodox Treasurer"
 SAF_orthodox_treasurer_desc:0 "Havenga balanced the books through the slump by the simple method of refusing to spend. It worked, and it cost the country a decade."
 SAF_dominion_loyalist:0 "Dominion Loyalist"
 SAF_dominion_loyalist_desc:0 "Stallard's Dominion Party exists to make sure Natal never forgets which flag it is under. It is very good at this and at nothing else."
 SAF_state_industrialist:0 "Director-General of War Supplies"
 SAF_state_industrialist_desc:0 "Van der Bijl is given every factory in the Union and the authority to point them wherever he likes. He points them at the war and sends the bill to the civilian economy."
 SAF_purified_nationalist:0 "Purified Nationalist"
 SAF_purified_nationalist_desc:0 "Malan broke with Hertzog for being too soft and will spend this war waiting. In 1948 the waiting pays off."
 SAF_new_order_civilian:0 "New Order"
 SAF_new_order_civilian_desc:0 "Pirow ran the Defence Ministry for six years and came back from Berlin an admirer. He builds fast and builds everywhere, at the direct expense of the arsenal he claims to be arming."
 SAF_mining_magnate:0 "Mining Magnate"
 SAF_mining_magnate_desc:0 "Oppenheimer's Anglo American backs Smuts and the war effort for the same reason it backs everything: it is good for business. The wealth concentrates in Johannesburg boardrooms, not on the platteland."
 SAF_labour_organiser:0 "Labour Organiser"
 SAF_labour_organiser_desc:0 "Kotane organises the men the colour bar throws away, and the Union needs them far more than it will admit."
 SAF_radar_pioneer:0 "Radar Pioneer"
 SAF_radar_pioneer_desc:0 "Schonland was studying lightning when the war started and had a working radar set in the field within months. He has no patience whatsoever for Pretoria."
 SAF_minister_of_education:0 "Minister of Finance and Education"
 SAF_minister_of_education_desc:0 "Hofmeyr took a first at Oxford at nineteen and was a university principal at twenty-four. He will build the Union the schools and laboratories it has never had, and send the Treasury the bill."
 SAF_minister_of_commerce:0 "Minister of Commerce and Industries"
 SAF_minister_of_commerce_desc:0 "Stuttaford ran the largest department store in the country before he ran its war economy. He gets more out of a mill than anyone thought was in it, and wears the mill out doing so."
 SAF_minister_of_native_affairs:0 "Minister of Native Affairs"
 SAF_minister_of_native_affairs_desc:0 "Reitz rode with the commandos at seventeen and refused to sign the peace at twenty. Thirty years on he finds the Union the men it will not admit it needs, and the platteland marks him for it."

