l_english:

 CZE_IOG_propaganda_campaigns:0 "Propaganda Campaigns"

 CZE_IOG_motorisaci:0 "Motorisation for a Secure Future of the State"
 CZE_IOG_motorisaci_desc:0 "Rally the nation behind the memory of the pre-war motorist and defence corps. Every citizen who can turn a wrench or hold a rifle is called to arms against the German threat. This campaign will spur mass mobilisation, filling out our depots with fresh recruits.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_vsechny_do_prace:0 "All Women to Work Alongside Men!"
 CZE_IOG_vsechny_do_prace_desc:0 "Encourage Bohemian and Moravian women into the factories to replace men called away to war industry and service. Labour offices push recruitment postcards and posters across every town, keeping our production lines fully staffed and running at capacity.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_hilf_der_herrenrasse:0 "Hilf der Herrenrasse"
 CZE_IOG_hilf_der_herrenrasse_desc:0 "\"We build a better tomorrow through work in the Reich.\" Protectorate labour is redirected to German war production.\n\n£factory_output_texticon §YGermany§! gains Factory Output: §G+2%§!\n£factory_output_texticon Our Factory Output: §R-5%§!\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_zachvati_li_te_zahynes:0 "If It Grips You, You Will Perish!"
 CZE_IOG_zachvati_li_te_zahynes_desc:0 "A stark warning campaign depicting the crimson hand of Bolshevism reaching for Prague Castle. By stoking fear of Soviet conquest, our soldiers steel themselves against the threat from the East, improving our defensive posture against the USSR.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_na_straz:0 "On Guard!"
 CZE_IOG_na_straz_desc:0 "Invoke the rallying cry of the Slovak Republic - \"Na straz!\" - across every town square and parish hall. Youth organisations and local leaders encourage Slovak volunteers to answer the call to arms, steadily swelling the ranks of our army.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_statocnou_pracou:0 "Through Honest Work and Struggle"
 CZE_IOG_statocnou_pracou_desc:0 "\"Through honest work and struggle, to a greater slice of bread.\" Celebrate the Slovak smith, soldier, and mother as the pillars of the nation. This campaign motivates construction crews and labourers, accelerating every building project underway.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_od_tatier_po_azovske_more:0 "From the Tatras to the Sea of Azov"
 CZE_IOG_od_tatier_po_azovske_more_desc:0 "Newsreels and poster campaigns retell the Slovak army's long march from the High Tatras to the shores of the Azov Sea. While our soldiers are not committed to active fighting, this martial pride is redirected into the workshops, speeding up construction of new arms factories.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"

 CZE_IOG_za_boha_naroda_vlast:0 "For God, Nation and Homeland"
 CZE_IOG_za_boha_naroda_vlast_desc:0 "\"For God, Nation and Homeland.\" A grand commemorative campaign honouring the founding leadership of the Slovak Republic. Slovakia is to be defended at all cost - our soldiers fight fiercer and hold the line harder, both attacking and defending our core territory.\n\n§YDuration:§! 210 days\n§YCooldown:§! 360 days"
