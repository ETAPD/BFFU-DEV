l_english:

 CZE_IOG_propaganda_campaigns:0 "Propaganda Campaigns"

 CZE_IOG_motorisaci:0 "Motorisation for a Secure Future of the State"
 CZE_IOG_motorisaci_desc:0 "Rally the nation behind the memory of the pre-war motorist and defence corps. Every citizen who can turn a wrench or hold a rifle is called to arms against the German threat."


 CZE_IOG_aryan_feminism:0 "Aryan Feminism"
 CZE_IOG_aryan_feminism_desc:0 "Women are mobilized throughout the Protectorate's factories under racial and political slogans imposed by the occupation administration."

 CZE_IOG_gestapo_visits:0 "Gestapo fear"
 CZE_IOG_gestapo_visits_desc:0 "Gestapo patrols, raids and interrogations temporarily disrupt Czech resistance networks. While active, civilian-factory sabotage occurs every §Y40 days§! instead of every §Y20 days§!."

 CZE_IOG_zachvati_li_te_zahynes:0 "If It Grips You, You Will Perish!"
 CZE_IOG_zachvati_li_te_zahynes_desc:0 "A stark warning campaign depicting the crimson hand of Bolshevism reaching for Prague Castle. By stoking fear of Soviet conquest, our soldiers steel themselves against the threat from the East."

 CZE_IOG_na_straz:0 "On Guard!"
 CZE_IOG_na_straz_desc:0 "Invoke the rallying cry of the Slovak Republic—\"Na stráž!\"—across every town square and parish hall. Youth organisations and local leaders encourage Slovak volunteers to answer the call to arms."

 CZE_IOG_statocnou_pracou:0 "Through Honest Work and Struggle"
 CZE_IOG_statocnou_pracou_desc:0 "\"Through honest work and struggle, to a greater slice of bread.\" Celebrate the Slovak smith, soldier, and mother as the pillars of the nation."

 CZE_IOG_od_tatier_po_azovske_more:0 "From the Tatras to the Sea of Azov"
 CZE_IOG_od_tatier_po_azovske_more_desc:0 "Newsreels and posters retell the Slovak army's long march from the High Tatras to the shores of the Azov Sea, redirecting martial pride into the workshops."

 CZE_IOG_za_boha_naroda_vlast:0 "For God, Nation and Homeland"
 CZE_IOG_za_boha_naroda_vlast_desc:0 "\"For God, Nation and Homeland.\" A grand commemorative campaign honours the founding leadership of the Slovak Republic and calls upon the nation to defend its soil at any cost."
