l_english:
 MAN_bop_chinese_officials:0 "§LAppoint Chinese Officials§!"
 MAN_bop_chinese_officials_desc:0 "Give county magistracies and a few vice-ministerial posts to Chinese officials of proven loyalty. The Japanese staff resent losing the seats."
 MAN_bop_mongol_autonomy:0 "§LXing'an Mongol Autonomy§!"
 MAN_bop_mongol_autonomy_desc:0 "Confirm the princes and lamas of the Xing'an provinces in their own administration, with Mongol schools and a Mongol cavalry force."
 MAN_tt_bop_mongol:0 "£pol_violence §OBanditry§! in §CHulunbuir§!, §CXilingol§! and §CPailingmiao§!: §G-5§!"
 MAN_bop_korean_council:0 "§LKorean Seats in the Concordia§!"
 MAN_bop_korean_council_desc:0 "Give the Korean farmers of Jiandao and the river flats their own councils. Many of Yang Jingyu's partisans are Korean, and some of their families take the offer."
 MAN_tt_bop_korean:0 "£nato_unit_irregular_infantry_icon_small §OFirst Route Army§! strength: §G-5§!"
 MAN_bop_russian_bureau:0 "§LThe White Russian Bureau§!"
 MAN_bop_russian_bureau_desc:0 "The Bureau of Russian Emigrants in Harbin speaks for the city's White Russians, and supplies scouts and interpreters to the Kwantung Army's intelligence service."
 MAN_tt_bop_russian:0 "£nato_unit_irregular_infantry_icon_small §OThird Route Army§! strength: §G-3§!"
 MAN_bop_fugu:0 "§LThe Far Eastern Jewish Conference§!"
 MAN_bop_fugu_desc:0 "In December 1937 the Jewish communities of the Far East meet in Harbin with Japanese blessing. Ayukawa and the army's Jewish experts dream of American Jewish capital for Manchuria; a little of it actually comes."
 MAN_bop_vice_ministers:0 "§LThe Vice-Ministers' Conference§!"
 MAN_bop_vice_ministers_desc:0 "Every Tuesday the Japanese vice-ministers meet at the General Affairs Board and decide what the Chinese ministers will sign on Wednesday."
 MAN_bop_manchu_court:0 "§LHonour the Manchu Bannermen§!"
 MAN_bop_manchu_court_desc:0 "Restore stipends and court ranks to the Manchu banner families around the throne. Their loyalty is to Puyi, and Puyi's to the Kwantung Army."
 MAN_bop_kempeitai:0 "§LKempeitai Thought Control§!"
 MAN_bop_kempeitai_desc:0 "Arrest the Concordia's Chinese activists as 'thought criminals'. The countryside is quieter for a while, and the Concordia's ideal of harmony a little emptier."
 MAN_tt_bop_kempeitai:0 "£pol_violence §OBanditry§! in every Manchurian province: §G-3§!"
 MAN_racial_harmony:0 "Racial Harmony"
 MAN_racial_harmony_chinese_bop:0 "Concord of Five Races"
 MAN_racial_harmony_japanese_bop:0 "Japanese Guidance"
 MAN_racial_harmony_balance:0 "The Kingly Way in Balance"
 MAN_racial_harmony_chinese_bop_moderate:0 "Concord of Nations"
 MAN_racial_harmony_chinese_bop_high:0 "The Five Races in Harmony"
 MAN_racial_harmony_chinese_bop_total:0 "A Manchurian Nation"
 MAN_racial_harmony_japanese_bop_moderate:0 "Internal Guidance"
 MAN_racial_harmony_japanese_bop_high:0 "Japanese Officials Rule"
 MAN_racial_harmony_japanese_bop_total:0 "A Japanese Colony in All But Name"
 MAN_racial_harmony_category_bop:0 "$MAN_racial_harmony$"
 MAN_racial_harmony_desc:0 "Is Manchukuo a union of five races, or a Japanese colony with a Manchu emperor?\n£white_dot §LJapanese Guidance§!: §G+§! £army_experience §LKwantung Army patience§! and £prod_eff §Yplanning efficiency§!, §R+§! £pol_violence §Obanditry§! growth\n£white_dot §LConcord of Five Races§!: §G-§! £pol_violence §Obanditry§! growth and voluntary £manpower_texticon §Ylabour§!, §R-§! £army_experience §LKwantung Army patience§!\n£white_dot The further from the centre, the stronger both effects"
