l_english:
 RULE_PEACETIME_TRAINING:0 "Peacetime Training"
 RULE_OPTION_PEACETIME_TRAINING_ENABLED_DESC:0 "Every nation at peace receives the Peacetime Training spirit (much faster training, bonus army and air experience, no naval accidents, faster mobilisation). Enabled by default."
 RULE_OPTION_PEACETIME_TRAINING_DISABLED_DESC:0 "The Peacetime Training spirit is disabled. No nation receives it and training runs at normal speed."
