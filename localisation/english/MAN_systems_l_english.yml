 man_sys.2.t:0 "Annual Review: Quotas Met"
 man_sys.2.d:0 "The Planning Board's auditors sign off the year's deliveries. Furnaces, pits and shops have met their targets, and the Kwantung Army's economic staff sends its compliments to Hsinking."
 man_sys.2.a:0 "The Plan marches on."
 man_sys.3.t:0 "Annual Review: Shortfall"
 man_sys.3.d:0 "The auditors' figures do not add up. Steel, coal and machinery have fallen short of the year's targets and the Kwantung Army wants to know why. Someone will have to answer for it."
 man_sys.3.a:0 "Purge the planning section."
 man_sys.3.b:0 "Blame bandit sabotage."
 man_sys.3.c:0 "Ask our friends in Tokyo to intercede."
 man_sys.4.t:0 "The First Plan Concludes"
 man_sys.4.d:0 "Five years of furnaces, pits and dams are tallied. Whether or not every target was met, the First Plan for Industrial Development has turned Manchuria into the Empire's arsenal on the continent, at a cost in lives the reports never print."
 man_sys.4.a:0 "Draft the Second Plan."
 man_sys.5.t:0 "The Second Plan Concludes"
 man_sys.5.d:0 "The Second Plan ends in the middle of the Empire's great war. Manchuria's mills and arsenals feed fronts from the Amur to the South Seas."
 man_sys.5.a:0 "The Behemoth of the East stands."
 man_sys.10.t:0 "Itagaki Leaves the Kwantung Army"
 man_sys.10.d:0 "Itagaki Seishiro, architect of the Mukden Incident and the Kwantung Army's long-serving chief of staff, hands over to the former head of the Kwantung Kempeitai, Tojo Hideki. Itagaki is bound for a division command and, it is said, the War Ministry."
 man_sys.10.a:0 "A new man in the post."
 man_sys.11.t:0 "Tojo Recalled to Tokyo"
 man_sys.11.d:0 "Tojo Hideki, 'the Razor', leaves Hsinking to become Vice-Minister of War. His successor as chief of staff is Isogai Rensuke. Tojo's friends in Manchuria expect great things of him."
 man_sys.11.a:0 "A new man in the post."
 man_sys.12.t:0 "Matsuoka Leaves Mantetsu"
 man_sys.12.d:0 "Matsuoka Yosuke resigns the presidency of the South Manchuria Railway Company. Omura Takuichi takes over a railway already stripped of its heavy industry. Matsuoka's ambitions now lie with the Foreign Ministry."
 man_sys.12.a:0 "A new man in the post."
 man_sys.13.t:0 "Kishi Returns to Tokyo"
 man_sys.13.d:0 "Kishi Nobusuke, the reform bureaucrat who drove the Plan, goes home to the Ministry of Commerce and Industry, leaving the ministry to his protege Shiina Etsusaburo. 'Manchuria is my work of art,' he tells his staff."
 man_sys.13.a:0 "A new man in the post."
 man_sys.14.t:0 "Hoshino Joins the Planning Board"
 man_sys.14.d:0 "Hoshino Naoki leaves the General Affairs Board to head the Cabinet Planning Board in Tokyo. Takebe Rokuzo becomes Director of General Affairs."
 man_sys.14.a:0 "A new man in the post."
 man_sys.15.t:0 "Ayukawa Resigns from Mangyo"
 man_sys.15.d:0 "Frustrated by army interference and the failure to win American capital, Ayukawa Yoshisuke steps down as president of Mangyo. Takasaki Tatsunosuke succeeds him."
 man_sys.15.a:0 "A new man in the post."
