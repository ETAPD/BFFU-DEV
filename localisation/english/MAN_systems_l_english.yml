 MAN_eco_miyazaki_blueprint:0 "The Miyazaki Blueprint"
 MAN_eco_miyazaki_blueprint_desc:0 "In 1936 Miyazaki Masayoshi's research association, working in secret for Colonel Ishiwara Kanji, drew up a five-year programme to turn Manchuria into the heavy-industry base for the war with the Soviet Union that Ishiwara believed was coming."
 MAN_eco_kishi_arrives:0 "Kishi Comes to Hsinking"
 MAN_eco_kishi_arrives_desc:0 "Kishi Nobusuke, the brightest of Tokyo's 'reform bureaucrats', arrives as Vice-Minister of Industry. He will run the Plan as an experiment in state-directed capitalism that he means to take home one day."
 MAN_eco_mantetsu_research:0 "The Mantetsu Research Department"
 MAN_eco_mantetsu_research_desc:0 "The South Manchuria Railway's research department is the finest think tank in Asia: geologists, economists, agronomists and more than a few Marxists. Put it to work for the Plan."
 MAN_eco_zone_planning:0 "Regional Development Zones"
 MAN_eco_zone_planning_desc:0 "The planners divide the country into zones of specialised development, each tied to its railway, its river and its mines."
 MAN_eco_first_plan:0 "The First Five-Year Plan"
 MAN_eco_first_plan_desc:0 "In January 1937 the Five-Year Plan for Industrial Development is proclaimed: steel, coal, oil, power and machinery, all under state direction and Japanese management."
 MAN_eco_prio_army:0 "Munitions First"
 MAN_eco_prio_army_desc:0 "The Kwantung Army staff wrote the Plan and the staff will set its priorities: guns, shells and the steel to make them, with everything else to follow when there is time. The Army will be pleased; the Ministry of Industry will be told what to do."
 MAN_eco_prio_balanced:0 "Kishi's Balanced Development"
 MAN_eco_prio_balanced_desc:0 "Kishi argues that an arsenal without power stations, coal and fed workers is a stage set. The Plan will build the foundations first, and the munitions lines can wait their turn. The Army staff grumble about civilian timidity."
 MAN_eco_labour_agency:0 "The Daito Koshi Labour Agency"
 MAN_eco_labour_agency_desc:0 "Manchuria has the land and the coal; it does not have the workers. The Greater East Company will recruit them in North China by the hundred thousand."
 MAN_eco_revised_plan:0 "The Revised Plan"
 MAN_eco_revised_plan_desc:0 "With the China Incident the army demands more: in 1938 the Plan's targets are roughly doubled, and Japan's own planners make Manchuria the core of their materials programme."
 MAN_eco_material_mobilisation:0 "The Materials Mobilisation Plan"
 MAN_eco_material_mobilisation_desc:0 "Tokyo's Planning Board now allocates steel, coal and shipping across the whole empire. Manchuria's share comes with priority for its projects."
 MAN_eco_fengman_dam:0 "The Fengman Dam"
 MAN_eco_fengman_dam_desc:0 "A dam across the Sungari above Kirin, meant to be the largest hydroelectric plant in Asia."
 MAN_eco_supung_dam:0 "The Supung Dam"
 MAN_eco_supung_dam_desc:0 "With the Government-General of Korea, dam the Yalu at Supung and share the current between both banks."
 MAN_eco_labour_service:0 "The Labour Service Law"
 MAN_eco_labour_service_desc:0 "Conscript the labour: every able-bodied man owes the state months of work each year in the labour service corps. The sites will never lack hands again, and the villages will hate us for it."
 MAN_eco_contract_labour:0 "Regulate the Labour Contractors"
 MAN_eco_contract_labour_desc:0 "Break the grip of the gang bosses who skim the coolies' wages, pay workers in cash and feed them properly. Fewer men, but they stay, and fewer runaways end up in the hills with a rifle."
 MAN_eco_first_plan_fulfilled:0 "The Manchurian Model"
 MAN_eco_first_plan_fulfilled_desc:0 "The First Plan is done. Its methods, its men and its controlled economy become the template for Japan's own wartime economy."
 MAN_eco_second_plan:0 "The Second Five-Year Plan"
 MAN_eco_second_plan_desc:0 "The Second Plan for 1942 to 1946 drops the dreams of balanced development: everything now serves the war."
 MAN_eco_steel_rolling:0 "Breakthrough in Steel Rolling"
 MAN_eco_steel_rolling_desc:0 "New rolling mills at Anshan turn out plate and sections instead of shipping pig iron to Japan."
 MAN_eco_heavy_machinery:0 "Machine Tools for the Empire"
 MAN_eco_heavy_machinery_desc:0 "Manchurian shops start building the machine tools that Japan can no longer import from America."
 MAN_eco_total_war_plan:0 "Everything for the Front"
 MAN_eco_total_war_plan_desc:0 "The Pacific war turns the Second Plan into an emergency programme: munitions first, steel second, everything else last. Grain and cloth are requisitioned, and the countryside pays for it."
 MAN_eco_preserve_base:0 "Preserve the Industrial Base"
 MAN_eco_preserve_base_desc:0 "The planners refuse to strip the mills for one more year of shells. Maintenance, spare parts and the workers' rations come first, so that Manchuria can still produce in 1945. The Army staff call it defeatism."
 MAN_eco_behemoth:0 "The Industrial Behemoth of the East"
 MAN_eco_behemoth_desc:0 "From the Amur to the Yellow Sea, Manchuria is one great works: the arsenal of the continent and the reason the Empire can fight on."
 MAN_eco_showa_steel:0 "The Showa Steel Works"
 MAN_eco_showa_steel_desc:0 "Anshan's Showa Steel Works is already the biggest steel plant in Japan's empire outside the home islands. The Plan will triple it."
 MAN_eco_benxihu:0 "Benxihu Coal and Iron"
 MAN_eco_benxihu_desc:0 "The Okura-financed works at Benxihu make the low-phosphorus pig iron Japan's arsenals need for gun barrels."
 MAN_eco_control_law:0 "The Important Industries Control Law"
 MAN_eco_control_law_desc:0 "Under the 1937 law every key industry is assigned to a single 'special company' answerable to the state: one industry, one company."
 MAN_eco_found_mangyo:0 "Found Mangyo"
 MAN_eco_found_mangyo_desc:0 "Ayukawa Yoshisuke moves the whole Nissan combine to Manchuria as the Manchurian Industrial Development Company. Mantetsu's mines and mills are handed over to it."
 MAN_eco_smr_concern:0 "Mantetsu's Industrial Empire"
 MAN_eco_smr_concern_desc:0 "Matsuoka keeps the railway company whole: mines, steel, chemicals and shipping stay under Mantetsu, run as one great combine along the lines."
 MAN_eco_nissan_moves:0 "Nissan Moves to Manchuria"
 MAN_eco_nissan_moves_desc:0 "Nissan's holding company, its engineers and its share register move to Hsinking. Ayukawa promises the army an automobile, aircraft and machine-tool industry within five years."
 MAN_eco_american_capital:0 "Courting American Capital"
 MAN_eco_american_capital_desc:0 "Ayukawa hopes to bring American money and machinery into Manchuria. Washington will never agree to the loans, but the licences and the engineers' visits are worth something. The Army staff watch the Americans closely."
 MAN_eco_dowa:0 "Dowa Automobile"
 MAN_eco_dowa_desc:0 "The Dowa Automobile Company at Mukden assembles lorries for the Kwantung Army from Japanese and imported parts."
 MAN_eco_smr_industrial:0 "The Mantetsu Industrial Department"
 MAN_eco_smr_industrial_desc:0 "Mantetsu reorganises its sprawling subsidiaries into an industrial department with its own engineers and capital, and the Fushun open pit, the largest coal mine in Asia, gets new excavators."
 MAN_eco_asia_express:0 "The Asia Express"
 MAN_eco_asia_express_desc:0 "Mantetsu's streamlined Asia Express runs from Dairen to Hsinking at over a hundred kilometres an hour. The line behind it gets new track, signals, yards and armoured trains."
 MAN_eco_mukden_arsenal:0 "The Mukden Arsenal"
 MAN_eco_mukden_arsenal_desc:0 "Zhang Zuolin built the largest arsenal in China at Mukden. Retooled for Japanese patterns, it can arm the whole Manchukuo Army."
 MAN_eco_kw_arms:0 "Supply the Kwantung Army"
 MAN_eco_kw_arms_desc:0 "The arsenals deliver to the Kwantung Army first. It is the only army that can stop the Soviets, and it is the army that decides who governs in Hsinking."
 MAN_eco_own_arms:0 "Arm the Manchukuo Army"
 MAN_eco_own_arms_desc:0 "Keep the new rifles and mortars for the Manchukuo Imperial Army and its anti-bandit columns. A native army with modern weapons makes the Kwantung Army staff nervous."
 MAN_eco_manshu_hikoki:0 "Manchuria Aircraft Manufacturing"
 MAN_eco_manshu_hikoki_desc:0 "Manshu Hikoki, founded in 1938 and soon a Mangyo company, builds and repairs aircraft for the Kwantung Army at Mukden and Harbin."
 MAN_eco_powder_company:0 "The Manchurian Powder Company"
 MAN_eco_powder_company_desc:0 "Explosives and propellant from Kirin's chemical works keep the arsenals' shell lines running."
 MAN_eco_arsenal_of_empire:0 "Arsenal of the Continent"
 MAN_eco_arsenal_of_empire_desc:0 "Manchuria's arsenals no longer just repair Japanese weapons: they design and build their own, for the Manchukuo Army and for the fronts in China."
 MAN_eco_fushun_shale:0 "Fushun Oil Shale"
 MAN_eco_fushun_shale_desc:0 "Above Fushun's coal lies a thick bed of oil shale. Distilled, it yields the fuel oil the navy craves."
 MAN_eco_hydrogenation:0 "The Navy's Hydrogenation Process"
 MAN_eco_hydrogenation_desc:0 "The Navy's fuel laboratory has its own coal hydrogenation process, and Mantetsu will build it at Fushun. Cheap and Japanese, but the Army resents the Navy's say in Manchurian industry."
 MAN_eco_synthetic_fuel:0 "The Ruhrchemie Licence"
 MAN_eco_synthetic_fuel_desc:0 "Mitsui buys the German Fischer-Tropsch licence, and a great synthetic fuel works rises at Kirin on the German model. Expensive, but it is oil beyond the reach of an American embargo."
 MAN_eco_light_metals:0 "Manchurian Light Metals"
 MAN_eco_light_metals_desc:0 "Aluminium from Liaoning's alunite shale at the Fushun works, for the Empire's aircraft."
 MAN_eco_oil_surveys:0 "Drill for Manchurian Oil"
 MAN_eco_oil_surveys_desc:0 "Japanese geologists have drilled all over the northeast and found nothing. One more campaign of deep wells in the Sungari plain might change that."
 MAN_eco_strategic_stockpiles:0 "Strategic Resource Stockpiles"
 MAN_eco_strategic_stockpiles_desc:0 "Ore, coke and fuel are hoarded against the day the sea lanes close."
 MAN_eco_aluminium_air:0 "Aluminium for the Air Arm"
 MAN_eco_aluminium_air_desc:0 "New reduction works at Kirin and Antung, powered by the dams."
 MAN_eco_soybean:0 "The Soybean Economy"
 MAN_eco_soybean_desc:0 "Manchuria feeds half the world's soybean trade. Mantetsu's export monopoly pays for the Plan's first years."
 MAN_eco_million_households:0 "A Million Households in Twenty Years"
 MAN_eco_million_households_desc:0 "Tokyo's emigration plan will settle five million Japanese farmers in Manchuria by 1956, on land bought cheaply or simply taken from the Chinese and Koreans who farm it."
 MAN_eco_korean_settlers:0 "The Manchuria Colonisation Company"
 MAN_eco_korean_settlers_desc:0 "Let the Korean farmers come instead. The Sen-Man Takushoku company settles Korean families on the river flats, where they turn swamp into rice paddy. They work hard and cheaply, but the partisans of the Changbai forests are their cousins."
 MAN_eco_youth_corps:0 "The Youth Volunteer Corps"
 MAN_eco_youth_corps_desc:0 "Japanese boys of fifteen and sixteen are trained as armed pioneer-settlers on the Soviet border: farmers by day, sentries by night."
 MAN_eco_grain_quotas:0 "Compulsory Grain Deliveries"
 MAN_eco_grain_quotas_desc:0 "The shussha system: every village owes the state a fixed delivery of grain at fixed prices, whatever the harvest. The cities and the labour camps eat cheaply; the villages go hungry."
 MAN_eco_agri_modern:0 "Modernise Manchurian Agriculture"
 MAN_eco_agri_modern_desc:0 "Tractors, fertiliser from Dairen and Mantetsu's agronomists for the plain's farms. Slower to pay off, but a fed village does not feed the partisans."
 MAN_eco_resource_board:0 "The Raw Materials Control Board"
 MAN_eco_resource_board_desc:0 "One board allocates every tonne of ore, coal and grain in the country."
 MAN_eco_continental_supply:0 "Continental Supply Base"
 MAN_eco_continental_supply_desc:0 "Manchuria becomes the Empire's larder and quarry on the continent, shipping coal, iron and grain south through Dairen and the Korean ports."
 MAN_restoring_control_to_the_concord_society:0 "Ishiwara's Concordia"
 MAN_restoring_control_to_the_concord_society_desc:0 "Ishiwara Kanji created Manchukuo and now wants to let it go: the Concordia Association, not the Kwantung Army staff, should govern a true union of the five races. Half the staff think he is a prophet, the other half a traitor."
 MAN_pol_east_asian_league:0 "The East Asian League"
 MAN_pol_east_asian_league_desc:0 "Ishiwara's East Asian League preaches equal partnership between Japan, Manchukuo and China against the Western powers. In Hsinking its members fill the General Affairs Board."
 MAN_pol_kenkoku_university:0 "Kenkoku University"
 MAN_pol_kenkoku_university_desc:0 "The Nation-Building University opens in Hsinking in 1938: Japanese, Chinese, Korean, Mongol and Russian students live and study together, and argue freely in their dormitories."
 MAN_pol_pacification_teams:0 "Concordia Pacification Teams"
 MAN_pol_pacification_teams_desc:0 "Instead of punitive columns, Concordia sends teams of doctors, teachers and propagandists into the guerrilla districts, with grain and amnesty papers."
 MAN_pol_withdraw_guidance:0 "End Internal Guidance"
 MAN_pol_withdraw_guidance_desc:0 "The Kwantung Army's Fourth Section, which has 'guided' every ministry since 1932, is dissolved. The army returns to the frontier and the state governs itself. Fewer garrisons in the interior will be noticed in the hills."
 MAN_pol_chinese_ministers:0 "Ministers Who Govern"
 MAN_pol_chinese_ministers_desc:0 "Zhang Jinghui and his Chinese ministers are given real portfolios, and the Japanese vice-ministers become advisers. The gentry and the county magistrates take notice."
 MAN_pol_japanese_citizens:0 "Japanese Officials Become Manchukuoans"
 MAN_pol_japanese_citizens_desc:0 "Ishiwara's oldest demand: Japanese officials in Manchukuo must give up Japanese nationality and serve this state alone, at its salaries and under its laws."
 MAN_pol_railway_zone:0 "The Railway Zone Returns"
 MAN_pol_railway_zone_desc:0 "Mantetsu's railway zone, a Japanese colony running the length of the country, is handed to the Manchukuo state with its towns, schools and police."
 MAN_pol_republic_in_all_but_name:0 "A Union of Five Races"
 MAN_pol_republic_in_all_but_name_desc:0 "Puyi reigns, the Joint Council deliberates and the General Affairs Board governs. Manchukuo is still Japan's ally, but it is no longer the Kwantung Army's property."
 MAN_an_army_with_a_state:0 "An Army with a State"
 MAN_an_army_with_a_state_desc:0 "The Kwantung Army does not have a state; Manchukuo is a state that has an army. Its commander is also Japan's ambassador, and his staff 'guide' every ministry in Hsinking."
 MAN_pol_concordia_reorganised:0 "Reorganise the Concordia Association"
 MAN_pol_concordia_reorganised_desc:0 "In 1936 the Association is purged of its idealists and made the army's instrument for mobilising the population: every official a member, every village a branch."
 MAN_pol_tojo_kempeitai:0 "Tojo's Kempeitai"
 MAN_pol_tojo_kempeitai_desc:0 "General Tojo Hideki commands the Kwantung Army's military police. His files cover communists, Chinese nationalists and Japanese officers alike."
 MAN_pol_gab_state:0 "The General Affairs Board State"
 MAN_pol_gab_state_desc:0 "Under Hoshino Naoki the General Affairs Board drafts every budget, every law and every appointment. The Chinese ministers sign what it sends them."
 MAN_pol_extraterritoriality:0 "Abolish Extraterritoriality"
 MAN_pol_extraterritoriality_desc:0 "In December 1937 Japan gives up its extraterritorial rights and Mantetsu's railway zone. Japanese residents now fall under Manchukuo law, which Japanese officials write."
 MAN_pol_pujie_marriage:0 "Prince Pujie's Marriage"
 MAN_pol_pujie_marriage_desc:0 "The Kwantung Army arranges the marriage of Puyi's brother to Saga Hiro, a Japanese noblewoman, and a new succession law makes their son the heir. The dynasty will be half Japanese."
 MAN_pol_vice_ministers:0 "Rule Through the Vice-Ministers"
 MAN_pol_vice_ministers_desc:0 "Every ministry is run by its Japanese vice-minister, meeting each Tuesday at the General Affairs Board. The Chinese ministers are told the decisions afterwards."
 MAN_pol_zhang_jinghui:0 "Rule Through Zhang Jinghui"
 MAN_pol_zhang_jinghui_desc:0 "Old Zhang Jinghui, Prime Minister and former bandit, knows every warlord family and county elder in the northeast. Give him face and he will keep the countryside quiet."
 MAN_pol_foundation_shrine:0 "The National Foundation Shrine"
 MAN_pol_foundation_shrine_desc:0 "In 1940 Puyi returns from Japan with a replica of the sacred mirror, and Amaterasu becomes the founding deity of Manchukuo. The Kwantung Army is delighted; the Emperor's Chinese subjects are not."
 MAN_pol_mobilisation_law:0 "The National Mobilisation Law"
 MAN_pol_mobilisation_law_desc:0 "Manchukuo copies Japan's 1938 mobilisation law: the state may direct any worker, factory or harvest to wherever the war requires."
 MAN_pol_conscription_law:0 "The National Conscription Law"
 MAN_pol_conscription_law_desc:0 "From 1940 every young man of Manchukuo is liable for military service. Those the army rejects are sent to the labour service instead."
 MAN_pol_neighbourhood:0 "Collective Responsibility"
 MAN_pol_neighbourhood_desc:0 "The old baojia system returns: households are grouped in tens and hundreds, each responsible for the others. If one shelters a partisan, all are punished."
 MAN_pol_kwantung_manchukuo:0 "The Kwantung Army's Manchukuo"
 MAN_pol_kwantung_manchukuo_desc:0 "The Army's experiment is complete: a state run by staff officers and reform bureaucrats, with every factory, farm and village answering to the needs of the Kwantung Army."
 MAN_sec_security_plan:0 "The Three-Year Public Security Plan"
 MAN_sec_security_plan_desc:0 "In 1936 the Kwantung Army gives itself three years to destroy the armed resistance in Manchukuo. The Security Bureau is to coordinate army, police and Kempeitai."
 MAN_sec_collective_hamlets:0 "Collective Hamlets"
 MAN_sec_collective_hamlets_desc:0 "Separate the fish from the water: move the scattered villages of the guerrilla zones into walled, guarded hamlets."
 MAN_sec_kempeitai:0 "The Kempeitai Field Network"
 MAN_sec_kempeitai_desc:0 "The military police extend their informers and interrogation centres into every county seat, and answer to nobody in the civil administration."
 MAN_sec_surrender:0 "The Surrender Programme"
 MAN_sec_surrender_desc:0 "Amnesty, cash and land for any partisan who comes in with his rifle, and death for anyone who shelters those who do not."
 MAN_sec_border:0 "Seal the Amur"
 MAN_sec_border_desc:0 "Patrol boats, border posts and minefields along the Amur and Ussuri cut the partisans off from Soviet sanctuary and supplies."
 MAN_sec_pacified:0 "A Pacified Manchukuo"
 MAN_sec_pacified_desc:0 "The organised resistance is broken. Pacified provinces are safer places to build, and the Kwantung Army takes the credit."
