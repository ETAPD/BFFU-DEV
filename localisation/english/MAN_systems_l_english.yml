 MAN_tt_new_holder:0 "The successor starts at §Y45§! favour."
 MAN_tt_ayukawa_arrives:0 "§YAyukawa Yoshisuke§! of Nissan takes the Mangyo seat in the Hsinking Bureaucracy (favour 45)."
 MAN_tt_kishi_arrives:0 "§YKishi Nobusuke§! takes the Ministry of Industry seat in the Hsinking Bureaucracy (favour 55)."
 man_sys.20.t:0 "Internal Guidance"
 man_sys.20.d:0 "The Kwantung Army's staff has lost patience with Hsinking. A colonel arrives at the State Council with a list of ministers to be dismissed and a draft of the next budget, already approved by the army."
 man_sys.20.a:0 "Submit to the army's guidance."
 man_sys.20.b:0 "Appeal to our patrons in Tokyo."
 man_sys.20.c:0 "Stall and delay."
 man_sys.21.t:0 "A Trusted Partner"
 man_sys.21.d:0 "The Kwantung Army's commander praises Manchukuo's government as a model for the whole Co-Prosperity Sphere. The army hands over the management of several of its own arsenals and depots to Hsinking."
 man_sys.21.a:0 "An honour for the Five Races."
 man_sys.30.t:0 "The Death of Yang Jingyu"
 man_sys.30.d:0 "Betrayed by a subordinate and run down in the snow near Mengjiang, Yang Jingyu fights alone to the end. The Japanese surgeons who open his stomach find only bark, grass roots and cotton padding. The First Route Army is finished as an organised force."
 man_sys.30.a:0 "The mountains fall quiet."
 man_sys.31.t:0 "The Second Route Army Breaks"
 man_sys.31.d:0 "Zhou Baozhong's columns are cut to pieces in the forests of eastern Kirin. The survivors scatter into small groups that can no longer hold territory."
 man_sys.31.a:0 "The mountains fall quiet."
 man_sys.32.t:0 "Zhao Shangzhi Falls"
 man_sys.32.d:0 "Zhao Shangzhi is lured into an ambush by an informer and mortally wounded. His Third Route Army melts away into the northern forests."
 man_sys.32.a:0 "The mountains fall quiet."
 man_sys.33.t:0 "The Second Route Army Crosses the Amur"
 man_sys.33.d:0 "Broken and starving, the remnants of the Second Route Army slip across the frozen Amur into Soviet territory. Moscow will feed them, train them and keep them for a day when they might be useful."
 man_sys.33.a:0 "Good riddance."
 man_sys.34.t:0 "The Third Route Army Crosses the Amur"
 man_sys.34.d:0 "Broken and starving, the remnants of the Third Route Army slip across the frozen Amur into Soviet territory. Moscow will feed them, train them and keep them for a day when they might be useful."
 man_sys.34.a:0 "Good riddance."
 man_sys.35.t:0 "The Exiles Return"
 man_sys.35.d:0 "The Chinese and Korean partisans who fled to the Soviet Union return, retrained as a Red Army brigade with radios, explosives and Soviet officers. Their old base areas rise with them."
 man_sys.35.a:0 "Hunt them down again."
 MAN_tt_exile:0 "The £nato_unit_irregular_infantry_icon_small §ORoute Army§! no longer raids Manchukuo, but it may return if the Soviet Union goes to war with us or with Japan."
