l_english:
 MAN_zone_hi:0 "Designate Heavy Industry Zone"
 MAN_zone_hi_desc:0 "Concentrate furnaces, machine shops and arsenals here. Unlocks the province's industrial district sites and Production Runs for the Empire.\n\nOnly surveyed provinces can be designated, and each may hold one designation. Designations are limited by the Plan's zone allowance."
 MAN_zone_hi_dm:0 "Heavy Industry Zone"
 MAN_zone_min:0 "Designate Mining District"
 MAN_zone_min_desc:0 "Open the coal seams and ore bodies the survey found. Unlocks the province's mine and colliery sites.\n\nOnly surveyed provinces can be designated, and each may hold one designation. Designations are limited by the Plan's zone allowance."
 MAN_zone_min_dm:0 "Mining District"
 MAN_zone_pow:0 "Designate Power and Water District"
 MAN_zone_pow_desc:0 "Harness the rivers of the northeast. Unlocks Thermal Station and Transmission Grid projects, and the province's hydro and electro-chemical sites.\n\nOnly surveyed provinces can be designated, and each may hold one designation. Designations are limited by the Plan's zone allowance."
 MAN_zone_pow_dm:0 "Power and Water District"
 MAN_zone_set:0 "Designate Settlement and Grain Zone"
 MAN_zone_set_desc:0 "Open the land to pioneer colonies and the export trade. Unlocks Pioneer Colonies, export seasons and the province's trade sites. Dispossession breeds banditry.\n\nOnly surveyed provinces can be designated, and each may hold one designation. Designations are limited by the Plan's zone allowance."
 MAN_zone_set_dm:0 "Settlement and Grain Zone"
 MAN_pj_thermal:0 "Thermal Power Station"
 MAN_pj_thermal_desc:0 "A coal-fired station to feed the new works. Each station raises local construction speed.\n\nUp to §Y3§! per province. Quota output is scaled by the province's security (banditry) and by planning efficiency."
 MAN_pj_grid:0 "Transmission Grid"
 MAN_pj_grid_desc:0 "High-tension lines carrying current from the dams to the factories.\n\nUp to §Y1§! per province. Quota output is scaled by the province's security (banditry) and by planning efficiency."
 MAN_pj_colony:0 "Pioneer Colony"
 MAN_pj_colony_desc:0 "Settle a Japanese pioneer group (kaitakudan) on land bought cheap or simply taken from Chinese and Korean farmers. Adds to the labour pool for good, but the dispossessed go to the hills.\n\nUp to §Y3§! per province. Quota output is scaled by the province's security (banditry) and by planning efficiency."
 MAN_zone_clear:0 "Lift Development Designation"
 MAN_zone_clear_desc:0 "Release the province from its current designation so it can be re-zoned. Completed projects stay built."
 MAN_mega_showa:0 "Expand the Showa Steel Works (stage [?MAN_mega_showa_n|0]/3)"
 MAN_mega_showa_desc:0 "The Showa Steel Works at Anshan is the heart of Manchurian heavy industry. Each stage adds furnaces, rolling mills and coke ovens.\n\nMegaproject in Liaoning: 3 stages. Completing the final stage grants a lasting bonus."
 MAN_mega_fengman:0 "Build the Fengman Dam (stage [?MAN_mega_fengman_n|0]/3)"
 MAN_mega_fengman_desc:0 "A concrete wall across the Sungari above Kirin, the largest dam in Asia. Tens of thousands of labourers will pour it.\n\nMegaproject in Kirin: 3 stages. Completing the final stage grants a lasting bonus."
 MAN_mega_supung:0 "Build the Supung Dam (stage [?MAN_mega_supung_n|0]/2)"
 MAN_mega_supung_desc:0 "A joint project with the Government-General of Korea to dam the Yalu. Its turbines will light both banks of the river.\n\nMegaproject in Liaoning: 2 stages. Completing the final stage grants a lasting bonus."
 MAN_mega_kirin_fuel:0 "Kirin Synthetic Fuel Works (stage [?MAN_mega_kirin_fuel_n|0]/2)"
 MAN_mega_kirin_fuel_desc:0 "Coal hydrogenation on the German model at Kirin, meant to free the Empire from American oil.\n\nMegaproject in Kirin: 2 stages. Completing the final stage grants a lasting bonus."
 MAN_mega_mamc:0 "Manchuria Aircraft Works (stage [?MAN_mega_mamc_n|0]/2)"
 MAN_mega_mamc_desc:0 "Manshu Hikoki at Mukden and Harbin, assembling Nakajima and Tachikawa designs for the Kwantung Army air arm.\n\nMegaproject in Liaoning: 2 stages. Completing the final stage grants a lasting bonus."
 MAN_mega_arsenal:0 "The Mukden Arsenal (stage [?MAN_mega_arsenal_n|0]/2)"
 MAN_mega_arsenal_desc:0 "Zhang Zuolin's old arsenal, the largest in China, retooled for Japanese patterns.\n\nMegaproject in Liaoning: 2 stages. Completing the final stage grants a lasting bonus."
 MAN_lab_concordia:0 "Concordia Labour Service"
 MAN_lab_concordia_desc:0 "The Concordia Association calls out its youth and neighbourhood groups for a season of 'voluntary' labour on the Plan's sites."
 MAN_lab_daito:0 "Daito Koshi Recruitment Drive"
 MAN_lab_daito_desc:0 "The Greater East Company sends its agents into Shandong and Hebei to sign up seasonal labourers with advances, promises and threats. Hundreds of thousands cross the Wall each spring."
 MAN_lab_special:0 "Special Workers Programme"
 MAN_lab_special_desc:0 "Captured soldiers and rounded-up civilians from the China front are shipped north as 'special workers' for the mines. Death rates are appalling, escapes are frequent, and the Kwantung Army approves."
 MAN_plan_review:0 "Annual Plan Review"
 MAN_plan_review_desc:0 "The Planning Board and the Kwantung Army staff audit this year's deliveries. Total plan fulfilment must reach §Y[?MAN_review_need|0]%§!. The review cannot close early in the first months of the plan year."
 MAN_pol_joint_council:0 "Convene the Joint Council"
 MAN_pol_joint_council_desc:0 "Delegates of the five races meet in Hsinking as the Concordia Association's national Joint Council. It cannot pass laws, but its resolutions give the General Affairs Board a mandate the Kwantung Army staff cannot simply ignore."
 MAN_pol_guidance_directive:0 "Issue an Internal Guidance Directive"
 MAN_pol_guidance_directive_desc:0 "The Fourth Section of the Kwantung Army staff sends Hsinking another set of 'suggestions'. The ministries will comply, and the vice-ministers will remember who wrote them."
 MAN_mantetsu_question:0 "The Mantetsu Question"
 MAN_mantetsu_question_desc:0 "Ayukawa Yoshisuke wants Mantetsu's mines and mills folded into a new holding company; Matsuoka Yosuke will not see the railway carved up. When the year is out, whichever of §LMangyo§! and §LMantetsu§! holds the greater favour in Hsinking wins the argument."
 MAN_pol_concordia_rally:0 "Concordia Association Rally"
 MAN_pol_concordia_rally_desc:0 "Flags of the five races, speeches on the Kingly Way, and a parade of youth corps before the Kwantung Army's observers."
 MAN_pol_imperial_tour:0 "The Emperor Visits Tokyo"
 MAN_pol_imperial_tour_desc:0 "Puyi travels to Japan to pay his respects at Ise and returns with the sacred mirror for a new National Foundation Shrine in Hsinking. The Kwantung Army is delighted; the Emperor's Chinese subjects are not."
 MAN_pol_appeal_tokyo:0 "Appeal to Our Friends in Tokyo"
 MAN_pol_appeal_tokyo_desc:0 "A former Hsinking man now sits in a Tokyo ministry. A quiet word from him calms the Kwantung Army staff."
 MAN_sec_surrender_1:0 "Surrender Campaign: First Route Army"
 MAN_sec_surrender_1_desc:0 "Leaflets, bribes and amnesties for the men of Yang Jingyu's First Route Army. Each band that comes down from the hills goes straight into the labour corps or the Manchukuo Army."
 MAN_tt_band1_m12:0 "§OFirst Route Army§! strength: §G-12§!"
 MAN_sec_surrender_2:0 "Surrender Campaign: Second Route Army"
 MAN_sec_surrender_2_desc:0 "Leaflets, bribes and amnesties for the men of Zhou Baozhong's Second Route Army. Each band that comes down from the hills goes straight into the labour corps or the Manchukuo Army."
 MAN_tt_band2_m12:0 "§OSecond Route Army§! strength: §G-12§!"
 MAN_sec_surrender_3:0 "Surrender Campaign: Third Route Army"
 MAN_sec_surrender_3_desc:0 "Leaflets, bribes and amnesties for the men of Zhao Shangzhi's Third Route Army. Each band that comes down from the hills goes straight into the labour corps or the Manchukuo Army."
 MAN_tt_band3_m12:0 "§OThird Route Army§! strength: §G-12§!"
 MAN_sec_sweep:0 "Punitive Sweep"
 MAN_sec_sweep_desc:0 "Japanese and Manchukuo columns comb the valleys, burning camps and seizing grain caches. Needs at least two of our divisions stationed in the province. Stronger with Kwantung Army favour and with an informant network in place."
 MAN_sweep_troops_tt:0 "At least §Y2§! of our divisions are stationed in the province"
 MAN_sec_hamlets:0 "Concentrate into Collective Hamlets"
 MAN_sec_hamlets_desc:0 "Burn the scattered farmsteads and herd their people behind the walls of fortified 'collective hamlets', starving the guerrillas of food and recruits. It works, at a terrible cost to the people moved."
 MAN_sec_blockhouses:0 "Build Railway Blockhouses"
 MAN_sec_blockhouses_desc:0 "A chain of brick blockhouses, wire and searchlights along every line and road in the province."
 MAN_sec_informants:0 "Plant a Kempeitai Informant Network"
 MAN_sec_informants_desc:0 "Paid informers in every village headman's house. For six months banditry grows more slowly and sweeps strike harder."
 MAN_sec_three_year:0 "The Three-Year Public Security Plan"
 MAN_sec_three_year_desc:0 "The Kwantung Army has given Hsinking three years to break the armed resistance. Average banditry must fall below §Y25§!."
 MAN_sec_nozoe:0 "The Nozoe Punitive Campaign"
 MAN_sec_nozoe_desc:0 "General Nozoe's special command hunts Yang Jingyu's First Route Army through the Changbai forests through a winter. While the campaign runs the First Route Army loses strength every week. Destroy it before the year is out."
 MAN_plan_cat:0 "The Industrial Development Plan"
 MAN_plan_cat_desc:0 "Survey and designate provinces, build their sites, and fill the four §Yquotas§! before each §YAnnual Review§!."
 MAN_politics_cat:0 "The Hsinking Bureaucracy"
 MAN_politics_cat_desc:0 "Five Japanese power centres run Manchukuo. Court them, answer their requests and keep the £army_experience §LKwantung Army patience§!."
 MAN_security_cat:0 "Public Security"
 MAN_security_cat_desc:0 "The £nato_unit_irregular_infantry_icon_small §ORoute Armies§! of the Northeast Anti-Japanese United Army still hold the forests. £pol_violence §OBanditry§! slows construction, resources and the Plan."
 MAN_site_gongchangling:0 "Gongchangling Magnetite Mines"
 MAN_site_gongchangling_desc:0 "The rich magnetite at Gongchangling feeds the Showa furnaces at Anshan directly, without the costly ore beneficiation that the lean Anshan ores need.\n\nSite in §CLiaoning§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_fushun_shale:0 "Fushun Oil Shale Retorts"
 MAN_site_fushun_shale_desc:0 "More retorts on the shale stripped from above the Fushun coal. Each battery adds a refinery. Requires the Fushun Oil Shale focus.\n\nSite in §CLiaoning§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_tiexi:0 "The Tiexi Industrial District"
 MAN_site_tiexi_desc:0 "West of the Mukden railway yards the planners lay out a whole district of factories: machine shops, tanneries, cement and textile mills along new paved streets.\n\nSite in §CLiaoning§!. Needs the province surveyed and designated as a §YHeavy Industry Zone§!. Up to §Y3§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_antung:0 "Antung Light Metals Works"
 MAN_site_antung_desc:0 "An aluminium reduction works at Antung on the Yalu, waiting for the current from the Supung turbines. Requires the Manchurian Light Metals focus.\n\nSite in §CLiaoning§!. Needs the province surveyed and designated as a §YHeavy Industry Zone§!. Up to §Y1§! stage. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_fuxin:0 "The Fuxin Open Pit"
 MAN_site_fuxin_desc:0 "The Fuxin coalfield is opened from 1936 as a vast open pit, worked by contract labour from Shandong under brutal conditions.\n\nSite in §CLiaobei§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y3§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_molybdenum:0 "Yangjiazhangzi Molybdenum"
 MAN_site_molybdenum_desc:0 "The molybdenum mine at Yangjiazhangzi supplies an alloy metal that Japanese armour plate and gun steel cannot do without.\n\nSite in §CLiaobei§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y1§! stage. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_hsinking:0 "The Great Hsinking Plan"
 MAN_site_hsinking_desc:0 "The new capital is laid out with boulevards, ministries and an industrial quarter, planned from nothing on the plain around the old town of Changchun.\n\nSite in §CKirin§!. Needs the province surveyed and designated as a §YHeavy Industry Zone§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_harbin:0 "Harbin Railway Workshops"
 MAN_site_harbin_desc:0 "The great workshops of the old Chinese Eastern Railway, bought from the Soviets in 1935, are retooled to build rolling stock and shells.\n\nSite in §CKirin§!. Needs the province surveyed and designated as a §YHeavy Industry Zone§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_dongbiandao:0 "The Dongbiandao Development Company"
 MAN_site_dongbiandao_desc:0 "Mangyo's company for the Tonghua highlands: iron at Dalizi and coal at Tiechang, in the forests where the First Route Army hides. Requires Mangyo, or 50 Mangyo favour.\n\nSite in §CKirin§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y3§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_kirin_chem:0 "Kirin Electro-Chemical Works"
 MAN_site_kirin_chem_desc:0 "Cheap current from Fengman makes calcium carbide, and carbide makes acetylene, synthetic rubber and explosives. Requires the first stage of the Fengman Dam.\n\nSite in §CKirin§!. Needs the province surveyed and designated as a §YPower and Water District§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_hegang:0 "Hegang Collieries"
 MAN_site_hegang_desc:0 "Mangyo opens the Hegang field north of Jiamusi, the largest coal reserve in the north, and hauls its coal south on the new Tumen line.\n\nSite in §CSungkiang§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y3§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_jixi:0 "Jixi and Mishan Coal"
 MAN_site_jixi_desc:0 "Coal pits close to the Soviet border, in country the Third Route Army knows well. Every new pit brings new targets for raids.\n\nSite in §CSungkiang§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_mudanjiang:0 "Mudanjiang Garrison Works"
 MAN_site_mudanjiang_desc:0 "Mudanjiang becomes the Kwantung Army's eastern base against the Soviet Maritime Province, with repair shops and ammunition works behind the fortified zones.\n\nSite in §CSungkiang§!. Needs the province surveyed and designated as a §YHeavy Industry Zone§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_jingpo:0 "Jingpo Lake Hydro Station"
 MAN_site_jingpo_desc:0 "A small hydro station at the outlet of Jingpo Lake, where the Mudan River falls through a basalt gorge.\n\nSite in §CSungkiang§!. Needs the province surveyed and designated as a §YPower and Water District§!. Up to §Y1§! stage. Quota output is scaled by the province's security and by planning efficiency."
 MAN_tt_cic_3000:0 "£civ_factory_output §YEconomic Capacity Surplus§!: §G+3000§! (cut by up to half in provinces troubled by §Obanditry§!)"
 MAN_site_heihe_gold:0 "The Heihe and Mohe Gold Fields"
 MAN_site_heihe_gold_desc:0 "Placer gold from the Amur valleys, which the Manchukuo Gold Mining Company sells for foreign currency to buy machine tools abroad.\n\nSite in §CHeilungkiang§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y3§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_qiqihar:0 "Qiqihar Machine Works"
 MAN_site_qiqihar_desc:0 "Locomotive and machine works at the junction of the western lines, building for the railways and for the army's northern front.\n\nSite in §CHeilungkiang§!. Needs the province surveyed and designated as a §YHeavy Industry Zone§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_jalainur:0 "Jalainur Collieries"
 MAN_site_jalainur_desc:0 "Lignite at Jalainur on the Soviet frontier, worked since the days of the Chinese Eastern Railway.\n\nSite in §CHulunbuir§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_tt_cic_2000:0 "£civ_factory_output §YEconomic Capacity Surplus§!: §G+2000§! (cut by up to half in provinces troubled by §Obanditry§!)"
 MAN_site_hailar:0 "Hailar Meat and Hides"
 MAN_site_hailar_desc:0 "Barga herds driven into a new meat-packing plant at Hailar: tinned beef for the army and hides for export.\n\nSite in §CHulunbuir§!. Needs the province surveyed and designated as a §YSettlement and Grain Zone§!. Up to §Y1§! stage. Quota output is scaled by the province's security and by planning efficiency."
 MAN_site_beipiao:0 "Beipiao Collieries"
 MAN_site_beipiao_desc:0 "Coking coal at Beipiao near Chaoyang, on the new line to Jinzhou.\n\nSite in §CJehol§!. Needs the province surveyed and designated as a §YMining District§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_tt_cic_1500:0 "£civ_factory_output §YEconomic Capacity Surplus§!: §G+1500§! (cut by up to half in provinces troubled by §Obanditry§!)"
 MAN_site_wool:0 "The Chahar Wool Trade"
 MAN_site_wool_desc:0 "Buy the Mongol wool clip at fixed prices and ship it to the Japanese mills.\n\nSite in §CChahar§!. Needs the province surveyed and designated as a §YSettlement and Grain Zone§!. Up to §Y1§! stage. Quota output is scaled by the province's security and by planning efficiency."
 MAN_tt_cic_1200:0 "£civ_factory_output §YEconomic Capacity Surplus§!: §G+1200§! (cut by up to half in provinces troubled by §Obanditry§!)"
 MAN_site_remount:0 "Xilingol Remount Depots"
 MAN_site_remount_desc:0 "Mongol horses for the Kwantung Army's cavalry and transport columns, bought on the steppe and broken at new depots.\n\nSite in §CXilingol§!. Needs the province surveyed and designated as a §YSettlement and Grain Zone§!. Up to §Y2§! stages. Quota output is scaled by the province's security and by planning efficiency."
 MAN_tt_line_jehol:0 "§CLiaobei§!, §CJehol§!: §G+1§! £infrastructure_texticon §Yinfrastructure§!. £pol_violence §OBanditry§! in §CJehol§! §G-8§!"
 MAN_line_jehol:0 "The Jinzhou to Chengde Line"
 MAN_line_jehol_desc:0 "Carry the railway up into the Jehol hills to Chengde, binding the province to Manchukuo and opening the Beipiao coal.\n\nA Mantetsu construction project. It counts as a plan project and as new track for Mantetsu's requests."
 MAN_tt_line_tumen:0 "§CSungkiang§!: §G+1§! £infrastructure_texticon §Yinfrastructure§!. £pol_violence §OBanditry§! in §CSungkiang§! §G-8§!"
 MAN_line_tumen:0 "The Tumen to Jiamusi Line"
 MAN_line_tumen_desc:0 "A strategic line through the eastern forests from the Korean border to the Sungari, opening Hegang and cutting the partisans' hinterland in two.\n\nA Mantetsu construction project. It counts as a plan project and as new track for Mantetsu's requests."
 MAN_tt_line_heihe:0 "§CHeilungkiang§!: §G+1§! £infrastructure_texticon §Yinfrastructure§!. £pol_violence §OBanditry§! in §CHeilungkiang§! §G-6§!"
 MAN_line_heihe:0 "The Bei'an to Heihe Line"
 MAN_line_heihe_desc:0 "The line north to Heihe on the Amur, which the Kwantung Army wants for an offensive into the Soviet Far East.\n\nA Mantetsu construction project. It counts as a plan project and as new track for Mantetsu's requests."
 MAN_tt_line_north:0 "§CKirin§!, §CHulunbuir§!: §G+1§! £infrastructure_texticon §Yinfrastructure§!. £pol_violence §OBanditry§! in §CHulunbuir§! §G-4§!"
 MAN_line_north:0 "Double-Track the North Manchuria Line"
 MAN_line_north_desc:0 "Convert the old Russian broad gauge from Harbin to Manzhouli to standard gauge and double it, so that troop trains can reach the Mongolian front.\n\nA Mantetsu construction project. It counts as a plan project and as new track for Mantetsu's requests."
 MAN_run_empire:0 "Production Run for the Empire"
 MAN_run_empire_desc:0 "Turn the province's works over to a contract run for Japanese buyers. The factories are tied up for two months; the proceeds go into the construction budget.\n\nThe province cannot repeat this for §Y90§! days afterwards. Economic Capacity Surplus speeds up construction lines."
 MAN_run_soy:0 "Soybean Export Season"
 MAN_run_soy_desc:0 "Mantetsu buys the harvest at fixed prices and ships it out through Dairen to Germany and Japan. The peasants get paper money; a quarter of the time they get angry too.\n\nThe province cannot repeat this for §Y180§! days afterwards. Economic Capacity Surplus speeds up construction lines."
 MAN_tt_cic_2500:0 "£civ_factory_output §YEconomic Capacity Surplus§!: §G+2500§! (cut by up to half in provinces troubled by §Obanditry§!)"
 MAN_run_opium:0 "The Jehol Opium Monopoly"
 MAN_run_opium_desc:0 "The state Opium Monopoly Bureau buys the Jehol poppy harvest and sells it through licensed dens across the country. It is one of the regime's richest sources of revenue and one of its most shameful.\n\nThe province cannot repeat this for §Y120§! days afterwards. Economic Capacity Surplus speeds up construction lines."
 MAN_tt_spur:0 "A new mine spur counts as track for §LMantetsu§!'s requests"
 MAN_req_kw_a:0 "Kwantung Army Staff: Secure the Railway Zone"
 MAN_req_kw_a_desc:0 "The Kwantung Army wants average banditry pushed below §Y[?MAN_req_kw_t|0]§!.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_kw_a_LINE:0 "§YRequest:§! Secure the Railway Zone"
 MAN_req_kw_b:0 "Kwantung Army Staff: Feed the Kwantung Army"
 MAN_req_kw_b_desc:0 "The Kwantung Army demands 1500 rifles from Manchurian arsenals. They will be taken the moment they are in store.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_kw_b_LINE:0 "§YRequest:§! Feed the Kwantung Army"
 MAN_req_gab_a:0 "General Affairs Board: Fund the Concordia Budget"
 MAN_req_gab_a_desc:0 "The General Affairs Board needs the state's reserves: hold §Y120§! political power and it will draw 80.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_gab_a_LINE:0 "§YRequest:§! Fund the Concordia Budget"
 MAN_req_gab_b:0 "General Affairs Board: Clean the Ministries"
 MAN_req_gab_b_desc:0 "Hoshino's office wants order in the provinces before the next budget: reach §Y60%§! stability.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_gab_b_LINE:0 "§YRequest:§! Clean the Ministries"
 MAN_req_ind_a:0 "Ministry of Industry: Meet the Steel Target"
 MAN_req_ind_a_desc:0 "The Ministry of Industry wants Iron and Steel fulfilment above §Y[?MAN_req_ind_t|0]%§!.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_ind_a_LINE:0 "§YRequest:§! Meet the Steel Target"
 MAN_req_ind_b:0 "Ministry of Industry: Zone New Ground"
 MAN_req_ind_b_desc:0 "The Ministry wants another province brought under a development designation (§Y[?MAN_req_ind_t|0]§! zones).\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_ind_b_LINE:0 "§YRequest:§! Zone New Ground"
 MAN_req_mgy_a:0 "Mangyo: Machinery for Mangyo"
 MAN_req_mgy_a_desc:0 "Ayukawa's holding company wants Machinery and Munitions fulfilment above §Y[?MAN_req_mgy_t|0]%§!.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_mgy_a_LINE:0 "§YRequest:§! Machinery for Mangyo"
 MAN_req_mgy_b:0 "Mangyo: A Free Hand for Mangyo"
 MAN_req_mgy_b_desc:0 "Mangyo wants results it can show its shareholders: complete §Y[?MAN_req_mgy_t|0]§! plan projects in total.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_mgy_b_LINE:0 "§YRequest:§! A Free Hand for Mangyo"
 MAN_req_smr_a:0 "Mantetsu: Lay More Track"
 MAN_req_smr_a_desc:0 "Mantetsu wants more track laid: §Y[?MAN_req_smr_t|0]§! railway lines or mine spurs in total.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
 MAN_REQ_smr_a_LINE:0 "§YRequest:§! Lay More Track"
 MAN_req_smr_b:0 "Mantetsu: Coal for the Railways"
 MAN_req_smr_b_desc:0 "The railway's locomotives burn Fushun coal by the trainload: raise Coal and Liquid Fuel fulfilment above §Y[?MAN_req_smr_t|0]%§!.\n\nSuccess: §G+18 favour§!, §G+5 Kwantung patience§!, §G+25§! political power. Failure: §R-15 favour§!, §R-5 Kwantung patience§!."
