 JAP_GEACPS_category: "§RGreater East Asia Co-Prosperity Sphere§!"
 JAP_GEACPS_category_desc: "\n\n\n£decision_header_JAP_GEACPS£\n\n\n\nThe \"Dai Tōa Kyōeiken\", or the Co-Prosperity Sphere, is a unique concept crafted by ourselves with the sole purpose of liberating the people of East Asia from the shackles of Western imperialism. This liberation, however, cannot happen without the means with which to accomplish it: abundant resources and absolute cooperation. The Old World, while corrupt and decadent, is still a powerful tyrant. With the exception of the Land of the Rising Sun, every other Asian nation is incapable of matching the European colonial powers.\n\nIn order to circumvent this disadvantage, our sworn allies must give everything they have, be they resources, factories or men, to their liberator and protector, for only the Emperor's warriors can obtain victory against the devils of the West. Someday they will control their own fate, but not today.\n\n                                    Strength of §YHakko Ichiu§! in the §RSphere§!: [?JAP_Hakko_Ichiu_var|+=0]"
 JAP_FACTION_LIST_FACTION_NAME_TEXT: "§H[Root.GetFactionName]§! currently has these members:"
 JAP_Invite_Jewish_Settlers_to_East_Asia: "Invite Jewish Settlers to East Asia"
 JAP_Invite_Jewish_Settlers_to_East_Asia_desc: "As Europe descends into chaos, the Jewish community seeks safety. We will extend pragmatic compassion to the Jewish diaspora by establishing regulated settlement zones on our eastern lands. In exchange, their financial expertise, scientific knowledge, and global networks will be dedicated to the Sphere's success."
 JAP_Found_the_Greater_East_Asian_Film_Sphere: "Found the Greater East Asian \"Film Sphere\""
 JAP_Found_the_Greater_East_Asian_Film_Sphere_desc: "Cinema is the soul of the modern era, and we will use its influence to define it. A new pan-Asian film cooperative, led by Tokyo and staffed by dedicated collaborators, will flood the continent with grand epics about emancipation, industrial prosperity, and cultural identity. Each frame will subtly reinforce our legitimate leadership and the moral clarity of our goal."
 JAP_Fund_and_Peddle_Propaganda: "Fund and peddle propaganda newsreels, films, and other cultural media"
 JAP_Fund_and_Peddle_Propaganda_desc: "We will send carefully crafted messages across the Sphere through a vast network of state-funded studios, publishing houses, and broadcasting organisations.  Newsreels will depict unity and prosperity under Japanese leadership; radio programs will instill loyalty and vigilance; and publications will celebrate collaborative development.  This media barrage will drown out both foreign and domestic dissent."
 JAP_Ingratiate_the_Japanese_Language_in_the_Sphere: "\"Ingratiate\" the Japanese language in the sphere"
 JAP_Ingratiate_the_Japanese_Language_in_the_Sphere_desc: "To ensure the Sphere's seamless administration and long-term unification, Japanese will be adopted as the language of progress. Schools' curricula will change, street signs will be updated, and local leaders' Japanese will be evaluated. While local dialects may survive in private, the Emperor's language will rule the public sphere. With progressive immersion and motivation, we will establish a single identity rooted in our language, preventing cultural fragmentation."
 JAP_Open_up_an_Exhibition_Street_in_Siam: "Open up an exhibition street in Siam"
 JAP_Open_up_an_Exhibition_Street_in_Siam_desc: "To demonstrate the excellence of the Co-Prosperity Sphere and solidify Siam's loyalty, we will hold a grand display in Bangkok. Siamese people will be introduced to the Empire's enlightened culture and worldview through well-organised exhibits and propaganda displays. This show will focus on our industrial miracles, military superiority, and pan-Asian unification."
 JAP_Unity_Marches_and_Parades: "Unity Marches & Parades"
 JAP_Unity_Marches_and_Parades_desc: "Across the Co-Prosperity Sphere, synchronised marches and military parades will be held to demonstrate our unity, resolve, and ideological commitment. Imperial soldiers, accompanied by native auxiliaries, will march through the streets of each provincial capital, waving solidarity flags. These coordinated exhibitions are more than just morale boosters; they serve as a reminder to all citizens that peace and prosperity are only possible through obedience and sacrifice."
 JAP_Requisition_Extra_Resources: "Requisition Extra Resources"
 JAP_Requisition_Extra_Resources_desc: "Victory cannot be achieved without the minerals needed to power our industries and armies. Our allies must understand that their efforts are not optional; they are required. With a single stroke of the pen, we will demand increased resource quotas from the entire Co-Prosperity Sphere. Rubber, oil, tin, and rare minerals must flow into Japan's heartland."
 JAP_Rebuild_Dutch_Oil_Wells: "Rebuild Dutch Oil Wells"
 JAP_Rebuild_Dutch_Oil_Wells_desc: "The former Dutch masters squandered the Indies' riches for their own pleasure, leaving the islands in ruins. We plan to repair and expand the archipelago's oil infrastructure with the help of both locals and Japanese engineers. These wells must run 24 hours a day, seven days a week to power the military machine that opposes Western tyranny. Through careful control and industrial simplification, we will increase output while maintaining a consistent supply of fuel to the Empire's core."
 JAP_Requisition_Forced_Labor: "Requisition forced labor"
 JAP_Requisition_Forced_Labor_desc: "Though unpalatable to some, desperate times call for desperate measures. Millions of people in our seized areas are idle because they believe they have freedom and leisure. That period has ended. To meet our industrial and logistical needs, we intend to implement a large-scale forced labour program. Workers will be assigned to mines, railroads, factories, and plantations, all under strict supervision."
 JAP_Hold_the_Tokyo_Conference: "Hold the Tokyo Conference"
 JAP_Hold_the_Tokyo_Conference_desc: "Finally, the time has come for Asia's nations to gather under one roof, united in spirit and determination. Over the course of two days, we will hold a large meeting in Tokyo with representatives from the Co-Prosperity Sphere to discuss the path of our shared destiny. The themes are still undecided: whether we will reaffirm our commitment to Pan-Asianism, extract critical resources from our partners, or simply affirm the Empire's unquestioned leadership."
 JAP_Support_Native_Nationalist_Movements: "Support Native Nationalist Movements"
 JAP_Support_Native_Nationalist_Movements_desc: "To undermine Western control and win over native populations, we will support nationalist movements throughout Asia. These groups, which are frequently marginalised or exiled, will now receive Japanese funds, weapons, and advisors. In exchange, they will pledge their allegiance to the Co-Prosperity Sphere and campaign against colonial governments."
 JAP_Build_Shinto_Shrines: "Build Shinto Shrines"
 JAP_Build_Shinto_Shrines_desc: "By erecting Shinto shrines throughout our territory, we not only promote culture and beauty, but also loyalty and ideological alignment. These shrines will be built in city centres and holy places, overseen by Japanese priests and guarded by loyal soldiers. Local communities will be invited or compelled to participate in rites honouring the Emperor's heavenly Spirit."
 JAP_Launch_Pacification_Operations: "Launch \"Pacification Operations\""
 JAP_Launch_Pacification_Operations_desc: "In rebellious areas, pacification operations must be launched to eliminate rebels, dissenters, and foreign agents. These campaigns will be fast, violent, and uncompromising. Villages suspected of supporting the opposition will be relocated or demolished. Entire populations may be subjected to loyalty tests, labour camps, or re-education. The message is clear: order will be maintained at all costs. We must quell revolt before it spreads."
 JAP_dai_toa_kyoeiken: "Dai Toa Kyoeiken"
 JAP_Invite_to_Yen_Bloc_Manchukuo: "Invite Manchukuo to the £yen_icon Yen Bloc"
 JAP_Invite_to_Yen_Bloc_Manchukuo_desc: "Manchukuo is the industrial heart of the continental sphere. Binding its economy to the yen ties its mines, mills, and factories directly to the Empire's war machine, trading a measure of its civilian comfort for accelerated construction."
 JAP_Invite_to_Yen_Bloc_Siam: "Invite Siam to the £yen_icon Yen Bloc"
 JAP_Invite_to_Yen_Bloc_Siam_desc: "Siam, proud and uncolonized, has long played a delicate game of empires. Now, as East Asia comes together under our leadership, we will offer Siam a prominent position within the Yen bloc. Siam's dedication will be rewarded with cultural recognition and a seat at the table of a new Asia free of the West's exploitative grip. By integrating its economies, Siam will gain access to Japanese infrastructure development, technological assistance, and continental trade routes."
 JAP_Invest_in_Ho_Ni_Tank_Destroyers: "Invest in Ho-Ni Tank Destroyers"
 JAP_Invest_in_Experimental_SR_Amphibious_Tanks: "Invest in Experimental SR Amphibious Tanks"
 JAP_Allocate_Spare_Resources_to_the_Kwangtung_Army: "Allocate Spare Resources to the Kwangtung Army"
 JAP_Allocate_Spare_Resources_to_the_SNLF: "Allocate Spare Resources to the SNLF"
 JAP_Yen_Bloc: "Yen Bloc"
 JAP_Yen_Bloc_desc: "Seeking economic independence from Western powers and greater integration across its expanding sphere of influence, Japan has launched the Yen Bloc, a self-contained financial system designed to unite East Asia under a single economic framework. By pegging the currency to the yen, this member's industry is harnessed to the Empire's needs: civilian consumption is curtailed in favour of accelerated construction and war production."
 JAP_siam_exhibition_output: "Japanese Exhibition Street"
 JAP_siam_exhibition_output_desc: "The grand exhibition in Bangkok has showcased the Empire's industrial methods to Siamese workshops and engineers, lifting factory output across the kingdom."
 JAP_geacps.1.t: "The Greater East Asia Co-Prosperity Sphere"
 JAP_geacps.1.d: "§ODai Tōa Kyōeiken§! - the Greater East Asia Co-Prosperity Sphere - is born. Under the Emperor's banner, Japan and Manchukuo stand as the first pillars of a new Asian order, free from the chains of Western imperialism. The resources and manpower of a liberated East shall flow to the cause, and in time every Asian nation shall take its place beneath the one roof of §OHakkō Ichiu§!."
 JAP_geacps.1.a: "Asia for the Asiatics."
 JAP_Enable_Yen_Bloc: "§YThe foundation of the Yen Bloc is laid into place.§!"
 JAP_behead_the_dragon_warning_tt: "§RNote:§! This focus will §Yauto-complete the moment China and Japan go to war§!. If that happens, the §Rairfield, supply hub and railway upgrades are §Onot§! built§! - they are only constructed if you complete this focus §Gmanually§!."
 JAP_prepare_manchuria_warning_tt: "§RNote:§! This focus will §Yauto-complete the moment China and Japan go to war§!. If that happens, the §Rairfield, supply hub and railway upgrades are §Onot§! built§! - they are only constructed if you complete this focus §Gmanually§!."
 JAP_prepare_manchuria_unlock_tt: "§GUnlocks§! the §YManchurian Border Preparations§! decisions - fortify the frontier, build forward airfields and rail, and arm Manchukuo §Wbefore§! war with China erupts.\n§RThese decisions are no longer available once the war with China begins.§!"
 JAP_manchurian_preparations: "Manchurian Border Preparations"
 JAP_manchuria_railways_and_hub: "Extend the Rail Net & Forward Supply Hub"
 JAP_manchuria_railways_and_hub_desc: "Upgrade the Beijing-Hsinking corridor to heavy gauge and raise a forward supply hub on the frontier, ready to feed the armies the moment the offensive opens. §RUses 5 civilian factories for the duration.§!\n§RThese decisions are no longer available once the war with China begins.§!"
 JAP_manchuria_border_forts: "Fortify the China Border"
 JAP_manchuria_border_forts_desc: "Throw up a belt of §Ylevel-5 land forts§! across every Japanese and Manchukuoan state facing China. §RUses 5 civilian factories for the duration.§!\n§RThese decisions are no longer available once the war with China begins.§!"
 JAP_manchuria_border_airfields: "Forward Airfields on the Frontier"
 JAP_manchuria_border_airfields_desc: "Lay down §Ylevel-5 airfields§! across the border states so the air fleets can range over China from the first day. §RUses 5 civilian factories for the duration.§!\n§RThese decisions are no longer available once the war with China begins.§!"
 JAP_manchuria_arms_shipment: "Arm the Manchukuoan Army"
 JAP_manchuria_arms_shipment_desc: "Ship Manchukuo a stockpile to equip its forces: §Y10,000§! rifles, §Y4,000§! squad weapons, §Y1,500§! support equipment, §Y25§! trains and §Y700§! trucks.\n§RUses 5 civilian factories for the duration.§!\n§RThese decisions are no longer available once the war with China begins.§!"

 # ===== Konoe leader traits & The Melancholy Prince stage events =====
 JAP_melancholy_prince_1:0 "The Melancholy Prince"
 JAP_melancholy_prince_1_desc:0 "The prince returns at the height of his standing. Head of the house of regents, he carries the political capital of a man the nation still believes in, and for now the restless melancholy that has always followed him is held at bay."
 JAP_melancholy_prince_2:0 "The Melancholy Prince"
 JAP_melancholy_prince_2_desc:0 "Born under the sign of Libra and prone to frequent swings of mood, the prince feels the old restlessness creeping back. The fire of his return dims, though he governs still."
 JAP_melancholy_prince_3:0 "The Melancholy Prince"
 JAP_melancholy_prince_3_desc:0 "As he has all his life, the prince retreats behind his fragile health when hard decisions loom. He withdraws to his villa, vacillates, and pleads illness while his ministers wait. The journals revive the old nickname: the melancholic prince."
 JAP_melancholy_prince_4:0 "The Melancholy Prince"
 JAP_melancholy_prince_4_desc:0 "The melancholy has hardened into paralysis. Nervous and exhausted, his famous weak will now a byword among journalists and analysts, the prince reigns over his cabinet in name while his resolve crumbles beneath him."

 JAP_ija_connections:0 "IJA Connections"
 JAP_ija_connections_desc:0 "Tojo carries the full weight of the Imperial Japanese Army behind him. His ties to the officer corps deliver political capital, cheap military counsel, and a steady flow of command authority."

