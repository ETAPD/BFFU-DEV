 JAP_mangyo_collab_man_tt:0 "Manchukuo's §YIndustrial Behemoth§! is adjusted:\n $modifier_production_speed_arms_factory_factor$: §G+10.0%§!"
 JAP_reform_bureaucrats_cap_tt:0 "$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+10.0%§!"
 JAP_reform_bureaucrats_output_tt:0 "$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+15.0%§!"
 JAP_sakura_blooms_tt:0 "§YManchukuo§! adopts §YTotal Mobilisation§!"
 JAP_economic_integration:0 "Economic Integration"
 JAP_deploying_investments_in_korea:0 "Deploying Investments in Korea"
 JAP_deploying_investments_in_korea_desc:0 "A concentrated year-long drive to weld the Korean economy to the home islands. Ten civilian factories are committed to the effort, and once it runs its course the peninsula will finally cease resisting integration."

 JAP_rework.20.t:0 "The Prince Returns"
 JAP_rework.20.desc:0 "Prince Fumimaro Konoe, head of the most prestigious noble house in the Empire, takes up the premiership once more. Tall, aristocratic and still trusted by the nation, he returns with a burst of purpose and the prestige of the Fujiwara behind him. For now, the shadow that has always followed him is nowhere to be seen."
 JAP_rework.20.a:0 "Asia turns to the Prince once more"

 JAP_rework.21.t:0 "Old Shadows Stir"
 JAP_rework.21.desc:0 "The energy of his return begins to fade. Born under the sign of Libra, the Prince has always been prone to frequent swings of mood, and the weight of office stirs the old restlessness. He governs still, but observers mark the first signs of the man they once called weak of will."
 JAP_rework.21.a:0 "He carries on"

 JAP_rework.22.t:0 "The Melancholic Prince"
 JAP_rework.22.desc:0 "When hard decisions press upon him, Konoe does as he has done all his life: he pleads ill health and withdraws. From his villa he vacillates while ministers wait upon a word that does not come. The journals revive the old name, the melancholic prince, and the cabinet drifts."
 JAP_rework.22.a:0 "Let the Prince rest"

 JAP_rework.23.t:0 "A Will That Will Not Hold"
 JAP_rework.23.desc:0 "The melancholy has become paralysis. Nervous, exhausted and increasingly excitable, the Prince reigns over his government in name while his resolve crumbles beneath him. His weak will, long a byword among journalists and analysts, has become a fact of state, and in the silence he leaves the militarists begin to circle."
 JAP_rework.23.a:0 "A prince adrift"
 JAP_manchuria_uses_5_civ_tt:0 "§RUses 5 civilian factories while this decision is active.§!"
 JAP_surprise_invasion:0 "Surprise Invasion"
 JAP_surprise_invasion_desc:0 "The opening blow against China has thrown our own armies into the chaos of a hurried offensive. Until order is restored the troops attack with less coordination, plan poorly, bleed their veterans and recover their strength more slowly."
 JAP_behead_the_dragon_tt:0 "§YIf completed before the war with China§!, this cripples the enemy the moment the offensive opens:\n§G- China cannot use its industrial evacuation decisions§!\n§G- China receives no foreign volunteers for 90 days§!\n§G- Japan's §YSurprise Invasion§! penalty lasts 90 days instead of 180§!\n\n§RIf the war with China begins before this focus is completed, it auto-completes and none of these rewards are granted.§!"

 # ===== China-war escalation: Kwantung missions, Imperial Directive 501, focus tooltips =====
 JAP_imperial_directive_501:0 "Imperial Directive 501"
 JAP_imperial_directive_501_desc:0 "The Empire commits to total escalation in China. The army strikes with renewed ferocity until the enemy is broken. Lasts until China capitulates."
 JAP_kwantung_escalation:0 "§REscalation in China§!"
 JAP_take_nanjing_mission:0 "Take Nanjing"
 JAP_take_nanjing_mission_desc:0 "§WThe high command wants §CNanjing§!, the enemy capital, taken between §8January and March 1938§!. Taking it sooner carries no penalty. If it still holds at the end of March, we lose §R-7.5% stability§! and §CNanjing§! gains §YKwantung Desires§! (§G+10% attack, +10% breakthrough§!).§!"
 JAP_take_guangzhou_mission:0 "Take Guangzhou"
 JAP_take_guangzhou_mission_desc:0 "§WTake the southern port of §CGuangzhou§! between §8April and August 1938§!. Taking it before March raises §R+5% world tension§!; taking it on time, only §R+2%§!. If it holds past August, we lose §R-7.5% stability§! and §CGuangzhou§! gains §YKwantung Desires§! (§G+10% attack, +10% breakthrough§!).§!"
 JAP_take_wuhan_mission:0 "Take Wuhan"
 JAP_take_wuhan_mission_desc:0 "§WTake §CWuhan§!, where the Kuomintang have made their stand, between §8July and September 1938§!. Taking it before June raises §R+5% world tension§!; on time, only §R+2%§!. If it holds past September, we lose §R-7.5% stability§! and §CWuhan§! gains §YKwantung Desires§! (§G+10% attack, +10% breakthrough§!).§!"
 JAP_take_chongqing_mission:0 "Take Chongqing"
 JAP_take_chongqing_mission_desc:0 "§WTake §CChongqing§!, Chiang's wartime capital, between §8January and March 1939§!. Reaching it before the new year raises §R+30% world tension§!. If it holds past March, we lose §R-7.5% stability§! and §CChongqing§! gains §YKwantung Desires§! (§G+10% attack, +10% breakthrough§!).§!"
 JAP_china_war_declare_tt:0 "§WThe war with China begins on §C29 December 1937§!.§!"
 JAP_kwantung_escalation_tt:0 "§WAs China's great cities are taken, objectives open under the §REscalation in China§! decisions. Each has a window the high command wants it taken in:\n§C Nanjing§! §8Jan - Mar 1938§!\n§C Guangzhou§! §8Apr - Aug 1938§!\n§C Wuhan§! §8Jul - Sep 1938§!\n§C Chongqing§! §8Jan - Mar 1939§!\n\nTaking a city §Rbefore§! its window raises world tension - Guangzhou and Wuhan by §R+5%§! (§R+2%§! if taken on time), Chongqing by §R+30%§!. Miss a window entirely and that front loses §R-7.5% stability§! but gains §YKwantung Desires§! (§G+10% attack, +10% breakthrough§!).§!"
 JAP_imperial_directive_501_tt:0 "§YImperial Directive 501§!: total escalation of the China war (§G+25% attack, +15% breakthrough, +15% experience loss§!). Lasts until China capitulates."
 JAP_kwantung_desires:0 "§YKwantung Desires§!"
 faction_manifest_co_prosperity_sphere_name:0 "Hakko Ichiu: The World Under One Roof"
 faction_manifest_co_prosperity_sphere_desc:0 "The Dai Toa Kyoeiken exists to free the peoples of East Asia from Western imperialism and unite them under the Emperor's banner. Each member nation gives its resources, industry and manpower to the common cause, that all of Asia may one day stand free beneath a single roof."
 JAP_hirohito:0 "Emperor Hirohito"
 JAP_hirohito_desc:0 "The Showa Emperor, sacred and inviolable, stands at the heart of the Empire. His person binds the nation in loyalty and steels its resolve for the trials ahead."
 JAP_hirohito_amnesty:0 "Emperor Hirohito"
 JAP_hirohito_amnesty_desc:0 "With the amnesty for political prisoners proclaimed in his name, the Showa Emperor stands revealed as a unifying reconciler as much as a sacred sovereign. His person binds the nation in loyalty and steels its resolve for the trials ahead."
 JAP_desire_for_a_new_political_system:0 "Desire for a New Political System"
 JAP_desire_for_a_new_political_system_desc:0 "With the old party politics discredited, voices across the Empire clamour for a new order: a single mass movement to replace the squabbling Diet. Until the question is settled, the government is paralysed and the drift toward one-party rule accelerates."
