 JAP_zaibatsu_nissan_motorization_contracts: "Nissan Motorization Contracts"
 JAP_zaibatsu_nissan_motorization_contracts_desc: "Aikawa Yoshisuke's Nissan combine builds trucks and vehicles for the Army. The generals favor the ambitious newcomer over the old houses."
 JAP_zaibatsu_nissan_motorization_contracts_tt: "§YMotorized Equipment§! build cost: §G-5.0%§!, gain §G500§! Motorized Equipment"
 JAP_zaibatsu_nissan_mangyo: "Aikawa's Manchurian Gambit"
 JAP_zaibatsu_nissan_mangyo_desc: "Aikawa is prepared to move the entire Nissan combine to Manchukuo and take over industrial development of the puppet state - a project the Kwantung Army enthusiastically backs, and the old zaibatsu deeply resent."
 JAP_zaibatsu_nissan_mangyo_tt: "$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+2.0%§!"
 JAP_zaibatsu_nissan_mangyo_man_tt: "Manchukuo's §YIndustrial Behemoth§!: Local Resources §G+5.0%§!"
 JAP_zaibatsu_nakajima_aircraft_contracts: "Nakajima Aircraft Contracts"
 JAP_zaibatsu_nakajima_aircraft_contracts_desc: "Nakajima Hikoki is the Army's favored aircraft maker, run by the fiercely nationalist Nakajima Chikuhei. Contracts sharpen their production lines."
 JAP_zaibatsu_nakajima_aircraft_contracts_tt: "$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+7.5%§!, §YAircraft§! Research Speed: §G+50.0%§! (one use)"
 JAP_zaibatsu_nakajima_ota_plant: "Expand the Ota Plant"
 JAP_zaibatsu_nakajima_ota_plant_desc: "Nakajima's home factory at Ota in Gunma prefecture can be expanded into one of the largest aircraft plants in the world."
 JAP_zaibatsu_nakajima_ota_plant_tt: "§G+4§! Military Factories in Kanto"
 JAP_zaibatsu_nissan_cheap_trucks:0 "Nissan Cheap Trucks"
 JAP_zaibatsu_nissan_cheap_trucks_desc:0 "Nissan's mass-production lines have driven down the cost of building motorized equipment."
 JAP_zaibatsu_yasuda_bond_bonus:0 "Bond Drive"
 JAP_zaibatsu_yasuda_bond_bonus_desc:0 "A fresh issue of Yasuda-backed government bonds is easing the treasury's burden."
 JAP_zaibatsu_yasuda_industrial_loans_bonus:0 "Industrial Loans"
 JAP_zaibatsu_yasuda_industrial_loans_bonus_desc:0 "Cheap Yasuda credit is expanding industry, though servicing the debt weighs on public confidence."

 # National-objective demand events (51-58 success, 61-68 failure)
 jap_zaibatsu.demand.ok:0 "Understood"
 JAP_zaibatsu_demand_success_tt:0 "§GThe national objective was met in time.§!"
 JAP_zaibatsu_demand_failure_tt:0 "§RThe deadline passed without the objective being met.§!"

 jap_zaibatsu.51.t:0 "Nissan's Manchurian Ambition"
 jap_zaibatsu.51.d:0 "Aikawa's gamble on Manchuria has paid off - Mangyo stands, or Manchukuo's own industry has grown regardless. Nissan's faith in the frontier is vindicated."
 jap_zaibatsu.61.t:0 "Nissan's Manchurian Ambition Falters"
 jap_zaibatsu.61.d:0 "Neither Mangyo nor Manchukuo's own research establishment has materialised. Aikawa's Manchurian vision looks like empty promises."

 jap_zaibatsu.52.t:0 "The Mobilization Law Delivered"
 jap_zaibatsu.52.d:0 "The National Mobilization Law is now the law of the land. Mitsui and Sumitomo see their compliance rewarded."
 jap_zaibatsu.62.t:0 "The Mobilization Law Stalls"
 jap_zaibatsu.62.d:0 "The National Mobilization Law was never enacted in time. Mitsui and Sumitomo grow openly resentful of the wasted effort."

 jap_zaibatsu.53.t:0 "The Fighter Contract Fulfilled"
 jap_zaibatsu.53.d:0 "The Army Air Service's fighter squadrons are fully equipped. Mitsubishi and Nakajima have delivered as promised."
 jap_zaibatsu.63.t:0 "The Fighter Contract Unfulfilled"
 jap_zaibatsu.63.d:0 "The fighter squadrons remain under-strength. Mitsubishi and Nakajima have failed to deliver."

 jap_zaibatsu.54.t:0 "The New Economic Structure Adopted"
 jap_zaibatsu.54.d:0 "The New Economic Structure is now in force. Yasuda and Mitsubishi's faith in the reform is rewarded."
 jap_zaibatsu.64.t:0 "The New Economic Structure Abandoned"
 jap_zaibatsu.64.d:0 "The New Economic Structure never took hold. Yasuda and Mitsubishi feel misled."

 jap_zaibatsu.55.t:0 "The Yen Bloc Secured"
 jap_zaibatsu.55.d:0 "A Yen Bloc now anchors the Empire's trade against the embargo. Mitsui's confidence in the government is renewed."
 jap_zaibatsu.65.t:0 "The Yen Bloc Fails to Form"
 jap_zaibatsu.65.d:0 "No Yen Bloc has been established. Mitsui watches the embargo bite with growing alarm."

 jap_zaibatsu.56.t:0 "The Munitions Ministry's Targets Met"
 jap_zaibatsu.56.d:0 "300 military factories now stand ready. Mitsui and Yasuda's investment in the war economy is vindicated."
 jap_zaibatsu.66.t:0 "The Munitions Ministry's Targets Missed"
 jap_zaibatsu.66.d:0 "Military factory output has fallen well short of 300. Mitsui and Yasuda question where their capital has gone."

 jap_zaibatsu.57.t:0 "Manchukuo's Industry Matures"
 jap_zaibatsu.57.d:0 "Manchukuo's factory count has passed 200. Nissan's stake in the puppet state's development is finally paying off."
 jap_zaibatsu.67.t:0 "Manchukuo's Industry Stagnates"
 jap_zaibatsu.67.d:0 "Manchukuo's industrial base has failed to grow. Nissan's Manchurian venture looks increasingly hollow."

 jap_zaibatsu.58.t:0 "Steel for Engines Delivered"
 jap_zaibatsu.58.d:0 "Nakajima's engine works have matured and Sumitomo's steel keeps flowing to them. The partnership is bearing fruit."
 jap_zaibatsu.68.t:0 "Steel for Engines Falls Short"
 jap_zaibatsu.68.d:0 "Neither Nakajima's engine works nor the excavation programme have matured enough. Sumitomo and Nakajima's partnership is fraying."
