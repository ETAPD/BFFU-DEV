 JAP_island_hopping_reference:0 "Theatre Map: Island Hopping"
 JAP_island_hopping_reference_desc:0 "The war bonus that rises and falls with the islands held on the control map. Read-only; hover to see what each captured island is worth."
 JAP_island_hopping_reference_tt:0 "§YIsland Hopping§! scales with the islands Japan holds. As the front advances the Empire's industry and resolve climb; as it is driven back they crumble. Milestone tiers, weakest to strongest:"
 JAP_yen_block_lock_tt:0 "Adopt the §YYen Block§! trade law. While it stands, Japan §Rcannot change its trade law until 1 January 1942§!."
 JAP_yen_block_tripartite_tt:0 "Upgrade the §YYen Block§! to extend preferential trade to §YGermany§! and §YItaly§!."
 JAP_hayashi_term_tt:0 "§HSenjuro Hayashi§! leads the cabinet from §Y2 February 1937§! until §Y5 June 1937§!."
 JAP_konoe_first_term_tt:0 "§HFumimaro Konoe§! leads his first cabinet from §Y5 June 1937§! until §Y5 January 1939§!."
 JAP_hiranuma_term_tt:0 "§HKiichiro Hiranuma§! leads the cabinet from §Y5 January 1939§! until §Y30 August 1939§!."
 JAP_konoe_second_term_tt:0 "§HFumimaro Konoe§! returns to lead his second cabinet from §Y30 August 1939§! until §Y1 January 1941§!."
 JAP_tojo_term_tt:0 "§HHideki Tojo§! leads the cabinet from §Y1 January 1941§! onward."
