 JAP_zaibatsu_grant_concessions_sumitomo_desc: "Tax relief, contract guarantees, and a public bow to the house's dignity."
 JAP_zaibatsu_grant_concessions_yasuda: "Grant Concessions to Yasuda"
 JAP_zaibatsu_grant_concessions_yasuda_desc: "Tax relief, contract guarantees, and a public bow to the house's dignity."
 JAP_zaibatsu_grant_concessions_nissan: "Grant Concessions to Nissan"
 JAP_zaibatsu_grant_concessions_nissan_desc: "Capital injections, army contracts, and a freer hand in Manchuria."
 JAP_zaibatsu_grant_concessions_nakajima: "Grant Concessions to Nakajima"
 JAP_zaibatsu_grant_concessions_nakajima_desc: "Steel allocations, engine contracts, and a seat at the procurement table."
 JAP_zaibatsu_appease_mitsui: "Appease Mitsui"
 JAP_zaibatsu_appease_mitsui_desc: "Settle the dispute on the house's terms and end the obstruction."
 JAP_zaibatsu_appease_mitsubishi: "Appease Mitsubishi"
 JAP_zaibatsu_appease_mitsubishi_desc: "Settle the dispute on the house's terms and end the obstruction."
 JAP_zaibatsu_appease_sumitomo: "Appease Sumitomo"
 JAP_zaibatsu_appease_sumitomo_desc: "Settle the dispute on the house's terms and end the obstruction."
 JAP_zaibatsu_appease_yasuda: "Appease Yasuda"
 JAP_zaibatsu_appease_yasuda_desc: "Settle the dispute on the house's terms and end the obstruction."
 JAP_zaibatsu_appease_nissan: "Appease Nissan"
 JAP_zaibatsu_appease_nissan_desc: "Settle the dispute on the combine's terms and end the obstruction."
 JAP_zaibatsu_appease_nakajima: "Appease Nakajima"
 JAP_zaibatsu_appease_nakajima_desc: "Settle the dispute on the company's terms and end the obstruction."
 JAP_reorganize_the_war_economy: "Reorganize the War Economy"
 JAP_reorganize_the_war_economy_desc: "The Empire's industry must serve the military first. Establishing central direction over the zaibatsu opens the door to a managed economy - and to playing the great houses against one another."
 JAP_empower_the_shinko_zaibatsu: "Empower the Shinko Zaibatsu"
 JAP_empower_the_shinko_zaibatsu_desc: "The new combines - Nissan and Nakajima - owe their fortunes to military contracts, not inherited wealth. Favour them over the conservative Big Four and bind capital to the army's needs."
 JAP_motorize_the_army: "Motorize the Army"
 JAP_motorize_the_army_desc: "Nissan's automobile works retool for military trucks and tractors, dragging the Imperial Army into the age of the engine."
 JAP_found_mangyo_focus: "Collaborate with Mangyo"
 JAP_found_mangyo_focus_desc: "Manchukuo has already raised the Manchurian Industrial Development Company on its own. Rather than duplicate the effort, Ayukawa's Nissan combine will partner directly with Mangyo, binding the two war economies together and channelling the arsenal of the continent back toward the home islands."
 JAP_aircraft_for_the_empire: "Aircraft for the Empire"
 JAP_aircraft_for_the_empire_desc: "Nakajima moves from licensed assembly to original design. The Ota plant will pour out warplanes for the coming struggle."
 JAP_break_the_old_houses: "Break the Old Houses"
 JAP_break_the_old_houses_desc: "The Big Four have grown fat on the Empire's blood. Strip them of their privileges and seize their assets for the war machine - they will not forgive it, and they will fight back."
 JAP_the_military_industrial_order: "The Military-Industrial Order"
 JAP_the_military_industrial_order_desc: "Capital and the sword are now one. The new economic order answers to the General Staff alone, and the factories of the Empire run day and night."
 JAP_zaibatsu_economy_unlocked_tt: "§YUnlocks the §HThe Zaibatsu§! decision category§!"
 JAP_shinko_zaibatsu_unlocked_tt: "§YUnlocks the §HNissan§! and §HNakajima§! investment decisions§!"
 JAP_mangyo_unlocked_tt: "§YUnlocks the §HFound the Manchurian Industrial Development Company§! decision§!"
 JAP_nakajima_ota_unlocked_tt: "§YUnlocks the §HExpand the Ota Plant§! decision§!"
 JAP_zaibatsu_rivalry_active_tt: "§RThe great houses begin to make demands of the state§!"
 JAP_zaibatsu_big4_minus20_tt: "§RMitsui, Mitsubishi, Sumitomo and Yasuda favour: -20§!"
 JAP_accommodate_the_big_four: "Accommodate the Big Four"
 JAP_accommodate_the_big_four_desc: "Mitsui, Mitsubishi, Sumitomo and Yasuda built modern Japan. Work with the great houses rather than against them - their goodwill is worth more than the army's ambitions."
 JAP_the_zaibatsu_banks: "The Zaibatsu Banks"
 JAP_the_zaibatsu_banks_desc: "The financial arms of Mitsui and Yasuda underwrite the state's ambitions, smoothing the flow of capital to where it is needed."
 JAP_heavy_industry_partnership: "Heavy Industry Partnership"
 JAP_heavy_industry_partnership_desc: "Mitsubishi and Sumitomo are given a free hand in shipbuilding and metals, and they reward the Empire with steel and hulls."
 JAP_the_trading_houses: "The Trading Houses"
 JAP_the_trading_houses_desc: "Mitsui Bussan and the other sogo shosha extend the Empire's commercial reach across Asia, securing raw materials and shipping."
 JAP_cartel_agreements: "Cartel Agreements"
 JAP_cartel_agreements_desc: "Formal cartels let the great houses divide markets and police themselves. With their interests secured, the zaibatsu will no longer obstruct the war economy."
 JAP_partnership_of_throne_and_capital: "Partnership of Throne and Capital"
 JAP_partnership_of_throne_and_capital_desc: "Throne, state and capital move as one. The conservative order endures, and the factories of the Empire hum with confident, well-funded industry."
 JAP_zaibatsu_cartel_tt: "§GThe zaibatsu will no longer obstruct the war economy (no obstruction events)§!"
 JAP_zaibatsu_mitsubishi_superheavy_shipyard: "Mitsubishi Super-Heavy Shipyard"
 JAP_zaibatsu_mitsubishi_superheavy_shipyard_desc: "Mitsubishi Heavy Industries expands its Nagasaki yards to slipways capable of building the largest warships afloat."
 JAP_zaibatsu_mitsubishi_superheavy_shipyard_tt: "Builds §Y8 dockyards§! in Kyushu"
 JAP_zaibatsu_sumitomo_light_metals_combine: "Sumitomo Light Metals Combine"
 JAP_zaibatsu_sumitomo_light_metals_combine_desc: "Sumitomo consolidates aluminium smelting and alloy production into a single combine, easing the Empire's chronic light-metals shortage."
 JAP_zaibatsu_sumitomo_light_metals_combine_tt: "$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-10.0%§!, §G+300 Aluminium§! in Shikoku"
 JAP_zaibatsu_mitsui_keiretsu_expansion: "Mitsui Keiretsu Expansion"
 JAP_zaibatsu_mitsui_keiretsu_expansion_desc: "The Mitsui combine extends its reach across every sector of the economy, from mining to manufacturing to shipping."
 JAP_zaibatsu_mitsui_keiretsu_expansion_tt: "Builds §Y5 civilian factories§! in Tokushima, gain §G150§! convoys"
 JAP_zaibatsu_mitsubishi_favor_50_tt: "§HMitsubishi§! favour is §Y50§! or higher"
 JAP_zaibatsu_sumitomo_favor_50_tt: "§HSumitomo§! favour is §Y50§! or higher"
 JAP_zaibatsu_mitsui_favor_50_tt: "§HMitsui§! favour is §Y50§! or higher"

 #################### HIROTA ERA - February 26 Incident ####################
 JAP_niniroku_jiken: "The February 26 Incident"
 JAP_niniroku_jiken_desc: "Before dawn on 26 February 1936, young officers of the Kodoha faction led some 1,400 soldiers in a revolt in central Tokyo, assassinating senior statesmen in a bid for a 'Showa Restoration'. The uprising would be crushed within days - but it would reshape the government and bring Hirota Koki to power."
 JAP_niniroku_jiken_occurred_tt: "§RThe February 26th Incident has occurred.§! The uprising runs its bloody course - this is a matter of history, not choice."

 JAP_kokiscabinetforms: "Koki's Cabinet Forms"
 JAP_kokiscabinetforms_desc: "With the rebels suppressed and Okada's government discredited, Hirota Koki assembles a new cabinet - one that must satisfy both the Diet and an emboldened military if it is to survive."
 JAP_hirota_limited_time_tt: "§RHirota Koki's cabinet is living on borrowed time.§!\n§RThis branch is only available until §Y2 February 1937§!.§!\n§RAfter that date the connected reforms are locked, Hirota is forced from office, and General Senjuro Hayashi takes power.§!"

 JAP_hirotaoutoftime: "Hirota Out of Time"
 JAP_hirotaoutoftime_desc: "Caught between the irreconcilable demands of the military and the Diet, Hirota's coalition has collapsed. His reform window has closed."
 JAP_hirota_has_failed_tt: "§RHirota Koki has run out of time. His cabinet collapses and General Senjuro Hayashi is called upon to form a government.§!"

 JAP_hayashi_enters_office: "Hayashi Enters Office"
 JAP_hayashi_enters_office_desc: "The aged general Senjuro Hayashi forms a short-lived cabinet, leaning ever harder on the army for support."

 JAP_remnants_of_the_coup: "Remnants of the Coup"
 JAP_remnants_of_the_coup_desc: "The bloody suppression of the February 26 Incident has left Tokyo tense and the government on edge. Order has been restored - but trust has not, and the capital remains uneasy."

 #################### HIROTA ERA - Events ####################
 JAP_rework.1.t: "The February 26 Incident"
 JAP_rework.1.desc: "In the pre-dawn snow of 26 February 1936, some fourteen hundred soldiers of the First Division - led by young Kodoha officers - have seized central Tokyo. They have cut down ministers in their own homes in the name of a 'Showa Restoration', demanding the purge of the Emperor's 'corrupt advisors'.\n\nThe Emperor is said to be incandescent with rage and has ordered the rebels crushed. The cabinet of Keisuke Okada lies in ruins. When the smoke clears, it will fall to Hirota Koki to restore order to a shaken nation."
 JAP_rework.1.a: "The rebellion must be put down."
 JAP_rework.2.t: "Hirota's Cabinet Falls"
 JAP_rework.2.desc: "Caught between the relentless demands of the military and a resentful Diet, the government of Hirota Koki has finally collapsed under the strain. With his coalition gone, the aged general Senjuro Hayashi is summoned to form a new cabinet - one that will lean still further on the army."
 JAP_rework.2.a: "Hirota's time is up."
 JAP_kiichiro_hiranuma: "Kiichiro Hiranuma"

 #################### HIROTA ERA - Economic Reforms ####################
 JAP_rework.100.t: "Education Programs Succeed"
 JAP_rework.100.desc: "The reforms pressed by the Kyōiku Kaigi council have borne fruit. A generation of scientists, engineers and technicians now flows from Japan's expanded universities and technical schools into the service of the Empire."
 JAP_rework.100.a: "Our investment in education has paid off."

 JAP_education_reforms: "Education Reforms"
 JAP_education_reforms_desc: "The Kyōiku Kaigi council drives a sweeping reform of Japanese education, pouring resources into the sciences and technical training."
 JAP_education_programs_success: "Education Programs Success"
 JAP_education_programs_success_desc: "Years of educational investment have built a deep bench of scientific and technical talent serving the Empire."





 # - Cabinet-transition focus tooltips -
 JAP_ichiyoraifuk_tt: "§YFumimaro Konoe§! forms his first cabinet as §YPrime Minister§!."
 JAP_hiranuma_cabinet_forms_tt: "§YKiichiro Hiranuma§! forms a cabinet as §YPrime Minister§!."
 JAP_the_prince_returns_tt: "§YPrince Fumimaro Konoe§! returns to form his second cabinet as §YPrime Minister§!."
 JAP_tojo_outmaneuvers_konoe_tt: "§YHideki Tojo§! outmaneuvers Konoe and becomes §YPrime Minister§!."
 JAP_increase_taxes: "Increase Taxes"
 JAP_increase_taxes_desc: "War-footing taxation squeezes the public to fund production. A temporary measure - heavier consumer-goods burden in exchange for greater factory output."
 JAP_Hakko_Ichiu_desc: "Emperor Jimmu, a descendant of Susanoo, Amaterasu, and sovereign of Yamato, became the first legendary emperor of the Rising Sun thousands of years ago. As he ascended to the throne, he uttered the following phrase: \"Hakkō wo ooute ie to nasan\", which means \"I shall cover the eight directions and make them my abode\". This statement put forward by our legendary forefather only grounds the fact that Nihon's destiny of expansion lies not in petty concepts like nationalism or mere jingoism but hinges on fate itself. The imperial rule is divinely ordained to encompass all eight corners of the world, and every single officer in the IJA must know this fact!"
 add_hakko_ichiu_changes_tt: "§YHakko Ichiu§! strength will be §Ymodified§! by [?hakko_ichiu_progress_to_add|+=0].\n"
 JAP_hakkoichiu_setup_tt: "Proclaims §YHakkō Ichiu§! and opens the §YGreater East Asian Co-Prosperity Sphere§! decision tab.\nHigher strength: §G+War Support, Output, Resources, Conscription§!. §R-Stability, -Political Power, -Research Speed, +Resistance§! in occupied states.\n"
 JAP_Hakko_Ichiu_0: "Hakko Ichiu"
 JAP_Hakko_Ichiu_0_desc: "Hakkō Ichiu - \"Eight Corners of the World Under One Roof\" - is a guiding principle of Japanese state ideology, originating from ancient imperial legends and revived as a rallying cry for national unity and expansion. It speaks of a divine destiny: Japan, under Emperor Showa's benevolent rule, must bring the world's peoples together in harmony. Hakkō Ichiu has become prevalent in political speeches, military doctrine, and school textbooks. It justifies both Japan's internal cohesion and its external campaigns by presenting our conquest as a civilising mission. According to this principle, Japan's expansion is not aggressive, but rather liberating, bringing the light of the Emperor's guidance to the world's darkest corners."
 JAP_Hakko_Ichiu_1: "Hakko Ichiu"
 JAP_Hakko_Ichiu_1_desc: "Hakkō Ichiu - \"Eight Corners of the World Under One Roof\" - is a guiding principle of Japanese state ideology, originating from ancient imperial legends and revived as a rallying cry for national unity and expansion. It speaks of a divine destiny: Japan, under Emperor Showa's benevolent rule, must bring the world's peoples together in harmony. Hakkō Ichiu has become prevalent in political speeches, military doctrine, and school textbooks. It justifies both Japan's internal cohesion and its external campaigns by presenting our conquest as a civilising mission. According to this principle, Japan's expansion is not aggressive, but rather liberating, bringing the light of the Emperor's guidance to the world's darkest corners."
