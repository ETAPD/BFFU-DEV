 JAP_a150_class:0 "A-150 Programme"
 JAP_a150_class_desc:0 "The §YA-150§!, the ultimate battleship - a super-heavy hull beyond even the Yamato. While the programme runs, super-heavy battleships are cheaper to build and the fleet repairs faster, at the cost of political capital."
 JAP_a150_spawn_tt:0 "Lay down §G3§! Super Heavy Battleships in the naval production queue, half complete."
 JAP_azuma_class:0 "Azuma Class"
 JAP_azuma_class_desc:0 "A new heavy cruiser design with §G+15%§! heavy gun attack and §G+15%§! heavy gun armour piercing."
 JAP_island_defences_tt:0 "Fortify the Pacific mandate:\n§YOkinawa, Iwo Jima, Marcus Island, Palau and Truk Atoll§! gain §Glevel 7§! air bases, and §YSaipan§! a §Glevel 4§! air base.\nAll mandate islands gain §Glevel 3§! anti-air and §Glevel 3§! coastal forts."
 JAP_test_the_soviets_tt:0 "§YProbe Soviet defences along the Manchurian frontier.§!\nWorld tension rises and §Rrelations with the Soviet Union§! sour, but the clash bloodies the army and sharpens its land doctrine."
 JAP_provoked_border_clash:0 "Provoked a Border Clash"
 JAP_german_legal_reforms:0 "German Legal Reforms"
 JAP_german_legal_reforms_desc:0 "Japan has remodelled its statutes on the German pattern. The upheaval rattles domestic stability, but the shared legal framework smooths commerce between Tokyo and Berlin, letting the two empires trade far more freely with each other."
 GER_japanese_legal_alignment:0 "Japanese Legal Alignment"
 GER_japanese_legal_alignment_desc:0 "Tokyo has adopted German legal norms, harmonising commercial law between the two empires and opening the way for much greater trade with the Empire of Japan."
 JAP_embargoed_by_allies_tt:0 "Japan is §Rembargoed by the United Kingdom or the United States§!"
 JAP_abandon_ties_nap_tt:0 "Sign a §Ynon-aggression pact§! with §YGermany§! and §YItaly§!."
 JAP_abandon_resources_tt:0 "$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+10.0%§!"
 JAP_abandon_output_tt:0 "$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.0%§!"
 JAP_nap_with_ussr_tt:0 "Form a §Ynon-aggression pact§! with the §YSoviet Union§!. The Soviets are shielded from embargo, and both nations gain §G+100§! political power.\nWhile the pact holds §Yneither side can declare war§! on the other. It can only be broken once Japan is §Rat war§! and controls §YHawaii§!, §YNew South Wales§! and §YDelhi§!, after which the truce lapses within a month or two."
 JAP_non_aggression_pact:0 "Non-Aggression Pact"
 JAP_nanshin_war:0 "§CNanshin-ron§!"
 JAP_betray_the_soviets:0 "Betray the Soviet Union"
 JAP_island_convert:0 "Island Convert"
 JAP_island_convert_desc:0 "Raise dedicated island-garrison divisions across the mandate to hold the Pacific perimeter against any Allied counter-landing."
 JAP_island_convert_tt:0 "Raise four §Y40-width Island Convert§! garrison divisions on each mandate/outpost island (Marshall, Caroline, Saipan, Palau, Iwo Jima, Marcus Island, Okinawa) and eighty more spread across the Home Islands. They start at §Yregular experience§! with §Gfull manpower§!, but are §Rnot issued equipment§! and must draw from your stockpile."
 JAP_strike_south:0 "Strike South"
 JAP_strike_south_desc:0 "The hour of the §YSouthern Expansion§! has come. In a single thunderclap we strike the United States, the British Empire and the Netherlands at once, seizing the resources of the south before the enemy can react. §RThis brings their entire factions into the war.§!"
 JAP_tora_tora_countdown:0 "Tora! Tora! Tora!"
 JAP_tora_tora_countdown_desc:0 "The surprise advantage holds for now. It is spent down by time and by every Pacific objective seized; when it expires the §YTora! Tora! Tora!§! spirit lifts."
 JAP_tora_tora_tora_idea:0 "Tora! Tora! Tora!"
 JAP_tora_tora_tora_idea_desc:0 "The surprise has succeeded. For a brief window the Combined Fleet and the southern armies hold a crushing advantage. The momentum fades with time, and every objective seized spends it faster."
 JAP_island_hopping:0 "Island Hopping"
 JAP_island_hopping_desc:0 "The strategic balance in the Pacific. As the Allied island-hopping campaign claws toward the home islands the nation's industry and resolve crumble; driving the enemy back restores the Empire's strength."
 # --- Island Hopping spirit: per-tier "Pacific War" status title + shared mechanic description ---
 JAP_island_hopping_mechanic_list:0 "Island Hopping Mechanic: for every island on the list below that the Empire captures it gains a bonus and the enemy suffers a malus.\n§YGuam\nMidway\nWake Island\nHawaii\nHong Kong\nIwo Jima\nSaipan\nOkinawa\nTruk Atoll\nPapua\nPalau\nTaiwan\nSolomon Islands\nSiam\nCambodia\nSingapore\nBurma§!."
 JAP_island_hopping0:0 "§YThe Pacific War§!: §RLosing§!!"
