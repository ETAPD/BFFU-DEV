 JAP_demand_indochina_focus_tt:0 "Opens the §YDemand Indochina§! decision to extort the colony from a defeated France."
 JAP_strike_the_west_tt:0 "Opens the Pacific war on the §YUS, Britain and the Netherlands§! at once.\nUnleashes §YTora! Tora! Tora!§! and drives the §YIsland Hopping§! and §YState of the Pacific§! spirits as the front advances."
 # --- Festung Europa: state display on Europe's coast + the real penalty on the Allied invaders ---
 JAP_festung_europa_tt:0 "§YFestung Europa§!\n§OThe war in Asia is limiting the Allies' ability to land in Europe.§!\nEvery Pacific island the Empire holds ties down Allied fleets and landing craft, making an amphibious assault on this coast harder to mount.\nJapan currently holds §Y[?global.JAP_festung_islands|0]§! of §Y13§! key islands."
 # --- The Pacific War: the Allies' attack debuff vs the European Axis while fighting Japan ---
 JAP_kwantung_escalation:0 "Kwantung Army Escalation"
 ALLIES_pacific_war:0 "§RThe Pacific War§!"
 ALLIES_pacific_war_desc:0 "Our people expect us to win the war we are fighting against the Empire of the Rising Sun. Abandoning Asia is not an option, and the aggressive war mongers in Tokyo must be stopped at any cost. Letting our allied nations across Asia fall under the grip of the Kempeitai is unthinkable.\nWhile the Pacific bleeds us, we cannot fully commit to the liberation of Europe, and our offensives against the §YEuropean Axis§! suffer for it. This debuff is eroded one level from the start of §Y1942§!, and is fully lifted at the start of §Y1943§! as the nation mobilises for a war on two fronts."
 JAP_operation_an:0 "Operation AN"
 JAP_operation_an_desc:0 "The plan to carry the war to Australia and New Zealand. Swifter, less costly amphibious landings and a marked edge over the defenders of the Antipodes."
 JAP_autarky_resources_tt:0 "$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+15.0%§!"
 JAP_autarky_output_tt:0 "$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+7.5%§!"
 jap_guerrilla.1.t:0 "Guerrilla Operation"
 jap_guerrilla.1.d:0 "Our agents are in position across the Allied rear. We can unleash them against the defences of a single enemy stronghold, gutting its forts, airfields, coastal guns and anti-air batteries in one night of sabotage. Where do we strike?"
 jap_guerrilla.1.a:0 "Hawaii"
 jap_guerrilla.1.b:0 "Calcutta"
 jap_guerrilla.1.c:0 "Batavia"
 JAP_demand_indochina:0 "Demand Indochina"
 JAP_demand_indochina_desc:0 "With France brought to its knees, we will press the rump government to cede §YIndochina§! to the Empire. Tonkin, Laos, Annam and Cambodia will pass under Japanese administration without a shot fired."
 JAP_betray_the_soviets_desc:0 "The Empire stands triumphant across the Pacific. With our southern flank secure, the hour has come to turn north, tear up the pact with Moscow and settle the question of the frontier by force. The Soviet Union will be made to answer for Nomonhan."
 JAP_break_nap_with_SOV:0 "Break the Pact with the Soviet Union"
 JAP_break_nap_with_SOV_desc:0 "The hour has come to turn north. With the Empire triumphant in the south and the Indian subcontinent, the non-aggression pact with Moscow has served its purpose. We renounce it and prepare to settle the question of the frontier by force."
 JAP_break_nap_sov_states_tt:0 "Japan or a faction member controls §YHawaii§!, §YNew South Wales§! and §YDelhi§!"
 JAP_yen_block:0 "Yen Block"
 JAP_yen_block_desc:0 "A closed, yen-denominated trading order for the Empire and its sphere. Only a tenth of Japan's resources reach the open market, but Manchukuo and Siam are bound tightly into the Co-Prosperity economy, trading freely with the home islands."
 JAP_yen_block_tripartite:0 "Yen Block (Tripartite Pact)"
 JAP_yen_block_tripartite_desc:0 "With the Tripartite Pact sealed, the Yen Block reaches across the world. Germany and Italy now enjoy preferential trade with the Empire alongside the continental sphere, knitting the Axis economies together against the Allied blockade."
 # --- Nanshin-ron theatre trackers ---
 JAP_nanshin_war_desc:0 "Though rich, China and Siberia do not possess all the resources we require. Not far away to the south, though, lie the Philippines, the Dutch East Indies and the British colonies of Malaya and Borneo. For true self-sufficiency we must wrest control over these areas away from the European imperialists.\n\nThe National Spirit §YIsland Hopping§! is modified by capturing the following islands:\n\n[ROOT.GetGuamController]\n[ROOT.GetMidwayController]\n[ROOT.GetWakeController]\n[ROOT.GetHawaiiController]\n[ROOT.GetCarolineController]\n[ROOT.GetIwoJimaController]\n[ROOT.GetSaipanController]\n[ROOT.GetOkinawaController]\n[ROOT.GetHongKongController]\n[ROOT.GetSolomonController]\n[ROOT.GetPapuaController]\n[ROOT.GetPalauController]\n[ROOT.GetTaiwanController]\n[ROOT.GetBurmaController]\n[ROOT.GetSingaporeController]\n[ROOT.GetSiamController]\n[ROOT.GetCambodiaController]\n\n§LIn addition, every Pacific base the Empire seizes strengthens the §YState of the Pacific§!, hardening Axis-held states in Europe against Allied invasion. Islands the Allies take or hold weaken it.§!"
