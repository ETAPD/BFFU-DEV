 JAP_partnership_eco_tt:0 "The §YImperial Japanese Economy§! is adjusted:\n $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+5.0%§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+2.0%§!\n $MODIFIER_STABILITY_FACTOR$: §G+5.0%§!\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-5.0%§!"
