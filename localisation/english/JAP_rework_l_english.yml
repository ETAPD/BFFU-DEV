 JAP_army_jungle_armor:0 "Jungle Armoured Warfare"
 JAP_army_jungle_armor_desc:0 "Tanks and armoured variants are trained and equipped to fight in dense jungle, gaining attack and defence in that terrain."
 JAP_army_sf_rough_terrain:0 "Special Forces Rough-Terrain Training"
 JAP_army_sf_rough_terrain_desc:0 "Special forces are drilled to press home attacks across hills, mountains, forest, jungle and marsh."
 JAP_supremacy_tech_armor_tt:0 "£army_experience Armour Division Attack: §G+10.0%§!"
 JAP_cannon_modernization:0 "Cannon Modernization"
 JAP_cannon_modernization_desc:0 "A sweeping overhaul of Japan's outdated artillery park. Field guns, heavy and rocket artillery, anti-tank and anti-air guns are all rebuilt to modern standards, sharpening the firepower of every formation."
 JAP_air_superiority:0 "Air Superiority"
 JAP_air_superiority_desc:0 "Closely integrated air and ground crews keep more fighters in the sky for less, and blunt the enemy's ability to support their own troops from the air."
 JAP_finish_army_reforms_idea:0 "Reformed Army"
 JAP_finish_army_reforms_idea_desc:0 "The long programme of army reform is complete. The infantry are hardier and the armoured force hits harder and holds firmer."
 JAP_three_alls_idea:0 "Three Alls Policy"
 JAP_three_alls_idea_desc:0 "Kill all, burn all, loot all. The brutal pacification of the Chinese countryside coarsens the army and grinds down the resilience of its own men."
 JAP_ijaas_fighters:0 "Army Air Service Doctrine"
 JAP_ijaas_fighters_desc:0 "The Army Air Service builds for the attack: light, agile fighters that hit hard, at the cost of their own protection."
 JAP_supremacy_technology_idea:0 "Supremacy of Technology"
 JAP_supremacy_technology_idea_desc:0 "Cutting-edge ground-attack aircraft and modern armour give Japan's forces a decisive technological edge over the battlefield."
 JAP_ugaki_production:0 "Ugaki's Standardisation"
 JAP_ugaki_production_desc:0 "Ugaki's rationalised production lines slash the cost of Japan's guns and armour, letting the factories turn out far more for the same outlay."
 JAP_ijnas_yokosuka_tt:0 "Unlock §YYokosuka's Type 91 Aerial Torpedo Integration§! organisation trait"
 JAP_rework.40.t:0 "A Study in Germany"
 JAP_rework.40.d:0 "Our delegation has spent months touring the Reich's research establishments and arsenals. The Germans, eager to bind Tokyo closer, have offered to share one of their most advanced programmes. We can take home only one - which shall it be?"
 JAP_rework.40.a:0 "German rocketry"
 JAP_rework.40.b:0 "German armour"
 JAP_rework.41.t:0 "Matsumoto's Speculation"
 JAP_rework.41.desc:0 "Kenjiro Matsumoto's speculative dealings in the yasukawa zaibatsu's markets have turned sour this month. Discipline must come before prosperity, he insists, even if the ledgers bleed a little more red for it."
 JAP_rework.41.a:0 "Discipline must come before prosperity."
 JAP_rework.42.t:0 "Kuhara's Connections"
 JAP_rework.42.desc:0 "Fusanosuke Kuhara's banking connections have paid off handsomely this month, easing the burden on the nation's markets."
 JAP_rework.42.a:0 "Japan stands tall again."
 JAP_rework.40.c:0 "German fighters"
 JAP_economy_locked_tt:0 "§RJapan's economy is directed by national focus and cannot be changed manually.§!"
 JAP_national_mobilisation_law:0 "National Mobilisation Law"
 JAP_national_mobilisation_law_desc:0 "The National Mobilisation Law places manpower, industry and prices under state direction, gearing the economy for a long war without going to full total-war footing. Factory output and building capacity grow, at the cost of higher consumer-goods demand, some lost conscription, and steady political and social strain."
 JAP_new_economic_structure:0 "New Economic Structure"
 JAP_new_economic_structure_desc:0 "The New Economic Structure places industry under central planning, subordinating the market to the needs of total war. Output, factory construction and repair surge and new building capacity opens up, at the cost of heavier consumer-goods demand, sagging conscription, and the political and social strain of running a command economy."
 JAP_imperial_army_doctrine:0 "Imperial Army Doctrine"
 JAP_imperial_army_doctrine_desc:0 "The Imperial Japanese Army is built around offensive spirit and rigid hierarchy. Its formations are cohesive and aggressive, but doctrine, training, and equipment lag behind: planning is slow and shallow, defensive fighting is neglected, and the men are pushed harder than their materiel can bear."
 jap_kwantung_veto:0 "Kwantung Clique"
 jap_kwantung_veto_desc:0 "This officer answers first to the Kwantung Army clique. While the China war drags on he cannot be trusted with independent command or further advancement, and learns nothing from the fighting."
 JAP_china_war_strain:0 "Strain of the China War"
 JAP_china_war_strain_desc:0 "The army is bogged down in the vast Chinese interior. Endless garrison duty and inconclusive offensives bleed away the experience the army should be gaining, and slow the seasoning of its divisions."
 JAP_korea_resisting_integration:0 "Resisting Integration"
 JAP_korea_resisting_integration_desc:0 "The Korean populace resents Japanese rule and quietly resists integration into the Empire. Construction projects and resource extraction in this state suffer from non-cooperation and sabotage."
 JAP_imperial_japanese_army:0 "Imperial Japanese Army"
 JAP_imperial_japanese_army_desc:0 "The Dai-Nippon Teikoku Rikugun stands ready to expand the Empire's borders by land."
 JAP_imperial_japanese_navy:0 "Imperial Japanese Navy"
 JAP_imperial_japanese_navy_desc:0 "The Dai-Nippon Teikoku Kaigun rules the waves of the Western Pacific."
 JAP_imperial_japanese_economy:0 "Imperial Japanese Economy"
 JAP_imperial_japanese_economy_desc:0 "The economy of the Empire of Japan, bound to the zaibatsu and the demands of the military."
 JAP_arita_greater_east_asia_dm: "Arita's Greater East Asia Diplomacy"
