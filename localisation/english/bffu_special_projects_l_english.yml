 sp_land_tech_bonus_armor_tech_reward:0 "Armor Design Advancements"

 # Oxygen Torpedo sp
 sp_naval_oxygen_torpedo:0 "Oxygen Torpedo"
 sp_naval_oxygen_torpedo_desc:0 "A large caliber, long range torpedo driven by a pure-oxygen wet-heater engine. It leaves almost no wake, but the oxygen fuel is dangerous to handle and even more so if the launcher is hit by enemy fire."
 sp_naval_oxygen_torpedo_tech:0 "Oxygen Torpedo"
 sp_naval_lancer_effects:0 "Improved torpedo propulsion and guidance for §Yall§! torpedo modules:\n- Torpedo Hit Chance: §G+3%§!\n- Torpedo Screen Penetration: §G+5%§!"
 torpedo_lancer:0 "Oxygen Torpedo Doctrine"
 torpedo_lancer_desc:0 "Lessons learned from oxygen torpedo trials improve the use of all torpedoes."

 ship_oxygen_torpedo:0 "Oxygen Torpedo Launcher"
 ship_oxygen_torpedo_short:0 "Oxygen Torpedo"
 ship_oxygen_torpedo_desc:0 "Wakeless long range oxygen torpedoes. Strong before late-war launchers arrive, but expensive and less reliable."
 ship_oxygen_torpedo_sub:0 "Oxygen Torpedo Tubes"
 ship_oxygen_torpedo_sub_short:0 "Oxygen Torpedo"
 ship_oxygen_torpedo_sub_desc:0 "Wakeless long range oxygen torpedoes. Strong before late-war launchers arrive, but expensive and less reliable."

 # BFFU passive special projects
 sp_electronics_cipher_machines:0 "Cipher Machines"
 sp_electronics_cipher_machines_desc:0 "Rotor cipher machines and the first electromechanical codebreaking aids let our signals staff encrypt traffic faster and attack enemy codes on a scale no team of clerks could manage."
 sp_electronics_mine_detectors:0 "Electronic Mine Detectors"
 sp_electronics_mine_detectors_desc:0 "A portable induction coil and a pair of headphones can find a buried mine faster than any bayonet. Sappers equipped with these sets can open lanes through minefields while the assault is still moving."
 sp_electronics_sound_ranging:0 "Sound and Flash Ranging"
 sp_electronics_sound_ranging_desc:0 "Microphone arrays and survey posts time the sound and flash of enemy guns, letting our batteries locate and silence hostile artillery before it can break up our own attacks."
 sp_electronics_tank_intercom:0 "Tank Crew Intercoms"
 sp_electronics_tank_intercom_desc:0 "Throat microphones and an internal intercom let commander, driver and gunner work as one crew through the noise of the engine and the gun, keeping the vehicle in the fight for longer."
 sp_land_hollow_charge:0 "Hollow-Charge Weapons"
 sp_land_hollow_charge_desc:0 "Shaped-charge warheads focus the blast of a small charge into a jet that cuts through armour plate, giving infantry a light weapon that can stop a tank at close range."
 sp_land_blood_plasma:0 "Plasma and Penicillin"
 sp_land_blood_plasma_desc:0 "Dried plasma that keeps in the field and mass-produced penicillin save men who would once have died of shock or infection, returning more of the wounded to their units."
 sp_land_assault_rifle_trials:0 "Assault Rifle Trials"
 sp_land_assault_rifle_trials_desc:0 "An intermediate cartridge in a select-fire rifle gives every rifleman the firepower of a submachine gun at the ranges where infantry actually fight."
 sp_land_muzzle_brake:0 "Muzzle Brake Trials"
 sp_land_muzzle_brake_desc:0 "Baffled muzzle brakes and improved recoil systems tame the kick of high-velocity guns, allowing heavier charges on lighter carriages without losing accuracy."
 sp_air_all_weather_flying:0 "All-Weather Flying"
 sp_air_all_weather_flying_desc:0 "Blind-flying instruments, radio navigation aids and de-icing equipment let our crews take off, fight and return in weather that would ground an untrained air force."
 sp_air_self_sealing_tanks:0 "Self-Sealing Fuel Tanks"
 sp_air_self_sealing_tanks_desc:0 "Layers of rubber that swell shut when pierced keep a holed fuel tank from leaking or catching fire, bringing damaged aircraft and their crews home."
 sp_electronics_cipher_machines_tech:0 "Electromechanical Cipher Machines"
 sp_electronics_cipher_machines_pick_a:0 "Cipher Machines: Secure Traffic"
 sp_electronics_cipher_machines_pick_b:0 "Cipher Machines: Codebreaking Bombes"
 sp_electronics_mine_detectors_tech:0 "Electronic Mine Detectors"
 sp_electronics_mine_detectors_pick_a:0 "Mine Detectors: Infantry-Carried Sets"
 sp_electronics_mine_detectors_pick_b:0 "Mine Detectors: Vehicle-Mounted Sets"
 sp_electronics_sound_ranging_tech:0 "Sound-Ranging and Flash-Spotting Sets"
 sp_electronics_tank_intercom_tech:0 "Tank Crew Intercom Systems"
 sp_land_hollow_charge_tech:0 "Hollow-Charge Infantry Weapons"
 sp_land_blood_plasma_tech:0 "Blood Plasma and Penicillin"
 sp_land_assault_rifle_trials_tech:0 "Assault Rifle Trials"
 sp_land_muzzle_brake_tech:0 "Muzzle Brake and Recoil Trials"
 sp_air_all_weather_flying_tech:0 "All-Weather Flying Programme"
 sp_electronics_cipher_machines_unique_reward:0 "Secure Our Traffic or Read Theirs"
 sp_electronics_cipher_machines_unique_reward_desc:0 "The prototype machines can be built for field encryption or wired together into codebreaking aids. Our signals staff must choose where the next production run goes."
 sp_electronics_cipher_machines_preference_a:0 "Field Cipher Sets"
 sp_electronics_cipher_machines_preference_b:0 "Codebreaking Bombes"
 sp_electronics_mine_detectors_unique_reward:0 "Carried or Mounted"
 sp_electronics_mine_detectors_unique_reward_desc:0 "The detector heads work, but the engineers disagree on how to field them: light sets for every sapper section, or heavier arrays on armoured vehicles that lead the column."
 sp_electronics_mine_detectors_preference_a:0 "Infantry-Carried Sets"
 sp_electronics_mine_detectors_preference_b:0 "Vehicle-Mounted Sets"

 # BFFU passive special projects: prototype choices
 sp_electronics_cipher_machines_rotor_wiring:0 "Rotor Wiring Backlog"
 sp_electronics_cipher_machines_rotor_wiring_desc:0 "Every rotor has to be wired by hand, and the workshop has fallen behind. We can rush the wiring and fix the faults later, or test every rotor before it leaves the bench."
 sp_electronics_cipher_machines_rotor_wiring_a:0 "Rush the Wiring"
 sp_electronics_cipher_machines_rotor_wiring_b:0 "Test Every Rotor"
 sp_electronics_mine_detectors_false_readings:0 "False Readings in Wet Ground"
 sp_electronics_mine_detectors_false_readings_desc:0 "In wet and stony ground the search coils pick up every nail and shell splinter. The sappers want the sets now, while the engineers want time to recalibrate them."
 sp_electronics_mine_detectors_false_readings_a:0 "Issue Them As They Are"
 sp_electronics_mine_detectors_false_readings_b:0 "Recalibrate the Coils"
 sp_electronics_sound_ranging_survey_parties:0 "Survey Parties"
 sp_electronics_sound_ranging_survey_parties_desc:0 "Sound-ranging only works if every microphone and battery position is surveyed exactly. We can work from the existing map grids, or send survey parties to fix every point."
 sp_electronics_sound_ranging_survey_parties_a:0 "Use the Map Grids"
 sp_electronics_sound_ranging_survey_parties_b:0 "Survey Every Position"
 sp_electronics_sound_ranging_flash_spotting:0 "Flash-Spotting Trials"
 sp_electronics_sound_ranging_flash_spotting_desc:0 "The flash-spotting posts need night firing to calibrate against. The artillery school can lend us its batteries, or we can pay for extra range time and finish quickly."
 sp_electronics_sound_ranging_flash_spotting_a:0 "Buy Extra Range Time"
 sp_electronics_sound_ranging_flash_spotting_b:0 "Train with the Gunners"
 sp_electronics_tank_intercom_throat_mics:0 "Throat Microphones"
 sp_electronics_tank_intercom_throat_mics_desc:0 "The aircraft intercom works in a tank, but its microphones pick up the engine more than the commander. We can adapt the aircraft sets or design one for the tank."
 sp_electronics_tank_intercom_throat_mics_a:0 "Adapt the Aircraft Sets"
 sp_electronics_tank_intercom_throat_mics_b:0 "Design a Tank Set"
 sp_electronics_tank_intercom_engine_noise:0 "Ignition Static"
 sp_electronics_tank_intercom_engine_noise_desc:0 "The engine's ignition floods the sets with static. Shielding every cable will take time, but the crews may simply learn to live with it."
 sp_electronics_tank_intercom_engine_noise_a:0 "Shield Every Cable"
 sp_electronics_tank_intercom_engine_noise_b:0 "Accept the Static"
 sp_land_hollow_charge_standoff:0 "Standoff Distance"
 sp_land_hollow_charge_standoff_desc:0 "The charge only cuts armour if it goes off at the right distance from the plate. A fixed nose probe will do for now, or we can test every distance on the range."
 sp_land_hollow_charge_standoff_a:0 "Fit a Fixed Nose Probe"
 sp_land_hollow_charge_standoff_b:0 "Test Every Distance"
 sp_land_hollow_charge_copper_liner:0 "Copper Liner Shortage"
 sp_land_hollow_charge_copper_liner_desc:0 "Copper liners give the best jet, but copper is scarce. Steel liners are weaker but easy to get, or we can buy copper abroad and keep the original design."
 sp_land_hollow_charge_copper_liner_a:0 "Use Steel Liners"
 sp_land_hollow_charge_copper_liner_b:0 "Buy Copper Abroad"
 sp_land_blood_plasma_drying:0 "Drying the Plasma"
 sp_land_blood_plasma_drying_desc:0 "Freeze-dried plasma keeps for years, but the plant is slow. Spray-drying in bulk is quicker, but more of each batch is wasted."
 sp_land_blood_plasma_drying_a:0 "Spray-Dry in Bulk"
 sp_land_blood_plasma_drying_b:0 "Freeze-Dry Small Batches"
 sp_land_blood_plasma_donor_drive:0 "Blood Donor Drive"
 sp_land_blood_plasma_donor_drive_desc:0 "We need far more donors. A national appeal would fill the blood banks quickly, while drawing only from the army keeps the programme under military control."
 sp_land_blood_plasma_donor_drive_a:0 "National Appeal"
 sp_land_blood_plasma_donor_drive_b:0 "Military Donors Only"
 sp_land_assault_rifle_trials_cartridge:0 "The Intermediate Cartridge"
 sp_land_assault_rifle_trials_cartridge_desc:0 "The new rifle needs a shorter, lighter cartridge. Cutting down an existing round is quick, but designing a new one will serve us for years."
 sp_land_assault_rifle_trials_cartridge_a:0 "Shorten an Existing Round"
 sp_land_assault_rifle_trials_cartridge_b:0 "Design a New Round"
 sp_land_assault_rifle_trials_troop_trials:0 "Troop Trials"
 sp_land_assault_rifle_trials_troop_trials_desc:0 "The prototypes are ready for trials. Sending them to front-line units will show their faults, while the proving ground is faster."
 sp_land_assault_rifle_trials_troop_trials_a:0 "Front-Line Trials"
 sp_land_assault_rifle_trials_troop_trials_b:0 "Proving Ground Only"
 sp_land_muzzle_brake_baffle_erosion:0 "Baffle Erosion"
 sp_land_muzzle_brake_baffle_erosion_desc:0 "The hot gas wears the brake's baffles away after a few hundred rounds. We can accept shorter barrel life or harden the baffles first."
 sp_land_muzzle_brake_baffle_erosion_a:0 "Accept Shorter Barrel Life"
 sp_land_muzzle_brake_baffle_erosion_b:0 "Harden the Baffles"
 sp_land_muzzle_brake_muzzle_blast:0 "Muzzle Blast"
 sp_land_muzzle_brake_muzzle_blast_desc:0 "The brake throws its blast sideways into the crew and kicks up dust that gives the gun away. Larger gun shields would help, or the crews can be trained to cope."
 sp_land_muzzle_brake_muzzle_blast_a:0 "Raise the Gun Shields"
 sp_land_muzzle_brake_muzzle_blast_b:0 "Train the Crews to Cope"
 sp_air_all_weather_flying_instruments:0 "Blind-Flying Instruments"
 sp_air_all_weather_flying_instruments_desc:0 "Our pilots need a proper blind-flying panel. Airline panels can be copied straight away, or we can design a military panel built for combat aircraft."
 sp_air_all_weather_flying_instruments_a:0 "Copy the Airline Panels"
 sp_air_all_weather_flying_instruments_b:0 "Design a Military Panel"
 sp_air_all_weather_flying_icing:0 "Icing Trials"
 sp_air_all_weather_flying_icing_desc:0 "The de-icing boots have to be proven in real ice. Winter test flights teach our crews a great deal, while the wind tunnel is quicker."
 sp_air_all_weather_flying_icing_a:0 "Winter Test Flights"
 sp_air_all_weather_flying_icing_b:0 "Wind Tunnel Only"
 sp_air_self_sealing_tanks_rubber:0 "The Sealing Layer"
 sp_air_self_sealing_tanks_rubber_desc:0 "The sealing layer is made of natural rubber, which we must import. A synthetic compound would free us from imports, but it needs more work."
 sp_air_self_sealing_tanks_rubber_a:0 "Use Natural Rubber"
 sp_air_self_sealing_tanks_rubber_b:0 "Develop a Synthetic Compound"
 sp_air_self_sealing_tanks_weight:0 "Added Weight"
 sp_air_self_sealing_tanks_weight_desc:0 "The sealing layers add a lot of weight to every tank. Thinner layers keep the fighters fast, while full protection brings more crews home."
 sp_air_self_sealing_tanks_weight_a:0 "Thinner Layers"
 sp_air_self_sealing_tanks_weight_b:0 "Full Protection"
 sp_land_assault_rifle_better_reward_tt:0 "Improves the research bonus for §YInfantry Equipment IV§! when the project is finished: no choice like this gives a 1-year ahead-of-time reduction, one gives 1 year and +50% research speed, both give 2 years and +100%."
