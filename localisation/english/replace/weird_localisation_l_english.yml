 GER_dive_bombers:0 "Perfect the Stuka"
 GER_establish_night_fighter_squadrons:0 "Nachtjagdgeschwader"
 GER_construct_the_kammhuber_line:0 "Set Up the Kammhuber Line"
 GER_aeronautical_research_institute:0 "Establish the DLFA"
 GER_aerodynamic_research_institute:0 "Wunderwaffen"
 GER_aerodynamic_research_institute_desc:0 "Jet engines, rocket interceptors and swept wings promise to leap a generation ahead of the Allies. The Me 262 and Me 163 could restore German mastery of the skies, if only they can be built in time."
 GER_aeronautical_research_institute_desc:0 "The Deutsche Luftfahrtforschungsanstalt (DLFA) will give German science world-leading wind tunnels and laboratories at Braunschweig. Expanding it will accelerate every aircraft programme we pursue and keep our designers a step ahead of the enemy."
 GER_construct_the_kammhuber_line_desc:0 "General Josef Kammhuber's belt of radar boxes, searchlights and night fighters stretches from Denmark to France. Each box guides a fighter onto a single bomber, creating a defensive line the RAF must pay dearly to cross."
 GER_defense_of_the_reich_desc:0 "As Allied bombers strike ever deeper, fighter Geschwader are recalled from every front to defend German cities. Concentrating the Jagdwaffe at home will blunt the bombing offensive, at the cost of air superiority over the armies in the field."
 GER_dive_bombers_desc:0 "The Ju 87 proved itself in Spain, but it is slow and vulnerable. Stronger engines, improved bomb gear and ultimately the cannon-armed Ju 87G Kanonenvogel will keep the Stuka the terror of enemy infantry and armour alike."
 GER_establish_night_fighter_squadrons_desc:0 "RAF Bomber Command strikes by night. Radar-equipped Nachtjagdgeschwader, guided by ground controllers, will stalk the bomber streams, and aces such as Heinz-Wolfgang Schnaufer will make the night skies over the Reich deadly."
 GER_expanding_the_luftwaffe_desc:0 "Unveiled to the world in March 1935, the Luftwaffe must grow from a clandestine cadre into the most modern air arm in Europe. Off-budget MEFO bills let the Reichsluftfahrtministerium order aircraft by the thousand while the treasury looks the other way."
 GER_fallschirmjager_desc:0 "Under General Kurt Student, the Luftwaffe's parachute troops are becoming an elite airborne force. Expanding them into full divisions will let us seize bridges, airfields and fortresses, as at Eben-Emael, before the enemy can react."
 GER_reorganize_the_luftwaffe_desc:0 "Rapid expansion has left the Luftwaffe with too many new units, too few experienced leaders and a muddled chain of command. Reorganising the Luftflotten and promoting proven fighter pilots will turn raw numbers into a coherent fighting force."
 GER_tactical_bombers_desc:0 "Why build lumbering heavy bombers when a fast twin-engined Schnellbomber can outrun enemy fighters and strike in numbers? Dornier's Do 17 and the Junkers Ju 88 embody a doctrine of cheap, fast medium bombers operating in close concert with the army."
 GER_uralbomber_program_desc:0 "General Walther Wever, the Luftwaffe's first chief of staff, believed wars are won by striking the enemy's industry, even beyond the Urals. Reviving his four-engined bomber programme with Heinkel at its head would give Germany a truly strategic air force."

 # GORING FOUR YEAR PLAN - vanilla focus overrides
 GER_accelerate_the_rearmament_program:0 "Guns Before Butter"
 GER_accelerate_the_rearmament_program_desc:0 "'Guns will make us powerful; butter will only make us fat.' Göring's words of 1936 set the tone of the Four Year Plan. Consumer industry waits its turn while every spare Reichsmark and ton of steel goes to the armaments works."
 GER_create_rustungsstab:0 "Raw Materials and Foreign Exchange Staff"
 GER_create_rustungsstab_desc:0 "In 1936 Hitler handed Göring control of raw materials and foreign exchange, wresting it from Schacht. His new staff decides which imports enter the Reich, and the answer is always the same: whatever the armaments industry needs first."
 GER_establish_production_targets:0 "Steel Quotas"
 GER_establish_production_targets_desc:0 "Steel is too scarce to be sold to the highest bidder. From 1937 every ton is allocated by quota through the Plan's offices, and the Wehrmacht's orders stand at the head of the queue."
 GER_concentrated_armament_program:0 "The Karinhall Plan"
 GER_concentrated_armament_program_desc:0 "Drawn up by Carl Krauch of IG Farben and approved at Göring's estate in 1938, the Karinhall Plan sets vast targets for explosives, powder and chemical weapons. New state-financed arms works will be raised to meet them."
