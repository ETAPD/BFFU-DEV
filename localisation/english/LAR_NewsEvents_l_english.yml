l_english:

  # End of the Spanish Civil War (Nationalist victory) - lar_news.1

  lar_news.1.t_franco:0 "Nationalist Victory in the Spanish Civil War"
  lar_news.1.t_falangist:0 "Falangist Victory in the Spanish Civil War"
  lar_news.1.t_carlists:0 "Carlist Victory in the Spanish Civil War"

  lar_news.1.desc_franco:0 "After a long and grueling civil war, the Nationalists, united under Francisco Franco, have finally defeated their Republican enemies and secured full control over Spain. Though isolated pockets of Republican troops continue to wage a guerrilla war that may well hamper the exertion of local Nationalist control in previously Republican areas, it is unlikely further coordinated resistance of any significance will materialize.\n\nAs the nation focuses on rebuilding its war-torn cities and industry, it remains to be seen what effects the Nationalists' ideological amalgamation will have on their foreign policy, and whether the generous foreign military aid they received will be repaid."
  lar_news.1.desc_franco_unified:0 "The Spanish Civil War has ended in swift and total victory for the Nationalist cause. United from the outset under Francisco Franco's leadership, the Nationalists overwhelmed their Republican enemies before the conflict could drag into a prolonged war of attrition.\n\nWith the nation spared the worst of a long civil war, reconstruction may proceed far more quickly than many had feared."
  lar_news.1.desc_franco_uprising:0 "After a long and grueling civil war, marked also by a brief but bloody uprising within Nationalist ranks, Francisco Franco has finally secured victory over both his Republican enemies and his rivals within the Nationalist movement. Spain is united under his rule, though the wounds of internal betrayal may take longer to heal than those of the war itself.\n\nAs the nation focuses on rebuilding its war-torn cities and industry, it remains to be seen what effects this hard-won unity will have on Spain's foreign policy."
  lar_news.1.desc_falangist:0 "After a long and grueling civil war, the Nationalists have finally defeated their Republican enemies and secured full control over Spain. Yet Francisco Franco did not live to see the fruits of this victory: instead, it is the radical Falange that has emerged in control of the new Spanish state, promising a more overtly fascist and revolutionary path than many of their erstwhile allies expected.\n\nAs the nation focuses on rebuilding its war-torn cities and industry, foreign observers watch closely to see how far the Falangists intend to take their ideological project."
  lar_news.1.desc_carlists:0 "After a long and grueling civil war, the Nationalists have finally defeated their Republican enemies and secured full control over Spain. In the end, it was the Carlist movement, not Francisco Franco, that emerged to lead the new Spanish state, restoring the old cause of throne and altar to a place of prominence few had expected to see again.\n\nAs the nation focuses on rebuilding its war-torn cities and industry, it remains to be seen how this restoration of traditionalist rule will shape Spain's place in Europe."

  lar_news.1.a:0 "A tragic end to a war of Spaniard against Spaniard."
  lar_news.1.b:0 "Spain's civil war has run its course. The consequences will be felt across Europe."
  lar_news.1.c:0 "One front falls silent. Let the rest of Iberia learn from Madrid's example."
  lar_news.1.d:0 "The war grinds on elsewhere in Spain, but its outcome is no longer in doubt."
  lar_news.1.e:0 "Comrades fall, but the struggle in Spain is not yet finished."
  lar_news.1.f:0 "Our cause is lost. There is nothing left to do but lay down what remains of our arms."
  lar_news.1.g:0 "The war in Spain has ended."
