l_english:
 BFFU_SE_SCW_Begins_TITLE:0 "Spanish Civil War"
 BFFU_SE_SCW_Begins_QUOTE:0 "It is better to die on your feet than to live on your knees.\n- Dolores Ibarruri"
 BFFU_SE_SCW_Begins_BUTTON:0 "Spain bleeds"

 BFFU_SE_Marco_Polo_TITLE:0 "Second Sino-Japanese War"
 BFFU_SE_Marco_Polo_QUOTE:0 "Other men are the carving knife and serving dish; we are the fish and the meat.\n- Sun Yat-sen"
 BFFU_SE_Marco_Polo_BUTTON:0 "Humiliation continues"

 BFFU_SE_danzig_TITLE:0 "The Second World War"
 BFFU_SE_danzig_QUOTE:0 "Close your hearts to pity. Act brutally. The stronger man is right.\n- Adolf Hitler"
 BFFU_SE_danzig_BUTTON:0 "War never changes..."

 BFFU_SE_Pearl_harbour_TITLE:0 "Pearl Harbour"
 BFFU_SE_Pearl_harbour_QUOTE:0 "The fate of the Empire rests on this enterprise. Every man must devote himself totally to the task in hand.\n- Isoroku Yamamoto"
 BFFU_SE_Pearl_harbour_BUTTON:0 "Tora! Tora! Tora!"

 BFFU_SE_operation_barbarossaa_commences_TITLE:0 "Operation Barbarossa"
 BFFU_SE_operation_barbarossaa_commences_QUOTE:0 "We have only to kick in the door and the whole rotten structure will come crashing down.\n- Adolf Hitler"
 BFFU_SE_operation_barbarossaa_commences_BUTTON:0 "Drang nach Osten!"

 BFFU_SE_fall_blau_TITLE:0 "Fall Blau Commences"
 BFFU_SE_fall_blau_QUOTE:0 "The Russian is finished. — France Halder"
 BFFU_SE_fall_blau_BUTTON:0 "The God of war has gone over"
