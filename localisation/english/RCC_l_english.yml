l_english:
 RCC_autonomous_government:0 "The Autonomous Government"
 RCC_autonomous_government_desc:0 "In November 1935 Yin Rugeng declared East Hebei autonomous from Nanjing under Japanese protection. The new government must now prove it can rule."
 RCC_anti_communist_pledge:0 "The Anti-Communist Pledge"
 RCC_anti_communist_pledge_desc:0 "The council was founded as an anti-communist body. Make the pledge the cornerstone of the regime."
 RCC_japanese_advisers:0 "Japanese Advisers"
 RCC_japanese_advisers_desc:0 "Every bureau gets a Japanese adviser. Business runs smoother, at the price of our own say."
 RCC_tangshan:0 "Move the Government to Tangshan"
 RCC_tangshan_desc:0 "After the Tongzhou Mutiny the government leaves the ruined town for Tangshan and rebuilds. Available after the mutiny, or from 1938."
 RCC_provisional_government:0 "The Provisional Government"
 RCC_provisional_government_desc:0 "On 14 December 1937 Wang Kemin proclaims the Provisional Government of the Republic of China in Beiping, and East Hebei merges into it. Requires Japan's Provisional Government focus (or an AI Japan after December 1937) and Beiping in our or Japanese hands."
 RCC_xinmin_hui:0 "The New People's Society"
 RCC_xinmin_hui_desc:0 "The Xinminhui, a mass organisation on the Japanese model, will win the people to the new order."
 RCC_merge_reformed:0 "Absorb the Reformed Government"
 RCC_merge_reformed_desc:0 "Liang Hongzhi's Reformed Government at Nanjing is brought under one roof with us. Requires Japan's Reformed Government focus (or an AI Japan after March 1938) and Nanjing in our or Japanese hands."
 RCC_return_to_nanjing:0 "Return the Capital to Nanjing"
 RCC_return_to_nanjing_desc:0 "On 30 March 1940 Wang Jingwei returns the national government to Nanjing as the true heir of Sun Yat-sen. Completes on its own if Japan hands China to Wang Jingwei."
 RCC_north_china_council:0 "The North China Political Council"
 RCC_north_china_council_desc:0 "The old Provisional Government lives on as a council with wide powers over the north."
 RCC_peace_anti_communism:0 "Peace, Anti-Communism, National Reconstruction"
 RCC_peace_anti_communism_desc:0 "Wang Jingwei's slogan becomes the programme of the government."
 RCC_qingxiang:0 "The Rural Pacification Movement"
 RCC_qingxiang_desc:0 "Li Shiqun's clearing of the countryside: blockhouses, bamboo fences and terror. Excludes the New Citizen Movement."
 RCC_new_citizen:0 "The New Citizen Movement"
 RCC_new_citizen_desc:0 "Win the villages with schools, relief and propaganda rather than fences. Excludes the Rural Pacification Movement."
 RCC_return_of_concessions:0 "Return of the Concessions"
 RCC_return_of_concessions_desc:0 "In 1943 Japan hands back its concessions and gives up extraterritoriality. Our claim to all of China is made official. Available from 1943."
 RCC_join_the_war:0 "Declare War on the Allies"
 RCC_join_the_war_desc:0 "On 9 January 1943 the national government declares war on Britain and the United States at Japan's side."
 RCC_greater_east_asia_conference:0 "The Greater East Asia Conference"
 RCC_greater_east_asia_conference_desc:0 "Wang Jingwei sits beside the leaders of Asia in Tokyo. Press for a freer hand. Available from November 1943."
 RCC_sovereign_china:0 "A Sovereign China?"
 RCC_sovereign_china_desc:0 "Prove that the government at Nanjing is more than a shadow."
 RCC_special_trade:0 "The East Hebei Special Trade"
 RCC_special_trade_desc:0 "Our tariffs are a quarter of Nanjing's. Japanese goods flood into China through East Hebei, and the customs revenue flows to us."
 RCC_kailuan_mines:0 "The Kailuan Mines"
 RCC_kailuan_mines_desc:0 "The great coal mines of Tangshan are the wealth of East Hebei."
 RCC_tangshan_cement:0 "Tangshan Cement Works"
 RCC_tangshan_cement_desc:0 "The Chee Hsin cement works can build the new state."
 RCC_federal_reserve_bank:0 "The Federal Reserve Bank of China"
 RCC_federal_reserve_bank_desc:0 "In March 1938 the bank in Beiping issues a new currency for the north, tied to the yen. Requires the Provisional Government."
 RCC_north_china_development:0 "Partner the North China Development Company"
 RCC_north_china_development_desc:0 "Open the coal, iron and salt of the north to the Japanese national policy company."
 RCC_north_china_railways:0 "Rebuild the North China Railways"
 RCC_north_china_railways_desc:0 "The North China Transportation Company restores the lines torn up in the fighting."
 RCC_central_reserve_bank:0 "The Central Reserve Bank"
 RCC_central_reserve_bank_desc:0 "In January 1941 Nanjing opens its own central bank and issues its own notes. Requires the return to Nanjing."
 RCC_lower_yangtze:0 "Rebuild the Lower Yangtze"
 RCC_lower_yangtze_desc:0 "Restart the mills and workshops of Shanghai and Nanjing."
 RCC_commerce_control:0 "The National Commerce Control Commission"
 RCC_commerce_control_desc:0 "From 1943 the government takes over the purchase of rice and cotton. Available from March 1943."
 RCC_arsenals:0 "Arsenals for East Asia"
 RCC_arsenals_desc:0 "Our own factories will arm our own army."
 RCC_peace_preservation_corps:0 "The Peace Preservation Corps"
 RCC_peace_preservation_corps_desc:0 "The Bao'andui are all the army East Hebei has. Make them a force that can hold the towns."
 RCC_japanese_instructors:0 "Japanese Instructors"
 RCC_japanese_instructors_desc:0 "Japanese officers train our men in the Japanese way. Excludes Train Our Own Officers."
 RCC_own_officers:0 "Train Our Own Officers"
 RCC_own_officers_desc:0 "Chinese officers for a Chinese army. Excludes Japanese Instructors."
 RCC_purge_the_corps:0 "Purge the Disloyal Corps"
 RCC_purge_the_corps_desc:0 "After Tongzhou no unit can be trusted until it is purged. Available after the mutiny, or from 1938."
 RCC_security_army:0 "The North China Security Army"
 RCC_security_army_desc:0 "Qi Xieyuan raises the Huabei Zhi'anjun to garrison the north. Requires the Provisional Government."
 RCC_railway_guards:0 "Railway Protection Corps"
 RCC_railway_guards_desc:0 "Guard the lines against the guerrillas who cut them every night."
 RCC_central_military_academy:0 "The Central Military Academy"
 RCC_central_military_academy_desc:0 "The academy reopens at Nanjing to train the officers of the national army. Requires the return to Nanjing."
 RCC_national_army:0 "The Peace National Construction Army"
 RCC_national_army_desc:0 "The Heping Jianguo Jun becomes the army of the national government."
 RCC_tax_police:0 "The Tax Police Corps"
 RCC_tax_police_desc:0 "Zhou Fohai's tax police are the best paid and best armed men we have."
 RCC_defectors:0 "Welcome Nationalist Defectors"
 RCC_defectors_desc:0 "Whole Nationalist armies are crossing over: Sun Dianying, Pang Bingxun, Hao Pengju. Available from 1942."
 RCC_nanjing_navy:0 "The Nanjing Navy"
 RCC_nanjing_navy_desc:0 "Ren Yuandao's navy ministry gathers gunboats to patrol the rivers and coast."
 RCC_air_force:0 "Air Force of the National Government"
 RCC_air_force_desc:0 "A small air arm with trainers and liaison aircraft."
