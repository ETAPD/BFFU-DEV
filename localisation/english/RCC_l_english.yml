 RCC_heir_of_sun_yat_sen:0 "Heir of Sun Yat-sen"
 RCC_bullet_of_1935_1:0 "The Bullet of 1935"
 RCC_bullet_of_1935_2:0 "The Wound Flares"
 RCC_bullet_of_1935_3:0 "Failing Health"
