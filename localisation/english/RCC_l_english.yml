 RCC_regime_changed_tt:0 "Modify §YCollaborationist Regime§! by:"
 RCC_army_changed_tt:0 "Modify §YPeace Preservation Army§! by:"
 RCC_collaborationist_regime:0 "Collaborationist Regime"
 RCC_collaborationist_regime_desc:0 "A Chinese government under Japanese protection. Every stage of the government and every focus of the economy shapes it."
 RCC_peace_preservation_army:0 "Peace Preservation Army"
 RCC_peace_preservation_army_desc:0 "From the Peace Preservation Corps of East Hebei to the army of the national government."
 RCC_tongzhou_aftermath:0 "Aftermath of Tongzhou"
 RCC_provisional_tt:0 "East Hebei becomes the §YProvisional Government of the Republic of China§!, led by §YWang Kemin§!.\nIt takes over §YBeiping§!, §YHebei§!, §YHebei-Chahar§!, §YShandong§! and §YJinan§! where we or Japan hold them, and moves the capital to Beiping."
 RCC_reformed_tt:0 "We take over §YNanjing§!, §YShanghai§!, §YJiangsu§!, §YSuzhou§!, §YZhejiang§! and §YAnhui§! where we or Japan hold them."
 RCC_reorganized_tt:0 "We become the §YReorganized National Government of the Republic of China§! under §YWang Jingwei§!, with Nanjing as the capital."
 RCC_concessions_tt:0 "Every Chinese core state we own becomes our core."
 RCC_two_divisions_tt:0 "Raise §G2§! divisions of the Security Army in the capital."
 rcc.1.t:0 "The Tongzhou Mutiny"
 rcc.1.d:0 "On 29 July 1937 the Peace Preservation Corps at Tongzhou turned on its Japanese advisers, killed the garrison and the Japanese residents, and carried Yin Rugeng off as a prisoner. The Japanese army has retaken the town, but the government is in ruins. Chi Zongmo takes charge and the government moves to Tangshan."
 rcc.1.a:0 "Rebuild at Tangshan."
 rcc.2.t:0 "Wang Jingwei Dies"
 rcc.2.d:0 "Wang Jingwei has died in Nagoya, where he was taken for treatment of the wound left by an assassin's bullet years ago. Chen Gongbo succeeds him as head of the national government."
 rcc.2.a:0 "Chen Gongbo takes over."
 RCC_yin_rugeng:0 "Yin Rugeng"
 RCC_chi_zongmo:0 "Chi Zongmo"
 RCC_wang_kemin:0 "Wang Kemin"
 RCC_wang_jingwei:0 "Wang Jingwei"
 RCC_chen_gongbo:0 "Chen Gongbo"
 RCC_liang_hongzhi:0 "Liang Hongzhi"
 RCC_zhou_fohai:0 "Zhou Fohai"
 RCC_li_shiqun:0 "Li Shiqun"
 RCC_wang_yitang:0 "Wang Yitang"
 RCC_qi_xieyuan:0 "Qi Xieyuan"
 RCC_sun_dianying:0 "Sun Dianying"
 RCC_pang_bingxun:0 "Pang Bingxun"
 RCC_hao_pengju:0 "Hao Pengju"
 RCC_ren_yuandao:0 "Ren Yuandao"
 JAP_annex_rcc:0 "Annex the East Hebei Regime"
 JAP_annex_rcc_desc:0 "No Chinese hand guides East Hebei. Fold its government and its corps into our own administration."
 JAP_war_rcc_beiping_tt:0 "If it exists, the §YEast Hebei§! regime may now become the §YProvisional Government§! and take over Beiping and the north."
 JAP_war_rcc_nanjing_tt:0 "If it exists, our Chinese government may now absorb the §YReformed Government§! and take over Nanjing and the lower Yangtze."
 JAP_war_direct_annex_rcc_tt:0 "The §YEast Hebei§! regime is §Rannexed§!."
 RCC_shanhaiguan:0 "The Great Wall Passes"
 RCC_shanhaiguan_desc:0 "Goods come over the Great Wall at Shanhaiguan and the Luan river passes with no customs at all. Run the route properly and take a cut of everything."
 RCC_blockhouse_lines:0 "Blockhouse Lines"
 RCC_blockhouse_lines_desc:0 "Ring the cleared districts with blockhouses, ditches and bamboo fences so the guerrillas cannot return."
 RCC_youth_corps:0 "The China Youth Corps"
 RCC_youth_corps_desc:0 "The New Citizen Movement raises a youth corps to carry Wang Jingwei's message into every school and village."
 RCC_jessfield_road:0 "No. 76 Jessfield Road"
 RCC_jessfield_road_desc:0 "The special services headquarters in Shanghai hunts Nationalist and communist agents in the cities."
 RCC_tokyo_man_tt:0 "§RTokyo Man§!: backed by Japan. Our autonomy grows more slowly while he serves."
 RCC_nanjing_man_tt:0 "§GNanjing Man§!: backed by the Chinese side. Our autonomy grows faster while they serve."
 RCC_rival_tt:0 "§RRival§!: Li Shiqun and Ding Mocun will not serve together."
 RCC_wk_zhou_fohai_tt:0 "Each week in office: §YCollaborationist Regime§! $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ §G+0.25%§! (up to §G+10%§!, kept if he leaves)."
 RCC_wk_liang_hongzhi_tt:0 "Each week in office: §YCollaborationist Regime§! $MODIFIER_RESISTANCE_TARGET$ §G-0.25%§! (up to §G-8%§!, kept if he leaves)."
 RCC_wk_chen_gongbo_tt:0 "Each week in office: §YCollaborationist Regime§! $MODIFIER_STABILITY_FACTOR$ §G+0.25%§! (up to §G+8%§!, kept if he leaves)."
 RCC_wk_wang_yitang_tt:0 "Each week in office: §YCollaborationist Regime§! $MODIFIER_LOCAL_RESOURCES_FACTOR$ §G+0.25%§! (up to §G+10%§!, kept if he leaves)."
 RCC_wk_li_shiqun_tt:0 "Each week in office: §YCollaborationist Regime§! $MODIFIER_RESISTANCE_TARGET$ §G-0.5%§! (up to §G-10%§!, kept if he leaves)."
 RCC_wk_ding_mocun_tt:0 "Each week in office: §YCollaborationist Regime§! $MODIFIER_RECRUITABLE_POPULATION_FACTOR$ §G+0.25%§! (up to §G+8%§!, kept if he leaves)."
 RCC_bullet_stage_1_tt:0 "A bullet from the 1935 assassination attempt is still lodged near his spine. §RIt will worsen from mid 1943.§!"
 RCC_bullet_stage_2_tt:0 "The old wound has flared up. §RIt will worsen again from March 1944.§!"
 RCC_bullet_stage_3_tt:0 "Bedridden and failing."
