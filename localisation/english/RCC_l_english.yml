 RCC_legislative_president:0 "President of the Legislative Yuan"
 RCC_double_dealer:0 "Double Dealer"
 RCC_madame_wang:0 "Madame Wang"
 RCC_zhili_veteran:0 "Old Zhili Veteran"
 RCC_wuhan_pacification_command:0 "Wuhan Pacification Command"
 RCC_river_navy_minister:0 "Minister of the River Navy"
 RCC_old_zhili_marshal:0 "Old Zhili Marshal"
 RCC_old_zhili_marshal_desc:0 "A Zhili clique general from the warlord years, brought back to command the North China Security Army."
 RCC_dongling_looter:0 "The Dongling Looter"
 RCC_dongling_looter_desc:0 "Robbed the Qing imperial tombs in 1928. His men live off whatever land they hold."
 RCC_hero_of_linyi:0 "Hero of Linyi"
 RCC_hero_of_linyi_desc:0 "Held Linyi against the Japanese in 1938 before he crossed over."
 RCC_seven_times_turncoat:0 "Seven Times a Turncoat"
 RCC_seven_times_turncoat_desc:0 "Has changed sides so often that his men never quite know whose war they are fighting."
 RCC_wuhan_pacifier:0 "Pacifier of Wuhan"
 RCC_wuhan_pacifier_desc:0 "Keeps the middle Yangtze quiet with patience rather than terror."
 RCC_river_patrol_admiral:0 "River Patrol Admiral"
 RCC_river_patrol_admiral_desc:0 "Commands the gunboats that keep the Yangtze open."
 RCC_ding_mocun:0 "Ding Mocun"
 RCC_kita_seiichi:0 "Kita Seiichi"
 RCC_kagesa_sadaaki:0 "Kagesa Sadaaki"
 RCC_chen_bijun:0 "Chen Bijun"
 RCC_ye_peng:0 "Ye Peng"
 rcc.3.t:0 "Li Shiqun Poisoned"
 rcc.3.d:0 "Li Shiqun, master of the special services at No. 76 Jessfield Road, has died in agony two days after a dinner with Kempeitai officers in Shanghai. Tokyo had come to fear the power he had gathered. Nobody in Nanjing dares to ask questions."
 rcc.3.a:0 "One rival fewer."
 RCC_mei_siping:0 "Mei Siping"
 RCC_bao_wenyue:0 "Bao Wenyue"
 RCC_minister_of_industry:0 "Minister of Industry"
 RCC_minister_of_military_administration:0 "Minister of Military Administration"
