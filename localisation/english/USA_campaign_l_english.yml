l_english:
 # ---- 1936 election: the focus works itself ----
 USA_election_in_progress_tt:0 "The campaign is under way. This focus completes itself on §YElection Day§! (3 November 1936); §YCampaign Headquarters§! in the decisions shows the days left. Use the §YCampaign Trail§! decisions and the campaign stops beside this focus to swing the polls."
 USA_election_auto_start_tt:0 "The election campaign starts by itself on 1 January 1936 and ends on Election Day."
 USA_camp_open_tt:0 "The §Y1936 campaign§! is still running"
 USA_camp_candidate_roosevelt:0 "Roosevelt"
 USA_camp_candidate_landon:0 "Landon"

 # ---- decision category and decisions ----
 USA_campaign_trail_cat:0 "The Road to November"
 USA_campaign_trail_cat_desc:0 "The campaign runs by itself until §YElection Day§!, but the candidates still need us. Back §HRoosevelt§! or §RLandon§!, then spend §Ypolitical power§! on campaign actions that swing the polls. Every action has a price, and some §Ocost more than they seem§!."
 USA_campaign_overview:0 "§LCampaign Headquarters§!"
 USA_campaign_overview_desc:0 "We are backing §Y[GetCampaignCandidate]§!. The §Lpolling bar§! sits at the top of the focus screen.\n\nActions push the polls toward the candidate we back. We can §Yswitch candidates§! at any time.\n\nCampaign stops made: §Y[?USA_camp_stops_done|0]§!. One stop is due every §Y35 days§! (with one stop of slack); for every stop we fall behind, the other candidate gains §Rmomentum§! each month. With fewer than §Y4§! stops on Election Day, the winner is an §RAbsentee Candidate§!."
 USA_campaign_back_roosevelt:0 "Back §HRoosevelt§!"
 USA_campaign_back_roosevelt_desc:0 "Throw our weight behind the president. Campaign actions will push the polls toward §HRoosevelt§!."
 USA_campaign_back_landon:0 "Back §RLandon§!"
 USA_campaign_back_landon_desc:0 "Throw our weight behind the Republican challenger. Campaign actions will push the polls toward §RLandon§!."
 USA_campaign_not_backing_roosevelt_tt:0 "We are not already backing §YRoosevelt§!"
 USA_campaign_not_backing_landon_tt:0 "We are not already backing §YLandon§!"
 USA_campaign_whistle_stop:0 "§YWhistle-Stop Tour§!"
 USA_campaign_whistle_stop_desc:0 "Take the candidate across the country by train. It is a §Gbig swing§!, but the schedule is brutal and the campaign arrives §Rworn out§!."
 USA_campaign_radio_address:0 "§YRadio Address§!"
 USA_campaign_radio_address_desc:0 "A national broadcast in prime time. A §Gmodest swing§! and a short burst of §Gattention§!."
 USA_campaign_party_machine:0 "§YWork the Party Machine§!"
 USA_campaign_party_machine_desc:0 "City bosses and ward heelers deliver the vote. A §Glarge swing§!, paid for in §Rpatronage§! afterwards."
 USA_campaign_press_conference:0 "§YPress Conference§!"
 USA_campaign_press_conference_desc:0 "Take the reporters' questions. A §Gsmall swing§! and §Gno downside§!."
 USA_campaign_dirty_tricks:0 "§RDirty Tricks§!"
 USA_campaign_dirty_tricks_desc:0 "Leak a story, plant a rumour, buy a columnist. If it works, the swing is §Ghuge§!. If it comes out (§R35% chance§!), it §Rbackfires§! on us."
 USA_campaign_donor_dinner:0 "§GDinner with the Donors§!"
 USA_campaign_donor_dinner_desc:0 "Eat the rubber chicken, take the cheques. We gain §Gpolitical power§! now, but whoever §Oleads the polls§! looks a little too cosy with money and §Rloses ground§!."

 # ---- early choices: campaign strategy, voting blocs, Election Honeymoon ----
 USA_election_absentee:0 "Absentee Candidate"
 USA_election_absentee_desc:0 "The president barely campaigned, and the country noticed. The new term starts without a mandate."
 USA_campaign_strategy_grassroots:0 "§OStrategy:§! Grassroots Organisation"
 USA_campaign_strategy_grassroots_desc:0 "Volunteers, door-to-door canvassing and train tours. The campaign lives §Gon the road§! and has §Rlittle time for donors§!.\n\nA strategy can only be chosen before §Y1 April 1936§!, and we can only choose §Yone§!."
 USA_campaign_strategy_grassroots_tt:0 "For the rest of the campaign:\n §YWhistle-Stop Tour§! moves the marker §G50%§! further\n §YPress Conference§! moves the marker §G50%§! further\n §YDinner with the Donors§! raises only §R15§! political power"
 USA_campaign_strategy_radio:0 "§OStrategy:§! The Radio Campaign"
 USA_campaign_strategy_radio_desc:0 "Buy airtime in every market and fight the election §Gfrom the studio§!. The candidate spends §Rless time on the rails§!.\n\nA strategy can only be chosen before §Y1 April 1936§!, and we can only choose §Yone§!."
 USA_campaign_strategy_radio_tt:0 "For the rest of the campaign:\n §YRadio Address§! moves the marker §Gtwice§! as far\n §YWhistle-Stop Tour§! moves the marker only §Rhalf§! as far"
 USA_campaign_strategy_warchest:0 "§OStrategy:§! The War Chest"
 USA_campaign_strategy_warchest_desc:0 "Raise money early and spend it through §Gthe party machine§!. It is effective, and the press will ask §Owhere the money came from§!.\n\nA strategy can only be chosen before §Y1 April 1936§!, and we can only choose §Yone§!."
 USA_campaign_strategy_warchest_tt:0 "For the rest of the campaign:\n §YDinner with the Donors§! raises §G50§! political power instead of 30\n §YWork the Party Machine§! moves the marker §G50%§! further"
 USA_campaign_bloc_labor:0 "§LCourt§! Organised Labour"
 USA_campaign_bloc_labor_desc:0 "Promise the unions a fair hearing on wages and the right to organise. Their members §Gvote§!, and they §Gcanvass§!.\n\nVoting blocs can only be courted before §Y1 July 1936§!. We can secure §Ytwo§! of them, and §YLabour§! and §YBusiness§! will not share a campaign."
 USA_campaign_bloc_labor_tt:0 "After Election Day, the §YElection Honeymoon§! gains:\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+3%§!\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+2%§!"
 USA_campaign_bloc_business:0 "§LCourt§! the Business Lobby"
 USA_campaign_bloc_business_desc:0 "Reassure the Chamber of Commerce and the big employers that the next four years will be §Ggood for business§!.\n\nVoting blocs can only be courted before §Y1 July 1936§!. We can secure §Ytwo§! of them, and §YLabour§! and §YBusiness§! will not share a campaign."
 USA_campaign_bloc_business_tt:0 "After Election Day, the §YElection Honeymoon§! gains:\n $MODIFIER_STABILITY_FACTOR$: §R-2%§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!"
 USA_campaign_bloc_farm:0 "§LCourt§! the Farm Bloc"
 USA_campaign_bloc_farm_desc:0 "Crop prices, credit and drought relief. The farm states §Gswing elections§!, and they remember who helped them.\n\nVoting blocs can only be courted before §Y1 July 1936§!. We can secure §Ytwo§! of them."
 USA_campaign_bloc_farm_tt:0 "After Election Day, the §YElection Honeymoon§! gains:\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.05§!\n $MODIFIER_STABILITY_FACTOR$: §G+3%§!"
 USA_campaign_bloc_south:0 "§LCourt§! the Solid South"
 USA_campaign_bloc_south_desc:0 "Win over the Southern party bosses and the committee chairmen in Congress. They deliver votes §Gin November§! and §Gin the Capitol§!.\n\nVoting blocs can only be courted before §Y1 July 1936§!. We can secure §Ytwo§! of them."
 USA_campaign_bloc_south_tt:0 "After Election Day, the §YElection Honeymoon§! gains:\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.10§!\n $MODIFIER_WAR_SUPPORT_FACTOR$: §G+2%§!"
 USA_campaign_bloc_slots_tt:0 "We have secured fewer than §Y2§! voting blocs"
 USA_campaign_bloc_not_labor_tt:0 "We have not courted §YOrganised Labour§!"
 USA_campaign_bloc_not_business_tt:0 "We have not courted the §YBusiness Lobby§!"
 USA_election_honeymoon:0 "Election Honeymoon"
 USA_election_honeymoon_desc:0 "The new administration enjoys the goodwill of a fresh mandate. It will not last."

 # ---- campaign stops (focuses) ----
 USA_camp_defend_new_deal:0 "Defend the New Deal"
 USA_camp_defend_new_deal_desc:0 "Roosevelt takes the New Deal to the primaries and dares the opposition to repeal it. Relief money buys loyalty, and the bills come due in the shops."
 USA_camp_new_deal_momentum:0 "New Deal Momentum"
 USA_camp_new_deal_momentum_desc:0 "Earned on the campaign trail."
 USA_camp_liberty_league:0 "Rally the Liberty League"
 USA_camp_liberty_league_desc:0 "Wealthy donors and the American Liberty League open their chequebooks for the Republicans. The money is generous, and the strings are visible."
 USA_camp_business_backing:0 "Business Backing"
 USA_camp_business_backing_desc:0 "Earned on the campaign trail."
 USA_camp_renominate_fdr:0 "Renominate Roosevelt"
 USA_camp_renominate_fdr_desc:0 "The Philadelphia convention renominates Roosevelt by acclamation. The party closes ranks, and its isolationist wing is promised a quiet foreign policy."
 USA_camp_party_unity:0 "Democratic Unity"
 USA_camp_party_unity_desc:0 "Earned on the campaign trail."
 USA_camp_nominate_landon:0 "Nominate Alf Landon"
 USA_camp_nominate_landon_desc:0 "The Cleveland convention picks the Kansas governor, a balanced-budget progressive. The party rallies behind a promise of thrift."
 USA_camp_republican_unity:0 "Republican Unity"
 USA_camp_republican_unity_desc:0 "Earned on the campaign trail."
 USA_camp_fireside_chats:0 "Fireside Chats"
 USA_camp_fireside_chats_desc:0 "Roosevelt speaks to the nation by radio, calm and direct, in living rooms from Maine to California. Listeners start to expect more of the same."
 USA_camp_fireside_glow:0 "Fireside Glow"
 USA_camp_fireside_glow_desc:0 "Earned on the campaign trail."
 USA_camp_heartland_tour:0 "The Heartland Tour"
 USA_camp_heartland_tour_desc:0 "Landon crosses the Midwest by train, talking farm prices and balanced budgets in town squares. The crowds are warm, and the campaign bleeds influence in the capital."
 USA_camp_heartland_tour_mod:0 "Heartland Enthusiasm"
 USA_camp_heartland_tour_mod_desc:0 "Earned on the campaign trail."
 USA_camp_msg_rally:0 "Madison Square Garden Rally"
 USA_camp_msg_rally_desc:0 "Roosevelt names the forces of organised money before a roaring crowd: "I welcome their hatred." The speech electrifies his supporters and unsettles everyone else."
 USA_camp_msg_afterglow:0 "Madison Square Afterglow"
 USA_camp_msg_afterglow_desc:0 "Earned on the campaign trail."
 USA_camp_wall_street_push:0 "Court Wall Street"
 USA_camp_wall_street_push_desc:0 "In the final weeks the Republicans lean on the banks and the big employers for votes and cash. It works, and everyone sees who is paying."
 USA_camp_wall_street_money:0 "Wall Street Money"
 USA_camp_wall_street_money_desc:0 "Earned on the campaign trail."

 # ---- campaign stops added for the eight-stage campaign ----
 USA_camp_toward_backed_tt:0 "Moves the polling bar toward the candidate we back (§Y[GetCampaignCandidate]§!):"
 USA_camp_season_opens:0 "The Campaign Season Opens"
 USA_camp_season_opens_desc:0 "The new year opens the presidential race. Campaign offices open in every state, the pollsters go to work, and both parties start fighting for the headlines."
 USA_camp_summer_campaign:0 "The Summer Campaign"
 USA_camp_summer_campaign_desc:0 "With the conventions over, the candidates take to the road. The long, hot summer decides how the country will remember them in November."
 USA_camp_get_out_the_vote:0 "Get Out the Vote"
 USA_camp_get_out_the_vote_desc:0 "Precinct captains knock on every door, buses wait outside the factory gates and the last radio spots go out. Whoever brings their voters to the polls wins."
 USA_camp_soil_conservation:0 "The Soil Conservation Act"
 USA_camp_soil_conservation_desc:0 "The Supreme Court struck down the Agricultural Adjustment Act in January. Within weeks Congress passes the Soil Conservation and Domestic Allotment Act, and the farm cheques keep coming. The farm belt remembers, and so does the Treasury."
 USA_camp_farm_belt:0 "Farm Belt Loyalty"
 USA_camp_farm_belt_desc:0 "Earned on the campaign trail."
 USA_camp_kansas_coolidge:0 "The Kansas Coolidge"
 USA_camp_kansas_coolidge_desc:0 "Governor Landon balanced the Kansas budget through the worst of the Depression. The Republicans sell him as the man who will do the same for Washington: thrift, sound money and fewer public works."
 USA_camp_balanced_budget:0 "Balanced-Budget Pledge"
 USA_camp_balanced_budget_desc:0 "Earned on the campaign trail."
 USA_camp_labor_league:0 "Labor's Non-Partisan League"
 USA_camp_labor_league_desc:0 "John L. Lewis and Sidney Hillman found Labor's Non-Partisan League to put the unions' money and muscle behind Roosevelt. The workers turn out, and the employers start to worry about the next strike."
 USA_camp_union_vote:0 "The Union Vote"
 USA_camp_union_vote_desc:0 "Earned on the campaign trail."
 USA_camp_hearst_press:0 "The Hearst Papers"
 USA_camp_hearst_press_desc:0 "William Randolph Hearst's newspapers line up behind Landon and hammer the New Deal on every front page. Readers grow wary of the administration, and of foreign adventures too."
 USA_camp_hearst_headlines:0 "Hearst Headlines"
 USA_camp_hearst_headlines_desc:0 "Earned on the campaign trail."
 USA_camp_rendezvous_destiny:0 "Rendezvous with Destiny"
 USA_camp_rendezvous_destiny_desc:0 "Accepting the nomination before a hundred thousand people at Franklin Field, Roosevelt tells the nation that this generation has a rendezvous with destiny. The promise lifts the country, and it will have to be paid for."
 USA_camp_rendezvous:0 "A Rendezvous with Destiny"
 USA_camp_rendezvous_desc:0 "Earned on the campaign trail."
 USA_camp_topeka_notification:0 "Notification at Topeka"
 USA_camp_topeka_notification_desc:0 "Landon formally accepts the nomination on the steps of the Kansas statehouse, promising to restore business confidence and to keep America out of foreign quarrels. The builders cheer; the hawks do not."
 USA_camp_topeka:0 "The Topeka Address"
 USA_camp_topeka_desc:0 "Earned on the campaign trail."
 USA_camp_drought_tour:0 "The Drought Tour"
 USA_camp_drought_tour_desc:0 "Roosevelt tours the Great Plains as the drought of 1936 burns the crops, and meets Governor Landon himself at the Des Moines drought conference. Relief flows to the stricken counties, and the bill lands in the shops."
 USA_camp_drought_relief:0 "Drought Relief"
 USA_camp_drought_relief_desc:0 "Earned on the campaign trail."
 USA_camp_pay_envelope:0 "The Pay Envelope Campaign"
 USA_camp_pay_envelope_desc:0 "In the final weeks Republicans and employers warn workers that Social Security will take a cut of every pay packet. The scare brings in money and attention, and leaves the workers uneasy."
 USA_camp_payroll_fears:0 "Payroll Fears"
 USA_camp_payroll_fears_desc:0 "Earned on the campaign trail."

 # ---- campaign decision modifiers ----
 USA_camp_road_weary:0 "Road Weary"
 USA_camp_road_weary_desc:0 "Days of train travel and handshakes have worn the campaign down."
 USA_camp_on_air:0 "On the Air"
 USA_camp_on_air_desc:0 "The nation is listening."
 USA_camp_machine_debts:0 "Machine Debts"
 USA_camp_machine_debts_desc:0 "The party bosses delivered the vote, and now they want jobs and contracts."
 USA_camp_scandal:0 "Campaign Scandal"
 USA_camp_scandal_desc:0 "The tricks came out, and every paper in the country is running the story."
 USA_camp_info:0 "How the Campaign Works"
 USA_camp_info_desc:0 "§YHow the 1936 campaign works§!\n\nThe campaign runs by itself and ends on §YElection Day§! (§Y3 November 1936§!). The election itself does not take our §Lfocus slot§!; only the campaign stops do.\n\n§LThe polling bar§! shows who is ahead. If the marker is on §RLandon's§! side on Election Day, §RLandon§! wins; if it is on §HRoosevelt's§! side, §HRoosevelt§! wins. If it is exactly in the middle, §HRoosevelt§! wins, because he is the sitting president.\n\n§LCampaign stops§!: eight steps of §Y35 days§! each, which last until just before Election Day. The neutral steps move the marker toward the candidate we back. At the §YPrimaries§! we take §HRoosevelt's§! or §RLandon's§! road, and each road has its own choices before the two meet again.\n\n§LThe Campaign Trail§!: in the decisions tab, back a candidate and spend §Ypolitical power§! on actions that move the marker.\n\n§LEarly choices§!: before §Y1 April§! choose a §Ycampaign strategy§!, and before §Y1 July§! secure up to two §Yvoting blocs§!. Both are in the decisions tab, and the blocs add to the §YElection Honeymoon§! after the vote.\n\nMonthly events add their own small movements on top."
 USA_camp_info_tt:0 "This is an information node. It §Rcannot be taken§!. Read its description, then use the §Lcampaign stops§! beside it and the §LCampaign Trail§! decisions."
 USA_camp_info_e1:0 "§YElection Day: 3 November 1936.§! Whoever has the marker on their side wins; a tie goes to §HRoosevelt§!."
 USA_camp_info_e2:0 "§LCampaign stops§! (below): 8 steps of §Y35 days§!. The §YPrimaries§! pick a road. Falling behind gives the rival §Rmomentum§!; under §Y4§! stops makes us an §RAbsentee Candidate§!."
 USA_camp_info_e3:0 "§LDecisions§!: back a candidate and spend §Ypolitical power§! on the marker. Pick a §Ystrategy§! by §Y1 April§! and up to §Ytwo voting blocs§! by §Y1 July§!."
 USA_camp_info_e4:0 "§RLeads drift§! back toward the middle, and past a clear lead decisions work at §Rhalf§! strength."
 USA_camp_info_e5:0 "§GBigger win, bigger reward:§! a two-year mandate plus a §G180-day honeymoon§!. Hover the polling bar for the exact values."
 # ---- polling bar: what each range pays out on Election Day ----
 USA_bop_USA_election_margin_of_error_tt:0 "\n§YIf the election ended here:§!\nWhoever is ahead wins a §Onarrow mandate§!. If the marker is exactly in the middle, §HRoosevelt§! wins as the sitting president."
 USA_bop_USA_roosevelt_favoured_tt:0 "\n§YIf the election ended here:§!\n§HRoosevelt§! wins a §Onarrow mandate§!.\nModify §YEconomy of the United States§! for §Ytwo years§! by:\n $MODIFIER_STABILITY_FACTOR$: §G+3.0%§!\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.05§!\nPlus a §Y180-day§! §YElection Honeymoon§!:\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.15§!\n $MODIFIER_STABILITY_FACTOR$: §G+3%§!\n§RFewer than 4 campaign stops:§! no honeymoon, §RAbsentee Candidate§! instead."
 USA_bop_USA_roosevelt_strong_tt:0 "\n§YIf the election ended here:§!\n§HRoosevelt§! wins a §Lclear mandate§!.\nModify §YEconomy of the United States§! for §Ytwo years§! by:\n $MODIFIER_STABILITY_FACTOR$: §G+6.0%§!\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.12§!\nPlus §G+50§! political power now.\nPlus a §Y180-day§! §YElection Honeymoon§!:\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.30§!\n $MODIFIER_STABILITY_FACTOR$: §G+6%§!\n $MODIFIER_WAR_SUPPORT_FACTOR$: §G+3%§!\n§RFewer than 4 campaign stops:§! no honeymoon, §RAbsentee Candidate§! instead."
 USA_bop_USA_roosevelt_landslide_tt:0 "\n§YIf the election ended here:§!\n§HRoosevelt§! wins a §Glandslide§!.\nModify §YEconomy of the United States§! for §Ytwo years§! by:\n $MODIFIER_STABILITY_FACTOR$: §G+10.0%§!\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.20§!\n $MODIFIER_WAR_SUPPORT_FACTOR$: §G+5.0%§!\nPlus §G+100§! political power now.\nPlus a §Y180-day§! §YElection Honeymoon§!:\n $MODIFIER_POLITICAL_POWER_GAIN$: §G+0.50§!\n $MODIFIER_STABILITY_FACTOR$: §G+10%§!\n $MODIFIER_WAR_SUPPORT_FACTOR$: §G+5%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+3%§!\n§RFewer than 4 campaign stops:§! no honeymoon, §RAbsentee Candidate§! instead."
 USA_bop_USA_landon_favoured_tt:0 "\n§YIf the election ended here:§!\n§RLandon§! wins a §Onarrow mandate§!.\nModify §YEconomy of the United States§! for §Ytwo years§! by:\n $MODIFIER_STABILITY_FACTOR$: §G+3.0%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+2.0%§!\nPlus a §Y180-day§! §YElection Honeymoon§!:\n $MODIFIER_STABILITY_FACTOR$: §G+3%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+4%§!\n§RFewer than 4 campaign stops:§! no honeymoon, §RAbsentee Candidate§! instead."
 USA_bop_USA_landon_strong_tt:0 "\n§YIf the election ended here:§!\n§RLandon§! wins a §Lclear mandate§!.\nModify §YEconomy of the United States§! for §Ytwo years§! by:\n $MODIFIER_STABILITY_FACTOR$: §G+6.0%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.0%§!\nPlus §G+50§! political power now.\nPlus a §Y180-day§! §YElection Honeymoon§!:\n $MODIFIER_STABILITY_FACTOR$: §G+6%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+8%§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!\n§RFewer than 4 campaign stops:§! no honeymoon, §RAbsentee Candidate§! instead."
 USA_bop_USA_landon_surge_tt:0 "\n§YIf the election ended here:§!\n§RLandon§! wins a §Glandslide§!.\nModify §YEconomy of the United States§! for §Ytwo years§! by:\n $MODIFIER_STABILITY_FACTOR$: §G+10.0%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+8.0%§!\n $MODIFIER_WAR_SUPPORT_FACTOR$: §G+5.0%§!\nPlus §G+100§! political power now.\nPlus a §Y180-day§! §YElection Honeymoon§!:\n $MODIFIER_STABILITY_FACTOR$: §G+10%§!\n $MODIFIER_WAR_SUPPORT_FACTOR$: §G+5%§!\n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+12%§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n§RFewer than 4 campaign stops:§! no honeymoon, §RAbsentee Candidate§! instead."
