l_english:
 # ---- 1936 election: the focus works itself ----
 USA_election_in_progress_tt:0 "The campaign is under way. §YElection Day§! (3 November 1936) is in §Y$FLAG_DAYS$§! days. Use the §YCampaign Trail§! decisions and the campaign stops beside this focus to swing the polls."
 USA_election_auto_start_tt:0 "The election campaign starts by itself on 1 January 1936 and ends on Election Day."
 USA_camp_open_tt:0 "The §Y1936 campaign§! is still running"
 USA_camp_candidate_roosevelt:0 "Roosevelt"
 USA_camp_candidate_landon:0 "Landon"

 # ---- decision category and decisions ----
 USA_campaign_trail_cat:0 "The Road to November"
 USA_campaign_trail_cat_desc:0 "The campaign runs by itself until Election Day, but the candidates still need us. Back a candidate, then spend political power on campaign actions that swing the polls. Every action has a price, and some cost more than they seem."
 USA_campaign_overview:0 "Campaign Headquarters"
 USA_campaign_overview_desc:0 "We are backing §Y[GetCampaignCandidate]§!. The polling bar sits at the top of the focus screen.\n\nActions push the polls toward the candidate we back. Switch candidates at any time."
 USA_campaign_overview_hint_tt:0 "Election Day is in §Y$FLAG_DAYS$§! days."
 USA_campaign_back_roosevelt:0 "Back Roosevelt"
 USA_campaign_back_roosevelt_desc:0 "Throw our weight behind the president. Campaign actions will push the polls toward Roosevelt."
 USA_campaign_back_landon:0 "Back Landon"
 USA_campaign_back_landon_desc:0 "Throw our weight behind the Republican challenger. Campaign actions will push the polls toward Landon."
 USA_campaign_not_backing_roosevelt_tt:0 "We are not already backing §YRoosevelt§!"
 USA_campaign_not_backing_landon_tt:0 "We are not already backing §YLandon§!"
 USA_campaign_whistle_stop:0 "Whistle-Stop Tour"
 USA_campaign_whistle_stop_desc:0 "Take the candidate across the country by train. It is a big swing, but the schedule is brutal and the campaign arrives worn out."
 USA_campaign_radio_address:0 "Radio Address"
 USA_campaign_radio_address_desc:0 "A national broadcast in prime time. A modest swing and a short burst of attention."
 USA_campaign_party_machine:0 "Work the Party Machine"
 USA_campaign_party_machine_desc:0 "City bosses and ward heelers deliver the vote. A large swing, paid for in patronage afterwards."
 USA_campaign_press_conference:0 "Press Conference"
 USA_campaign_press_conference_desc:0 "Take the reporters' questions. A small swing and no downside."
 USA_campaign_dirty_tricks:0 "Dirty Tricks"
 USA_campaign_dirty_tricks_desc:0 "Leak a story, plant a rumour, buy a columnist. If it works, the swing is huge. If it comes out, it backfires on us."
 USA_campaign_donor_dinner:0 "Dinner with the Donors"
 USA_campaign_donor_dinner_desc:0 "Eat the rubber chicken, take the cheques. We gain political power now, and the candidate looks a little too cosy with money."

 # ---- tooltips ----
 USA_camp_push_4_tt:0 "The polls swing §Y4 points§! toward §Y[GetCampaignCandidate]§!."
 USA_camp_push_8_tt:0 "The polls swing §Y8 points§! toward §Y[GetCampaignCandidate]§!."
 USA_camp_push_12_tt:0 "The polls swing §Y12 points§! toward §Y[GetCampaignCandidate]§!."
 USA_camp_push_16_tt:0 "The polls swing §Y16 points§! toward §Y[GetCampaignCandidate]§!."
 USA_camp_pushback_4_tt:0 "The polls swing §R4 points§! away from §Y[GetCampaignCandidate]§!."
 USA_camp_dirty_tricks_tt:0 "§G65%§! chance: the polls swing §Y16 points§! toward §Y[GetCampaignCandidate]§!.\n§R35%§! chance: it backfires. The polls swing §R12 points§! away and a §YCampaign Scandal§! lasts 60 days."

 # ---- campaign stops (focuses) ----
 USA_camp_defend_new_deal:0 "Defend the New Deal"
 USA_camp_defend_new_deal_desc:0 "Roosevelt takes the New Deal to the primaries and dares the opposition to repeal it. Relief money buys loyalty, and the bills come due in the shops."
 USA_camp_new_deal_momentum:0 "New Deal Momentum"
 USA_camp_new_deal_momentum_desc:0 "Earned on the campaign trail."
 USA_camp_liberty_league:0 "Rally the Liberty League"
 USA_camp_liberty_league_desc:0 "Wealthy donors and the American Liberty League open their chequebooks for the Republicans. The money is generous, and the strings are visible."
 USA_camp_business_backing:0 "Business Backing"
 USA_camp_business_backing_desc:0 "Earned on the campaign trail."
 USA_camp_renominate_fdr:0 "Renominate Roosevelt"
 USA_camp_renominate_fdr_desc:0 "The Philadelphia convention renominates Roosevelt by acclamation. The party closes ranks, and its isolationist wing is promised a quiet foreign policy."
 USA_camp_party_unity:0 "Democratic Unity"
 USA_camp_party_unity_desc:0 "Earned on the campaign trail."
 USA_camp_nominate_landon:0 "Nominate Alf Landon"
 USA_camp_nominate_landon_desc:0 "The Cleveland convention picks the Kansas governor, a balanced-budget progressive. The party rallies behind a promise of thrift."
 USA_camp_republican_unity:0 "Republican Unity"
 USA_camp_republican_unity_desc:0 "Earned on the campaign trail."
 USA_camp_fireside_chats:0 "Fireside Chats"
 USA_camp_fireside_chats_desc:0 "Roosevelt speaks to the nation by radio, calm and direct, in living rooms from Maine to California. Listeners start to expect more of the same."
 USA_camp_fireside_glow:0 "Fireside Glow"
 USA_camp_fireside_glow_desc:0 "Earned on the campaign trail."
 USA_camp_heartland_tour:0 "The Heartland Tour"
 USA_camp_heartland_tour_desc:0 "Landon crosses the Midwest by train, talking farm prices and balanced budgets in town squares. The crowds are warm, and the campaign bleeds influence in the capital."
 USA_camp_heartland_tour_mod:0 "Heartland Enthusiasm"
 USA_camp_heartland_tour_mod_desc:0 "Earned on the campaign trail."
 USA_camp_msg_rally:0 "Madison Square Garden Rally"
 USA_camp_msg_rally_desc:0 "Roosevelt names the forces of organised money before a roaring crowd: "I welcome their hatred." The speech electrifies his supporters and unsettles everyone else."
 USA_camp_msg_afterglow:0 "Madison Square Afterglow"
 USA_camp_msg_afterglow_desc:0 "Earned on the campaign trail."
 USA_camp_wall_street_push:0 "Court Wall Street"
 USA_camp_wall_street_push_desc:0 "In the final weeks the Republicans lean on the banks and the big employers for votes and cash. It works, and everyone sees who is paying."
 USA_camp_wall_street_money:0 "Wall Street Money"
 USA_camp_wall_street_money_desc:0 "Earned on the campaign trail."

 # ---- campaign decision modifiers ----
 USA_camp_road_weary:0 "Road Weary"
 USA_camp_road_weary_desc:0 "Days of train travel and handshakes have worn the campaign down."
 USA_camp_on_air:0 "On the Air"
 USA_camp_on_air_desc:0 "The nation is listening."
 USA_camp_machine_debts:0 "Machine Debts"
 USA_camp_machine_debts_desc:0 "The party bosses delivered the vote, and now they want jobs and contracts."
 USA_camp_scandal:0 "Campaign Scandal"
 USA_camp_scandal_desc:0 "The tricks came out, and every paper in the country is running the story."
 USA_camp_info:0 "How the Campaign Works"
 USA_camp_info_desc:0 "The 1936 campaign runs by itself and ends on §YElection Day§! (3 November 1936). You do not need to wait with your hands tied: our focus slot is free the whole time.\n\n§YThe polling bar§! shows who is ahead. If the bar sits on Landon's side on Election Day he wins; otherwise Roosevelt holds the White House. A dead heat goes to the incumbent, Roosevelt.\n\n§YCampaign stops:§! four stages (Primaries, Conventions, Summer Tour, Election Eve), and at each one we pick Roosevelt's side or Landon's. Each pick swings the polls and gives a 90-day buff with a price.\n\n§YThe Campaign Trail:§! the decisions tab lets us back a candidate and spend political power on rallies, broadcasts, machine politics and dirty tricks that swing the polls further, always with a downside.\n\nThe monthly campaign events add their own swings on top."
 USA_camp_info_tt:0 "This is an information node. It cannot be taken. Read its description, then use the §Ycampaign stops§! beside it and the §YCampaign Trail§! decisions."
 USA_camp_info_e1:0 "§YThe campaign runs by itself.§! It ends on §YElection Day§! (3 November 1936). Our focus slot stays free the whole time."
 USA_camp_info_e2:0 "§YThe polling bar§! decides the winner. If it sits on Landon's side on Election Day he wins, otherwise Roosevelt holds the White House. A dead heat goes to the incumbent, §YRoosevelt§!."
 USA_camp_info_e3:0 "§YCampaign stops§! (the focuses beside this one): four stages, and at each we pick Roosevelt's or Landon's. Each pick swings the polls by §G8-12 points§! and gives a §Y90 day§! buff with a price."
 USA_camp_info_e4:0 "§YThe Campaign Trail§! (decisions tab): back a candidate, then spend political power on a §YWhistle-Stop Tour§!, §YRadio Address§!, §YParty Machine§!, §YPress Conference§! or §YDirty Tricks§! to swing the polls further."
 USA_camp_info_e5:0 "Every action has a downside: §Rfatigue§!, §Rpatronage debts§!, or a §R35% chance of a scandal§! on Dirty Tricks."
 USA_camp_info_e6:0 "The §Ymonthly campaign events§! add their own swings on top of ours. Switch candidates at any time."
