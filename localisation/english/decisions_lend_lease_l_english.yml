l_english:
 # ==========================================
 # Lend-Lease Act. Decision Category
 # ==========================================
 USA_lend_lease_cat:0 "Lend-Lease Act"

 # ==========================================
 # Shared tooltip. "not same country twice"
 # ==========================================
 USA_lend_lease_not_same_country_tt:0 "We just sent them a shipment, so someone else gets the next one. §Y(This no longer applies once every partner has reached Tier III.)§!"

 # ==========================================
 # Focus completion tooltip
 # ==========================================
 USA_begin_lend_lease_unlocks_tt:0 "Unlocks the §YLend-Lease Act§! decisions:\n - Supply the §YUnited Kingdom§!\n - Supply §YFrance§!\n - Supply the §YSoviet Union§!\n\nEach shipment costs £pol_power §R50§! and lowers £factory_output_texticon Factory Output by §R10-20%§! for §Y180 days§!, until it arrives."

 # ==========================================
 # UNITED KINGDOM
 # ==========================================
 USA_lend_lease_ENG_tier1:0 "Supply the United Kingdom (Tier I)"
 USA_lend_lease_ENG_tier1_desc:0 "Britain's army needs more than its own factories can make. A first round of rifles, radios and trucks can be on its way across the Atlantic within the week.\n\nOnce it arrives, §YTier II§! opens up."

 USA_lend_lease_ENG_tier2:0 "Supply the United Kingdom (Tier II)"
 USA_lend_lease_ENG_tier2_desc:0 "The first convoys made it through. With the routes worked out and our factories picking up, we can send Britain a lot more this time.\n\nOnce it arrives, §YTier III§! opens up."

 USA_lend_lease_ENG_tier3:0 "Supply the United Kingdom (Tier III)"
 USA_lend_lease_ENG_tier3_desc:0 "Our factories now turn out almost as much for Britain as for ourselves, and we can keep the convoys coming for as long as it takes.\n\nCan be sent again after each delivery."

 # ==========================================
 # FRANCE
 # ==========================================
 USA_lend_lease_FRA_tier1:0 "Supply France (Tier I)"
 USA_lend_lease_FRA_tier1_desc:0 "France needs equipment faster than its own factories can make it. A first shipment would show Paris that America is not just watching from across the ocean.\n\nOnce it arrives, §YTier II§! opens up."

 USA_lend_lease_FRA_tier2:0 "Supply France (Tier II)"
 USA_lend_lease_FRA_tier2_desc:0 "The French army has put the first deliveries to good use. A bigger shipment would go a long way toward filling the gaps.\n\nOnce it arrives, §YTier III§! opens up."

 USA_lend_lease_FRA_tier3:0 "Supply France (Tier III)"
 USA_lend_lease_FRA_tier3_desc:0 "Supplying France is now routine work for our factories and ports, and we can keep it going as long as it's needed.\n\nCan be sent again after each delivery."

 # ==========================================
 # SOVIET UNION
 # ==========================================
 USA_lend_lease_SOV_tier1:0 "Supply the Soviet Union (Tier I)"
 USA_lend_lease_SOV_tier1_desc:0 "Few in Washington trust Stalin, but a well-armed Red Army is in our interest. A first shipment can go north with the Arctic convoys or overland through Persia.\n\nOnce it arrives, §YTier II§! opens up."

 USA_lend_lease_SOV_tier2:0 "Supply the Soviet Union (Tier II)"
 USA_lend_lease_SOV_tier2_desc:0 "The Soviets want more, and they want it now. With the Persian route running smoothly, a much bigger shipment is possible.\n\nOnce it arrives, §YTier III§! opens up."

 USA_lend_lease_SOV_tier3:0 "Supply the Soviet Union (Tier III)"
 USA_lend_lease_SOV_tier3_desc:0 "American trucks, radios and rifles now keep whole Soviet armies moving, and we can keep them coming for as long as it takes.\n\nCan be sent again after each delivery."
