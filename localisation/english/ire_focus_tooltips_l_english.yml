#party name swap
 IRE_fine_gael: "Fine Gael"
 IRE_fine_gael_l: "Fine Gael"
#spirits
 ire_drain_the_bogs_spirit: "Draining the Bogs"
 ire_drain_the_bogs_spirit_desc: "Nationwide peat bog drainage projects are underway, clearing land and speeding infrastructure construction across the country."
 ire_europes_last_bastion: "Europe's Last Bastion"
 ire_europes_last_bastion_desc: "With much of the continent falling under occupation, Ireland stands resolute as one of the few remaining free states in Europe. Every soldier knows that this ground, and this ground alone, must never be surrendered."
 ire_higher_education: "Higher Education"
 ire_higher_education_desc: "Investment in universities and technical colleges is producing a new generation of scientists, engineers, and skilled tradesmen, sharpening both the nation's research capacity and the competence of its fledgling industry."
 ire_agency_cooperation: "Agency Cooperation"
 ire_agency_cooperation_desc: "Closer coordination between Ireland's fledgling intelligence services and allied agencies abroad expands the pool of available operatives and sharpens the edge of special forces trained under joint programs."
 ire_ira_persecution: "IRA Persecution"
 ire_ira_persecution_desc: "A sustained campaign against IRA remnants and sympathizers is underway, strengthening the state's authority while diverting resources toward internal security."
 ire_ira_tactics: "IRA Tactics"
 ire_ira_tactics_desc: "Veterans of the IRA's guerrilla campaigns bring hard-won irregular warfare experience into the state's militia forces, though this comes at the cost of conventional infantry discipline and special operations cohesion."
 ire_free_irish_army: "Free Irish Army"
 ire_free_irish_army_desc: "A standard, professional army built around disciplined infantry and supporting artillery, forming the backbone of Ireland's conventional defence."
 ire_tip_of_the_spear: "Tip of the Spear"
 ire_tip_of_the_spear_desc: "Resources and training pivot toward small, highly capable special forces units, at the expense of the state's irregular militia formations."
 ire_wall_of_flesh: "Wall of Flesh"
 ire_wall_of_flesh_desc: "Doctrine shifts toward sheer weight of numbers - vast conscript infantry formations, kept in the fight through superior organisation and recovery, built to overwhelm any defence through attrition alone."
 ire_grand_battery: "Grand Battery"
 ire_grand_battery_desc: "Massed artillery becomes the backbone of Ireland's offensive doctrine, with streamlined production and hardened gun crews delivering devastating and affordable firepower."
 ire_northern_purchase: "Northern Purchase"
 ire_northern_purchase_desc: "The transfer of Northern Ireland has come at a price - concessions to London have strained the economy as the state adjusts to its newly expanded territory."
 ire_sas_training: "SAS Training"
 ire_sas_training_desc: "Joint training programs with British special forces sharpen Ireland's own paratrooper corps, improving their cohesion after landing, their resilience against air attack, and their ability to hold ground before resupply arrives."
 ire_sbs_training: "SBS"
 ire_sbs_training_desc: "Joint training with British special boat forces hones Ireland's own marine corps, easing the chaos of the landing itself and letting naval guns support the beachhead more effectively."
 ire_dockyard_expansion: "Dockyard Expansion"
 ire_dockyard_expansion_desc: "A major push to expand the nation's shipbuilding capacity, speeding up the construction of new dockyards across the coast."
 ire_british_expertise: "British Expertise"
 ire_british_expertise_desc: "Access to British naval know-how strengthens Ireland's own shipyards and accelerates the pace of domestic naval research."
 ire_protect_our_trade: "Protect Our Trade"
 ire_protect_our_trade_desc: "A dedicated convoy escort doctrine keeps merchant shipping safe from raiders and submarines alike, while streamlined production keeps the merchant fleet growing."
 ire_choke_them_out: "Choke Them Out"
 ire_choke_them_out_desc: "A doctrine built around aggressive convoy raiding and a lean, fast surface fleet designed to slip past escorts and strike enemy shipping."
 state_of_ireland: "State of Ireland"
 state_of_ireland_desc: "The Irish Free State stands newly independent but deeply unready - its institutions fragile, its economy underdeveloped, and its politics still scarred by civil war. Nearly every arm of the state must be built up almost from nothing."
 ire_british_model: "British Model Airforce"
 ire_british_model_desc: "Ireland's fighter squadrons adopt British airframe designs, prized for their nimble handling in a dogfight."
 ire_american_model: "American Model Airforce"
 ire_american_model_desc: "American-designed aircraft bring greater range and durability to Ireland's air force."
 ire_homegrown_airforce: "Homegrown Airforce"
 ire_homegrown_airforce_desc: "A domestic aircraft industry begins to take shape, trading a bit of raw performance for cheaper, more readily available fighters."
 ire_rule_the_sky: "Rule the Sky"
 ire_rule_the_sky_desc: "A balanced doctrine focused on air superiority, sharpening every aspect of Ireland's fighter arm."
 ire_close_air_support: "Close Air Support Focus"
 ire_close_air_support_desc: "Doctrine shifts toward supporting the army directly from the air, with aircraft built to strike ground targets and range further afield."
 ire_block_out_the_sun: "Block Out the Sun"
 ire_block_out_the_sun_desc: "A massive expansion of the aircraft industry, accelerating research and streamlining production even as resources run thin."
 ire_reclaiming_albion: "Reclaiming Albion"
 ire_reclaiming_albion_desc: "Every ship, plan, and soldier is committed to a single purpose - landing on British shores and driving the Axis occupiers out of the home isles for good."
 ire_press_our_advantage: "Press Our Advantage"
 ire_press_our_advantage_desc: "The army pivots to the offensive, with rail lines pushed forward at pace to keep divisions supplied as they advance."
 ire_defend_our_allies: "Defend Our Allies"
 ire_defend_our_allies_desc: "Doctrine shifts to a hardened defence, with fortifications rushed up along key lines to hold ground alongside our allies."
 IRE_trade_from_uk: "Trade with the UK"
 IRE_trade_from_uk_desc: "Our efforts to end the trade war on favourable terms has succedeed, letting out industry import British goods at reduced tarrifs!"

#events
#---LONDON BRIDGE IS FALLING DOWN---#
 ire_london_fall.1.t: "London Bridge Is Falling Down!"
 ire_london_fall.1.d: "With the fall of London to the Axis powers, the fall of the south of the United Kingdom is inevitable. We must make a choice regarding our strategy!"
 ire_london_fall.1.a: "We will defend our home first!"
 ire_london_fall.1.b: "Celts do not run away! Hold the mountains!"

