 GER_CG_debuff:0 "§GGets rid of the rest of the Expected Consumer Goods debuff, if we have any.§!"
 GER_Speer_Path:0 "§RWarning :§! If you pick §Y"Follow Speer's Plan"§! you will be locked from Anschluss until §YMarch 1937§!, Fate of Czechoslovakia until §YApril 1938§! and Danzig or War until §YAugust 1939§!"
 GER_conversion_POL:0 "§RConverts §Y15 civs§! to §Y30 mils§! in random states in Poland.§!"
 GER_conversion_BEN:0 "§RConverts §Y15 civs§! to §Y30 mils§! in random states in the Benelux.§!"
 GER_conversion_DEN:0 "§RConverts §Y10 civs§! to §Y20 mils§! in random states in Denmark.§! §GOR§! §RConverts §Y15 civs§! to §Y30 mils§! in random states in Denmark and Norway in total.§! §Cif we have capitulated Norway.§!"
 GER_conversion_FRA:0 "§RConverts §Y15 civs§! to §Y30 mils§! in random states in France.§!"
 GER_conversion_CZE:0 "§RConverts §Y7 civs§! to §Y10 mils§! in random states in Czechia.§!"
 GER_conversion_SWI:0 "§RConverts §Y7 civs§! to §Y10 mils§! in random states in Switzerland.§!"
 GER_Zitadelle:0 "§RAllows us to launch Operation Zitadelle§!"
 GER_Typhoon:0 "§ Focus launches §ROperation Typhoon§! for §Y30 days§! if completed before §YFebruary 1942§!"
 GER_winter_of_1941_tt:0 "Our soldiers have been freezing to death in the relentless and merciless cold §RRussian Winter§!, this can never happen again. No one could have prepared us for a winter like that of the one during 1941, it is as if god himself wants us to fail in Russia. To succeed we must have adequate equipment for our soldiers, with warm hats, insulated clothes and sturdy boots. This of course, will come at a cost."

 germany.902.t:0 "§ROccupation Costs§!"
 germany.902.d:0 "By occupying foreign territories, we can extract valuable resources, tax revenue, and materials from the local population to support our war effort and strengthen the Reich's economy. Although that comes at a cost of our Goods. We need to plunder the cities of the conquered countries to boost our economy and consumer goods."
 germany.902.a:0 "Ja"
 germany.903.t:0 "§RThe Plunder of Poland§!"
 germany.903.d:0 "We gain consumer goods by counquering countries in Europe, by doing focuses in the eco tree, we are gonna revert these consumer goods back to normal."
 germany.903.a:0 "Ok"

 GER_the_winter_of_1941:0 "The Winter of 1941"
 GER_the_winter_of_1941_desc:0 "Our troops are woefully underprepared for the harsh winter temperatures and storms; this has left a large part of our army dying to the simple cold. This is due to many factors. An ill lack of preparation for such an event is at its root, as it was anticipated that the army would defeat the Red Army in a couple of months."
 GER_festung_principle:0 "Dig in for the Winter"
 GER_festung_principle_desc:0 "We can not allow the Soviets to take back what we have conquered, our goal should be to consolidate and keep control of what we have to launch invasion from there, not to keep attacking."
 GER_offense_is_the_best_defense:0 "Offense is the best Defense"
 GER_offense_is_the_best_defense_desc:0 "It is no longer an option for us to sit still and watch idly as the Soviets fortify positions and build up their strength along the front. To make sure that our own front is strong and secure we must launch continuous incursions against the Soviet lines to keep them on their heels and make them feel threatened across the entire front."
 GER_mobile_fortresses_desc:0 "Our experiences in Russia have taught us three things, wide tracks are necessary to traverse the Russian terrain, big guns are needed to strike from afar and take out the armoured legions we are fighting against and heavy armour to resist the high velocity Soviet guns. Henschel's Tiger will decimate our enemies."
 GER_mobile_fortresses:0 "Bring in the Tigers"
 GER_grenadiers_never_retreat:0 "Grenadier tactics"
 GER_grenadiers_never_retreat_desc:0 "The title of Grenadier shall be bestowed upon our soldiers to inspire them to hold steadfast and to be brave in the face of our enemy. Our men in the field are true heroes and should be treated as such, they are the decisive factor of our success in the east. They repel the Soviet counter-attacks, THEY, will drive the bolsheviks back behind the Urals and farther."
 GER_the_wild_cats_that_roam_in_russia:0 "Bring in the Panthers"
 GER_the_wild_cats_that_roam_in_russia_desc:0 "Our experiences in Russia have taught us three things, wide tracks are necessary to traverse the Russian terrain, big guns are needed to strike from afar and take out the armoured legions we are fighting against and heavy armour to resist the high velocity Soviet guns. MAN's Panther is the cost effective and clear answer."
 GER_endless_offensives:0 "Modern Blitzkrieg Warfare"
 GER_endless_offensives_desc:0 "Offense is the best defence, there is no point in standing still and letting the Soviets recover, we must simply put keep up the advance and never let the Soviets rest. If we can find parts of the front to breakthrough it means that we can create potential encirclements and keep collapsing the Soviet Front."
 GER_sieg_im_westen:0 "Der Sieg im Westen"
 GER_the_final_crusade:0 "The Final Crusade"
 GER_the_final_crusade_desc:0 "The Final Crusade has begun, the titantic struggle between the civilized world and the despotic, brutal regime that is communism. It is our duty to protect the future of Europe and Europeans from this threat, we will extinguish the flame of the revolution once and for all. Men! March! Destroy the Soviet Union."
  GER_ambush_tactics:0 "Pak Front"
 GER_ambush_tactics_desc:0 "The great soldiers of the Reich are unable to push any further. Due to logistical problems and the enemy’s numerical superiority we must halt and hold out until we gain the upper hand once again. With the ludicrous amount of soviet tanks and the insufficient production of our own armoured vehicles, we are in need of a new way of fighting."
  GER_new_weapons:0 "Weapon Developments"
 GER_new_weapons_desc:0 "Our weapon manufactures have researched the possibility of a new standard weapon for the soldiers. This new weapon should make every recruit into a machine gunner at once. With these new submachine guns that use rifle caliber bullets, will we achieve the upper hand against the enemy."
  GER_division_support_structure:0 "Division Support Structure"
 GER_division_support_structure_desc:0 "Experience has shown that any division requires as many specialised companies as possible and proper anti-air cover to keep combat readiness high."
  GER_modern_grenadiers:0 "Modern Grenadiers"
 GER_modern_grenadiers_desc:0 "Despite our drive towards armoured warfare the grenadiers remain the backbone of our army. We must make sure our infantry remains the best equipped on the battlefield. "

