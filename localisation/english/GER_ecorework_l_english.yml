 GER_Speer_Path:0 "§RWarning :§! §W If you pick §R"Follow Speer's Plan"§! you will be locked from §O"Danzig or War"§! until §YAugust 1939§!"
 GER_Speer_Path2:0 "§W If we decide to §RFollow Speer's Plan§! occupied states will be plundered every §Y40 days§! and Occupation Focuses are gonna be available every §Y135 days.§!"
 GER_Manage_Autarky:0 "§RAutarky§! can be completed after §Y1st of January 1943§! instead of needing all required resources.§!"
 GER_Goring_Path3:0 "§OHermann Göring§! had decided to focus the Reich's resources towards Rearmament, he believes in a §GQuick and Swift Victory§! against §CAllies§! and §RSoviets§!, prolonging the war will mean an §Rimminent death for The Reich§! §!"
 GER_Goring_Path2:0 "§WIf we decide to Continue with §RGoring's Four Year Plan§! occupied states will plunder every §Y30 days§! and Occupation Focuses are gonna be available every §Y90 days.§!"
