 GER_listen_to_goring_idea:0 "Göring's Promises"
 GER_listen_to_goring_idea_desc:0 "The Reichsmarschall has taken personal charge of the air war and demands results now. His Luftwaffe will fight harder than ever, but his promises to industry cannot be kept for long."
 GER_listen_to_goring_idea_tt:0 "\n§YWhen this expires:§!\n§Y$mio_cat_eq_all_airplanes$§!: $production_cost_tt$ §R+7.50%§!"
 GER_heed_udets_warning_idea:0 "Udet's Warning"
 GER_heed_udets_warning_idea_desc:0 "Rationalising the aircraft industry means grounding units and cutting types while production is reorganised. The Luftwaffe will be weaker for a time, but the factories will emerge leaner."
 GER_heed_udets_warning_idea_tt:0 "\n§YWhen this expires:§!\nRemoves the §R+10.00%§! $production_cost_tt$ penalty on §Y$mio_cat_eq_all_airplanes$§! from §YThe Fall of an Eagle§!."
