 # GERMAN FOCUS TREE - MISSING NAMES AND DESCRIPTIONS
 GER_howitzer_barrage:0 "Howitzer Barrage"
 GER_howitzer_barrage_desc:0 "The Great War taught that nothing moves until the guns have spoken. Heavy howitzers massed behind the front will smash enemy strongpoints and let our infantry dig in on ground the artillery has already won."
 GER_every_man_a_soldier:0 "Every Man a Soldier"
 GER_every_man_a_soldier_desc:0 "From the Hitler Youth to the reserve battalions, every German must be ready to take up arms. A nation trained for war from boyhood gives its officers men who act on their own initiative."
 GER_clean_the_tanks_with_croatian_soap:0 "Train Elite Panzer Crews"
 GER_clean_the_tanks_with_croatian_soap_desc:0 "A Tiger is only as good as the five men inside it. Hand-picked veterans, schooled at Paderborn and Sennelager, will crew our heavy Panzers, and their commanders will be trusted to act on their own judgement when the battle turns."
 GER_deliver_panzerschokolade:0 "Deliver Panzerschokolade"
 GER_deliver_panzerschokolade_desc:0 "Pervitin tablets, sold to the troops as Panzerschokolade, keep drivers and gunners awake through days of continuous advance. Exhausted men make slow decisions; ours will not be exhausted."
 GER_increase_tank_quality:0 "Increase Tank Quality"
 GER_increase_tank_quality_desc:0 "We cannot match our enemies in numbers, so every Panzer must outclass its opponent. Better optics, radios in every tank and well-trained crews give our commanders the confidence to seize the initiative."
 GER_beginning_of_the_end:0 "The Beginning of the End"
 GER_beginning_of_the_end_desc:0 "The war has turned against us. What remains now is to decide how Germany will face the reckoning that is coming."
 GER_Bewegungskrieg:0 "Bewegungskrieg"
 GER_Bewegungskrieg_desc:0 "The Prussian tradition of the war of movement: strike fast, strike first and never let the enemy settle. Mechanised forces give this old doctrine a new and terrible speed."
 GER_Schwere_Panzertruppen:0 "Schwere Panzertruppen"
 GER_Schwere_Panzertruppen_desc:0 "Some fronts cannot be outmanoeuvred, only broken. Dedicated heavy tank battalions, armed and armoured beyond anything the enemy fields, will crack the strongest defensive lines."
 GER_light_tank_studies:0 "Light Tank Studies"
 GER_light_tank_studies_desc:0 "The Panzer I and II taught our crews their trade in Spain and Poland. Studying their strengths and failings will shape the reconnaissance and mobile units of the future."
 GER_early_mechanization_efforts:0 "Early Mechanization Efforts"
 GER_early_mechanization_efforts_desc:0 "Hanomag half-tracks and motorised supply columns let infantry keep pace with the tanks. Mechanising the support arms turns armoured spearheads into balanced combat formations."
 GER_Tiger_developments:0 "Tiger Developments"
 GER_Tiger_developments_desc:0 "Henschel's Tiger is a fortress on tracks: thick armour and the deadly 8.8 cm gun. Few enemy tanks can survive meeting it head-on."
 GER_heavy_turret_developments:0 "Heavy Turret Developments"
 GER_heavy_turret_developments_desc:0 "Bigger guns demand bigger turrets. Developing the heavy turret rings and mountings for long-barrelled guns will let every new Panzer outrange the enemy."
 GER_increase_armor_quality:0 "Increase Armour Quality"
 GER_increase_armor_quality_desc:0 "Face-hardened plate and sloped armour will let our heavy tanks shrug off hits that would destroy lesser machines."
 GER_bust_down_strategy:0 "Breakthrough Strategy"
 GER_bust_down_strategy_desc:0 "Where the lines are fortified, the heavy Panzers lead: armour and assault guns batter a hole through which the rest of the army can pour."
 GER_101st_SS_Heavy_Panzer_Battalion:0 "101st SS Heavy Panzer Battalion"
 GER_101st_SS_Heavy_Panzer_Battalion_desc:0 "The Tiger battalion of the Leibstandarte, home to aces such as Michael Wittmann, whose crews would become legends of armoured warfare."
 GER_Sturmtiger_infantry_support_division:0 "Sturmtiger Infantry Support Division"
 GER_Sturmtiger_infantry_support_division_desc:0 "A Tiger chassis carrying a 38 cm rocket mortar, built to demolish fortified buildings in a single shot. Grouped in support of the infantry, it turns city fighting in our favour."
 GER_SS-Panzer-Division_Das_Reich:0 "SS-Panzer-Division Das Reich"
 GER_SS-Panzer-Division_Das_Reich_desc:0 "One of the most powerful armoured divisions of the Waffen-SS, equipped with the best tanks the Reich could produce and thrown wherever the fighting was hardest."
 GER_sturmpanzer_doctrine:0 "Sturmpanzer Doctrine"
 GER_sturmpanzer_doctrine_desc:0 "Heavily armoured assault guns such as the Brummbär accompany the infantry and destroy bunkers at point-blank range, where towed artillery could never follow."
 GER_Panzerkampfwagen_IV_A:0 "Panzerkampfwagen IV Ausf. A"
 GER_Panzerkampfwagen_IV_A_desc:0 "Designed as a support tank with a short 7.5 cm gun, the Panzer IV had room to grow. It will become the workhorse of the Panzerwaffe for the entire war."
 GER_SPG_regimental_force:0 "Self-Propelled Artillery Regiments"
 GER_SPG_regimental_force_desc:0 "Guns that can keep up with the tanks: self-propelled artillery regiments give Panzer divisions fire support wherever the advance takes them."
 GER_Blitzkrieg:0 "Blitzkrieg"
 GER_Blitzkrieg_desc:0 "Concentrated armour, close air support and radio command combine into lightning war: a sudden breakthrough, then a deep drive that collapses the enemy before he can react."
 GER_Schwerpunkt:0 "Schwerpunkt"
 GER_Schwerpunkt_desc:0 "Find the decisive point and throw everything at it. By concentrating force where it matters most, a smaller army can shatter a larger one."
 GER_Vernichtungsgedanke:0 "Vernichtungsgedanke"
 GER_Vernichtungsgedanke_desc:0 "The idea of annihilation that runs from Cannae to Schlieffen: encircle the enemy army and destroy it in a single decisive battle."
 GER_Stellungskrieg:0 "Stellungskrieg"
 GER_Stellungskrieg_desc:0 "When manoeuvre fails, positional warfare takes over. Deep defensive belts, massed artillery and disciplined infantry will hold any line and grind down any attacker."
 GER_maintenance_crews:0 "Maintenance Crews"
 GER_maintenance_crews_desc:0 "A Panzer division is only as strong as the tanks it can keep running. Mobile workshops and trained recovery crews put damaged vehicles back into the line within days."
 GER_cannon_developments:0 "Cannon Developments"
 GER_cannon_developments_desc:0 "The short guns of our first Panzers cannot pierce modern armour. Longer, high-velocity cannon from Krupp and Rheinmetall will restore the edge our tank crews need."
 GER_adopt_new_panzer_doctrine_desc:0 "Guderian argues that tanks must fight concentrated, in their own divisions, not scattered in support of the infantry. Adopting his doctrine will shape every Panzer the Reich builds."
 GER_the_four_year_plan_desc:0 "Autarky and rearmament within four years: the Four Year Plan puts the economy on a war footing. Who will direct it, Göring's state industry or Speer's rationalised private sector, will shape everything that follows."
 GER_nationalized_industrial_development:0 "The Four Year Plan Office"
 GER_nationalized_industrial_development_desc:0 "Göring's Four Year Plan Office stands above the ministries, with authority to override any of them. Paul Körner and his planners will steer state investment straight into the factories that rearmament requires."
 GER_nationalize_armaments_companies:0 "Nationalize the Armaments Companies"
 GER_nationalize_armaments_companies_desc:0 "Arms makers who drag their feet on contracts will find the state taking them over. Their factories will produce what the Reich requires, at the prices it sets."
 GER_hermann_goring_werke_focus:0 "Reichswerke Hermann Göring"
 GER_hermann_goring_werke_focus_desc:0 "Founded in 1937 to mine the low-grade ores the Ruhr barons refused to touch, the Reichswerke will grow into a state-owned steel and armaments empire under Göring's personal control."
 GER_planned_economic_flexibility:0 "Planned Economic Flexibility"
 GER_planned_economic_flexibility_desc:0 "Central planning need not mean rigidity. Reserve capacity held back by the planners can be redirected wherever the Four Year Plan falls behind."
 GER_integrate_the_austrian_armaments_industry:0 "Integrate the Austrian Armaments Industry"
 GER_integrate_the_austrian_armaments_industry_desc:0 "With the Anschluss, the Steyr works and Austria's iron and steel concerns fall to the Reichswerke. Their factories will be retooled to arm the Wehrmacht."
 GER_slime_siemens:0 "Place Siemens under the Plan"
 GER_slime_siemens_desc:0 "Siemens will serve the Plan on the Plan's terms. Commissioners from the Four Year Plan Office will turn its factories from consumer electrics to war production, whatever the family thinks."
 GER_optimise_military_production:0 "Labour Conscription Decree"
 GER_optimise_military_production_desc:0 "Göring's decree of June 1938 lets the state conscript workers and send them wherever the Plan needs them. Skilled men are pulled from civilian trades and put to work in the arms plants and on the Westwall."
 GER_the_national_war_economy:0 "The National War Economy"
 GER_the_national_war_economy_desc:0 "Every factory, mine and workshop is harnessed to the war. The civilian economy exists only to serve the needs of the front."
 GER_intergrate_war_economies:0 "Integrate the War Economies"
 GER_intergrate_war_economies_desc:0 "The occupied and allied economies of Europe will be bound into a single war economy directed from Berlin, their factories and resources working for the German war effort."
 GER_national_recovery:0 "Work and Bread"
 GER_national_recovery_desc:0 "Arbeit und Brot was the promise that won the Reich, and it has not yet been fully kept. Civilian construction and public works come first, so the war industry of tomorrow is built on a sound, employed and fed nation."
 GER_krupp_factory_expansion:0 "Krupp Factory Expansion"
 GER_krupp_factory_expansion_desc:0 "Krupp's Essen works have forged German arms for a century. New workshops and rolling mills will expand the firm's civilian capacity for the years ahead."
 GER_deals_with_industry:0 "The Reichsgruppe Industrie"
 GER_deals_with_industry_desc:0 "Rather than seize the factories, we organise them. Under the law of 1934 every firm belongs to the Reichsgruppe Industrie, a self-governing body through which the state negotiates contracts and targets with owners who still run their own works."
 GER_mobilize_the_industry:0 "Ministry for Armaments and Munitions"
 GER_mobilize_the_industry_desc:0 "Fritz Todt's ministry gives armaments production a single civilian master. Fixed-price contracts replace the wasteful cost-plus system, rewarding the firms that build most efficiently rather than those that spend the most."
 GER_urban_development:0 "Workers' Settlements"
 GER_urban_development_desc:0 "Workers need homes near the factories. New settlements of small houses with gardens on the edge of the industrial cities will draw labour to where the Reich needs it, and keep it there."
 GER_civilian_development:0 "Reprivatisation"
 GER_civilian_development_desc:0 "The Depression left the state holding banks, shipyards and the shares of Vereinigte Stahlwerke. Selling them back to private owners raises money for the Reich and gives industry a stake in the recovery it is asked to lead."
 GER_krupp_assembly_lines:0 "Flow Production"
 GER_krupp_assembly_lines_desc:0 "American-style flow production comes to the German arms industry. Moving assembly lines and standardised parts let a factory turn out guns and vehicles at a pace the old craft workshops never could."
 GER_dispersed_assembly_production:0 "Subcontract the Mittelstand"
 GER_dispersed_assembly_production_desc:0 "Rather than concentrate production in a few giant works, we spread subassembly across thousands of small private workshops. Output is harder to coordinate, but no bombing raid can stop it all at once."
 GER_deutsch_military_complexes:0 "German Military-Industrial Complexes"
 GER_deutsch_military_complexes_desc:0 "Research institutes, electronics firms and arms works are grouped into integrated complexes, so that new weapons move from the laboratory to the production line in months, not years."
 GER_integrate_the_czech_economy:0 "Protectorate Contract Work"
 GER_integrate_the_czech_economy_desc:0 "Bohemia's factories stay in Czech hands, but they work to German orders. Contracts, credit and German trustees in the boardrooms keep the Protectorate's skilled workforce producing for the Reich without the cost of running it ourselves."
 
 GER_social_market_economist:0 "Social Market Economist"
 
 # SPEER PLAN
 GER_bilateral_clearing:0 "Bilateral Clearing Agreements"
 GER_bilateral_clearing_desc:0 "Foreign currency is scarce, so we will trade without it. Clearing agreements with the Balkan states exchange German machinery for Romanian oil, Yugoslav copper and Hungarian grain, with every balance settled in Reichsmarks held in Berlin."
 GER_redeem_the_mefo_bills:0 "Redeem the MEFO Bills"
 GER_redeem_the_mefo_bills_desc:0 "The MEFO bills were only ever meant as a temporary expedient. Redeeming them on schedule restores confidence in the Reichsmark and keeps inflation at bay, even if rearmament must slow to pay for it."
 GER_roll_over_the_mefo_bills:0 "Roll Over the MEFO Bills"
 GER_roll_over_the_mefo_bills_desc:0 "Why pay the bills when they can simply be renewed? Rolling the MEFO notes over for another term keeps money flowing into the armaments works and leaves the reckoning for a future that may never come."
 GER_speer_grossraumwirtschaft:0 "Großraumwirtschaft"
 GER_speer_grossraumwirtschaft_desc:0 "Germany cannot feed its factories from within its own borders. A continental economic sphere, bound to Berlin by trade treaties and Reichsmark credit, will supply our industry with raw materials beyond the reach of any blockade."
 GER_industrial_self_responsibility:0 "Industrial Self-Responsibility"
 GER_industrial_self_responsibility_desc:0 "Speer trusts engineers over bureaucrats. Main committees and rings drawn from industry itself will fix production methods and share best practice between rival firms, with managers answerable for results rather than paperwork."
 GER_empower_the_wehrwirtschaftsamt:0 "Empower the Wehrwirtschaftsamt"
 GER_empower_the_wehrwirtschaftsamt_desc:0 "General Thomas insists that the soldiers who fight with the weapons should decide how they are built. Inspectors of the War Economy and Armaments Office will sit in every major works and hold industry to the Wehrmacht's requirements."
 GER_siemens:0 "Siemens & Halske"
 GER_siemens_desc:0 "Germany's electrical giant leads the world in communications, radio and precision instruments. Its engineers will be vital to the rockets and radars of the coming war."
 GER_fuel_silo:0 "Construct Fuel Reserves"
 GER_fuel_silo_desc:0 "Synthetic fuel is only useful if it can be stored. Underground tanks and reserve depots will carry the Wehrmacht through the first campaigns of the war."
 GER_mobilise_the_reich:0 "Mobilise the Reich"
 GER_mobilise_the_reich_desc:0 "The economy is ready and the war has come. Industry, labour and resources are placed on a full war footing to meet the demands of the front."
 GER_autarky_efforts_desc:0 "Germany cannot again be starved into surrender by blockade. Self-sufficiency in food, fuel and raw materials is the first goal of the Four Year Plan."
 GER_coal_liquefaction_desc:0 "Germany has coal but little oil. IG Farben's Bergius hydrogenation plants will turn one into the other, fuelling the Wehrmacht from German mines."
 GER_Expand_Steel_Production_desc:0 "Speer's planners reorganise steel production around efficiency rather than ownership. New works and better allocation will give the armaments industry the steel it needs."
 GER_exploit_the_east:0 "Exploit the East"
 GER_exploit_the_east_desc:0 "The conquered lands of the East are to be stripped of grain, oil and labour to feed the German war machine, whatever the cost to their people."
 GER_exploit_the_west:0 "Exploit the West"
 GER_exploit_the_west_desc:0 "The factories of France and the Low Countries will be put to work for the Reich, paying occupation costs in goods, machinery and labour."
 GER_management_of_labor:0 "Management of Labour"
 GER_management_of_labor_desc:0 "Millions of workers are needed in German factories. A central labour office will direct manpower from the occupied territories to wherever the war economy demands."
 GER_todt:0 "Summon Fritz Todt"
 GER_todt_desc:0 "The builder of the Autobahn and the Westwall is given charge of munitions. Todt's organisational genius may yet bring order to the chaos of the war economy."
 GER_trade_deal_with_sweden_desc:0 "Swedish iron ore from Kiruna is the lifeblood of German steel. A favourable trade agreement will keep the ore ships sailing, as long as Sweden remains neutral."
 GER_occupation_switzerland_desc:0 "Switzerland's precision engineering and hydroelectric power are too valuable to leave outside the New Order. Occupation places them in the service of the Reich."
 GER_confiscate_hungarian_alunimium_desc:0 "Hungary's bauxite deposits are among the largest in Europe. Our ally will be persuaded to hand over its aluminium for the Luftwaffe's aircraft factories."
 GER_Mobilise_The_Deutchess_Reich_desc:0 "With Czechoslovakia settled and the east secure, the Reich moves to a full war economy. The time for half-measures is over."
 GER_crush_uprisings_desc:0 "Partisans and saboteurs threaten our hold on the occupied territories. The security services will root out resistance before it can spread."
 GER_strengthen_the_kriegsmarine_desc:0 "Versailles left Germany with a coastal defence navy. Rebuilding the fleet, and its shipyards, is the first step towards challenging the Royal Navy."
 GER_grosskampfschiff_construction_desc:0 "Battleships remain the measure of naval power. Bismarck, Tirpitz and their successors will give the Kriegsmarine the heavy units it needs to contest the seas."
