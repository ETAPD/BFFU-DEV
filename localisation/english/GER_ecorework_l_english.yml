 GER_crush_uprisings_tt:0 "§RThis Focus Will Remove 25% Resistance In Every Occupied State With Over 25% Resistance§!"

 GER_criteria_for_economy_laws_ttt:0 "Having §YWar Economy§! will change the Economy Law to §YTotal Mobilization§! if it is available."

 GER_rapid_mobilisation:0 "Rapid Mobilisation"
 GER_Occupation_Costs:0 "Occupation Costs"
 GER_plunder_economy_category:0 "The Plunder Economy"
 GER_plunder_economy_category_desc:0 "Germany’s economy of plunder is built upon the exploitation of conquered lands: the Reich must seize the resources, and industry of occupied nations, convert civilian factories into military production, and channel every available output into the war machine. Without the wealth of the conquered countries, Germany’s industry would stagnate and collapse.\n"
 GER_plunder_of_poland:0 "§RPlunder Of Poland§!"
 GER_plunder_of_netherlands:0 "§RPlunder Of The Netherlands§!"
 GER_plunder_of_belgium:0 "§RPlunder Of Belgium§!"
