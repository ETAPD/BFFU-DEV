 # LUFTWAFFE
 GER_shut_down_richthofens_reports:0 "Shut Down Richthofen's Reports"
 GER_shut_down_richthofens_reports_desc:0 "In June 1936 Wolfram von Richthofen, head of the RLM development section, ordered work on the Ju 87 halted. Burying his reports and handing the programme to the dive-bomber enthusiast Ernst Udet will save the Stuka and shape the Luftwaffe around supporting the army."
 GER_invest_in_long_range_fighters:0 "Invest into Long Range Fighters"
 GER_invest_in_long_range_fighters_desc:0 "Göring's Zerstörer concept calls for a heavily armed twin-engined fighter able to escort bombers deep into enemy airspace. Messerschmitt's Bf 110 leads the field, while Arado's work on successor designs keeps the bureaus competing for the elite of the fighter arm."
 GER_uralbomber_program:0 "Uralbomber"
 GER_tactical_bombers:0 "Schnellbomber"
 GER_general_der_jagdflieger:0 "General der Jagdflieger"
 GER_general_der_jagdflieger_desc:0 "The post of General der Jagdflieger gives the fighter arm a single voice within the high command, a role later held by Werner Mölders and Adolf Galland. A dedicated inspector can standardise tactics such as the Schwarm and fight for the pilots' needs."
 GER_sturzkampfgeschwader_2:0 "Sturzkampfgeschwader 2"
 GER_sturzkampfgeschwader_2_desc:0 "Sturzkampfgeschwader 2 Immelmann is the Luftwaffe's premier dive-bomber wing. Its crews, Hans-Ulrich Rudel among them, will become some of the most decorated airmen of the war, and their experience will set the standard for every Stuka unit."
 GER_reach_out_to_junkers_and_henschel:0 "Reach Out to Junkers and Henschel"
 GER_reach_out_to_junkers_and_henschel_desc:0 "Junkers builds the Stuka, while Henschel's Hs 123 and the armoured Hs 129 show what a purpose-built ground-attack aircraft can achieve. Generous contracts with both firms will expand production and deliver the next generation of close support aircraft."
 GER_reorganize_the_luftwaffe:0 "Reform the Luftwaffe"
 GER_messerschmitt_109:0 "Stick to Messerschmitt"
 GER_messerschmitt_109_desc:0 "Willy Messerschmitt's Bf 109 is already the backbone of the Jagdwaffe. Concentrating orders on the Augsburg works keeps the production lines simple and lets a proven design be refined rather than replaced."
 GER_focke_wulf:0 "Eyes to Focke-Wulf"
 GER_focke_wulf_desc:0 "Kurt Tank's radial-engined Fw 190 is rugged, hard-hitting and easier to maintain in the field than the Bf 109. Backing Focke-Wulf gives the Jagdwaffe a fighter able to outclass the Spitfire V and double as a fighter-bomber."
 GER_bf_109_gustav:0 "Bf 109 Gustav"
 GER_bf_109_gustav_desc:0 "The Bf 109G Gustav will become the most-produced variant of the war. A more powerful DB 605 engine and field kits for heavier armament keep the ageing airframe competitive against a new generation of Allied fighters."
 GER_fw_190_dora:0 "Fw 190 Dora"
 GER_fw_190_dora_desc:0 "Fitting the Fw 190 with the liquid-cooled Jumo 213 creates the long-nosed Fw 190D Dora, a superb high-altitude fighter able to meet the latest Allied escort fighters on equal terms."
 GER_he_177_greif:0 "Heinkel He 177 Greif"
 GER_he_177_greif_desc:0 "Heinkel's He 177 Greif is Germany's only heavy bomber to reach service. Its coupled twin engines are troublesome, but a crash programme at Rostock can put a genuine long-range bomber force into the air and finally carry the war to the enemy's industry."
 GER_mass_produce_the_ju_88:0 "Mass-Produce the Ju 88"
 GER_mass_produce_the_ju_88_desc:0 "The Ju 88 is the Luftwaffe's jack of all trades: level bomber, dive bomber, night fighter and reconnaissance aircraft. Opening new production lines across the Reich will put the Schnellbomber into service by the thousand."
 GER_lessons_from_britain:0 "Lessons from Britain"
 GER_lessons_from_britain_desc:0 "Over Britain the Stuka met modern fighters and radar-directed defences, and losses were ruinous. The lesson is clear: ground-attack aircraft need longer reach, larger numbers and a sky already swept clean by our fighters."
 GER_lay_down_the_fritz_x:0 "Lay Down the Fritz X Bomb"
 GER_lay_down_the_fritz_x_desc:0 "The Ruhrstahl SD 1400 Fritz X is a radio-guided armour-piercing bomb that can be steered onto a warship from high altitude. In 1943 it sank the battleship Roma; in quantity it could make any enemy fleet fear our bombers."
 GER_fall_of_an_eagle:0 "The Fall of an Eagle"
 GER_fall_of_an_eagle_desc:0 "Ernst Udet, Generalluftzeugmeister and hero of the Great War, is buckling under the blame for the Luftwaffe's production failures. Abandoned by Göring and undermined by Milch, he may not survive the pressure much longer."
 GER_flying_artillery_strategy:0 "Flying Artillery Doctrine"
 GER_flying_artillery_strategy_desc:0 "Stukas as flying artillery: dive-bombers working hand in hand with the Panzer spearheads, called down by liaison officers on strongpoints the guns cannot reach in time. This is the beating heart of Blitzkrieg."
 GER_give_goring_command:0 "Listen to Göring"
 GER_give_goring_command_desc:0 "Hermann Göring insists the Luftwaffe is his and his alone. Trusting the Reichsmarschall's promises brings political backing and resources, but also his whims, his favourites and his contempt for unwelcome facts."
 GER_heed_udets_warning:0 "Heed Udet's Warning"
 GER_heed_udets_warning_desc:0 "Udet warned that the Luftwaffe was falling behind: too many aircraft types, too little production and no replacements for ageing designs. Heeding his warning means rationalising the industry and preparing to defend the Reich itself."
 GER_werner_molders:0 "Werner Mölders"
 GER_werner_molders_desc:0 "Werner Mölders, the first pilot to claim one hundred victories, pioneered the finger-four formation and became General der Jagdflieger. His tactics and insistence on range, speed and teamwork will shape every fighter pilot we train."
 GER_defense_of_the_reich:0 "Defence of the Reich"
 GER_jagernotprogramm:0 "Jägernotprogramm"
 GER_jagernotprogramm_desc:0 "The Emergency Fighter Programme of 1944 sacrifices almost everything for fighter production. Bombers are cancelled and resources stripped from the other services so that thousands of fighters can defend the Reich, whether or not there are pilots to fly them."
 GER_mefo_air:0 "Luftwaffe MEFO Bills"
 GER_mefo_air_desc:0 "Hjalmar Schacht's off-budget MEFO bills quietly finance the Luftwaffe's expansion. The money flows only as long as the peace holds."
 GER_mefo_air_expanded:0 "Expanded Luftwaffe MEFO Bills"
 GER_mefo_air_expanded_desc:0 "Under Göring's Four Year Plan, MEFO financing is stretched to its limit to pour money into aircraft production. The bills will come due the moment war breaks out."
 GER_jagernotprogramm_idea:0 "Jägernotprogramm"
 GER_jagernotprogramm_idea_desc:0 "Fighter production takes absolute priority. Every other programme must wait."
 GER_fall_of_an_eagle_tt:0 "§RCannot be selected.§! Completes automatically when the §YReichsmarschall, Why Have You Deserted Me?§! event fires on §Y7 November 1941§!."
 GER_fallschirmjager_divisions_tt:0 "Spawns §Y5§! fully equipped §Y30-width Fallschirmjäger-Divisionen§! in the capital."
 air_maximum_speed_factor_tt:0 " $MODIFIER_AIR_MAX_SPEED_FACTOR$: $RIGHT|+=%1$"
 GER_luftwaffe.1.t:0 "Reichsmarschall, Why Have You Deserted Me?"
 GER_luftwaffe.1.d:0 "Generaloberst Ernst Udet, Generalluftzeugmeister and one of the great aces of the last war, has shot himself at his Berlin home. Blamed for the Luftwaffe's faltering production and abandoned by Göring, he scrawled a bitter accusation against the Reichsmarschall on the wall before he died.\n\nThe official announcement will claim he was killed testing a new weapon, and he will be buried with full state honours. Within the Reichsluftfahrtministerium, however, the truth is known, and the reckoning over the Luftwaffe's failures has only begun."
 GER_luftwaffe.1.a:0 "Tell the people he died testing a new weapon."
 GER_kammhuber_line_tt:0 "Every state we control along the historical §YKammhuber Line§!, from Jutland through northern Germany and the Low Countries into northern France, is raised to at least:\n    §YLevel 3§! $anti_air_building$\n    §YLevel 2§! $radar_station$"
 GER_luftwaffe.2.t:0 "The Jet Age"
 GER_luftwaffe.2.d:0 "The first reliable turbojets are finally leaving the test benches, but there are nowhere near enough of them for every design on the drawing boards. The Reichsluftfahrtministerium must choose where the engines go: to Messerschmitt's Me 262 Schwalbe, the fastest fighter in the world, or to Heinkel's Hs 132, a jet dive bomber that could strike before the enemy even hears it coming."
 GER_luftwaffe.2.a:0 "The Schwalbe will sweep the skies."
 GER_luftwaffe.2.b:0 "Build the Hs 132 jet dive bomber."
 GER_airforce_equipment_bonuses_tt:0 "[GetGERLuftwaffeCASRangeTooltip][GetGERLuftwaffeMoldersTooltip][GetGERLuftwaffeUdetTooltip][GetGERLuftwaffeGoringTooltip]"
