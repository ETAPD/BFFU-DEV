l_english:

 GER_follow_speers_plan:0 "Follow Speer's Plan"
 GER_follow_speers_plan_desc:0 "Göring promises everything and delivers waste. Speer promises rationalisation - fewer parallel programs, fewer competing ministries, and factories that finally answer to a single plan.\n\nWe stop borrowing against tomorrow and start building today."
 GER_currency_reforms:0 "Schacht's New Plan"
 GER_currency_reforms_desc:0 "Hjalmar Schacht's New Plan of 1934 places every import under state supervisory offices. Scarce foreign currency will buy only what the economy truly needs, and the Reichsmark will stay stable while Germany rebuilds."
 GER_invest_in_electrical_grids:0 "Electrical Grid Investment"
 GER_invest_in_electrical_grids_desc:0 "Every new factory is another load on a grid built for a smaller Reich. We lay new power lines and expand the industrial infrastructure around the Ruhr before the shortages start costing us production."
 GER_establish_buna_werke2:0 "Expand the Buna Werke"
 GER_establish_buna_werke2_desc:0 "One synthetic rubber plant was never going to be enough. A second Buna Werke rises alongside the first, and IG Farben's chemists push the yield of both higher."
 GER_Expand_The_Autobahn:0 "Expand the Autobahn"
 GER_Expand_The_Autobahn_desc:0 "The road network that once impressed the world is now a military asset first and a public work second. We extend it into every core state, and every future construction project moves a little faster for it."
 GER_German_Steel_Werke:0 "Göring Steel Werke"
 GER_Expand_Steel_Production:0 "Speer's Steel Werke"
 GER_itajoinwar_tt:0 "§RTHIS FOCUS WILL AUTOMATICALLY CALL ITALY INTO THE WAR AGAINST THE ALLIES!!!§!"
 GER_around_maginot:0 "§RAround Maginot§!"
 GER_Empower_Steel_Barons:0 "Empower the Steel Barons"
 GER_Empower_Steel_Barons_desc:0 "Thyssen, Flick and the rest built the Reich's industrial base long before the Party existed. Give them the contracts and the construction slots, and they will build it further - loyally, and profitably."
 GER_Support_Siemens:0 "Switch To Armaments Policies"
 GER_Support_Siemens_desc:0 "Electronics and precision instruments win wars as surely as steel does. Siemens gets state backing, a new research chair, and the industrial capacity to make good on both."
 GER_Expand_Rheinmetall:0 "The Rheinmetall Merger"
 GER_Expand_Rheinmetall_desc:0 "Rheinmetall absorbs smaller arms concerns and steel suppliers into a single vertically integrated combine. Fewer firms, fewer bottlenecks, more guns."
 GER_for_a_greater_germany:0 "Industrialise Central Germany"
 GER_for_a_greater_germany_desc:0 "Factories crowded on the Rhine and the borders lie within easy reach of enemy bombers. New plants in the heart of the Reich, from Saxony to Thuringia, trade a little efficiency for a great deal of resilience."
 GER_place_holder1:0 "Finance Europa"
 GER_place_holder1_desc:0 "Berlin's credit lines now reach every capital in the New Order. If our partners are to fight alongside us, they will do it with factories we paid to build."
 GER_finance_europa_tt:0 "§YEvery Axis minor currently in our faction§! receives, at their capital:\n£mil_factory  §G+4§! Military Factories\n£slot_texticon  §G+4§! Building Slots"
 GER_place_holder2:0 "The Armaments Union"
 GER_place_holder2_desc:0 "One caliber, one airframe, one hull design - a Reich this size cannot afford a dozen contractors building a dozen incompatible standards. We bind the whole armaments industry to a single production line, from rifles to panzers to fighters."
 GER_the_armaments_union:0 "The Armaments Union"
 GER_the_armaments_union_desc:0 "A permanent standardisation of the Reich's armaments industry: cheaper small arms, aircraft and armour across the board."
 GER_curtail_the_steel_baronss:0 "Lex Krupp"
 GER_curtail_the_steel_baronss_desc:0 "The decree of 1943 made Krupp a family enterprise answerable to one man, Alfried Krupp. With works reaching from Essen into occupied Europe, the firm becomes a state within the state and the war economy's most dependable partner."
 
 # GORING FOUR YEAR PLAN
 GER_absorb_rheinmetall_borsig:0 "Absorb Rheinmetall-Borsig"
 GER_absorb_rheinmetall_borsig_desc:0 "In 1938 the Reichswerke Hermann Göring swallowed Rheinmetall-Borsig, bringing Germany's great gun and locomotive maker under the Reichsmarschall's control. The state's steel concern now builds the weapons its steel is destined for."
 GER_salzgitter_ore_works:0 "Expropriate the Ore Fields"
 GER_salzgitter_ore_works_desc:0 "The Ruhr barons dismissed the low-grade ore beneath Salzgitter as worthless, then refused to give it up. Göring takes their mining rights by decree, and a vast new smelting complex will free German steel from Swedish imports."
 GER_silesian_steel:0 "Seize the Silesian Steelworks"
 GER_silesian_steel_desc:0 "The mines and mills of Upper Silesia around Kattowitz are among the richest in Europe. Folded into the Reichswerke, they will feed the eastern armaments industry with coal, iron and zinc."
 GER_lorraine_ore:0 "Lorraine Iron Ore"
 GER_lorraine_ore_desc:0 "The minette ore fields of Lorraine once fuelled the Kaiser's war economy. Reclaimed and handed to the Reichswerke, they will make the conglomerate the master of continental steel."
 GER_indulge_gorings_graft:0 "Indulge Göring's Graft"
 GER_indulge_gorings_graft_desc:0 "Carinhall grows grander with every acquisition, and the Reichsmarschall's cut grows with it. Let him have his art and his estates; in return the Reichswerke expands without restraint or oversight."
 GER_milchs_audit:0 "Pleiger's Management"
 GER_milchs_audit_desc:0 "Paul Pleiger, a small Ruhr engineering man turned general director of the Reichswerke, cares for output, not for Carinhall. Put the conglomerate firmly in his professional hands and the waste and the favourites will be cut away, though the Reichsmarschall's circle will resent losing its spoils."
 GER_largest_enterprise_in_europe:0 "The Largest Enterprise in Europe"
 GER_largest_enterprise_in_europe_desc:0 "Mines in Austria, Bohemia, Silesia and Lorraine, steelworks from Linz to Salzgitter, arms plants across the continent: the Reichswerke Hermann Göring has become the largest industrial enterprise in Europe."
 GER_Private_Military_Complex:0 "Private Military Complex"
 GER_Private_Military_Complex_desc:0 "With France beaten, the industrialists who hedged their bets now compete openly for war contracts. We let them - the output is worth the flattery."
 GER_Private_Military_Contracts:0 "Private Military Contracts"
 GER_Private_Military_Contracts_desc:0 "Every combine in the Reich wants a piece of the armaments budget. We hand out contracts by output, not by Party loyalty, and production climbs accordingly."
 GER_barbarossa_economic_missions_tt:0 "§YThe war economy expects fast progress in the East§!: within §Y120 days§! of this focus, §YKiev§!, §YMinsk§! and §YRiga§! must each be under Axis control. For every one not secured in time: §R-7.5%§! stability and §R+1.5%§! expected consumer goods."
 GER_barbarossa_mission_kiev_pending:0 "Objective: Kiev"
 GER_barbarossa_mission_kiev_pending_tt:0 "§YObjective: Kiev§!\nMust be under Axis control within §Y120 days§! of Barbarossa.\nIf not secured in time: §R-7.5%§! stability, §R+1.5%§! expected consumer goods."
 GER_barbarossa_mission_minsk_pending:0 "Objective: Minsk"
 GER_barbarossa_mission_minsk_pending_tt:0 "§YObjective: Minsk§!\nMust be under Axis control within §Y120 days§! of Barbarossa.\nIf not secured in time: §R-7.5%§! stability, §R+1.5%§! expected consumer goods."
 GER_barbarossa_mission_riga_pending:0 "Objective: Riga"
 GER_barbarossa_mission_riga_pending_tt:0 "§YObjective: Riga§!\nMust be under Axis control within §Y120 days§! of Barbarossa.\nIf not secured in time: §R-7.5%§! stability, §R+1.5%§! expected consumer goods."
 germany.300.t:0 "The Drive on Kiev"
 germany.300.d:0 "One hundred and twenty days into the campaign, and the General Staff wants to know where Army Group South actually stands. Kiev was supposed to have fallen by now."
 germany.300.a:0 "Kiev still holds out. The ministries are not pleased."
 germany.300.b:0 "Kiev is ours. The campaign is on schedule, for now."
 germany.301.t:0 "The Drive on Minsk"
 germany.301.d:0 "One hundred and twenty days into the campaign, and the General Staff wants to know where Army Group Centre actually stands. Minsk was supposed to have fallen by now."
 germany.301.a:0 "Minsk still holds out. The ministries are not pleased."
 germany.301.b:0 "Minsk is ours. The campaign is on schedule, for now."
 germany.302.t:0 "The Drive on Riga"
 germany.302.d:0 "One hundred and twenty days into the campaign, and the General Staff wants to know where Army Group North actually stands. Riga was supposed to have fallen by now."
 germany.302.a:0 "Riga still holds out. The ministries are not pleased."
 germany.302.b:0 "Riga is ours. The campaign is on schedule, for now."
 SWI_swiss_gold_trade_agreement:0 "The Swiss Gold Agreement"
 SWI_swiss_gold_trade_agreement_desc:0 "Bern's vaults hold gold Berlin needs and cannot easily take by force. In exchange for looking the other way on where that gold comes from, Swiss goods now cross the border at cost."
 GER_french_repayments_established_tt:0 "§YFrench Repayments§!: Vichy France becomes a nominal German subject, opening a decision category letting Germany claim up to §Y25%§! of its military factory output."
 VIC_french_repayments_modifier:0 "French Repayments"
 VIC_nominal_subject:0 "Nominal Subject"
 GER_french_repayments_category:0 "French Repayments"
 GER_french_repayments_category_desc:0 "Vichy France now answers to Berlin. Through this policy, we may gradually requisition a share of its military industry for the Reich.\n\n§YMilitary Factory Obligation§!: [?VIC.VIC_go_mic_to_overlord_factor|%0]/25%"
 GER_french_repayments_available_tt1:0 "You cannot go over §G25%§!"
 GER_french_repayments_available_tt2:0 "You cannot go lower than §R0%§!"
 GER_french_repayments_complete_tt1:0 "§YFrench Repayments§! gains;\n$mic_to_overlord_factor_tt$: §G+5.00%§!"
 GER_french_repayments_complete_tt2:0 "§YFrench Repayments§! gains;\n$mic_to_overlord_factor_tt$: §R-5.00%§!"
 GER_french_repayments_increase:0 "Increase War Reparations"
 GER_french_repayments_decrease:0 "Decrease War Reparations"
 GER_essen_combine:0 "The Essen Combine"
 GER_essen_combine_desc:0 "Essen's furnaces run day and night for the war effort alone now. New heavy industry rises around Krupp's old works, and the engineers who once built cannons for the Kaiser now build them for the Führer."
 GER_Reorganize_The_Armaments_Industry:0 "Reorganise the Armaments Industry"
 GER_Reorganize_The_Armaments_Industry_desc:0 "War with the Soviet Union changes the arithmetic entirely. Every ministry, every combine and every private contract gets folded into a single armaments effort built to sustain a war of that scale."
 GER_increased_trade:0 "Subsidise Exports"
 GER_increased_trade_desc:0 "Germany can only buy abroad what it sells abroad. A levy on domestic industry funds subsidies for exporters, keeping German goods competitive on world markets so that every factory offered in trade buys back more than before."
 GER_economic_direction_mission:0 "Direct the War Economy"
 GER_economic_direction_mission_desc:0 "Speer or Göring - Berlin cannot keep funding both visions of the war economy indefinitely. A decision is expected within the year."
 germany_mefo_bills.5.t:0 "An Economy Without Direction"
 germany_mefo_bills.5.desc:0 "Neither Speer nor Göring has been given control of the war economy, and the ministries are beginning to work against each other. The Führer will not tolerate the confusion any longer - one of them takes charge, now."
 germany_mefo_bills.5.a:0 "Speer takes charge"
 germany_mefo_bills.5.b:0 "Göring takes charge"

 GER_Mobilise_The_Deutchess_Reich:0 "Mobilise The Deutsches Reich"
 GER_goring_plan:0 "Göring's Four Year Plan"
 GER_goring_plan_desc:0 "Speer talks of rationalisation and patience. Göring promises guns now, autarky now, and lets Berlin worry about the bill later."
 GER_empower_krupp:0 "Bring the Ruhr Barons to Heel"
 GER_empower_krupp_desc:0 "In 1937 the Ruhr steel masters protested against Göring's plans. He answered with threats of treason charges and forced them into line. Industry will build what the Plan demands, where it demands, whatever the shareholders think."
 GER_empower_siemens:0 "Luftwaffe Contracts for Siemens"
 GER_empower_siemens_desc:0 "As chief of the Luftwaffe, Göring can offer Siemens the richest contracts in the Reich. Radio, radar and fire-control research will be lavishly funded, so long as the firm remembers who pays for it."
 GER_occupation_france:0 "§ROccupation of France§!"
 GER_occupation_france_desc:0 "France's factories and farmland now answer to Berlin. What resistance remains is a policing matter, not a military one."
 GER_occupation_benelux:0 "§ROccupation of Benelux§!"
 GER_occupation_benelux_desc:0 "The Low Countries' ports and workshops are folded into the Reich's war economy, their governments reduced to administering the occupation on our behalf."
 GER_occupation_denmark:0 "§ROccupation of Scandinavia§!"
 GER_occupation_denmark_desc:0 "Scandinavia's iron ore and coastline are secured. Compliant local authorities administer the day-to-day, so long as the shipments keep moving south."
 GER_occupation_poland:0 "§ROccupation of Poland§!"
 GER_occupation_poland_desc:0 "What remains of the Polish state exists to serve the occupation, not to be governed for its own sake. Its industry is repurposed accordingly."
 GER_occupation_france2:0 "§ROccupation of France§!"
 GER_occupation_france2_desc:0 "France's factories and farmland now answer to Berlin. What resistance remains is a policing matter, not a military one."
 GER_occupation_benelux2:0 "§ROccupation of Benelux§!"
 GER_occupation_benelux2_desc:0 "The Low Countries' ports and workshops are folded into the Reich's war economy, their governments reduced to administering the occupation on our behalf."
 GER_occupation_denmark2:0 "§ROccupation of Scandinavia§!"
 GER_occupation_denmark2_desc:0 "Scandinavia's iron ore and coastline are secured. Compliant local authorities administer the day-to-day, so long as the shipments keep moving south."
 GER_occupation_poland2:0 "§ROccupation of Poland§!"
 GER_occupation_poland2_desc:0 "What remains of the Polish state exists to serve the occupation, not to be governed for its own sake. Its industry is repurposed accordingly."
 GER_absorb_skoda_and_brno:0 "Absorb Škoda and Brno"
 GER_absorb_skoda_and_brno_desc:0 "The Reichswerke Hermann Göring takes over the jewels of Czech industry: the Škoda Works at Pilsen, the Brno arms factory and the Vitkovice ironworks. Their guns and steel now serve the Wehrmacht, along with the arsenals the Czechoslovak army left behind."
 GER_occupation_switzerland:0 "§ROccupation of Switzerland§!"



 GER_strafbataillon_spawn_tt:0 "§Y10 Penal Division§! units will be created in §Y[ROOT.Capital.GetName]§!. \nUnlocks limited recruitment of §YPenal Divisions§!."
