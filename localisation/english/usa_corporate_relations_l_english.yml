 USA_corp_gm_dupont_tooltip:0 "§YGM / DuPont§!\n\n§YAgitated§!:\n £research_speed_texticon  Research Speed: §G+5.0%§!\n £efficiency_base_texticon  Production Efficiency Base: §G+2.5%§!\n\n§WNeutral§!:\n £research_speed_texticon  Research Speed: §G+10.0%§!\n £efficiency_base_texticon  Production Efficiency Base: §G+5.0%§!\n\n§GFriendly§!:\n £research_speed_texticon  Research Speed: §G+17.5%§!\n £efficiency_base_texticon  Production Efficiency Base: §G+7.5%§!"
