 SPA_scw_nationalist_handicap:0 "Improvised War Machine"
 SPA_scw_nationalist_handicap_desc:0 "The rising was planned as a swift coup, not a long war. Columns thrown together from garrison troops, requetés and falangist militia fight hard but coordinate poorly, and the officers leading them are learning a modern war as they wage it.

Foreign contingents fighting alongside the Nationalists share in the confusion, tied to a command structure they do not answer to and orders they often cannot read."
 
 SPR_ready_for_war:0 "Ready for War"
 SPR_ready_for_war_desc:0 "The trials of recent conflicts have forged our nation into steel. Our factories are running around the clock, our men are fully mobilized, and our commanders stand ready. We will not be caught off guard; Spain is prepared to defend its sovereignty against any threat."