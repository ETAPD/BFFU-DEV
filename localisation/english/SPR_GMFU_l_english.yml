 SPA_scw_balance_modifier:0 "SCW Balance"
 SPA_scw_balance_modifier_desc:0 "A balance measure for the Spanish Civil War, applied to the Nationalist side and to every nation whose volunteers fight for them.\n\nFrom §Y1 January 1937§! it weakens by §Y1%§! each month, and is gone entirely ten months later. It is also removed from all holders once the war is decided."
 
 SPR_ready_for_war:0 "Ready for War"
 SPR_ready_for_war_desc:0 "The trials of recent conflicts have forged our nation into steel. Our factories are running around the clock, our men are fully mobilized, and our commanders stand ready. We will not be caught off guard; Spain is prepared to defend its sovereignty against any threat."