 fuel_help.1.t:0 "The Fuel Distribution System"
 fuel_help.1.d:0 "As a fuel manager, you supply your whole faction with fuel automatically every day.\n\nSet your 'Required Fuel Reserves' target with the plus and minus buttons. You and each faction member are then topped up toward that share of your fuel capacity, drawn from your own stockpile.\n\nUse the arrows beside a member to change its priority, and press 'Refresh List' to update who is included after your alliances change.\n\nGermany draws on Romania's oil and Japan on Jehol's oil to keep the reserve full."
