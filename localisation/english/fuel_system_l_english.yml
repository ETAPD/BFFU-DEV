 HOST_HELP_DELAYED:0 "An event will pop up when clicked to get further information about the fuel system."
 fuel_help.1.t:0 "The Fuel Distribution System"
 fuel_help.1.d:0 "As a fuel manager, you supply your whole faction with fuel automatically every day.\n\nYou and every faction member each have your own 'Required Fuel Reserves' target (use the plus and minus buttons; shift click changes it by 10%). Remember this is a target, so if your net fuel production is not enough, it will slowly drain the entire faction while in fuel deficit.\n\nEvery day, in this order:\n1. If you are below your own target, members holding fuel above THEIR targets send the surplus back to you.\n2. Members above their own target lend their surplus to members below theirs, so idle fuel is used first.\n3. You top up whoever is still short from your own stockpile, down to your own target.\nNobody is ever drained below their own target, and countries at war with you are never fuelled or taxed.\n\nAs the controller, keep your OWN target LOW on purpose and do not forget to do fuel techs, you control the faction oil resources so it is down to you only to do it (minus minors doing excav techs). You hold the oil, so everything above your target is sent out to your faction. Raising it makes you keep your fuel high first and starve your allies as they constantly wait for your fuel to hit 80% etc.\n\nFaction members should have the opposite set a HIGH target, especially tank minors, so they have fuel always available for their divisions.\n\nUse the arrows beside a member to change its priority (shift click sends it straight to the top or bottom), and press 'Refresh List' to update who is included after your alliances change. AI-led managers refresh their list every month.\n\nGermany Japan and Uk get their fuel via resource rights, you can see where on the map."
 fuel_help.1.a:0 "Understood"
