 HORST_HELP:0 "§HHelp Me!§!"
 fuel_help.1.t:0 "The Fuel Distribution System"
 fuel_help.1.d:0 "As a fuel manager, you supply your whole faction with fuel automatically every day.\n\nSet your 'Required Fuel Reserves' target with the plus and minus buttons (Remember this is a target so if your net fuel production is not enough, it will slowly drain the entire faction while in fuel deficit). You and each faction member are then topped up toward that share of your fuel capacity, drawn from your own stockpile.\n\nAs the controller, keep your OWN target LOW on purpose and do not forget to do fuel techs, you control the faction oil resources so it is down to you only to do it (minus minors doing excav techs). You hold the oil, so everything above your target is sent out to your faction. Raising it makes you keep your fuel high first and starve your allies as they constantly wait for your fuel to hit 80% etc.\n\nFaction members should have the opposite set a HIGH target, especially tank minors, so they have fuel always available for thier divisions.\n\nUse the arrows beside a member to change its priority, and press 'Refresh List' to update who is included after your alliances change.\n\nGermany Japan and Uk get their fuel via resource rights, you can see where on the map."
 fuel_help.1.a:0 "Understood"
