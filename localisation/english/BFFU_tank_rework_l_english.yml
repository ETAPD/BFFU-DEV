l_english:
 # ===== Cannons =====
 tank_autocannon:0 "Autocannon"
 tank_autocannon_desc:0 "A rapid-firing light automatic cannon. Good against soft targets and low-flying aircraft, but little armour penetration."
 tank_autocannon_2:0 "Improved Autocannon"
 tank_autocannon_2_desc:0 "A refined automatic cannon with better rounds and penetration."
 tank_small_cannon:0 "Light Cannon"
 tank_small_cannon_desc:0 "A small-calibre tank gun. A balanced early-war weapon."
 tank_small_cannon_2:0 "Improved Light Cannon"
 tank_small_cannon_2_desc:0 "An up-gunned light cannon with improved anti-armour performance."
 tank_small_close_support:0 "Light Support Gun"
 tank_small_close_support_desc:0 "A low-velocity support howitzer for a light chassis. Strong against infantry, weak against armour."
 tank_small_high_velocity:0 "Light High-Velocity Gun"
 tank_small_high_velocity_desc:0 "A long-barrelled light gun optimised for punching through armour. Fitted to tank destroyers."
 tank_medium_cannon:0 "Medium Cannon"
 tank_medium_cannon_desc:0 "The standard medium tank gun. A solid all-rounder."
 tank_medium_cannon_2:0 "Improved Medium Cannon"
 tank_medium_cannon_2_desc:0 "A higher-powered medium cannon with better penetration."
 tank_medium_close_support:0 "Medium Support Gun"
 tank_medium_close_support_desc:0 "A medium low-velocity gun for infantry support. High soft attack."
 tank_medium_high_velocity:0 "Medium High-Velocity Gun"
 tank_medium_high_velocity_desc:0 "A long medium anti-tank gun. Excellent penetration; tank-destroyer weapon."
 tank_medium_high_velocity_2:0 "Advanced High-Velocity Gun"
 tank_medium_high_velocity_2_desc:0 "A refined long medium gun with superior penetration."
 tank_medium_smoothbore:0 "Medium Smoothbore Gun"
 tank_medium_smoothbore_desc:0 "A modern smoothbore firing advanced anti-tank rounds."
 tank_heavy_cannon:0 "Heavy Cannon"
 tank_heavy_cannon_desc:0 "A large-calibre gun for heavy tanks. High hard attack and penetration."
 tank_heavy_cannon_2:0 "Improved Heavy Cannon"
 tank_heavy_cannon_2_desc:0 "An up-gunned heavy cannon with formidable penetration."
 tank_heavy_close_support:0 "Heavy Support Gun"
 tank_heavy_close_support_desc:0 "A heavy low-velocity gun. Strong versus infantry and fortifications."
 tank_heavy_smoothbore:0 "Heavy Smoothbore Gun"
 tank_heavy_smoothbore_desc:0 "A modern heavy smoothbore with excellent penetration."
 tank_very_heavy_cannon:0 "Very Heavy Cannon"
 tank_very_heavy_cannon_desc:0 "An enormous anti-tank gun. Devastating penetration, very heavy and slow."
 tank_very_heavy_cannon_2:0 "Improved Very Heavy Cannon"
 tank_very_heavy_cannon_2_desc:0 "A refined very-heavy gun with extreme penetration."
 tank_super_heavy_cannon:0 "Super-Heavy Cannon"
 tank_super_heavy_cannon_desc:0 "A colossal cannon able to defeat any armour. Ruinously expensive and ponderous."
 tank_rocket_mortar:0 "Rocket Mortar"
 tank_rocket_mortar_desc:0 "A heavy rocket launcher for saturation bombardment."
 tank_medium_howitzer:0 "Medium Howitzer"
 tank_medium_howitzer_desc:0 "A self-propelled howitzer for indirect infantry support."
 tank_medium_howitzer_2:0 "Improved Medium Howitzer"
 tank_medium_howitzer_2_desc:0 "A larger self-propelled howitzer with greater soft attack."
 tank_heavy_howitzer:0 "Heavy Howitzer"
 tank_heavy_howitzer_desc:0 "A heavy self-propelled howitzer. Massive soft attack."
 tank_heavy_howitzer_2:0 "Improved Heavy Howitzer"
 tank_heavy_howitzer_2_desc:0 "An improved heavy howitzer with even greater firepower."
 tank_siege_gun:0 "Siege Gun"
 tank_siege_gun_desc:0 "An immense siege weapon for reducing fortifications. Extreme soft attack, glacial speed."
 tank_aa_cannon:0 "Anti-Air Autocannon"
 tank_aa_cannon_desc:0 "A single automatic cannon on an open mount for engaging aircraft."
 tank_aa_cannon_2:0 "Twin Anti-Air Autocannon"
 tank_aa_cannon_2_desc:0 "A twin-barrel anti-aircraft mount with improved coverage."
 tank_aa_cannon_3:0 "Heavy Anti-Air Battery"
 tank_aa_cannon_3_desc:0 "A quad or heavy AA mount providing dense anti-air fire."
 tank_flamethrower:0 "Flamethrower"
 tank_flamethrower_desc:0 "A flame projector for clearing infantry and fortifications at close range."
 # ===== Turrets =====
 tank_modern_turret:0 "Modern Turret"
 tank_modern_turret_desc:0 "A modern fully-stabilised turret with advanced fire control."
 tank_super_heavy_turret:0 "Super-Heavy Turret"
 tank_super_heavy_turret_desc:0 "A massive rotating turret for a super-heavy chassis."
 tank_super_heavy_superstructure:0 "Super-Heavy Casemate"
 tank_super_heavy_superstructure_desc:0 "A fixed super-heavy fighting compartment. More armour, no traverse."
 tank_heavy_open_casemate:0 "Heavy Open Casemate"
 tank_heavy_open_casemate_desc:0 "An open-topped heavy mount for howitzers and AA. Cheap and light, poorly protected."
 # ===== Engines / Armour Types =====
 tank_multifuel_engine:0 "Multi-Fuel Engine"
 tank_multifuel_engine_desc:0 "A versatile engine balancing speed, reliability and fuel use."
 tank_face_hardened_armor:0 "Face-Hardened Armour"
 tank_face_hardened_armor_desc:0 "Surface-hardened plate offering better protection at some brittleness."
 tank_composite_armor:0 "Composite Armour"
 tank_composite_armor_desc:0 "Modern layered composite armour. The best protection, at high cost."
 # ===== Armour Sloping =====
 unsloped_armor:0 "Unsloped Armour"
 unsloped_armor_desc:0 "Vertical plate. Cheap and simple, minimal effective-thickness benefit."
 rounded_armor:0 "Rounded Armour"
 rounded_armor_desc:0 "Cast rounded surfaces giving modest extra protection."
 advanced_sloped_armor:0 "Advanced Sloped Armour"
 advanced_sloped_armor_desc:0 "Steeply angled plate that markedly increases effective thickness."
 composite_sloped_armor:0 "Composite Sloped Armour"
 composite_sloped_armor_desc:0 "Sharply angled composite plate for maximum protection."
 # ===== Special Features =====
 commander_cupola:0 "Commander's Cupola I"
 commander_cupola_desc:0 "A raised commander's station improving awareness, initiative and accuracy against hard targets."
 improved_gun_sight:0 "Improved Gun Sights"
 improved_gun_sight_desc:0 "Better optics improving accuracy and penetration against armour."
 auto_loader:0 "Autoloader"
 auto_loader_desc:0 "A mechanical loader raising rate of fire at the cost of reliability."
 squeezebore_adaptor:0 "Squeezebore Adaptor"
 squeezebore_adaptor_desc:0 "A tapered muzzle device sharply boosting penetration; hard on the barrel."
 applique_armor:0 "Appliqué Armour"
 applique_armor_desc:0 "Bolt-on armour plates. Extra protection at the cost of speed."
 cheap_materials:0 "Cheap Materials"
 cheap_materials_desc:0 "Simplified materials cutting production cost, reducing reliability."
 design_simplification:0 "Design Simplification"
 design_simplification_desc:0 "Streamlined manufacture improving reliability and cost, with minor performance loss."
 wider_tracks:0 "Wider Tracks"
 wider_tracks_desc:0 "Broader tracks improving cross-country breakthrough and reliability."
 # ===== Module category tab labels =====
 tank_special_module:0 "Special Modules"
 tank_cupola_module:0 "Cupola"
 tank_secondary_turret:0 "Secondary Turrets"
 tank_radio_module:0 "Radio"
 # ===== Feedback batch: extra specials + cupolas =====
 spare_parts_bin:0 "Spare Parts Bin"
 spare_parts_bin_desc:0 "Onboard spares keep the vehicle running - better reliability, so fewer are lost for good."
 crew_ergonomics:0 "Improved Ergonomics"
 crew_ergonomics_desc:0 "A better-laid-out fighting compartment - more initiative and a little reliability."
 command_radio_net:0 "Command Radio Net"
 command_radio_net_desc:0 "Command-net radios improving coordination - initiative and reconnaissance."
 reinforced_suspension:0 "Reinforced Suspension"
 reinforced_suspension_desc:0 "Heavier running gear - more defence and breakthrough at a small speed cost."
 spaced_armor:0 "Spaced Armour"
 spaced_armor_desc:0 "Standoff plates that defeat shaped charges - extra armour and defence."
 anti_mine_plating:0 "Anti-Mine Plating"
 anti_mine_plating_desc:0 "Belly and hull plating for survivability - a strong defence bonus."
 improved_transmission:0 "Improved Transmission"
 improved_transmission_desc:0 "A better gearbox - more speed with a touch of reliability."
 vision_ports:0 "Vision Ports"
 vision_ports_desc:0 "Extra vision devices - better reconnaissance and situational defence."
 improved_ventilation:0 "Improved Ventilation"
 improved_ventilation_desc:0 "Fume extraction keeps the crew fighting - reliability and sustained soft attack."
 gun_travel_lock:0 "Gun Travel Lock"
 gun_travel_lock_desc:0 "Protects the gun on the march - reliability and a little hard attack."
 aa_cupola:0 "AA Cupola"
 aa_cupola_desc:0 "A ring-mounted machine gun for anti-aircraft and close defence - air and soft attack."
 commander_cupola_2:0 "Commander's Cupola II"
 commander_cupola_2_desc:0 "An improved commander's cupola - more initiative, awareness and gunnery."
 armored_cupola:0 "Armoured Cupola"
 armored_cupola_desc:0 "A heavily protected commander's cupola - added defence and a little armour, at the cost of awareness."
 # ===== Module category TAB labels (EQ_MOD_CAT_<cat>_TITLE) =====
 EQ_MOD_CAT_tank_special_module_TITLE:0 "Special Modules"
 EQ_MOD_CAT_tank_cupola_module_TITLE:0 "Cupola"
 EQ_MOD_CAT_tank_radio_module_TITLE:0 "Radio"
 # ===== Special projects =====
 sp_nuclear_smoothbore_gun:0 "Smoothbore Tank Gun"
 sp_nuclear_smoothbore_gun_desc:0 "High-pressure smoothbore ballistics firing fin-stabilised rounds - a research-intensive leap in armour penetration developed at the physics complex."
 sp_nuclear_smoothbore_gun_effect_tt:0 "Unlocks the Medium and Heavy Smoothbore tank guns."
 sp_land_advanced_tank_warfare:0 "Combined Arms Tank Doctrine"
 sp_land_advanced_tank_warfare_desc:0 "Field trials integrating armour, gunnery and crew coordination into a unified doctrine, squeezing more fighting power from every tank."
 sp_land_advanced_tank_warfare_effect_tt:0 "All tanks gain §G+7.5%§! soft attack, hard attack and breakthrough."
 sp_advanced_tank_warfare_tech:0 "Combined Arms Tank Doctrine"
 sp_advanced_tank_warfare_tech_desc:0 "+7.5% soft attack, hard attack and breakthrough to all armoured vehicles."
