 bffu_aa_gun_2:0 "Improved Anti-Air Guns"
 bffu_aa_gun_2_desc:0 "Twin anti-aircraft mounts."
 bffu_aa_gun_3:0 "Heavy Anti-Air Guns"
 bffu_aa_gun_3_desc:0 "Heavy anti-aircraft batteries."
 bffu_armour_2:0 "Sloped Armour"
 bffu_armour_2_desc:0 "Face-hardened and well-sloped armour."
 bffu_armour_3:0 "Cast Armour"
 bffu_armour_3_desc:0 "Cast armour and steeply-sloped plate."
 bffu_armour_4:0 "Composite Armour"
 bffu_armour_4_desc:0 "Modern composite armour."
 bffu_protection_1:0 "Protective Additions"
 bffu_protection_1_desc:0 "Skirts, wet stowage and appliqué armour for extra survivability."
 bffu_protection_2:0 "Advanced Protection"
 bffu_protection_2_desc:0 "Spaced armour and anti-mine plating."
 bffu_firectrl_1:0 "Fire Control"
 bffu_firectrl_1_desc:0 "Gun sights, extra ammunition storage and gun travel locks."
 bffu_firectrl_2:0 "Advanced Fire Control"
 bffu_firectrl_2_desc:0 "Gun stabilisers, autoloaders, APCR rounds and squeeze-bore adaptors."
 bffu_crew_1:0 "Crew Equipment"
 bffu_crew_1_desc:0 "Commander's cupolas, AA and armoured cupolas, and vision ports."
 bffu_crew_2:0 "Advanced Crew Equipment"
 bffu_crew_2_desc:0 "Improved cupola, crew ergonomics and ventilation."
 bffu_mobility_1:0 "Field Modifications"
 bffu_mobility_1_desc:0 "Easy maintenance, spare parts, cheap materials and wider tracks."
 bffu_mobility_2:0 "Advanced Reliability"
 bffu_mobility_2_desc:0 "Reinforced suspension, improved transmission, design simplification and extra fuel."
 tank_rocket_launcher:0 "Rocket Launcher"
 tank_rocket_launcher_desc:0 "A rack of artillery rockets. Heavy soft attack and breakthrough at the cost of speed; artillery variants only."
 tank_rocket_cs:0 "Heavy Rocket Battery"
 tank_rocket_cs_desc:0 "A large calibre rocket close-support battery. Devastating soft attack but slow and costly; flame variants only."
 fire_prevention:0 "Fire Prevention System"
 fire_prevention_desc:0 "Automatic fire-suppression and wet stowage. Recovers more knocked-out crews and vehicles (higher trickle-back) and improves reliability."
 bffu_medhv_1:0 "High-Velocity Guns"
 bffu_medhv_1_desc:0 "Long-barrelled medium guns trading soft attack for penetration and armour piercing."
 bffu_medhv_2:0 "Improved High-Velocity Guns"
 bffu_medhv_2_desc:0 "Upgraded high-velocity medium guns with even better anti-armour performance."
 ger_pz4_turret:0 "Panzer IV Turret"
 ger_pz4_turret_desc:0 "The standard Panzer IV turret. Mounts light and small anti-tank guns only."
 ger_pz4_turret_improved:0 "Panzer IV Ausf. F2 Turret"
 ger_pz4_turret_improved_desc:0 "An enlarged Panzer IV turret with a wider ring, able to mount medium (7.5cm) guns. Better breakthrough and soft attack at a small reliability cost."
 ger_p4_turret_1:0 "Improved Panzer IV Turret"
 ger_p4_turret_1_desc:0 "A redesigned Panzer IV turret able to mount medium guns."
