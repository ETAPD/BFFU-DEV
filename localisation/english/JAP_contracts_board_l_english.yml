 JAP_CB_SAVINGS:0 "Savings Drive"
 JAP_CB_SAVINGS_D:0 "§R-3%§! stability, Yasuda +10"
 JAP_CB_SAVINGS_TT:0 "§YNational Savings Movement§!\nFrom 1938 the Home Ministry pressed every household, school and workplace to save and buy war bonds through the banks.\n\n§G+100§! Capital, §R-3%§! stability, Yasuda influence §G+10§!.\nAvailable once every 30 days."
 JAP_CB_BOJ:0 "BoJ Bonds"
 JAP_CB_BOJ_D:0 "§R+5§! inflation"
 JAP_CB_BOJ_TT:0 "§YBank of Japan Underwriting§!\nSince Takahashi Korekiyo's 1932 reforms the Bank of Japan has bought government bonds directly. The money is fast, but it feeds inflation, which cuts weekly Capital income until it fades.\n\n§G+100§! Capital, §R+5§! inflation.\nAvailable once every 30 days."
 JAP_CB_NCDC:0 "North China Co."
 JAP_CB_NCDC_D:0 "§R+5§! resistance in China, Mitsui +10"
 JAP_CB_NCDC_TT:0 "§YNorth China Development Company§!\nThe 1938 national policy company, backed by the zaibatsu, takes over the coal, iron and salt of occupied North China.\n\n§G+100§! Capital, §R+5§! resistance in occupied Chinese states, Mitsui influence §G+10§!.\nRequires control of a Chinese core state. Available once every 30 days."
