 JAP_cb_inf_gain_nissan_tt:0 "Nissan influence §G+20§! (§G+25§! if favoured)"
 JAP_CB_PERK_MITSUI:0 "At 50: §G+5% resources§!"
 JAP_CB_HOUSE_MITSUI_TT:0 "§YMitsui§!\nThe oldest house, built on Mitsui Bussan's worldwide trade network and the Miike coal mines.\n\nEvery contract it fulfils raises its influence. At 50 influence: §G+5% resources§!. Total zaibatsu influence drains political power."
 JAP_CB_PERK_MITSUBISHI:0 "At 50: §G+5% dockyard output§!"
 JAP_CB_HOUSE_MITSUBISHI_TT:0 "§YMitsubishi§!\nIwasaki's empire of shipyards, aircraft and heavy industry: the Navy's own zaibatsu.\n\nEvery contract it fulfils raises its influence. At 50 influence: §G+5% dockyard output§!. Total zaibatsu influence drains political power."
 JAP_CB_PERK_SUMITOMO:0 "At 50: §G+3% efficiency cap§!"
 JAP_CB_HOUSE_SUMITOMO_TT:0 "§YSumitomo§!\nMasters of copper and light metals since the Besshi mine, now supplying the aircraft industry.\n\nEvery contract it fulfils raises its influence. At 50 influence: §G+3% efficiency cap§!. Total zaibatsu influence drains political power."
 JAP_CB_PERK_YASUDA:0 "At 50: §G+25% Capital income§!"
 JAP_CB_HOUSE_YASUDA_TT:0 "§YYasuda§!\nA financial house of banks and insurers. Yasuda money underwrites the war economy.\n\nEvery contract it fulfils raises its influence. At 50 influence: §G+25% Capital income§!. Total zaibatsu influence drains political power."
 JAP_CB_PERK_NISSAN:0 "At 50: §G+10% arms factory speed§!"
 JAP_CB_HOUSE_NISSAN_TT:0 "§YNissan§!\nAikawa Yoshisuke's new zaibatsu, which followed the Army into Manchuria with heavy industry.\n\nEvery contract it fulfils raises its influence. At 50 influence: §G+10% arms factory speed§!. Total zaibatsu influence drains political power."
