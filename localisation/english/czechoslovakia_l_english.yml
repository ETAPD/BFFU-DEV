 germany.55.t:0 "The Fate of Czechoslovakia"
 CZE_sudeten.1.t:0 "The Sudeten Building Prohibition"
 CZE_sudeten.1.d:0 "Fortress clearances, prepared demolitions, disputed deeds, and military access corridors have brought construction across the Sudeten defensive belt to a halt for the next three years."
 CZE_sudeten.1.a:0 "The frontier comes first."
 CZE_sudeten_construction_embargo:0 "Sudeten Building Prohibition"
 CZE_sudeten_construction_embargo_desc:0 "Construction is prohibited for three years while the frontier fortification plan remains in force."
 cze_crisis.0.t:0 "The Constitutional Crisis Begins"
 cze_crisis.0.d:0 "§YDebug schedule: day 1 after game start.§! This event completes §YThe Gathering Storm§! branch root. In normal timing, the branch follows German pressure on Czechoslovakia."
 cze_crisis.0.a:0 "Open the crisis ledger."
 cze_crisis.1.t:0 "The Anschluss"
 cze_crisis.1.d:0 "§YDebug schedule: day 2 after game start.§! This event completes §YThe Anschluss§!. Its normal condition is Germany annexing Austria."
 cze_crisis.1.a:0 "The southern frontier is exposed."
 cze_crisis.2.t:0 "The May Crisis"
 cze_crisis.2.d:0 "§YDebug schedule: day 2 after game start.§! This event completes §YThe May Crisis§!. Its normal condition is Germany beginning its pressure for the Sudetenland."
 cze_crisis.2.a:0 "Call the army to readiness."
 cze_crisis.3.t:0 "The Karlsbad Programme"
 cze_crisis.3.d:0 "§YDebug schedule: day 3 after game start.§! This event completes §YThe Karlsbad Programme§!, representing Henlein's escalating demands."
 cze_crisis.3.a:0 "Prague records the demands."
 cze_crisis.4.t:0 "The Runciman Report"
 cze_crisis.4.d:0 "§YDebug schedule: day 3 after game start.§! This event completes §YThe Runciman Report§!. Its normal condition is German acquisition of the Sudetenland."
 cze_crisis.4.a:0 "The verdict is already written."
 cze_crisis.5.t:0 "The Munich Agreement"
 cze_crisis.5.d:0 "§YDebug schedule: day 4 after game start.§! This event completes §YThe Munich Agreement§! and records the diplomatic surrender of the frontier."
 cze_crisis.5.a:0 "We were not invited to decide our fate."
 cze_crisis.6.t:0 "General Mobilisation"
 cze_crisis.6.d:0 "§YDebug schedule: day 4 after game start.§! This event completes §YGeneral Mobilisation§! and unlocks its propaganda campaign."
 cze_crisis.6.a:0 "Every reservist to his post."
 cze_crisis.7.t:0 "The Wehrmacht Marches In"
 cze_crisis.7.d:0 "§YDebug schedule: day 4 after game start.§! This event completes §YThe Wehrmacht Marches In§!. Its normal condition is completion of Germany's §YFate of Czechoslovakia§! focus."
 cze_crisis.7.a:0 "The republic enters its darkest hour."

