 CZE_rszml_party:0 "RSZML"
 CZE_rszml_party_long:0 "Republican Party of Farmers and Peasants"
 CZE_snj_party:0 "SNJ"
 CZE_snj_party_long:0 "Party of National Unity"
 CZE_munich_party_transition_tt:0 "The §YRepublican Party of Farmers and Peasants§! will be reorganized into the §YParty of National Unity§!, marking the political transition to the Second Czechoslovak Republic."
 CZE_GATHERING_STORM_DESC:0 "Czechoslovakia enters 1936 as one of central Europe's last democracies, armed with the Škoda works and a fortified frontier. But German ambitions loom, and the republic's fate may not be its own to decide."
 germany.55.t:0 "The Fate of Czechoslovakia"
 CZE_sudeten.1.t:0 "The Sudeten Building Prohibition"
 CZE_sudeten.1.d:0 "Fortress clearances, prepared demolitions, disputed deeds, and military access corridors have brought construction across the Sudeten defensive belt to a halt for the next three years."
 CZE_sudeten.1.a:0 "The frontier comes first."
 CZE_sudeten_construction_embargo:0 "Sudeten Building Prohibition"
 CZE_sudeten_construction_embargo_desc:0 "Construction is prohibited for three years while the frontier fortification plan remains in force."
 cze_crisis.0.t:0 "The Hossbach Memorandum"
 cze_crisis.0.d:0 "The Hossbach conference has made Berlin's intentions unmistakable. German rearmament now points directly toward Austria and Czechoslovakia."
 cze_crisis.0.a:0 "Open the crisis ledger."
 cze_crisis.1.t:0 "The Anschluss"
 cze_crisis.1.d:0 "Austria has been absorbed into the Reich. Our southern frontier now lies exposed to German pressure."
 cze_crisis.1.a:0 "The southern frontier is exposed."
 cze_crisis.2.t:0 "The May Crisis"
 cze_crisis.2.d:0 "German pressure over the Sudetenland has entered a new phase. Prague must prepare for diplomatic coercion and military escalation."
 cze_crisis.2.a:0 "Call the army to readiness."
 cze_crisis.3.t:0 "The Karlsbad Programme"
 cze_crisis.3.d:0 "Konrad Henlein has issued the Karlsbad demands, presenting Berlin's ambitions as a programme for Sudeten German autonomy."
 cze_crisis.3.a:0 "Prague records the demands."
 cze_crisis.4.t:0 "The Runciman Report"
 cze_crisis.4.d:0 "The diplomatic mission has concluded in favour of concessions. The frontier is being stripped from the republic."
 cze_crisis.4.a:0 "The verdict is already written."
 cze_crisis.5.t:0 "The Munich Agreement"
 cze_crisis.5.d:0 "The Munich settlement has been imposed without Czechoslovak participation. The borderlands are surrendered under foreign pressure."
 cze_crisis.5.a:0 "We were not invited to decide our fate."
 cze_crisis.6.t:0 "General Mobilisation"
 cze_crisis.6.d:0 "The army calls its reservists and the country braces for the consequences of the Munich settlement."
 cze_crisis.6.a:0 "Every reservist to his post."
 cze_crisis.7.t:0 "The Wehrmacht Marches In"
 cze_crisis.7.d:0 "The Wehrmacht has crossed the frontier. The fate imposed in Berlin is now being enforced on the ground."
 cze_crisis.7.a:0 "The republic enters its darkest hour."

