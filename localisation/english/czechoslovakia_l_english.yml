 CZE_B6_ROOT_historical_trigger_tt:0 "§YGeneral Staff Estimate:§! German strategic planning is expected to harden around §Ythe first spring after rearmament begins§!.\nPrague will be forced to reassess its security as rumours reach the cabinet."
 CZE_B6_01_A_historical_trigger_tt:0 "§YForeign Office Warning:§! Berlin may move against §YAustria once the diplomatic ground is prepared§!.\nSuch a move would expose Czechoslovakia's southern approach."
 CZE_B6_01_B_historical_trigger_tt:0 "§YPolice Intelligence:§! Sudeten German leaders are expected to present their demands §Yshortly after Berlin settles its strategy§!.\nNo reliable timetable has reached Prague."
 CZE_B6_01_C_historical_trigger_tt:0 "§YArmy Intelligence:§! Reports suggest a serious military scare §Ysometime during the warmer months of 1937§!.\nRumours of German action may provoke a political and military crisis."
 CZE_B6_02_MERGE_historical_trigger_tt:0 "§YDiplomatic Estimate:§! British mediation is considered likely §Yas winter closes around the frontier dispute§!.\nLondon's timetable remains deliberately vague."
 CZE_B6_03_A_historical_trigger_tt:0 "§YMobilisation Forecast:§! The army expects emergency measures §Yduring the opening months of 1938§!.\nThe exact order depends on how quickly diplomacy collapses."
 CZE_B6_03_B_historical_trigger_tt:0 "§YCabinet Assessment:§! A settlement may be imposed §Yonce the frontier crisis becomes impossible to contain§!.\nCzechoslovakia's fortified border would then be stripped away."
 CZE_B6_04_DOTTED_historical_trigger_tt:0 "§YFinal Contingency:§! German troops are expected only §Yafter Berlin decides that Czechoslovakia's fate is sealed§!.\nNeither the hour nor the terms are known in Prague."

 CZE_industrial_path_title:0 "§RINDUSTRIAL DIRECTION§!"
 CZE_industrial_path_text:0 "Choose either the §YBohemian Economy§! or the §YSlovakian Economy§!. Every later factory reward is placed in that region. Coordinate with the §YGerman player§!: Germany must select the matching settlement when deciding Czechoslovakia's fate, or the planned factories may end up outside your future territory."

 CZE_idea_b4_04a_forced_marches:0 "Forced March Doctrine"
 CZE_idea_b4_04a_forced_marches_desc:0 "Divisions move faster but dig in far less thoroughly when they stop."

