 CZE_heydrich_industrial_enforcer_desc:0 "Heydrich's coercive production directives increase factory output by 10%."
 CZE_daluege_acting_protector:0 "Acting Reich Protector"
 CZE_daluege_acting_protector_desc:0 "Kurt Daluege assumed the office after Heydrich's death, expanding the police apparatus while deepening unrest."
 CZE_kurt_daluege:0 "Kurt Daluege"
 CZE_kurt_daluege_desc:0 "Chief of the Ordnungspolizei and Heydrich's historical successor as acting Protector of Bohemia and Moravia."
