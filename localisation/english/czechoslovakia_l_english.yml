 CZE_B2_03_FLAG_1:0 "ČKD's New Designs"
 cze_hist.1.t:0 "The Czechoslovak Republic Stands Firm"
 cze_hist.1.d:0 "The Czechoslovak Republic enters 1936 as one of the few remaining democracies in Central Europe. Under President Edvard Beneš and the leadership of the Hrad political group, the country maintains its strong alliance with France and the Little Entente. Our Škoda works produce some of the finest arms in Europe, and our Sudeten fortifications grow stronger by the day. Yet shadows gather on all sides."
 cze_hist.1.a:0 "We shall defend our republic."

 cze_hist.2.t:0 "The Hossbach Memorandum"
 cze_hist.2.d:0 "Intelligence reports reaching Prague speak of a secret meeting in Berlin. On the 5th of November, Adolf Hitler convened his senior military commanders and foreign minister and outlined his intention to acquire living space in Central Europe — beginning with Austria and Czechoslovakia. Our nation has been named explicitly as a target. The time to strengthen our defences is now."
 cze_hist.2.a:0 "We must prepare for the worst."

 cze_hist.3.t:0 "Austria Falls — We Are Surrounded"
 cze_hist.3.d:0 "German troops have crossed into Austria. By morning, Vienna is in their hands. The Anschluss is complete. In a single night, Czechoslovakia has gone from having a neutral neighbour to the south to being encircled on three sides by the German Reich. Our border with Germany has more than doubled overnight. The Sudetenland now feels more exposed than ever, and the cries of Konrad Henlein's Sudeten German Party grow louder."
 cze_hist.3.a:0 "We stand alone but we will not yield."

 cze_hist.4.t:0 "Partial Mobilisation — The May Crisis"
 cze_hist.4.d:0 "Throughout the autumn, rumours have circulated of German contingency plans against us. Our intelligence services report unusual activity in the Reich's southern commands, and the mood in the Sudetenland grows uglier by the week. Prague has quietly placed additional border units on alert — not a full mobilisation, not yet, but enough to signal that we are watching. The new year approaches under a shadow that no one in the General Staff is quite willing to name."
 cze_hist.4.a:0 "Our army is ready. Let them come."

 cze_hist.5.t:0 "The Runciman Mission"
 cze_hist.5.d:0 "Lord Walter Runciman has arrived in Prague, sent by the British government as a mediator between Prague and the Sudeten German Party. Though presented as an impartial arbiter, his mission carries an uncomfortable message: the Western powers expect Czechoslovakia to make concessions. Henlein's demands — local autonomy, then a plebiscite, then outright annexation — shift with each negotiation. We are being asked to negotiate the terms of our own dismemberment."
 cze_hist.5.a:0 "We will negotiate, but we will not capitulate."

 cze_hist.6.t:0 "General Mobilisation"
 cze_hist.6.d:0 "As the Sudeten crisis reaches its peak and German forces mass along our borders, President Beneš has ordered full general mobilisation. Over one million men report to their units within hours — a testament to the discipline and patriotism of the Czechoslovak people. Our fortifications in the Sudetenland are among the strongest in Europe. We can fight. The question is whether our allies will stand beside us."
 cze_hist.6.a:0 "Every man to his post. Czechoslovakia will not surrender without a fight."

 cze_hist.7.t:0 "The Munich Diktat"
 cze_hist.7.d:0 "In Munich, the leaders of Britain, France, Italy and Germany have signed an agreement handing the Sudetenland to the Reich — without consulting us. We were not invited to the conference. Chamberlain calls it 'peace for our time.' For us, it is a betrayal. We must cede our border fortifications, our industrial heartland, our strategic depth — everything we built to defend ourselves. Beneš resigns. The republic survives, but it has been broken."
 cze_hist.7.a:0 "We have been abandoned. We have no choice but to comply."

 cze_hist.8.t:0 "Slovakia Declares Independence"
 cze_hist.8.d:0 "Under pressure from Berlin, the Slovak government under Jozef Tiso has declared independence. Hitler has summoned President Hácha to Berlin and demanded he place the fate of Bohemia and Moravia in Germany's hands. German troops are already crossing our borders. By morning, the Protectorate of Bohemia and Moravia will be proclaimed. Czechoslovakia ceases to exist. But the spirit of our nation cannot be occupied."
 cze_hist.8.a:0 "The republic lives in exile. The fight is not over."


 cze_hist.9.t:0 "The Protectorate of Böhmen und Mähren"
 cze_hist.9.d:0 "By order of the Führer, Bohemia and Moravia are proclaimed a Protectorate of the German Reich. Konstantin von Neurath is appointed Reich Protector. The swastika flies over Hradčany Castle. What was once a proud republic is now an administered territory — its people subjects of the Greater German Reich."
 cze_hist.9.a:0 "The Protectorate submits to the Reich."

 cze_hist.10.t:0 "The Slovak Republic is Proclaimed"
 cze_hist.10.d:0 "With German recognition secured, Father Jozef Tiso proclaims the First Slovak Republic. The Hlinka Guard stands ready to enforce the new order. It is independence — but independence on a German leash. Slovakia will walk the path Berlin sets for it, for now."
 cze_hist.10.a:0 "For God, for Slovakia. The republic is born."


