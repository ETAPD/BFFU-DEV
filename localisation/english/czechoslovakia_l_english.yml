 CZE_idea_b4_01_right_base_volunteer_corps_desc:0 "A standing legal framework allows the dispatch of volunteer divisions abroad."

 CZE_idea_b4_02_right_wartime_rationing:0 "Wartime Rationing"
 CZE_idea_b4_02_right_wartime_rationing_desc:0 "Rationing frees up factories from consumer goods production."

