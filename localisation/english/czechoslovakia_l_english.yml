 CZE_B6R_01_B_heydrich_tt:0 "§GNeurath's military-factory sabotage ends.§! §RCzech Worker Resistance continues targeting civilian industry.§!\n\n§YThe Price of Delay§!\nEvery §Y30 days§! after §YThe Protectorate Proclaimed§! without appointing Heydrich earns §G0.5 Attack§! and §G0.5 Defence§!. The earned combat stats are applied when this focus completes, then stop increasing. Maximum: §G10 Attack§! and §G10 Defence§!.\n\n§YCombat stats currently earned:§!\n£attack_texticon Attack: §G+[?CZE_heydrich_delay_stat|1]§!\n£defence_texticon Defence: §G+[?CZE_heydrich_delay_stat|1]§!"

