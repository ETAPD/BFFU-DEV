 GER_ungeheuer_in_uniform:0 "Ungeheuer in Uniform"
 GER_ss_primacy_himmler_tt:0 "Stronger with §YHimmler's Inner Circle§!: more SS divisions and §YPanzer Leaders§!."
 GER_heer_primacy_himmler_tt:0 "Forgoes the Waffen-SS bonuses from §YHimmler's Inner Circle§!."
 ss_medium_armor:0 "SS Medium Tank"
 ss_medium_armor_desc:0 "Waffen-SS panzer crews, hard-trained and committed without regard for losses. They hit harder and break through faster than Heer tank battalions, but bleed faster too."
 ss_heavy_armor:0 "SS Heavy Tank"
 ss_heavy_armor_desc:0 "SS heavy tank battalions built around the Tiger, like the 101st. Devastating in the attack, hard to replace when lost."
 ss_mechanized:0 "SS Panzergrenadiers"
 ss_mechanized_desc:0 "Waffen-SS infantry in half-tracks, fighting alongside the SS panzer regiments. Strong in the assault, thin in reserves."
 ss_motorized:0 "SS Motorized Infantry"
 ss_motorized_desc:0 "Motorised Waffen-SS infantry of the early SS divisions: aggressive, well equipped and used up quickly in the assault."
 GER_combined_arms_breakthrough_tt:0 "Unlocks the §YBreakthrough§! combat tactic."
 ss_heavy_assault_gun_brigade:0 "SS Heavy Assault Guns"
 ss_heavy_assault_gun_brigade_desc:0 "Sturmgeschütz and Sturmmörser batteries of the Waffen-SS, with the best crews and priority for the latest heavy assault guns."
 GER_mio_initial_trait_porsche_desc:0 "Ferdinand Porsche's Stuttgart design bureau, bold on electric drive and giant hulls, and notoriously poor at keeping them reliable in the field."
 GER_mio_initial_trait_henschel_desc:0 "Henschel & Sohn of Kassel, builder of locomotives and the Tiger, turned its heavy-engineering shops over to the Wehrmacht's largest tanks."
 GER_mio_initial_trait_man_desc:0 "Maschinenfabrik Augsburg-Nürnberg, a diesel and heavy machinery firm whose Nuremberg works built the Panther: powerful, but rushed into service."
 GER_mio_initial_trait_krupp_desc:0 "Krupp of Essen, the old armoury of Germany, forged the guns and armour of the Panzer IV and the Wehrmacht's flak tanks."
 GER_mio_initial_trait_alkett:0 "Berliner Sturmgeschützbau"
 GER_mio_initial_trait_alkett_desc:0 "Altmärkische Kettenwerk of Berlin-Spandau built the StuG III, the assault gun that supported the infantry throughout the war."
 GER_mio_initial_trait_daimler_benz_desc:0 "Daimler-Benz of Stuttgart-Untertürkheim built the engines and chassis of the Panzer III and the army's reliable medium tanks."
 GER_mio_initial_trait_vomag_desc:0 "The Vogtländische Maschinenbau AG of Plauen, a machine works that fitted long guns to tank chassis as tank destroyers."
 GER_mio_initial_trait_deschimag:0 "Weserwerft Bremen"
 GER_mio_initial_trait_deschimag_desc:0 "Deutsche Schiff- und Maschinenbau AG of Bremen, which built destroyers, escorts and U-boats on the Weser."
 GER_mio_initial_trait_germaniawerft:0 "Kieler Kreuzerbau"
 GER_mio_initial_trait_germaniawerft_desc:0 "The Germaniawerft of Kiel, a Krupp yard that built the heavy cruiser Prinz Eugen and, in secret, the U-boat designs of the 1920s."
 GER_mio_initial_trait_blohm_und_voss:0 "Hamburger Hochseewerft"
 GER_mio_initial_trait_blohm_und_voss_desc:0 "Blohm & Voss of Hamburg, builder of the Bismarck and of the large cruisers and raiders meant to break the sea lanes."
 GER_mio_initial_trait_hdw:0 "Howaldtswerke Unterseebootbau"
 GER_mio_initial_trait_hdw_desc:0 "The Howaldtswerke of Kiel, whose slipways turned out U-boats in the dozens once the Kriegsmarine's submarine arm was rebuilt."
 GER_mio_initial_trait_deutsche_werke:0 "Kieler Flottenbau"
 GER_mio_initial_trait_deutsche_werke_desc:0 "The Deutsche Werke of Kiel built cruisers and the Gneisenau-class ships that formed the Kriegsmarine's fast task forces."
 GER_mio_initial_trait_kriegsmarinewerft:0 "Marinewerft Wilhelmshaven"
 GER_mio_initial_trait_kriegsmarinewerft_desc:0 "The state-run naval dockyard at Wilhelmshaven, which refitted and repaired the fleet and built the Scharnhorst and Tirpitz."
 GER_mio_initial_trait_junkers:0 "Dessauer Sturzkampfbau"
 GER_mio_initial_trait_junkers_desc:0 "Junkers of Dessau, the pioneers of all-metal aircraft, builders of the Ju 87 Stuka and the Ju 88 that served in every role."
 GER_mio_initial_trait_heinkel:0 "Marieneher Bomberbau"
 GER_mio_initial_trait_heinkel_desc:0 "Heinkel's Rostock-Marienehe works built the He 111 bombers and the He 177 that carried the Luftwaffe's long-range hopes."
 GER_mio_initial_trait_dornier:0 "Friedrichshafener Bomberbau"
 GER_mio_initial_trait_dornier_desc:0 "Dornier of Friedrichshafen, known for flying boats and the Do 17 'Flying Pencil' bomber that served in the early campaigns."
 GER_mio_initial_trait_arado:0 "Warnemünder Mehrzweckbau"
 GER_mio_initial_trait_arado_desc:0 "Arado of Warnemünde produced trainers, reconnaissance seaplanes and the Ar 234 jet bomber under Walter Blume's design team."
 GER_mio_initial_trait_fieseler:0 "Kasseler Leichtflugzeugbau"
 GER_mio_initial_trait_fieseler_desc:0 "Fieseler of Kassel built the Fi 156 Storch liaison aircraft and the Fi 103 flying bomb, light machines that flew where others could not."
 GER_mio_initial_trait_focke_achgelis:0 "Bremer Drehflüglerbau"
 GER_mio_initial_trait_focke_achgelis_desc:0 "Focke-Achgelis of Bremen, Henrich Focke's rotor-wing firm, developed the Fa 61 helicopter and the Fa 223 Drache."
 GER_mio_initial_trait_rheinmetall:0 "Düsseldorfer Geschützbau"
 GER_mio_initial_trait_rheinmetall_desc:0 "Rheinmetall-Borsig of Düsseldorf, the Army's largest gun maker, produced the artillery, anti-tank guns and tank guns of the Wehrmacht."
 GER_mio_initial_trait_mauser:0 "Oberndorfer Gewehrbau"
 GER_mio_initial_trait_mauser_desc:0 "Mauser of Oberndorf, whose Kar 98k rifle was the standard small arm of the German soldier throughout the war."
 GER_mio_initial_trait_opel:0 "Rüsselsheimer Kraftfahrzeugbau"
 GER_mio_initial_trait_opel_desc:0 "Opel of Rüsselsheim, part of General Motors, built the Blitz truck that carried the motorised divisions to the front."
 GER_mio_initial_trait_carl_walther:0 "Zella-Mehliser Waffenbau"
 GER_mio_initial_trait_carl_walther_desc:0 "Carl Walther of Zella-Mehlis, maker of the P38 pistol, supplied sidearms and small precision equipment to the Wehrmacht."
 GER_mio_initial_trait_auto_union:0 "Chemnitzer Panzerwagenbau"
 GER_mio_initial_trait_auto_union_desc:0 "Auto Union of Chemnitz, the maker of the Horch and Wanderer cars, built the light armoured cars that scouted for the panzers."
