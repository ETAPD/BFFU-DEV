 GER_legion_condor_entry:0 "Fought with the Legion Condor in Spain"
 GER_panzer_lehr_entry:0 "Formed from the instructors of the Panzer schools"
 GER_grossdeutschland_entry:0 "Raised from the Wachregiment Berlin as the Army's showcase unit"
 GER_leibstandarte_entry:0 "Raised from Hitler's bodyguard regiment"
 GER_officer_wilhelm_von_thoma:0 "Wilhelm Ritter von Thoma"
