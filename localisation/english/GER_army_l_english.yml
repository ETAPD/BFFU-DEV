 GER_army_three_arms_tt:0 "The Wehrmacht can only prioritise §Ythree§! of its five arms: §YInfanterie§!, §YArtillerie§!, §YSchwere Waffen§!, §YPanzerwaffe§! and §YMotorisierung§!. Combined-arms focuses need two neighbouring arms."
