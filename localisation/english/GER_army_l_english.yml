l_english:
 GER_legion_condor:0 "Legion Condor"
 GER_legion_condor_desc:0 "German airmen, tank crews and gunners fight for Franco in Spain. They return with hard lessons about bombing, anti-tank guns and combined arms."
 GER_legion_condor_veterans_tt:0 "Two veteran §YLegion Condor§! divisions return from Spain, decorated with the §YSpanish Cross§!."
 GER_brandenburgers:0 "The Brandenburgers"
 GER_brandenburgers_desc:0 "Abwehr commandos who speak the enemy's language and wear his uniform seize bridges and tunnels ahead of the panzers."
 GER_kriegsakademie:0 "Kriegsakademie"
 GER_kriegsakademie_desc:0 "The War Academy in Berlin reopens in 1935 and trains a new generation of General Staff officers in manoeuvre and command."
 GER_heer_primacy:0 "Primacy of the Heer"
 GER_heer_primacy_desc:0 "The Army insists that it alone bears arms for the Reich. Its showcase unit, the Großdeutschland regiment, grows into an elite division."
 GER_grossdeutschland_tt:0 "Creates the elite §YGroßdeutschland§! template (at most §Y3§! divisions) and a first veteran division."
 GER_waffen_ss_primacy:0 "Primacy of the Waffen-SS"
 GER_waffen_ss_primacy_desc:0 "Himmler's armed SS demands men, weapons and a place at the front beside the Army. Paul Hausser builds it into a fighting force."
 GER_leibstandarte_tt:0 "Creates the elite §YLeibstandarte SS Adolf Hitler§! template (at most §Y2§! divisions) and a first veteran division."
 GER_panzer_lehr_tt:0 "Creates the elite §YPanzer-Lehr-Division§! template (§Y1§! division only) and the division itself."
 GER_army_spirit_unlocked_tt:0 "Unlocks a new §YArmy Spirit§! in the Military Staff:"
 GER_edelweiss_badge_unlocked_tt:0 "Unlocks the division medal §YEdelweiss Badge§!."
 GER_assault_badge_unlocked_tt:0 "Unlocks the division medal §YAssault Badge§!."
 GER_panzer_assault_badge_unlocked_tt:0 "Unlocks the division medal §YPanzer Assault Badge§!."
 GER_panzer_assault_badge_heavy_unlocked_tt:0 "Unlocks the division medal §YPanzer Assault Badge (Heavy)§!."
 GER_close_combat_clasp_unlocked_tt:0 "Unlocks the division medal §YClose Combat Clasp§!."
 GER_stellungskrieg_army_spirit:0 "Stellungskrieg"
 GER_stellungskrieg_army_spirit_desc:0 "Hold the line, dig deep, let the enemy break himself on it."
 GER_vernichtungsgedanke_army_spirit:0 "Vernichtungsgedanke"
 GER_vernichtungsgedanke_army_spirit_desc:0 "The battle of annihilation: encircle and destroy, never merely push back."
 GER_bewegungskrieg_army_spirit:0 "Bewegungskrieg"
 GER_bewegungskrieg_army_spirit_desc:0 "The war of movement: speed, surprise and fuel carried forward with the spearheads."
 GER_schwerpunkt_army_spirit:0 "Schwerpunkt"
 GER_schwerpunkt_army_spirit_desc:0 "Concentrate everything at the decisive point and let the rest of the front wait."
 GER_pervitin_withdrawal:0 "Pervitin Withdrawal"
 GER_pervitin_withdrawal_desc:0 "The men who marched for three days without sleep now cannot stand."
 GER_spanish_cross:0 "Spanish Cross"
 GER_edelweiss_badge:0 "Edelweiss Badge"
 GER_assault_badge:0 "Assault Badge"
 GER_panzer_assault_badge:0 "Panzer Assault Badge"
 GER_panzer_assault_badge_heavy:0 "Panzer Assault Badge (Heavy)"
 GER_close_combat_clasp:0 "Close Combat Clasp"
 GER_legion_condor_entry:0 "Fought with the Legion Condor in Spain"
 GER_panzer_lehr_entry:0 "Formed from the instructors of the Panzer schools"
 GER_grossdeutschland_entry:0 "Raised from the Wachregiment Berlin as the Army's showcase unit"
 GER_leibstandarte_entry:0 "Raised from Hitler's bodyguard regiment"
 GER_officer_wilhelm_von_thoma:0 "Wilhelm Ritter von Thoma"
 GER_officer_fritz_bayerlein:0 "Fritz Bayerlein"
 GER_officer_sepp_dietrich:0 "Sepp Dietrich"
 GER_trait_cautious_reformer:0 "Cautious Reformer"
 GER_trait_general_staff_method:0 "General Staff Method"
 GER_trait_lakeitel:0 "Lakeitel"
 GER_trait_compromise_commander:0 "Compromise Commander"
 GER_trait_sichelschnitt:0 "Sichelschnitt"
 GER_trait_inspector_of_panzer_troops:0 "Inspector of Panzer Troops"
 GER_trait_fuhrers_fireman:0 "The Führer's Fireman"
 GER_trait_waffen_ss_organiser:0 "Organiser of the Waffen-SS"
 GER_wehrmacht_cat:0 "Wehrmacht"
 GER_wehrmacht_cat_desc:0 "Measures that keep the German army fighting."
 GER_issue_pervitin:0 "Issue Pervitin"
 GER_issue_pervitin_desc:0 "Hand out the Panzerschokolade before the next offensive. The men will pay for it when the doses run out."
 GER_army.1.t:0 "Beck Resigns"
 GER_army.1.d:0 "General Ludwig Beck, Chief of the General Staff, has resigned in protest at the plans for war over the Sudetenland. Franz Halder, his deputy, takes over a staff that will now plan the campaigns Beck warned against."
 GER_army.1.a:0 "Halder will do."
 GER_army.2.t:0 "The Führer's Fireman"
 GER_army.2.d:0 "Walter Model's 3rd Panzer Division spearheaded the encirclement at Kiev. Now, as the Soviet winter offensive breaks the line before Moscow, he is given the shattered 9th Army at Rzhev. He is a master of improvised defence who refuses to yield ground, and he is available to command the Army."
 GER_army.2.a:0 "Send him to Rzhev."
 GER_officer_hasso_von_manteuffel:0 "Hasso von Manteuffel"
 GER_sturmartillerie_regiments_tech_tt:0 "All §YSelf-Propelled Artillery§! gain §G+8%§! Soft Attack and §G+5%§! Breakthrough."
 GER_sturmgeschuetz_tech_tt:0 "All §YAssault Guns§! gain §G+8%§! Soft Attack and §G+5%§! Defense."
 GER_panzerjaeger_tech_tt:0 "All §YTank Destroyers§! gain §G+8%§! Hard Attack and §G+5%§! Piercing."
 GER_flakpanzer_tech_tt:0 "All §YSelf-Propelled Anti-Air§! gain §G+10%§! Air Attack."
 GER_sturmartillerie_regiments_tech:0 "Sturmartillerie Regiments"
 GER_sturmgeschuetz_tech:0 "Sturmgeschütz Doctrine"
 GER_panzerjaeger_tech:0 "Panzerjäger Doctrine"
 GER_flakpanzer_tech:0 "Flakpanzer Escorts"
 GER_ersatzheer_law:0 "Ersatzheer Replacement System"
 GER_ersatzheer_law_desc:0 "Each Wehrkreis keeps a depot battalion for every field division. Recruits train with men from their own region and join units they already know, so losses are replaced without breaking the cohesion of the division."
 GER_ersatzheer_law_tt:0 "Unlocks the German conscription law §YErsatzheer Replacement System§!, usable at war or above §Y50%§! war support:"
 GER_k5_railway_guns_tt:0 "Two §Y28 cm K5 (E)§! railway guns, §YRobert§! and §YLeopold§!, are handed to the army."
 GER_krupp_80cm_gun:0 "Order the Krupp 80 cm Gun"
 GER_krupp_80cm_gun_desc:0 "In 1937 the army asked Krupp for a gun able to breach the Maginot forts. The result weighs 1,350 tonnes, fires a seven-tonne shell and needs its own railway to move. Krupp will build it, at a price."
 GER_krupp_80cm_gun_order_tt:0 "Krupp begins work on the 80 cm gun. It will be delivered in §Y365§! days."
 GER_krupp_80cm_gun_delivered_tt:0 "The super-heavy railway gun §YSchwerer Gustav§! joins the army. With §YGötterdämmerung§!, the §YSuper-Heavy Railway Gun§! project is completed and its sister gun §YDora§! enters production."
 GER_gebirgs_division_tt:0 "The veteran §Y1. Gebirgs-Division§! is formed in Bavaria, decorated with the §YEdelweiss Badge§!."
 GER_gebirgs_entry:0 "Formed from the Alpine regiments of Bavaria and Austria"
 GER_officer_ludwig_kubler:0 "Ludwig Kübler"
 GER_westwall_tt:0 "Builds §Y2§! levels of §YLand Forts§! on every border province of the §YRhineland§!, §YMoselland§! and §YBaden§!, if they are owned, controlled and no longer demilitarised."
 GER_raise_heavy_abteilung:0 "Raise a schwere Panzer-Abteilung"
 GER_raise_heavy_abteilung_desc:0 "Heavy tanks are too scarce to spread among the Panzer divisions. They are gathered into independent heavy battalions, kept under army command and sent wherever the front must break."
 GER_raise_heavy_abteilung_tt:0 "Forms the next Heer heavy tank battalion (§Y501§!, §Y502§!, then §Y503§!) in the capital, using the capped §Yschwere Panzer-Abteilung§! template."
 GER_tigerfibel_tech:0 "Tigerfibel"
 GER_tigerfibel_tech_tt:0 "All §YHeavy Tanks§! gain §G+5%§! Defense and §G+5%§! Breakthrough."
 GER_karl_geraet_tt:0 "Advances the §YSelf-Propelled Super-Heavy Howitzer§! project (the §YKarl-Gerät§!) by §G50%§!."
 GER_brandenburg_regiment_tt:0 "Forms the veteran §YLehr-Regiment Brandenburg z.b.V. 800§!, an elite special forces unit, in the capital."
 GER_officer_theodor_von_hippel:0 "Theodor von Hippel"
 GER_auftragstaktik_trait:0 "Auftragstaktik"
 GER_auftragstaktik_trait_tt:0 "Every general with skill §Y3§! or higher gains the trait §YAuftragstaktik§!: §G+10%§! Planning Speed, §G+5%§! Division Recovery Rate and §G+10%§! Experience Gain."
 GER_otto_programm_tt:0 "§YOtto-Programm§!: upgrades the railways from §YBrandenburg§! to §YErmland-Masuren§!. If they are controlled, also to §YWarsaw§!, from Warsaw to §YBiałystok§! and §YLublin§!, and from §YLower Silesia§! to §YKraków§!."
 GER_beutepanzer_38t_tt:0 "The Škoda and ČKD works in §YBohemia§! build for the Wehrmacht. Adds the §YPzKpfw 38(t)§! design and §Y300§! tanks to the stockpile."
 GER_beutepanzer_38t_missing_tt:0 "If we controlled §YBohemia§!, we would gain the §YPzKpfw 38(t)§! design and §Y300§! tanks."
