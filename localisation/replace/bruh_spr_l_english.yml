  #### EVENTS ####
  lar_spain.39.t:0 "[From.GetNameDefCap] Demands North Africa"
  lar_spain.39.desc:0 "[From.GetAdjective] diplomats have delivered us an ultimatum, demanding we immediately relinquish control over North Africa to [From.GetNameDef]. No doubt they mean to capitalize on the weakness of our current international position..."
  lar_spain.39.a:0 "We can part with just the coast."
  lar_spain.39.b:0 "We cannot afford another war. We must accept."
  lar_spain.39.d:0 "They will not get it so easily!"
  lar_spain.40.t:1 "[From.GetNameDefCap] Accepts Demands"
  lar_spain.40.desc:0 "[From.GetNameDefCap] has accepted our demands and their diplomats assure us they are making arrangements for the transfer of control of North Africa forthwith."
  lar_spain.40.a:0 "Very efficient."
  lar_spain.400.desc:0 "[From.GetNameDefCap] has accepted some of our demands for the control of the Atlantic coast portion of North Africa."
  lar_spain.400.a:0 "We had hoped for more."

  SPA_demand_french_north_africa:0 "Demand Morocco"
  SPA_demand_french_north_africa_desc:0 "Vichy France holds Morocco, and we have both the claim and the strength to take it back. A formal demand, backed by the threat of force, should be enough to see it returned to Spanish hands - though the Great Powers will not look kindly on the pressure."
  SPA_demand_morocco_tt:0 "Demands Morocco from Vichy France. If they accept:"

  #### BALANCE OF POWER TOOLTIPS (not covered by SPR_TFB_l_english.yml) ####
  SPR_appeasement_modifier:0 "Appeasement"
  SPR_appeasement_modifier_desc:0 "Daily Appeasement. §WCarlists§! (left side) sits at §Y.13§!, and §WFranco§! (right side) sits at §Y.08§! by Default. However, the better the Axis do in Africa the faster it will tick.\n\nPossible Daily Changes:\n§WCairo§! §Y0.01§! Daily\n§WPort Sudan§! §Y0.01§! Daily\n§WAlgiers§! §Y0.01§! Daily - (If owned by Vichy, Vichy must be at war)\n§WAden§! §Y0.02§! Daily\n§WGibraltar§! §Y0.04§! Daily\n§WCape Town§! §Y0.04§! Daily"
  SPR_appeasement_tick_carlist_tt:0 "Going the Carlist path will cause your post war Balance of Power to tick down by §Y0.13 Daily§!"
  SPR_appeasement_tick_franco_tt:0 "Going the Franco path will cause your post war Balance of Power to start tick down by §Y0.08 Daily§!. However, the better the Axis do in Africa the faster it will tick."
  SPR_appeasement_tick_franco_list_tt:0 "Possible Daily Changes:\n§YCairo 0.01§! Daily\n§YPort Sudan 0.01§! Daily\n§YAlgiers 0.01§! Daily - (If owned by Vichy, Vichy must be at war)\n§YAden 0.02§! Daily\n§YGibraltar 0.04§! Daily\n§YCape Town 0.04§! Daily"
  SPR_appeasement_tick_stop_tt:0 "§RTicking will pause if any state in Europe with the \"State of the Pacific\" modifier is owned by the allies.§!"

  #### FAMINE EVENT OPTIONS (TFB only localised option .a; filling in .b/.c/.d) ####
  lar_spain.658.b:0 "We will endure."
  lar_spain.658.c:0 "We will manage."
  lar_spain.658.d:0 "It could be worse."
