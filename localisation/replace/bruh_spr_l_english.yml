  #### EVENTS ####
  lar_spain.39.t:0 "[From.GetNameDefCap] Demands North Africa"
  lar_spain.39.desc:0 "[From.GetAdjective] diplomats have delivered us an ultimatum, demanding we immediately relinquish control over North Africa to [From.GetNameDef]. No doubt they mean to capitalize on the weakness of our current international position..."
  lar_spain.39.a:0 "We can part with just the coast."
  lar_spain.39.b:0 "We cannot afford another war. We must accept."
  lar_spain.39.d:0 "They will not get it so easily!"
  lar_spain.40.t:1 "[From.GetNameDefCap] Accepts Demands"
  lar_spain.40.desc:0 "[From.GetNameDefCap] has accepted our demands and their diplomats assure us they are making arrangements for the transfer of control of North Africa forthwith."
  lar_spain.40.a:0 "Very efficient."
  lar_spain.400.desc:0 "[From.GetNameDefCap] has accepted some of our demands for the control of the Atlantic coast portion of North Africa."
  lar_spain.400.a:0 "We had hoped for more."

  SPA_demand_french_north_africa:0 "Demand Morocco"
  SPA_demand_french_north_africa_desc:0 "Vichy France holds Morocco, and we have both the claim and the strength to take it back. A formal demand, backed by the threat of force, should be enough to see it returned to Spanish hands - though the Great Powers will not look kindly on the pressure."
  SPA_demand_morocco_tt:0 "Demands Morocco from Vichy France. If they accept:"

  #### FOCUSES (BoP / appeasement) ####
  SPA_unlock_more_resources_tt:0 "§GCompleting this focus will unlock more resource extraction decisions.§!"
  SPA_ensure_agricultural_self_sufficiency_tt:0 "§GAgricultural Self-Sufficiency will lessen the effects of a famine if we ever enter into war with the Allied powers.§!"
  SPA_foundation_of_steel_and_iron:0 "Foundation of Steel and Iron"
  SPA_foundation_of_steel_and_iron_desc:0 "A modern nation is built on heavy industry. We will invest heavily in our smelting plants and steel mills, ensuring that Spain no longer needs to beg for the basic materials of war."
  SPA_reconstuccion_nacional:0 "Reconstrucción Nacional"
  SPA_reconstuccion_nacional_desc:0 "The ruins of our cities are a constant reminder of the price of victory. This massive public works program will repair our infrastructure, provide jobs to the veterans, and literally rebuild Spain from the ground up."
  SPA_rearm_the_nation:0 "Rearm the Nation"
  SPA_rearm_the_nation_desc:0 "With our industrial foundation secured, we must turn our focus to the production of high grade weaponry. We will not be caught unprepared when the next global storm reaches our borders."
  SPA_spain_reforged:0 "Spain Reforged"
  SPA_spain_reforged_desc:0 "The trial by fire is over. Out of the anvil of the Civil War, a new, stronger Spain has been forged. Our industry is humming, our people are united, and our sovereignty is unquestioned."
  SPA_electrify_the_spanish_grid:0 "Electrify the Spanish Grid"
  SPA_electrify_the_spanish_grid_desc:0 "Modern industry and urban growth demand a continuous, dependable flow of power. Expanding our electrical infrastructure into the provinces will jumpstart our rural factories and integrate our isolated regions. Bringing the national grid up to date ensures our domestic production can finally keep pace with our grand strategic ambitions."
  SPA_enact_defense_of_spain:0 "The Defense of Spain Act"
  SPA_enact_defense_of_spain_desc:0 "Our shores have historically been our greatest vulnerability. By enacting the Defense of Spain Act, we have authorized a massive public works project to line our beaches and ports with concrete and steel. From the Pyrenees to the Rock of Gibraltar, the coastline is being transformed into a series of interconnected defensive zones designed to break the back of any amphibious assault before it can establish a foothold."

  #### IDEAS (famine) ####
  SPA_famine0:0 "Apocalyptic Famine"
  SPA_famine0_desc:0 "We have failed. Utterly, completely and totally. We can only pray when the people come to hang us that they do so swiftly and mercifully."
  SPA_famine1:0 "Severe Famine"
  SPA_famine1_desc:0 "The agricultural heart of Spain has been ripped open. Supply chains are weakened and the population is facing starvation. We will need continued efforts to prevent a loss of control and this will severely weaken our industrial growth."
  SPA_famine2:0 "Famine"
  SPA_famine2_desc:0 "While the immediate threat of total state collapse is not present, the reality of starvation remains constant. Factories stand idle as workers lack the calories to perform their duties, and the cost of maintaining order in the bread lines is paralyzing our economy."
  SPA_famine3:0 "Moderate Famine"
  SPA_famine3_desc:0 "Rationing is the new normal. The black market the only way many can survive. While we are no longer losing our grip on the streets, the massive diversion of civilian resources to food procurement continues to hinder our industrial growth."
  SPA_famine4:0 "Minor Famine"
  SPA_famine4_desc:0 "The worst of the hunger has been avoided, but the issue remains. Though the fields are still producing, the economy still feels the weight of the Famine. We are fine for now, but the belt must remain tightened."

  #### EVENTS (appeasement / famine) ####
  lar_spain.654.t:0 "British Embargo"
  lar_spain.654.desc:0 "Intelligence reports from Madrid confirm that the Spanish government has pivoted too far towards the Axis sphere. To ensure our continued trade war with Germany does not get circumvented, the Foreign Office has recommended an immediate cessation of all trade. London will no longer fuel a regime that stands against our interests."
  lar_spain.654.a:0 "Blockade Spain."
  lar_spain.655.t:0 "American Embargo"
  lar_spain.655.desc:0 "The State Department has officially classified the Spanish state as a hostile state. To preserve the security of the Western Hemisphere and the Atlantic, we must restrict the flow of American resources. Our war materials will only go to those who respect the democratic order."
  lar_spain.655.a:0 "Blockade Spain."
  lar_spain.656.t:0 "French Embargo"
  lar_spain.656.desc:0 "As hostility from our southern neighbor reaches a critical threshold, the French Republic can no longer ignore the threat at our back. Spain will no longer be permitted to trade with us. If Madrid wishes to side with our enemies, they shall do so in total isolation."
  lar_spain.656.a:0 "Blockade Spain."
  lar_spain.657.t:0 "New BOP level reached"
  lar_spain.657.desc:0 "A new level in the balance of power has been reached. This allows us to send more volunteers, but also may increase allied pressure on our nation."
  lar_spain.657.a:0 "Understood."
  lar_spain.658.t:0 "Famine!"
  lar_spain.658.desc:0 "The outbreak of war with the United Kingdom has brought an immediate and devastating blow to our supply lines. The Royal Navy has successfully locked down the Atlantic and Mediterranean approaches, enforcing a total maritime blockade on all Spanish ports. Every vital grain transport and cargo vessel bound for our shores has been intercepted or turned back. Cut off completely from international markets, our domestic food reserves have instantly collapsed. Bread lines are already forming across our major cities, and the specter of a systemic famine has become an immediate reality. Without a way to break this naval stranglehold or secure emergency relief from abroad, our home front will starve before the war truly begins."
  lar_spain.658.a:0 "God help us."
  lar_spain.658.b:0 "We will endure."
  lar_spain.658.c:0 "We will manage."
  lar_spain.658.d:0 "It could be worse."

  #### BALANCE OF POWER (appeasement struggle) ####
  SPR_spain_appeasement_struggle:0 "Our Struggle for Appeasement"
  SPR_spain_appeasement:0 "Full Appeasement"
  SPR_spain_active_war:0 "Open War"
  SPR_appeasement:0 "Full Appeasement"
  SPR_strained_neutrality:0 "Strained Neutrality"
  SPR_axis_sympathies:0 "Axis Sympathiser"
  SPR_allied_embargo:0 "Allied Embargo"
  SPR_open_war:0 "Open War"
  SPR_appeasement_modifier:0 "Appeasement"
  SPR_appeasement_modifier_desc:0 "Daily Appeasement. §WCarlists§! (left side) sits at §Y.13§!, and §WFranco§! (right side) sits at §Y.08§! by Default. However, the better the Axis do in Africa the faster it will tick.\n\nPossible Daily Changes:\n§WCairo§! §Y0.01§! Daily\n§WPort Sudan§! §Y0.01§! Daily\n§WAlgiers§! §Y0.01§! Daily - (If owned by Vichy, Vichy must be at war)\n§WAden§! §Y0.02§! Daily\n§WGibraltar§! §Y0.04§! Daily\n§WCape Town§! §Y0.04§! Daily"
  SPR_appeasement_tick_carlist_tt:0 "Going the Carlist path will cause your post war Balance of Power to tick down by §Y0.13 Daily§!"
  SPR_appeasement_tick_franco_tt:0 "Going the Franco path will cause your post war Balance of Power to start tick down by §Y0.08 Daily§!. However, the better the Axis do in Africa the faster it will tick."
  SPR_appeasement_tick_franco_list_tt:0 "Possible Daily Changes:\n§YCairo 0.01§! Daily\n§YPort Sudan 0.01§! Daily\n§YAlgiers 0.01§! Daily - (If owned by Vichy, Vichy must be at war)\n§YAden 0.02§! Daily\n§YGibraltar 0.04§! Daily\n§YCape Town 0.04§! Daily"
  SPR_appeasement_tick_stop_tt:0 "§RTicking will pause if any state in Europe with the \"State of the Pacific\" modifier is owned by the allies.§!"

  #### DECISIONS (appeasement) ####
  SPR_diplomatic_appeasement:0 "Diplomatic Appeasement"
  SPR_diplomatic_appeasement_desc:0 "To keep the Great Powers at bay, we must show a willingness to negotiate. By sending diplomatic missions to the democratic power, we can reassure the Allies of our neutral intentions and reduce the likelihood of escalations."
  SPR_trade_with_allies:0 "Expand Allied Trade"
  SPR_trade_with_allies_desc:0 "Trade has always opened doors and made new friends. Buying Allied goods and raw materials will create a financial entanglement that makes it harder for the democratic powers to justify an embargo or similar hostile action."
  SPR_loosen_press_laws:0 "Loosen Press Restrictions"
  SPR_loosen_press_laws_desc:0 "The international community views our censorship as a sign of totalitarian aggression. By relaxing some of our strict wartime press laws, we can project a more moderate image to the Western public, making it politically difficult for their governments to move against us."
  SPR_reduce_defense_budget:0 "Reduce Defense Spending"
  SPR_reduce_defense_budget_desc:0 "The military is the heart of the state, but its massive budget is a red flag to our neighbors. Temporarily scaling back our rearmament programs will signal our peaceful intent to the world, though it will hinder our rearmament efforts temporarily."
